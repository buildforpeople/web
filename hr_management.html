  halfType = 'morning';
  showModal(`\n    <h3>${type} 신청</h3>\n\n    ${isHalf ? `\n    <div class="form-row">\n      <label>반차 구분</label>\n      <div style="display:flex; gap:8px;">\n        <button type="button" id="halfMorning" class="btn-primary" onclick="setHalfType('morning')" style="flex:1;">오전반차</button>\n        <button type="button" id="halfAfternoon" class="btn-secondary" onclick="setHalfType('afternoon')" style="flex:1;">오후반차</button>\n      </div>\n    </div>\n    ` : isBirthday ? `\n    <div style="padding:10px 12px; background:#fef3c7; border-radius:6px; font-size:12px; color:#92400e; margin-bottom:14px;">\n      🎂 생일연차는 연 1회, 하루만 사용 가능합니다. 연차 잔여일에서 차감됩니다.\n    </div>\n    ` : isSpecial ? `\n    <div class="form-row">\n      <label>특별휴가 구분</label>\n      <select id="specialType" onchange="updateSpecialDays()">\n        <option value="결혼">본인 결혼 (5일)</option>\n        <option value="배우자 출산">배우자 출산 (20일·법정)</option>\n        <option value="본인/배우자 부모 사망">본인/배우자 부모 사망 (5일)</option>\n        <option value="본인/배우자 조부모·외조부모 사망">본인/배우자 조부모·외조부모 사망 (3일)</option>\n        <option value="형제·자매 사망">형제·자매 사망 (3일)</option>\n        <option value="자녀 사망">자녀 사망 (5일)</option>\n        <option value="기타">기타 (직접 입력)</option>\n      </select>\n    </div>\n    <div style="padding:10px 12px; background:#eff6ff; border-radius:6px; font-size:11px; color:#1e40af; margin-bottom:14px; line-height:1.6;">\n      ℹ️ 경조사 휴가는 <b>휴일 포함</b>으로 산정됩니다 (예: 금요일 시작 5일 → 금·토·일·월·화).\n    </div>\n    ` : `\n    <div class="form-row">\n      <label>사용 구분</label>\n      <div style="display:flex; gap:8px;">\n        <button type="button" id="modeSingle" class="btn-primary" onclick="setRequestMode('single')" style="flex:1;">1일</button>\n        <button type="button" id="modeRange" class="btn-secondary" onclick="setRequestMode('range')" style="flex:1;">연속일</button>\n      </div>\n    </div>\n    `}\n\n    ${isSpecial ? `\n    <div class="form-row">\n      <label>시작일</label>\n      <input type="date" id="specialStart" value="${today}" min="${today}" onchange="updateSpecialEnd()">\n    </div>\n    <div class="form-row">\n      <label>사용 일수</label>\n      <input type="number" id="specialDays" value="5" min="1" max="30" onchange="updateSpecialEnd()">\n    </div>\n    <div class="form-row">\n      <label>종료일 (자동계산)</label>\n      <input type="text" id="specialEnd" readonly style="background:#f3f4f6;">\n    </div>\n    ` : `\n    <div id="singleDateRow" class="form-row">\n      <label>${isHalf ? '사용 일자' : '사용 일자 (1일)'}</label>\n      <input type="date" id="reqSingle" value="${today}" min="${today}">\n    </div>\n\n    <div id="rangeRow" class="hidden">\n      <div class="form-row">\n        <label>시작일</label>\n        <input type="date" id="reqStart" value="${today}" min="${today}" onchange="updateDayCount()">\n      </div>\n      <div class="form-row">\n        <label>종료일</label>\n        <input type="date" id="reqEnd" value="${today}" min="${today}" onchange="updateDayCount()">\n      </div>\n      <div id="dateWarning" class="hidden" style="color:var(--danger); font-size:12px; margin-top:-8px; margin-bottom:12px; padding:8px 12px; background:#fee2e2; border-radius:6px;">⚠️ 종료일은 시작일보다 늦은 날짜를 선택해 주세요.</div>\n      <div class="form-row">\n        <label>일수 (자동계산, 주말 제외)</label>\n        <input type="text" id="reqDays" value="1" readonly style="background:#f3f4f6;">\n      </div>\n    </div>\n    `}\n\n    <div class="form-row">\n      <label>사유</label>\n      <textarea id="reqReason" rows="3" placeholder="사유를 입력해 주세요"></textarea>\n    </div>\n    <div class="modal-actions">\n      <button class="btn-secondary" onclick="closeModal()">취소</button>\n      <button class="btn-primary" onclick="submitRequest('${type}')">신청</button>\n    </div>\n  `);
  if (type === '특별휴가') {
    setTimeout((() => {
      updateSpecialDays();
    }), 50);
  }
}

function updateSpecialDays() {
  const type = document.getElementById('specialType').value;
  const daysInput = document.getElementById('specialDays');
  if (daysInput && SPECIAL_LEAVE_DAYS[type] !== undefined) {
    daysInput.value = SPECIAL_LEAVE_DAYS[type];
    updateSpecialEnd();
  }
}

function updateSpecialEnd() {
  const start = document.getElementById('specialStart').value;
  const days = Number(document.getElementById('specialDays').value);
  const endInput = document.getElementById('specialEnd');
  if (!start || !days || days < 1) {
    endInput.value = '';
    return;
  }
  const d = new Date(start + 'T00:00:00');
  d.setDate(d.getDate() + days - 1);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  endInput.value = `${y}-${m}-${dd}`;
}

function setHalfType(t) {
  halfType = t;
  document.getElementById('halfMorning').className = t === 'morning' ? 'btn-primary' : 'btn-secondary';
  document.getElementById('halfAfternoon').className = t === 'afternoon' ? 'btn-primary' : 'btn-secondary';
}

function setRequestMode(mode) {
  requestMode = mode;
  document.getElementById('singleDateRow').classList.toggle('hidden', mode !== 'single');
  document.getElementById('rangeRow').classList.toggle('hidden', mode !== 'range');
  document.getElementById('modeSingle').className = mode === 'single' ? 'btn-primary' : 'btn-secondary';
  document.getElementById('modeRange').className = mode === 'range' ? 'btn-primary' : 'btn-secondary';
  if (mode === 'range') updateDayCount();
}

function updateDayCount() {
  const s = document.getElementById('reqStart').value;
  const e = document.getElementById('reqEnd').value;
  const warning = document.getElementById('dateWarning');
  const daysInput = document.getElementById('reqDays');
  if (!warning || !daysInput) return;
  if (s && e && s > e) {
    warning.classList.remove('hidden');
    daysInput.value = '-';
    return;
  }
  warning.classList.add('hidden');
  if (s && e) daysInput.value = workdaysCount(s, e);
}

async function submitRequest(type) {
  const isHalf = type === '반차';
  const isBirthday = type === '생일연차';
  const isSpecial = type === '특별휴가';
  let start, end, days;
  if (isBirthday) requestMode = 'single';
  if (isSpecial) {
    start = document.getElementById('specialStart').value;
    days = Number(document.getElementById('specialDays').value);
    if (!start || !days || days < 1) {
      alert('시작일과 일수를 확인해 주세요.');
      return;
    }
    const d = new Date(start + 'T00:00:00');
    d.setDate(d.getDate() + days - 1);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    end = `${y}-${m}-${dd}`;
  } else if (isHalf || requestMode === 'single') {
    start = document.getElementById('reqSingle').value;
    if (!start) {
      alert('날짜를 선택해 주세요.');
      return;
    }
    if (isBirthday) {
      const emp = getEmployee(DB.session.empId);
      const allowed = birthdayLeaveMonths(emp);
      const pickedMonth = Number(start.split('-')[1]);
      if (!allowed.includes(pickedMonth)) {
        alert(`생일연차는 ${allowed.join('/')}월 중에만 선택할 수 있습니다.`);
        return;
      }
    }
    end = start;
    days = isHalf ? .5 : 1;
  } else {
    start = document.getElementById('reqStart').value;
    end = document.getElementById('reqEnd').value;
    if (!start || !end) {
      alert('시작일과 종료일을 모두 선택해 주세요.');
      return;
    }
    if (start > end) {
      alert('종료일은 시작일보다 늦은 날짜를 선택해 주세요.');
      return;
    }
    days = workdaysCount(start, end);
  }
  const reason = document.getElementById('reqReason').value.trim();
  const _now2 = new Date;
  const todayStr = _now2.getFullYear() + '-' + String(_now2.getMonth() + 1).padStart(2, '0') + '-' + String(_now2.getDate()).padStart(2, '0');
  if (start < todayStr) {
    alert('신청일은 오늘(' + todayStr + ') 이후만 가능합니다.');
    return;
  }
  if (type === '연차') {
    const emp = getEmployee(DB.session.empId);
    const remain = calcAnnualLeave(emp).total - usedLeaveDays(emp.id);
    if (days > remain) {
      if (!confirm(`잔여 연차(${remain}일)보다 많은 ${days}일을 신청합니다. 진행하시겠습니까?`)) return;
    }
  }
  const specialType = isSpecial ? document.getElementById('specialType').value : null;
  const request = {
    id: 'r' + Date.now(),
    empId: DB.session.empId,
    type: type,
    startDate: start,
    endDate: end,
    days: days,
    reason: reason,
    status: 'approved',
    halfType: isHalf ? halfType : null,
    specialType: specialType,
    eventId: null,
    decidedBy: null,
    decidedAt: null,
    createdAt: Date.now()
  };
  showLoader('저장 중...');
  try {
    await dbInsert('requests', request);
    DB.requests.push(request);
    save(DB);
    hideLoader();
    closeModal();
    showToast('저장 완료', 'success');
    renderApp();
  } catch (err) {
    hideLoader();
    alert('저장 실패: ' + err.message);
    return;
  }
  if (type === '연차' || type === '반차' || type === '생일연차' || type === '특별휴가') {
    syncToCalendar(request);
  }
  if (isSpecial && specialType && specialType !== '기타') {
    sendCondolencePayAlert(request);
  }
}

const CONDOLENCE_PAY = {
  '결혼': null,
  '배우자 출산': null,
  '본인/배우자 부모 사망': null,
  '본인/배우자 조부모·외조부모 사망': null,
  '형제·자매 사망': null,
  '자녀 사망': null
};

const CONDOLENCE_ALERT_EMP_IDS = [ 'admin', 'jang' ];

async function sendCondolencePayAlert(request) {
  const url = HARDCODED_CALENDAR_URL;
  const emp = getEmployee(request.empId);
  if (!url || !emp) return;
  const empIdToEmail = {};
  Object.entries(EMAIL_WHITELIST).forEach((([email, id]) => {
    empIdToEmail[id] = email;
  }));
  const amount = CONDOLENCE_PAY[request.specialType];
  const subject = `[경조사비 지급 알림] ${emp.name} · ${request.specialType}`;
  const body = `경조사 특별휴가가 등록되어 경조사비 지급을 알려드립니다.\n\n직원: ${emp.name} (${emp.dept} · ${emp.position})\n경조 사유: ${request.specialType}\n휴가 기간: ${request.startDate}${request.endDate !== request.startDate ? ' ~ ' + request.endDate : ''} (${request.days}일)\n메모: ${request.reason || '-'}\n등록 일시: ${new Date(request.createdAt).toLocaleString('ko-KR')}\n\n경조금: ${amount ? Number(amount).toLocaleString() + '원' : '회사 기준 금액 확인 후 지급해 주세요'}\n\n— 식구 앱에서 자동 발송`;
  for (const id of CONDOLENCE_ALERT_EMP_IDS) {
    const to = empIdToEmail[id];
    if (!to) continue;
    try {
      await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'send_card_statement',
          to: to,
          subject: subject,
          body: body,
          attachments: [],
          idToken: DB.session ? DB.session.idToken : null
        })
      });
    } catch (err) {
      console.warn('[경조사비 알림] 발송 실패:', to, err);
    }
  }
}

async function cancelRequest(id) {
  const req = DB.requests.find((r => r.id === id));
  if (!req) return;
  if (!confirm('기록을 삭제하시겠습니까?')) return;
  showLoader('삭제 중...');
  try {
    await dbDelete('requests', 'id', id);
    if (req.eventId) deleteFromCalendar(req.eventId);
    DB.requests = DB.requests.filter((r => r.id !== id));
    save(DB);
    hideLoader();
    showToast('삭제 완료', 'success');
    renderApp();
  } catch (err) {
    hideLoader();
    alert('삭제 실패: ' + err.message);
  }
}

function givenName(name) {
  if (!name || name.length < 2) return name || '';
  return name.substring(1);
}

function calendarEventTitle(request, emp) {
  const gName = givenName(emp.name);
  if (request.type === '반차') {
    return (request.halfType === 'afternoon' ? '오후반차_' : '오전반차_') + gName;
  }
  return '연차_' + gName;
}

async function syncToCalendar(request) {
  const url = HARDCODED_CALENDAR_URL;
  if (!url) return;
  const emp = getEmployee(request.empId);
  if (!emp) return;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        action: 'create',
        title: calendarEventTitle(request, emp),
        startDate: request.startDate,
        endDate: request.endDate,
        description: request.reason || '',
        idToken: DB.session ? DB.session.idToken : null
      })
    });
    const data = await res.json();
    if (data.success && data.eventId) {
      const r = DB.requests.find((x => x.id === request.id));
      if (r) {
        r.eventId = data.eventId;
        save(DB);
        try {
          await dbUpdate('requests', 'id', request.id, {
            eventId: data.eventId
          });
        } catch (err) {
          console.warn('eventId DB 업데이트 실패:', err);
        }
      }
    } else {
      console.warn('캘린더 동기화 실패:', data.error);
    }
  } catch (err) {
    console.warn('캘린더 동기화 오류:', err);
  }
}

async function deleteFromCalendar(eventId) {
  const url = HARDCODED_CALENDAR_URL;
  if (!url) return;
  try {
    await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        action: 'delete',
        eventId: eventId,
        idToken: DB.session ? DB.session.idToken : null
      })
    });
  } catch (err) {
    console.warn('캘린더 이벤트 삭제 오류:', err);
  }
}

let _birthdayLunarFlag = false;

function setBirthdayType(lunar) {
  _birthdayLunarFlag = lunar;
  document.getElementById('bdaySolar').className = lunar ? 'btn-secondary' : 'btn-primary';
  document.getElementById('bdayLunar').className = lunar ? 'btn-primary' : 'btn-secondary';
  updateBirthdayPreview();
}

function updateBirthdayPreview() {
  const bday = document.getElementById('empBirthday').value;
  const leap = document.getElementById('empBirthdayLunarLeap').checked;
  const preview = document.getElementById('bdayPreview');
  if (!bday) {
    preview.textContent = '';
    return;
  }
  if (_birthdayLunarFlag) {
    const [y, m, d] = bday.split('-').map(Number);
    const thisYear = (new Date).getFullYear();
    const solarThis = lunarToSolar(thisYear, m, d, leap);
    const solarNext = lunarToSolar(thisYear + 1, m, d, leap);
    if (solarThis) {
      preview.innerHTML = `🗓️ 음력 ${m}/${d}${leap ? ' (윤달)' : ''} → 양력 ${thisYear}년 <b>${solarThis}</b>, ${thisYear + 1}년 <b>${solarNext || '변환 불가'}</b>`;
    } else {
      preview.innerHTML = `<span style="color:var(--danger);">⚠️ 해당 음력 날짜를 변환할 수 없습니다 (${leap ? '윤달' : '평달'} 정보 확인 필요)</span>`;
    }
  } else {
    preview.textContent = '';
  }
}

function saveEmployee(existingId) {
  const id = document.getElementById('empId').value.trim();
  const name = document.getElementById('empName').value.trim();
  const dept = document.getElementById('empDept').value.trim();
  const position = document.getElementById('empPos').value.trim();
  const joinDate = document.getElementById('empJoin').value;
  const role = document.getElementById('empRole').value;
  const pw = document.getElementById('empPw').value;
  const birthday = document.getElementById('empBirthday').value || null;
  const birthdayLunar = _birthdayLunarFlag;
  const birthdayLunarLeap = document.getElementById('empBirthdayLunarLeap').checked;
  const leaveRatioInput = document.getElementById('empLeaveRatio').value;
  const leaveRatio = leaveRatioInput === '' ? 1 : Math.max(0, Math.min(1, Number(leaveRatioInput)));
  if (!id || !name || !joinDate) {
    alert('ID, 이름, 입사일은 필수입니다.');
    return;
  }
  if (existingId) {
    const e = getEmployee(existingId);
    Object.assign(e, {
      name: name,
      dept: dept,
      position: position,
      joinDate: joinDate,
      role: role,
      birthday: birthday,
      birthdayLunar: birthdayLunar,
      birthdayLunarLeap: birthdayLunarLeap,
      leaveRatio: leaveRatio
    });
    if (pw) e.pw = pw;
  } else {
    if (getEmployee(id)) {
      alert('이미 존재하는 ID입니다.');
      return;
    }
    const parts = joinDate.split('-');
    const defaultPw = parts.length === 3 ? parts[1] + parts[2] : '0000';
    DB.employees.push({
      id: id,
      pw: pw || defaultPw,
      name: name,
      role: role,
      position: position,
      joinDate: joinDate,
      dept: dept,
      birthday: birthday,
      birthdayLunar: birthdayLunar,
      birthdayLunarLeap: birthdayLunarLeap,
      leaveRatio: leaveRatio
    });
  }
  save(DB);
  closeModal();
  renderAdminBody();
}

async function deleteEmployee(id) {
  if (!confirm('정말 삭제하시겠습니까? 해당 직원의 신청 이력도 함께 삭제됩니다.')) return;
  showLoader('삭제 중...');
  try {

    for (const r of toDelete) {

    hideLoader();
    alert('삭제 실패: ' + err.message);

}

const CEO_EMP_ID = 'admin';

const ROLLING_OPEN_DAYS = 60;

const ROLLING_CLOSE_DAYS = 10;

let ROLLING = {
  loaded: false,
  loading: false,
  failed: false,
  mine: [],
  all: []
};

let _rollingAutoShown = false;

function isCEO() {
  return DB.session && DB.session.empId === CEO_EMP_ID;
}

function milestoneSubtitle(emp) {
  if (emp.dept === '설계') return '내가 그린 집들';
  if (emp.dept === '시공') return '내가 땀 흘린 현장들';
  if (emp.dept === '행정') return '내가 아낀 살림';
  return '함께한 시간들';
}

function ymdLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function rollingTargets(fromDays, toDays) {
  const today = new Date;
  today.setHours(0, 0, 0, 0);
  const withEmail = new Set(Object.values(EMAIL_WHITELIST));
  const out = [];
  DB.employees.forEach((e => {
    if (e.id === CEO_EMP_ID || !withEmail.has(e.id) || !e.joinDate) return;
    const j = new Date(e.joinDate);
    if (isNaN(j.getTime())) return;
    TENURE_MILESTONES.forEach((y => {
      const ann = new Date(j);
      ann.setFullYear(j.getFullYear() + y);
      ann.setHours(0, 0, 0, 0);
      const daysLeft = Math.round((ann - today) / 864e5);
      if (daysLeft <= fromDays && daysLeft >= toDays) out.push({
        emp: e,
        years: y,
        date: ymdLocal(ann),
        daysLeft: daysLeft
      });
    }));
  }));
  return out.sort(((a, b) => a.daysLeft - b.daysLeft));
}

function myRollingTargets() {
  const me = DB.session ? DB.session.empId : null;
  return rollingTargets(ROLLING_OPEN_DAYS, ROLLING_CLOSE_DAYS).filter((t => t.emp.id !== me));
}

function myRollingNotes(targetId, years) {
  return ROLLING.mine.filter((n => n.kind !== 'self' && n.targetEmpId === targetId && Number(n.milestone) === years)).sort(((a, b) => Number(a.createdAt) - Number(b.createdAt)));
}

function mySelfTarget() {
  const me = DB.session ? DB.session.empId : null;
  return rollingTargets(ROLLING_OPEN_DAYS, 0).find((t => t.emp.id === me)) || null;
}

function mySelfNotes(years) {
  return ROLLING.mine.filter((n => n.kind === 'self' && Number(n.milestone) === years)).sort(((a, b) => Number(a.createdAt) - Number(b.createdAt)));
}

async function loadRolling(force) {
  if (ROLLING.loading || ROLLING.loaded && !force) return;
  ROLLING.loading = true;
  try {
    const res = await dbCall('rolling_list');
    if (res) {
      ROLLING.mine = res.mine || [];
      ROLLING.all = res.all || [];
      ROLLING.loaded = true;
      ROLLING.failed = false;
    }
  } catch (e) {
    ROLLING.failed = true;
    console.warn('[롤링페이퍼] 불러오기 실패:', e);
  }
  ROLLING.loading = false;
  refreshRollingUI();
}

function refreshRollingUI() {
  const el = document.getElementById('rollingBanner');
  if (el) el.innerHTML = renderRollingBanner();
  const body = document.getElementById('adminBody');
  if (body && adminTab === 'rolling' && isCEO()) body.innerHTML = renderRollingAdmin();
  maybeAutoShowRolling();
}

function renderRollingBanner() {
  if (!DB.session) return '';
  const targets = myRollingTargets();
  const self = mySelfTarget();
  if (targets.length === 0 && !self) return '';
  if (!ROLLING.loaded) {
    if (!ROLLING.failed) loadRolling();
    return '';

function rollingGroups() {
  const groups = {};
  rollingTargets(ROLLING_OPEN_DAYS, -60).forEach((t => {
    groups[t.emp.id + '_' + t.years] = {
      emp: t.emp,
      years: t.years,
      date: t.date,
      daysLeft: t.daysLeft,
      notes: []
    };
  }));
  ROLLING.all.forEach((n => {
    const key = n.targetEmpId + '_' + n.milestone;
    if (!groups[key]) {
      const e = getEmployee(n.targetEmpId);
      if (!e) return;
      groups[key] = {
        emp: e,
        years: Number(n.milestone),
        date: '',
        daysLeft: null,
        notes: []
      };
    }
    groups[key].notes.push(n);
  }));
  return Object.values(groups).sort(((a, b) => (a.daysLeft ?? 9999) - (b.daysLeft ?? 9999)));
}

function groupNotesByWriter(notes) {
  const byWriter = {};
  notes.filter((n => n.kind !== 'self')).sort(((a, b) => Number(a.createdAt) - Number(b.createdAt))).forEach((n => {
    const w = n.writer || '?';
    (byWriter[w] = byWriter[w] || []).push(n);
  }));
  return Object.keys(byWriter).sort().map((w => ({
    writer: w,
    notes: byWriter[w]
  })));
}

function copyRollingNotes(targetId, years) {
  const g = rollingGroups().find((x => x.emp.id === targetId && x.years === years));
  if (!g) return;
  const writers = groupNotesByWriter(g.notes);
  const text = [ `『나의 ${years}년 마일스톤 — ${milestoneSubtitle(g.emp)}』 ${g.emp.name}님 (${g.emp.dept} · ${g.emp.position}) 축하메시지 원문`, '아래 원문을 동료 한 명당 한마디씩, 쓴 사람 말투를 살려 2~3문장 대화체 초안으로 풀어 주세요.', '', ...writers.map((w => `식구 ${w.writer}\n` + w.notes.map((n => '- ' + n.content.replace(/\n+/g, ' '))).join('\n') + '\n')) ].join('\n');
  const done = () => showToast('원문을 복사했어요. Claude에게 붙여넣어 주세요.', 'success');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch((() => fallbackCopy(text, done)));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    done();
  } catch (e) {
    alert(text);
  }
  document.body.removeChild(ta);
}

function tgDayTs(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).getTime();
}

function tgToday() {
  const n = new Date;
  n.setHours(0, 0, 0, 0);
  return n.getTime();
}

function tgMembers() {
  const withEmail = new Set(Object.values(EMAIL_WHITELIST));
  return DB.employees.filter((e => withEmail.has(e.id)));
}

function tgTeamLabel(e) {
  if (e.id === CEO_EMP_ID) return '대표';
  if (e.dept === '시공') return '현장';
  if (e.dept === '설계') return '설계';
  if ((e.position || '').includes('공무')) return '공무';
  if (e.dept === '행정') return '회계';
  return e.dept || '';
}

function tgCanAdmin() {
  const me = getEmployee(DB.session?.empId);
  return !!me && me.role === 'admin';
}

function tgOpenForm(id) {
  _tgView = 'form:' + id;

    if (el) el.focus();
  }), 50);
}

async function tgSaveGoal(id) {
  const el = document.getElementById('tgInput');
  const content = (el ? el.value : '').trim();
  if (!content) {
    alert('목표를 적어 주세요.');
    return;
  }
  const me = DB.session.empId;
  showLoader('저장 중...');
  try {
    if (id === 'new') {
      if (DB.teamGoals.filter((g => g.empId === me)).length >= TG_MAX_GOALS) {
        hideLoader();
        alert(`목표는 ${TG_MAX_GOALS}개까지 적을 수 있어요.`);
        return;
      }
      const row = {
        id: 'tg' + Date.now(),
        empId: me,
        content: content,
        done: false,
        doneAt: '',
        ceoComment: '',
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      await dbInsert('teamGoals', row);
      DB.teamGoals.push(row);
    } else {
      await dbUpdate('teamGoals', 'id', id, {
        content: content,
        updatedAt: Date.now()
      });
      const g = DB.teamGoals.find((x => x.id === id));
      if (g) g.content = content;
    }
    save(DB);
    hideLoader();
    _tgView = null;
    renderTeamGoal();
  } catch (err) {
    hideLoader();
    alert('저장 실패: ' + err.message);
  }
}

async function tgToggleGoal(id) {
  const g = DB.teamGoals.find((x => x.id === id));
  if (!g) return;
  const done = !g.done;
  try {
    await dbUpdate('teamGoals', 'id', id, {
      done: done,
      doneAt: done ? Date.now() : '',
      updatedAt: Date.now()
    });
    g.done = done;
    g.doneAt = done ? Date.now() : '';
    save(DB);
    if (done) showToast('목표 완료! 수고했어요 👏', 'success');
    renderTeamGoal();
  } catch (err) {
    alert('저장 실패: ' + err.message);
  }
}

async function tgDeleteGoal(id) {
  if (!confirm('이 목표를 지울까요?')) return;
  try {
    await dbDelete('teamGoals', 'id', id);
    DB.teamGoals = DB.teamGoals.filter((x => x.id !== id));
    save(DB);
    renderTeamGoal();
  } catch (err) {
    alert('삭제 실패: ' + err.message);
  }
}

async function tgComment(id) {
  const g = DB.teamGoals.find((x => x.id === id));
  if (!g) return;
  const text = prompt('이 목표에 남길 대표님 한마디', g.ceoComment || '');
  if (text === null) return;
  try {
    await dbUpdate('teamGoals', 'id', id, {
      ceoComment: text.trim(),
      updatedAt: Date.now()
    });
    g.ceoComment = text.trim();
    save(DB);
    renderTeamGoal();
  } catch (err) {
    alert('저장 실패: ' + err.message);
  }
}

function tgUpgradeHTML() {
  if (_tgView && _tgView.startsWith('place:')) return tgPlaceHTML(_tgView.slice(6));
  const cur = Math.max(0, Number(DB.appSettings[TG_REVENUE_KEY]) || 0);
  const {VN: vn, SG: sg, DE: de} = TG_TIERS;
  let pct;
  if (cur < vn) pct = 40 * cur / vn; else if (cur < sg) pct = 40 + 30 * (cur - vn) / (sg - vn); else pct = 70 + 30 * Math.min(1, (cur - sg) / (de - sg));
  const rV = cur >= vn, rS = cur >= sg, rD = cur >= de;
  const status = rD ? '독일 확정! 최고 단계 달성' : rS ? `싱가포르 확정! 독일까지 ${de - cur}억` : rV ? `베트남 확정! 싱가포르까지 ${sg - cur}억` : `베트남까지 ${vn - cur}억 남았어요`;
  const ring = (reached, isNext) => reached ? 'border:4px solid #059669;' : isNext ? 'border:3px dashed #2563eb;' : 'border:2px solid #e5e7eb; opacity:.85;';
  const tag = (reached, isNext, amt) => `<span style="color:${reached ? '#059669' : isNext ? '#1d4ed8' : '#6b7280'};">${amt}억${reached ? ' · 확정' : ''}</span>`;
  const stop = (code, left, reached, isNext, amt) => `\n    <div class="tg-stop" style="left:${left}%;">\n      <button class="tg-circle" style="${ring(reached, isNext)}" onclick="_tgView='place:${code}'; renderTeamGoal()" aria-label="${TG_PLACES[code].name} 연수 소개 보기">${TG_FLAGS[code]}</button>\n      <span>${TG_PLACES[code].name}</span>${tag(reached, isNext, amt)}\n    </div>`;
  return `\n    ${tgHeader('2029년 1~2월 연수')}\n    <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">\n      <div style="font-size:24px; font-weight:800; line-height:1.35;">함께 달린 만큼,<br><span style="color:#2563eb;">더 멀리</span> 떠납니다</div>\n      <div style="text-align:right;">\n        <div style="font-size:12px; color:var(--muted);">2027~2028 함께 쌓은 매출</div>\n        <div style="font-size:32px; font-weight:800; color:#1d4ed8; line-height:1.1;">${cur}억</div>\n        <div style="font-size:13px; font-weight:700;">${status}</div>\n      </div>\n    </div>\n    <div class="tg-route" style="height:130px;">\n      <div class="tg-line"></div>\n      <div class="tg-trail" style="width:${pct}%;"></div>\n      <div class="tg-stop" style="left:0; top:24px;"><div style="width:24px; height:24px; border-radius:50%; background:#2563eb; border:4px solid #dbeafe; box-sizing:border-box;"></div><span>출발</span><span style="color:#6b7280;">0억</span></div>\n      ${stop('VN', 40, rV, true, vn)}\n      ${stop('SG', 70, rS, rV, sg)}\n      ${stop('DE', 100, rD, rS, de)}\n      <div class="tg-plane" style="left:${pct}%; top:-30px;">${TG_PLANE}</div>\n    </div>\n    <div style="background:#f9fafb; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.7;">\n      <b>2년 동안 함께 쌓은 매출로 떠나는 연수입니다.</b> 출발은 1~2월 건축 비수기예요.<br>\n      ${vn}억이면 베트남, ${sg}억이면 싱가포르, ${de}억이면 독일! 국기를 누르면 연수지 소개를 볼 수 있어요.\n    </div>\n    ${tgCanAdmin() ? `\n      <div style="display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--muted); flex-wrap:wrap;">\n        <label for="tgRevenue" style="margin:0;">관리자 · 2027~2028 누적 매출(억)</label>\n        <input id="tgRevenue" type="number" min="0" step="1" value="${cur}" style="width:100px; padding:6px 8px;">\n        <button class="btn-secondary btn-sm" onclick="tgSaveRevenue()">반영</button>\n      </div>` : ''}\n  `;

  const join = emp && emp.joinDate ? new Date(emp.joinDate) : null;
  const today = new Date;
  const annivOf = y => {
    const d = new Date(join);
    d.setFullYear(d.getFullYear() + y);
    return d;
  };
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const cards = TENURE_REWARDS.map((r => {
    const done = join && annivOf(r.years) <= today;
    return `\n      <div style="display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:8px; border-radius:10px; background:${r.bg}; border:1px solid ${r.bd}; ${done ? 'opacity:0.75;' : ''}">\n        <div style="font-size:26px; line-height:1;">${r.icon}</div>\n        <div style="flex:1;">\n          <div style="font-size:12px; color:#92400e; font-weight:700;">근속 ${r.years}년</div>\n          <div style="font-size:14px; font-weight:700; color:#1f2937;">${r.title}${r.gift ? ` <span style="font-weight:700; color:#b45309;">+ ${r.gift}</span>` : ''}</div>\n          <div style="font-size:11px; color:#78350f;">${r.note}</div>\n        </div>\n        ${done ? '<div style="font-size:12px; font-weight:700; color:#059669;">✓ 지남</div>' : ''}\n      </div>`;
  })).join('');
  let mine = '';
  if (join && !isNaN(join.getTime())) {
    const next = TENURE_REWARDS.find((r => annivOf(r.years) > today));
    if (next) {
      const idx = TENURE_REWARDS.indexOf(next);
      const from = idx > 0 ? annivOf(TENURE_REWARDS[idx - 1].years) : join;
      const to = annivOf(next.years);
      const left = Math.ceil((to - today) / 864e5);
      const pct = Math.max(0, Math.min(100, Math.round((today - from) / (to - from) * 100)));
      mine = `\n        <div style="margin-top:16px; padding:14px; border-radius:10px; background:#f1f5f9;">\n          <div style="font-size:12px; color:var(--muted); font-weight:600; margin-bottom:6px;">${emp.name}님의 다음 포상</div>\n          <div style="font-size:13px; line-height:1.6;">\n            근속 ${formatTenure(emp.joinDate).replace(/\s*\(.*\)$/, '')} → <b>${next.icon} ${next.years}년 포상까지 ${left.toLocaleString()}일</b>\n            <span style="color:var(--muted); font-size:11px;">(${ymd(to)})</span>\n          </div>\n          <div style="margin-top:8px; background:#e2e8f0; border-radius:99px; height:8px; overflow:hidden;">\n            <div style="width:${pct}%; height:100%; background:linear-gradient(90deg,#fbbf24,#d97706);"></div>\n          </div>\n          <div style="text-align:right; font-size:11px; color:var(--muted); margin-top:3px;">${pct}%</div>\n        </div>`;
    } else {
      mine = `\n        <div style="margin-top:16px; padding:14px; border-radius:10px; background:#f1f5f9; text-align:center; font-size:14px; font-weight:700;">\n          ${emp.name}님은 모든 포상을 받으셨어요 👑\n        </div>`;
    }
  }
  showModal(`\n    <h3 style="margin-bottom:4px;">🏆 사람사는집 근속 포상 기준</h3>\n    <p style="font-size:12px; color:var(--muted); margin-bottom:16px;">함께 쌓아온 시간에 감사하는 마음을 담았습니다.</p>\n    ${cards}\n    ${mine}\n    <div style="margin-top:16px; font-size:12px; color:var(--muted); line-height:1.8;">\n      <b style="color:var(--text);">알아두세요</b><br>\n      · <b style="color:#b45309;">모든 포상휴가는 연차와 별도로 추가 부여됩니다.</b> 안식월 20일도 연차에서 빠지지 않아요.<br>\n      &nbsp;&nbsp;(예: 연차 15일인 해에 근속 7년이 되면 → 15일 + 안식월 20일 = 총 35일)<br>\n      · 포상휴가는 해당 근속 주년이 되는 해에 한 번 부여됩니다.<br>\n      · 포상휴가는 연차수당으로 바꿀 수 없어요. 꼭 쉬는 데 써주세요 💛<br>\n      · 근속 주년 2개월 전에 메일로 미리 알려드립니다.\n    </div>\n    <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">닫기</button></div>\n  `);
}

function showLoader(text) {
  const root = document.getElementById('loaderRoot');
  if (!root) return;
  root.innerHTML = `\n    <div class="loader-overlay">\n      <div class="loader-spinner"></div>\n      <div class="loader-text">${escapeHtml(text || '불러오는 중...')}</div>\n    </div>\n  `;
}

function hideLoader() {
  const root = document.getElementById('loaderRoot');
  if (root) root.innerHTML = '';
}

let _toastTimer = null;

function showToast(msg, type) {
  const el = document.getElementById('syncToast');
  if (!el) return;
  el.className = 'sync-toast show' + (type ? ' ' + type : '');
  el.textContent = msg;
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout((() => {
    el.className = 'sync-toast';
  }), 2500);
}

function applyTables(tables) {
  if (tables.requests) {
    DB.requests = tables.requests;
    DB.requests.forEach((r => {
      r.days = Number(r.days) || 0;
      r.createdAt = Number(r.createdAt) || 0;
      if (r.decidedAt) r.decidedAt = Number(r.decidedAt);
    }));
  }
  if (tables.overtime) {
    DB.overtime = tables.overtime;
    DB.overtime.forEach((o => {
      o.hours = Number(o.hours) || 0;
      o.createdAt = Number(o.createdAt) || 0;
    }));
  }
  if (tables.mileage) {
    DB.mileage = tables.mileage;
    DB.mileage.forEach((m => {
      m.distance = Number(m.distance) || 0;
      m.fuelPrice = Number(m.fuelPrice) || 0;
      m.createdAt = Number(m.createdAt) || 0;
    }));
  }
  if (tables.tollgate) {
    DB.tollgate = tables.tollgate;
    DB.tollgate.forEach((t => {
      t.amount = Number(t.amount) || 0;
      t.createdAt = Number(t.createdAt) || 0;
    }));
  }
  if (tables.cardUsage) {
    DB.cardUsage = tables.cardUsage;
    DB.cardUsage.forEach((c => {
      c.amount = Number(c.amount) || 0;
      c.createdAt = Number(c.createdAt) || 0;
      if (c.sentAt) c.sentAt = Number(c.sentAt);
    }));
  }
  if (tables.welfare) {
    DB.welfare = tables.welfare;
    DB.welfare.forEach((w => {
      w.year = Number(w.year) || 0;
      w.totalAmount = Number(w.totalAmount) || 0;
      w.companyAmount = Number(w.companyAmount) || 0;
      w.createdAt = Number(w.createdAt) || 0;
    }));
  }
  if (tables.vehicles) {
    DB.vehicles = {};
    tables.vehicles.forEach((v => {
      if (v.empId) DB.vehicles[v.empId] = {
        fuelType: v.fuelType || '휘발유',
        efficiency: Number(v.efficiency) || 12
      };
    }));
  }
  if (tables.fuelPrices) {
    DB.fuelPrices = {};
    tables.fuelPrices.forEach((f => {
      if (f.month) DB.fuelPrices[f.month] = {
        gasoline: Number(f.gasoline) || 0,
        diesel: Number(f.diesel) || 0
      };
    }));
  }
  if (tables.fuelPriceDaily) {
    DB.fuelPriceDaily = tables.fuelPriceDaily.map((f => ({
      date: String(f.date),
      gasoline: Number(f.gasoline) || 0,
      diesel: Number(f.diesel) || 0
    })));
  }
  if (tables.teamGoals) {
    DB.teamGoals = tables.teamGoals.map((g => ({
      ...g,
      done: g.done === true || g.done === 'TRUE' || g.done === 'true',
      createdAt: Number(g.createdAt) || 0
    })));
  }
  if (tables.appSettings) {
    DB.appSettings = {};
    tables.appSettings.forEach((s => {
      if (s.key) DB.appSettings[s.key] = s.value;
    }));
  }
  if (tables.tenureNotifications) {
    DB.tenureNotifications = {};
    tables.tenureNotifications.forEach((t => {
      if (t.key) DB.tenureNotifications[t.key] = t.sentAt;
    }));
  }
  if (tables.legacyLeave) {
    tables.legacyLeave.forEach((l => {
      const emp = DB.employees.find((e => e.id === l.empId));
      if (emp) {
        emp.legacyLeaveUsed = Number(l.used) || 0;
        emp.legacyBirthdayUsed = !!l.birthdayUsed;
      }
    }));
  }
}

const ESSENTIAL_TABLES = [ 'requests', 'overtime', 'legacyLeave', 'vehicles', 'fuelPrices', 'fuelPriceDaily', 'tenureNotifications', 'teamGoals', 'appSettings' ];

const DEFERRED_TABLES = [ 'mileage', 'tollgate', 'cardUsage', 'welfare' ];

let _deferredLoaded = false;

async function syncFromDB() {
  const tables = await dbLoadAll(ESSENTIAL_TABLES);
  applyTables(tables);
  save(DB);
  loadDeferredTables();
  ensureFuelPricesFresh();
}

async function loadDeferredTables() {
  if (_deferredLoaded) return;
  try {
    const tables = await dbLoadAll(DEFERRED_TABLES);
    applyTables(tables);
    save(DB);
    _deferredLoaded = true;
  } catch (err) {
    console.warn('지연 테이블 로드 실패:', err.message);
  }
}

async function ensureDeferredLoaded() {
  if (_deferredLoaded) return;
  showLoader('추가 데이터 불러오는 중...');
  await loadDeferredTables();
  hideLoader();
}

async function migrateLocalToDB() {
  if (DB.migrated_to_sheets_v1) return false;
  const batches = [ {
    table: 'requests',
    rows: DB.requests || []
  }, {
    table: 'overtime',
    rows: DB.overtime || []
  }, {
    table: 'mileage',
    rows: DB.mileage || []
  }, {
    table: 'tollgate',
    rows: DB.tollgate || []
  }, {
    table: 'cardUsage',
    rows: DB.cardUsage || []
  }, {
    table: 'welfare',
    rows: DB.welfare || []
  } ];
  let total = 0;
  for (const b of batches) {
    if (b.rows.length > 0) {
      await dbBulkInsert(b.table, b.rows);
      total += b.rows.length;
    }
  }
  for (const [empId, v] of Object.entries(DB.vehicles || {})) {
    await dbUpsert('vehicles', 'empId', {
      empId: empId,
      fuelType: v.fuelType,
      efficiency: v.efficiency
    });
  }
  for (const [month, f] of Object.entries(DB.fuelPrices || {})) {
    await dbUpsert('fuelPrices', 'month', {
      month: month,
      gasoline: f.gasoline,
      diesel: f.diesel
    });
  }
  for (const [key, sentAt] of Object.entries(DB.tenureNotifications || {})) {
    await dbUpsert('tenureNotifications', 'key', {
      key: key,
      sentAt: sentAt
    });
  }
  DB.migrated_to_sheets_v1 = true;
  save(DB);
  return total > 0;
}

if (DB.session) renderApp();

(function() {
  const sub = document.getElementById('loginSub');
  if (sub) sub.textContent = `(주)사람사는집 근태관리 web app (${(new Date).getFullYear()})`;
})();
</script>
