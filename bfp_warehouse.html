<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F1E1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>사람사는집 창고</title>
<style>
:root{color-scheme:dark;--bg:#262624;--surface:#2D2D2B;--raise:#333331;--line:#3A3937;--line2:#4A4946;--ink:#F2F0EB;--text:#DCD9D3;--muted:#9A9791;--green:#3F7A5C;--amber:#E0A72E;--red:#E07B6A;--blue:#7FA7D8}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 80px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top h1{font-size:20px;margin:0;color:var(--ink);flex:1}
.who{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 10px}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;background:var(--green);color:#fff;cursor:pointer}
.btn.ghost{background:var(--surface);border:1px solid var(--line2);color:var(--ink)}
.pin{max-width:340px;margin:12vh auto 0;text-align:center}.pin h1{color:var(--ink);font-size:22px;margin:0 0 4px}.pin p{color:var(--muted);margin:0 0 18px}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:18px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)}.dots i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:24px;color:var(--ink)}
.err{color:var(--red);min-height:22px;margin-top:12px}
.alerts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.alerts button{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 12px}
.alerts button b{font-size:17px;margin-right:4px}.alerts .warn b{color:var(--amber)}.alerts .bad b{color:var(--red)}.alerts [aria-pressed=true]{border-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input,.tools select{flex:1;min-width:150px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px}
.flag{font-size:11.5px;padding:1px 7px;border-radius:999px;margin-left:6px;background:rgba(224,167,46,.15);color:var(--amber)}.flag.bad{background:rgba(224,123,106,.15);color:var(--red)}.flag.out{background:rgba(127,167,216,.15);color:var(--blue)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:flex-end;z-index:9}
.sheet>div{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--line);padding:18px}
.sheet h2{margin:0 0 4px;color:var(--ink);font-size:18px}.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:12.5px;color:var(--muted)}
.warnbox{background:rgba(224,123,106,.12);color:var(--red);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.thumbs button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--raise) center/cover no-repeat}
.rules li{margin:3px 0;font-size:13.5px}.rules h3{font-size:14.5px;margin:14px 0 6px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#F2F0EB;color:#1F1E1D;padding:10px 16px;border-radius:8px;display:none;z-index:20}
.empty,.loading{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:600px){.two{grid-template-columns:1fr}.top h1{font-size:18px}}
.tbl-wrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto;max-height:calc(100vh - 230px)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--raise);color:var(--muted);font-weight:600;font-size:13px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr[data-id]{cursor:pointer}.tbl tr[data-id]:hover td{background:rgba(255,255,255,.03)}
.tbl .num{text-align:right;width:68px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.nm b{color:var(--ink);font-weight:600}.tbl .br{color:var(--muted);font-size:12.5px;margin-left:6px}
.tbl .grp td{background:var(--bg);color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 12px}
.tbl .dim,.dim{color:var(--muted)}.tbl .out{color:var(--blue);font-weight:700}.tbl .zero{color:var(--red);font-weight:700}.tbl .site{color:var(--blue)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stat div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:20px;color:var(--ink)}.stat b.sm{font-size:14px}
.h3{font-size:14px;color:var(--ink);margin:6px 0 8px}.rent{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.rent div{flex:1}.rent small{display:block;color:var(--muted);font-size:12.5px}.btn:disabled{opacity:.4}
@media(max-width:640px){.tbl{font-size:14px}.tbl td,.tbl th{padding:9px 8px}.tbl .num{width:44px}.tbl .br{display:block;margin:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzc21WNSYNOg55Bc5W_lcUxMBmi4KN0JrkAMB84cvi6AbGf1Xsmy10MoTQz93BuxIdigA/exec';
const TK = 'bfp_wh_token', WK = 'bfp_wh_who';
const W = { token: '', who: '', items: [], meta: null, names: [], sites: [], q: '', cat: '', place: '', flag: '', urls: {}, pin: '' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3000); }
try { W.token = localStorage.getItem(TK) || ''; W.who = localStorage.getItem(WK) || ''; W.device = localStorage.getItem('bfp_wh_device') || ''; if (!W.device) { W.device = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random()).replace(/-/g, '') + Math.random().toString(36).slice(2); localStorage.setItem('bfp_wh_device', W.device); } } catch (e) {}
async function api(body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ token: W.token, who: W.who, device: W.device }, body)) });
  const d = await r.json();
  if (d.authError) { W.token = ''; try { localStorage.removeItem(TK); } catch (e) {} pinView(d.error); throw new Error(d.error); }
  if (!d.ok) throw new Error(d.error || '요청 실패');
  return d;
}
function pinView(msg) {
  W.pin = '';
  $('app').innerHTML = `<div class="pin"><h1>사람사는집 창고</h1><p>창고 비밀번호를 입력하세요</p><div class="dots" id="dots"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,'지움',0,'확인'].map(k => `<button type="button" data-k="${k}" ${typeof k === 'string' ? 'style="font-size:16px"' : ''}>${k}</button>`).join('')}</div><div class="err" id="perr">${esc(msg || '')}</div></div>`;
  const dots = () => { $('dots').innerHTML = Array.from({ length: Math.max(6, W.pin.length) }, (_, i) => `<i class="${i < W.pin.length ? 'on' : ''}"></i>`).join(''); };
  dots();
  const go = async () => {
    if (W.pin.length < 4) return;
    $('perr').textContent = '확인 중...';
    try { const d = await api({ action: 'wh_login', pin: W.pin }); W.token = d.token; try { localStorage.setItem(TK, d.token); } catch (e) {} start(); }
    catch (e) { W.pin = ''; dots(); $('perr').textContent = e.message; }
  };
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === '지움') W.pin = W.pin.slice(0, -1); else if (k === '확인') return go(); else if (W.pin.length < 8) W.pin += k; dots(); });
  document.onkeydown = e => { if (!$('dots')) return; if (/^\d$/.test(e.key) && W.pin.length < 8) { W.pin += e.key; dots(); } else if (e.key === 'Backspace') { W.pin = W.pin.slice(0, -1); dots(); } else if (e.key === 'Enter') go(); };
}
async function start() {
  if (!W.token) return pinView();
  $('app').innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const [m, l] = await Promise.all([api({ action: 'wh_meta' }), api({ action: 'wh_list' })]);
    W.names = m.names; W.sites = m.sites; W.items = l.items; W.meta = l;
    render();
  } catch (e) { if (W.token) $('app').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function months(ym) { if (!/^\d{4}-\d{2}/.test(ym || '')) return 0; const [y, m] = ym.split('-').map(Number); const n = new Date(); return (n.getFullYear() - y) * 12 + (n.getMonth() + 1 - m); }
function flags(o) {
  const f = [], keep = W.meta.keepMonths || 24;
  if (o.status === '대여중') f.push({ k: 'out', t: '대여중' });
  if (o.status === '수리 필요') f.push({ k: 'bad', t: '수리 필요' });
  if (o.cat === '기한 한정 자재' && months(o.inMonth) >= keep) f.push({ k: 'bad', t: '입고 2년 경과 · 폐기' });
  else if (['공구', '창고 자재', '현장 비품'].includes(o.cat) && o.status !== '대여중' && months(o.lastUsed ? o.lastUsed.slice(0, 7) : o.inMonth) >= keep) f.push({ k: '', t: '2년 미사용 · 처분 검토' });
  return f;
}
const FILT = { out: ['대여중', o => (o.rentals || []).length > 0, ''], old: ['2년 미사용·경과', o => flags(o).some(f => /2년/.test(f.t)), 'warn'], fix: ['수리 필요', o => o.status === '수리 필요', 'bad'] };
const SHOW = ['공구', '창고 자재', '기한 한정 자재', '현장 비품', '컨테이너', '기타'];
function render() {
  const M = W.meta, cats = M.cats.filter(c => SHOW.includes(c));
  const places = [...new Set([...M.places, ...W.items.filter(o => cats.includes(o.cat)).map(o => o.place).filter(Boolean)])];
  const q = W.q.trim().toLowerCase();
  const list = W.items.filter(o => cats.includes(o.cat || '기타') && (!W.cat || o.cat === W.cat) && (!W.place || o.place === W.place || (o.rentals || []).some(r => r.site === W.place))
    && (!W.flag || FILT[W.flag][1](o)) && (!q || [o.tag, o.name, o.brand, o.note, o.place, o.sub, ...(o.rentals || []).map(r => r.by + ' ' + r.site)].join(' ').toLowerCase().includes(q)));
  const groups = cats.map(c => [c, list.filter(o => (o.cat || '기타') === c).sort((a, b) => a.name.localeCompare(b.name, 'ko'))]).filter(g => g[1].length);
  const n = v => v === '' || v == null ? '–' : v;
  const row = o => {
    const rs = o.rentals || [], warn = flags(o).filter(f => f.k !== 'out');
    return `<tr data-id="${esc(o.id)}">
      <td class="nm"><b>${esc(o.name)}</b>${o.brand ? `<span class="br">${esc(o.brand)}</span>` : ''}${warn.map(f => `<span class="flag ${f.k}">${esc(f.t)}</span>`).join('')}</td>
      <td class="num">${n(o.qty)}</td>
      <td class="num ${o.rented ? 'out' : 'dim'}">${o.rented || '–'}</td>
      <td class="num ${o.remain === 0 ? 'zero' : ''}">${n(o.remain)}</td>
      <td>${rs.length ? rs.map(r => `<div>${esc(r.by)}${r.qty > 1 ? ` <span class="dim">×${r.qty}</span>` : ''}</div>`).join('') : '<span class="dim">–</span>'}</td>
      <td>${rs.map(r => `<div class="site">${esc(r.site)}</div>`).join('')}${o.remain !== 0 || !rs.length ? `<div class="dim">${esc(o.place || '')}</div>` : ''}</td></tr>`;
  };
  $('app').innerHTML = `
    <div class="top"><h1>창고</h1>
      <select class="who" id="who"><option value="">누구세요?</option>${W.names.map(x => `<option ${x === W.who ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
      <button class="btn ghost" id="rules">보관 기준</button><button class="btn" id="add">+ 등록</button></div>
    <div class="alerts">${Object.entries(FILT).map(([k, [lb, fn, cls]]) => { const c = W.items.filter(fn).length; return `<button class="${c ? cls : ''}" data-flag="${k}" aria-pressed="${W.flag === k}"><b>${c}</b>${lb}</button>`; }).join('')}</div>
    <div class="tools"><input type="search" id="q" placeholder="품목·사람·현장 검색" value="${esc(W.q)}">
      <select id="cat"><option value="">전체 분류</option>${cats.map(c => `<option ${c === W.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select id="place"><option value="">전체 장소</option>${places.map(c => `<option ${c === W.place ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="tbl-wrap">${groups.length ? `<table class="tbl">
      <thead><tr><th class="nm">품목</th><th class="num">수량</th><th class="num">대여중</th><th class="num">잔여</th><th>대여자</th><th>위치</th></tr></thead>
      ${groups.map(([c, rows]) => `<tbody><tr class="grp"><td colspan="6">${esc(c)} <span class="dim">${rows.length}</span></td></tr>${rows.map(row).join('')}</tbody>`).join('')}
    </table>` : '<div class="empty">해당하는 물품이 없습니다</div>'}</div>
    <div class="hint" style="margin-top:10px">행을 누르면 반출·반납·수정을 할 수 있습니다.</div>`;
  $('who').onchange = e => { W.who = e.target.value; try { localStorage.setItem(WK, W.who); } catch (x) {} };
  $('q').oninput = e => { W.q = e.target.value; clearTimeout(W._t); W._t = setTimeout(() => { render(); const i = $('q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
  $('cat').onchange = e => { W.cat = e.target.value; render(); };
  $('place').onchange = e => { W.place = e.target.value; render(); };
  document.querySelectorAll('[data-flag]').forEach(b => b.onclick = () => { W.flag = W.flag === b.dataset.flag ? '' : b.dataset.flag; render(); });
  document.querySelectorAll('tr[data-id]').forEach(r => r.onclick = () => detail(W.items.find(x => x.id === r.dataset.id)));
  $('rules').onclick = rules; $('add').onclick = () => form(null);
}
function needWho() { if (W.who) return true; toast('위에서 이름을 먼저 고르세요'); $('who').focus(); return false; }
function sheet(title, sub, html) {
  close(); const s = document.createElement('div'); s.className = 'sheet'; s.id = 'sheet';
  s.innerHTML = `<div><h2>${title}</h2><div class="sub">${sub}</div>${html}</div>`;
  s.onclick = e => { if (e.target === s) close(); }; document.body.appendChild(s); return s;
}
function close() { const s = $('sheet'); if (s) s.remove(); }
async function busy(btn, fn) { if (btn.disabled) return; const t = btn.textContent; btn.disabled = true; btn.textContent = '저장 중...'; try { await fn(); } catch (e) { toast(e.message); } finally { btn.disabled = false; btn.textContent = t; } }
function put(item) { const i = W.items.findIndex(x => x.id === item.id); if (i >= 0) W.items[i] = item; else W.items.push(item); }
function detail(o) {
  const rentable = (W.meta.rentable || ['공구']).includes(o.cat), rs = o.rentals || [], fl = flags(o).filter(f => f.k !== 'out');
  const canOut = rentable && (o.remain === '' ? !rs.length : o.remain > 0);
  const s = sheet(esc(o.name), [o.brand, o.cat, o.sub].filter(Boolean).map(esc).join(' · '), `
    ${fl.length ? `<div class="warnbox">${fl.map(f => esc(f.t)).join(' · ')}</div>` : ''}
    <div class="stat"><div><small>수량</small><b>${o.qty === '' ? '–' : o.qty}</b></div><div><small>대여중</small><b>${o.rented || 0}</b></div><div><small>잔여</small><b>${o.remain === '' ? '–' : o.remain}</b></div><div><small>보관</small><b class="sm">${esc(o.place || '–')}</b></div></div>
    ${rs.length ? `<h3 class="h3">대여 중</h3>${rs.map(r => `<div class="rent"><div><b>${esc(r.by)}</b>${r.qty > 1 ? ` ×${r.qty}` : ''}<small>${esc(r.site)} · ${esc(r.at)}${r.at ? ' · ' + dayDiff(r.at, today()) + '일째' : ''}</small></div><button class="btn ghost" data-ret="${esc(r.id)}">반납</button></div>`).join('')}` : ''}
    ${o.note ? `<p class="hint">${esc(o.note)}</p>` : ''}
    <div class="acts"><button class="btn ghost" id="ed" style="margin-right:auto">정보 수정</button><button class="btn ghost" id="c">닫기</button>${rentable ? `<button class="btn" id="out" ${canOut ? '' : 'disabled'}>반출</button>` : ''}</div>`);
  $('c').onclick = close; $('ed').onclick = () => form(o);
  if ($('out')) $('out').onclick = () => rentForm(o);
  s.querySelectorAll('[data-ret]').forEach(b => b.onclick = () => returnForm(o, rs.find(r => r.id === b.dataset.ret)));
}
function rentForm(o) {
  if (!needWho()) return;
  const max = o.remain === '' ? 1 : o.remain;
  sheet(`반출 · ${esc(o.name)}`, `${esc(W.who)} 님 이름으로 기록됩니다 · 남은 수량 ${max}`, `
    <div class="f"><label>사용 현장</label><select id="rs"><option value="">현장 선택</option>${W.sites.map(s => `<option>${esc(s)}</option>`).join('')}<option value="기타">기타(직접 입력)</option></select>
      <input id="rs2" placeholder="현장 직접 입력" style="margin-top:6px" hidden></div>
    ${max > 1 ? `<div class="f"><label>수량</label><select id="rq">${Array.from({ length: max }, (_, i) => `<option>${i + 1}</option>`).join('')}</select></div>` : ''}
    <div class="acts"><button class="btn ghost" id="c">닫기</button><button class="btn" id="g">반출</button></div>`);
  $('rs').onchange = () => { $('rs2').hidden = $('rs').value !== '기타'; };
  $('c').onclick = close;
  $('g').onclick = e => busy(e.target, async () => { const site = $('rs').value === '기타' ? $('rs2').value : $('rs').value; const d = await api({ action: 'wh_rent', id: o.id, site, by: W.who, qty: $('rq') ? Number($('rq').value) : 1 }); put(d.item); close(); render(); toast('반출 기록했습니다'); });
}
function returnForm(o, r) {
  if (!needWho()) return;
  sheet(`반납 · ${esc(o.name)}`, `${esc(r.by)} 님 · ${esc(r.site)}${r.qty > 1 ? ' · ' + r.qty + '개' : ''}`, `
    <div class="f"><label>보관 장소</label><select id="rp">${W.meta.places.map(p => `<option ${p === o.place ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
    <div class="acts"><button class="btn ghost" id="c">닫기</button><button class="btn" id="g">반납</button></div>`);
  $('c').onclick = close;
  $('g').onclick = e => busy(e.target, async () => { const d = await api({ action: 'wh_return', id: o.id, rentalId: r.id, place: $('rp').value, by: W.who }); put(d.item); close(); render(); toast('반납했습니다'); });
}
async function photoUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid; if (W.urls[k]) return W.urls[k];
  const d = await api({ action: 'wh_photo', id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return W.urls[k] = URL.createObjectURL(new Blob([arr], { type: d.type }));
}
async function readImgs(input) {
  const out = [];
  for (const f of Array.from(input.files || [])) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
    const k = Math.min(1, 1400 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    out.push({ name: f.name.replace(/\.\w+$/, '') + '.jpg', type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.78).split(',')[1] });
  }
  return out;
}
function form(o) {
  const M = W.meta, x = o || { cat: W.cat || '창고 자재', status: '보관중', qty: 1, place: '사무실 창고', inMonth: today().slice(0, 7), photos: [] };
  const removed = [], fl = o ? flags(o) : [];
  const cats = M.cats.filter(c => SHOW.includes(c));
  const s = sheet(o ? esc(o.name) : '물품 등록', o ? `수정 ${esc(o.by || '')} ${esc(String(o.updatedAt || '').slice(0, 16))}` : '보관 기준에 맞는 품목만 등록해 주세요', `
    ${fl.length ? `<div class="warnbox">${fl.map(f => esc(f.t)).join(' · ')}</div>` : ''}

      <div class="f" id="fsw"><label>세부 (보관 기준)</label><select id="fs"></select></div></div>
    <div class="f"><label>품목</label><input id="fn" value="${esc(x.name || '')}" placeholder="예: 스텐 L앙카, 기밀테이프"></div>
    <div class="two"><div class="f"><label>브랜드·모델·규격</label><input id="fb" value="${esc(x.brand || '')}"></div><div class="f"><label>수량</label><input id="fq" type="number" min="0" value="${esc(x.qty)}"></div></div>
    <div class="two"><div class="f"><label>보관 장소</label><input id="fp" list="pl" value="${esc(x.place || '')}"><datalist id="pl">${M.places.map(p => `<option value="${esc(p)}">`).join('')}</datalist></div>
      <div class="f"><label>상태</label><select id="fst" ${x.status === '대여중' ? 'disabled' : ''}>${M.statuses.map(c => `<option ${c === x.status ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div></div>
    <div class="f"><label>입고 연월</label><input id="fi" type="month" value="${esc(x.inMonth || '')}"></div><input type="hidden" id="ft" value="${esc(x.tag || '')}">
    <div class="f"><label>내용</label><textarea id="fnt" rows="2">${esc(x.note || '')}</textarea></div>
    <div class="hint" id="fh"></div>
    <div class="f" style="margin-top:12px"><label>사진</label>${(x.photos || []).length ? `<div class="thumbs">${x.photos.map(p => `<button type="button" data-p="${esc(p.id)}"></button>`).join('')}</div>` : ''}<input type="file" id="ff" accept="image/*" multiple></div>
    <div class="acts">${o ? '<button class="btn ghost" id="del" style="margin-right:auto;color:var(--red)">삭제</button>' : ''}<button class="btn ghost" id="c">닫기</button><button class="btn" id="g">저장</button></div>`);
  const hint = () => { const c = $('fc').value, subs = M.subs[c] || []; $('fsw').hidden = !subs.length;
    $('fs').innerHTML = subs.map(v => `<option ${v === x.sub ? 'selected' : ''}>${esc(v)}</option>`).join('');
    $('fh').textContent = c === '기한 한정 자재' ? '미개봉 신품만 보관합니다. 입고 연월 기준 2년이 지나면 폐기 대상으로 표시됩니다.' : c === '창고 자재' ? '기준 품목만 보관합니다. 한 평당 가치 3만원 이하·특정 색상·현장 맞춤 잔여분·짝 없는 부속은 보관하지 않습니다.' : c === '공구' ? '목록에서 눌러 반출·반납을 기록합니다.' : ''; };
  hint(); $('fc').onchange = hint;
  (x.photos || []).forEach(p => { const b = s.querySelector(`[data-p="${p.id}"]`); photoUrl(x.id, p.id, true).then(u => b.style.backgroundImage = `url("${u}")`).catch(() => {}); b.onclick = () => photoUrl(x.id, p.id).then(u => window.open(u, '_blank')); });
  $('c').onclick = close;
  if ($('del')) $('del').onclick = e => { if (!needWho() || !confirm('이 물품을 목록에서 지울까요? 분실·폐기는 상태만 바꿔도 됩니다.')) return; busy(e.target, async () => { await api({ action: 'wh_delete', id: o.id }); W.items = W.items.filter(y => y.id !== o.id); close(); render(); toast('지웠습니다'); }); };
  $('g').onclick = e => { if (!needWho()) return; busy(e.target, async () => {
    const fields = { cat: $('fc').value, sub: $('fsw').hidden ? '' : $('fs').value, name: $('fn').value, brand: $('fb').value, qty: $('fq').value, place: $('fp').value, status: $('fst').value, inMonth: $('fi').value, tag: $('ft').value, note: $('fnt').value };
    const d = await api({ action: 'wh_save', id: o ? o.id : '', fields, photos: await readImgs($('ff')), removePhotos: removed }); put(d.item); close(); render(); toast('저장했습니다'); }); };
}
function rules() {

    <h3>보관 금지</h3><ul><li>특정 색상 자재(벽돌·페인트·슁글·타일), 석고보드, 세면대·양변기(반품), 3만원 이하 부피 큰 자재(몰탈·OSB·SSB), 현장 맞춤 잔여분, MDF·합판 자투리, 짝 없는 도어 부속, 도료, 철물점 상시 구매 소량 자재</li></ul>
    <div class="acts"><button class="btn" id="c">확인</button></div></div>`);
  $('c').onclick = close;
