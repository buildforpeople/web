    --gray: #8A8F86; --gray-soft: #F0EEE0; --red: #A33A2B; --red-soft: #F6DEDA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--ink); font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* 로그인 */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 36px 28px 28px; text-align: center; }
  .login-logo { width: 168px; display: block; margin: 0 auto 16px; }
  .login-card h1 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
  .login-card p { margin: 6px 0 24px; color: var(--muted); font-size: 14px; }
  #gbtn { display: flex; justify-content: center; min-height: 44px; }
  .login-msg { margin-top: 16px; font-size: 13px; color: var(--red); min-height: 18px; }

  /* 상단 */
  .top { background: var(--green); color: #fff; position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top); }
  .top-row { max-width: 1080px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; display: flex; align-items: center; gap: 9px; }
  .logo-mark { height: 15px; display: block; opacity: .95; }
  .site-pick { margin-left: auto; position: relative; min-width: 0; }
  .site-pick select { appearance: none; -webkit-appearance: none; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); color: #fff; border-radius: 8px; padding: 7px 32px 7px 12px; max-width: 280px; font-weight: 600; }
  .site-pick select option { color: var(--ink); }
  .site-pick::after { content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .me { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .me .role { background: rgba(255,255,255,.16); padding: 2px 8px; border-radius: 999px; }
  .me button { background: none; border: 0; color: rgba(255,255,255,.8); font-size: 13px; padding: 4px; }
  .tabs-row { max-width: 1080px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; }
  .tabs { flex: 1 1 auto; min-width: 0; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .dyk { flex: 0 1 360px; min-width: 0; margin: 0 12px 7px 0; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13px; text-align: left; }
  .dyk:hover { background: rgba(255,255,255,.18); }
  .dyk-tag { flex: none; background: #FEFAE0; color: #2D5016; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; }
  .dyk-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .35s; }
  .dyk-text.fade { opacity: 0; }
  .dyk-list { list-style: none; margin: 0; padding: 0; }
  .dyk-list li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .dyk-list li:first-child { border-top: 0; padding-top: 0; }
  .dyk-list .ic { font-size: 22px; line-height: 1.2; flex: none; }
  .dyk-list b { display: block; }
  .dyk-list small { color: var(--muted); font-size: 13px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; background: none; border: 0; color: rgba(255,255,255,.72); padding: 10px 14px 11px; font-weight: 600; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 5px; text-decoration: none; font-size: 15px; }
  .tab[aria-selected="true"] { background: var(--bg); color: var(--ink); }
  .tab.ext { font-weight: 500; }
  .tab.ext svg { opacity: .7; }
  .tab-sep { width: 1px; background: rgba(255,255,255,.2); margin: 10px 6px; flex: none; }

  main { max-width: 1080px; margin: 0 auto; padding: 20px 20px 60px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

  /* 현장 요약 */
  .site-head { padding: 20px 22px 18px; }
  .site-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .code { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--heritage); background: var(--heritage-soft); border-radius: 6px; padding: 2px 8px; font-size: 14px; letter-spacing: .03em; }
  .site-title h2 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .pill { font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green); }
  .pill.보류 { background: var(--amber-soft); color: var(--amber); }
  .pill.완공 { background: var(--blue-soft); color: var(--blue); }
  .pill.설계중, .pill.견적조정중, .pill.허가중 { background: #fff; box-shadow: inset 0 0 0 1px #9DB38A; }
  .pill.problem { background: var(--red-soft); color: var(--red); }
  .addr { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .problem-note { margin-top: 12px; background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 8px 12px; font-size: 14px; }

  .progress { padding: 0 22px 18px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .progress-top b { color: var(--ink); font-size: 20px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--gray-soft); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green-2); border-radius: 999px; }

  .facts { border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 -1px; }
  .fact { padding: 14px 22px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
  .fact:nth-child(4n) { border-right: 0; }
  .fact dt { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .fact dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .fact dd small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }

  .subnav { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 12px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
  .empty h3 { margin: 0 0 6px; color: var(--ink); font-size: 17px; }
  .loading { padding: 80px 20px; text-align: center; color: var(--muted); }

  /* ===== 변경요청 ===== */
  .cr-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cr-bar h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; margin-right: auto; }
  .btn { border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; background: var(--green); color: #fff; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid #E6B8B0; }
  .btn:disabled { opacity: .5; cursor: default; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters .chip b { margin-left: 4px; }
  .cr-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 18px; }
  .cr-row:last-child { border-bottom: 0; }
  .cr-row:hover { background: #F7F8F5; }
  .cr-id { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .cr-title { font-weight: 600; }
  .cr-sub { font-size: 13px; color: var(--muted); }
  .cr-right { grid-column: 2; grid-row: 1 / span 3; text-align: right; align-self: center; }
  .cr-wait { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .st { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); white-space: nowrap; }
  .st.완료 { background: var(--green-soft); color: var(--green); }
  .st.반려, .st.취소 { background: var(--gray-soft); color: var(--gray); }
  .st.mine { box-shadow: inset 0 0 0 2px var(--amber); }
  .tag { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); margin-left: 6px; vertical-align: 1px; }
  .money { font-variant-numeric: tabular-nums; font-weight: 600; }

  .scrim { position: fixed; inset: 0; background: rgba(20,26,18,.42); z-index: 30; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--bg); z-index: 31; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(20,26,18,.18); }
  .sheet-head { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; align-items: flex-start; gap: 12px; }
  .sheet-head h3 { margin: 2px 0 0; font-size: 18px; letter-spacing: -0.02em; }
  .sheet-head .x { margin-left: auto; background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); padding: 4px 6px; }
  .sheet-body { overflow-y: auto; padding: 16px 18px 40px; flex: 1; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .card h4 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; }

  .steps { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; }
  .step { flex: 1 0 auto; min-width: 64px; text-align: center; position: relative; font-size: 12px; color: var(--muted); padding-top: 22px; }
  .step::before { content: ""; position: absolute; top: 6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--line); z-index: 1; }
  .step::after { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line); }
  .step:first-child::after { display: none; }
  .step.done { color: var(--ink); }
  .step.done::before { background: var(--green-2); box-shadow: none; }
  .step.done::after, .step.cur::after { background: var(--green-2); }
  .step.cur { color: var(--amber); font-weight: 700; }
  .step.cur::before { background: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
  .step.skip { opacity: .4; text-decoration: line-through; }

  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .content { white-space: pre-wrap; font-size: 15px; }

  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .thumb { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 8px; background: var(--gray-soft) center/cover no-repeat; display: flex; align-items: flex-end; padding: 0; overflow: hidden; }
  .thumb span { width: 100%; font-size: 11px; background: rgba(255,255,255,.9); padding: 3px 5px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb.doc { align-items: center; justify-content: center; flex-direction: column; font-size: 12px; color: var(--muted); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compare h5 { margin: 0 0 6px; font-size: 13px; }

  .f { margin-bottom: 12px; }
  .f > label, .f > .lb { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .f input[type=text], .f input[type=number], .f select, .f textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: #fff; }
  .f textarea { resize: vertical; min-height: 72px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .won-read { margin-top: 6px; font-size: 15px; color: var(--green); min-height: 1.4em; }
  .notice { background: var(--amber-soft); color: #6B4A0C; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .sum { background: var(--green-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .sum b { font-size: 18px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  .sig-wrap { border: 1px dashed #9DB38A; border-radius: 8px; background: #fff; position: relative; }
  .sig-wrap canvas { display: block; width: 100%; height: 170px; touch-action: none; }
  .sig-wrap .clr { position: absolute; top: 6px; right: 6px; font-size: 12px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .sig-wrap .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #B5BCAE; pointer-events: none; font-size: 14px; }
  .timeline { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .timeline li { padding: 8px 0 8px 14px; border-left: 2px solid var(--line); position: relative; }
  .timeline li::before { content: ""; position: absolute; left: -5px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); }
  .timeline .t { font-size: 12px; color: var(--muted); }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 40; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 20px; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  .lb-stage { flex: 1; height: 100%; display: grid; place-items: center; min-width: 0; }
  .lb-load { position: absolute; color: #fff; font-size: 14px; }
  .lb-nav { flex: none; width: 48px; height: 72px; border: 0; border-radius: 10px; background: rgba(255,255,255,.14); color: #fff; font-size: 34px; line-height: 1; }
  .lb-nav:hover { background: rgba(255,255,255,.26); }
  .lb-close { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px; width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 24px; line-height: 1; }
  .lb-count { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.85); font-size: 14px; font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { .lb-nav { display: none; } .lightbox { padding: 12px; } }
  details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--green); }

  @media (max-width: 760px) {
    .sheet { width: 100%; }
    .cr-row { padding: 12px 14px; }
    .compare { grid-template-columns: 1fr; }
  }
  input[type=file] { width: 100%; font-size: 14px; color: var(--muted); }
  input[type=file]::file-selector-button { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 8px 14px; font-weight: 600; margin-right: 10px; font-family: inherit; cursor: pointer; }
  .fab { display: none; }
  /* ===== 고객관리 ===== */
  .badge { background: #D9534F; color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 5px; text-align: center; margin-left: 2px; }
  .cx-alert { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .cx-alert button { flex: 1 1 180px; text-align: left; border: 1px solid #E6B8B0; background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
  .cx-alert b { font-size: 22px; margin-right: 6px; vertical-align: -2px; font-variant-numeric: tabular-nums; }
  .cx-ok { background: var(--green-soft); color: var(--green); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; font-size: 14px; }
  .chip.warn b { color: var(--red); }
  .cx-row.urgent { box-shadow: inset 4px 0 0 var(--red); }
  .cx-row.starred { background: #FDF7E3; }
  .cx-row.starred:hover { background: #FBF1D2; }
  .star { color: #E0A020; margin-right: 4px; }
  .tag.star-tag { background: #F6ECD4; color: var(--amber); }
  .chip.star-chip[aria-pressed="true"] { background: #E0A020; border-color: #E0A020; }
  .cx-star { padding: 12px 14px; }
  .cx-star.on { background: #FDF7E3; border-color: #EBD9A8; }
  .flag { font-size: 12px; font-weight: 700; color: #fff; background: var(--red); border-radius: 5px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .cx-warn { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; font-size: 14px; }
  .cx-st.접수메일답장완료 { background: var(--amber-soft); color: var(--amber); }
  .cx-st.반려, .cx-st.이탈 { background: var(--gray-soft); color: var(--gray); }

  .cx-next { font-size: 13px; color: var(--muted); }
  .cx-next.today { color: var(--amber); font-weight: 600; }
  .cx-next.over { color: var(--red); font-weight: 600; }
  .cx-st { background: var(--blue-soft); color: var(--blue); }
  .cx-st.접수 { background: var(--amber-soft); color: var(--amber); }
  .cx-st.계약완료 { background: var(--green-soft); color: var(--green); }
  .cx-plan { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 0 10px; margin-top: 12px; }
  .cx-plan .f input[type=date] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; }
  .cx-contact { display: flex; gap: 8px; }
  .pc-note { display: none; }
  @media (pointer: fine) { .pc-note { display: block; margin-top: 10px; } }
  .thumb-wrap { position: relative; aspect-ratio: 1; }
  .thumb-wrap .thumb { width: 100%; height: 100%; aspect-ratio: auto; }
  .thumb-x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(30,38,27,.72); color: #fff; font-size: 16px; line-height: 1; }
  .log-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .log-date { font-size: 14px; font-variant-numeric: tabular-nums; }
  .log-kind { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--gray-soft); color: var(--muted); }
  .log-kind.k-통화, .log-kind.k-미팅, .log-kind.k-방문상담 { background: var(--amber-soft); color: var(--amber); }
  .log-kind.k-단계 { background: var(--blue-soft); color: var(--blue); }
  .timeline .content { white-space: pre-wrap; font-size: 14px; }
  .cx-meet { background: var(--green-soft); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
  .cx-meet b { font-size: 17px; }
  .cx-clean-list { max-height: 320px; overflow-y: auto; font-size: 14px; display: grid; gap: 6px; }
  .check + .check { margin-top: 6px; }
  .cx-when { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-top: 12px; }
  .cx-when input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; }
  .cx-contact:empty { display: none; }
  .cx-contact .btn { flex: 1; text-align: center; text-decoration: none; white-space: nowrap; }
  .cx-ai { margin-top: 10px; background: var(--green-soft); border-radius: 8px; padding: 12px; font-size: 14px; }
  .timeline li.k-통화::before, .timeline li.k-방문상담::before, .timeline li.k-미팅::before { background: var(--amber); }
  @media (max-width: 760px) {
    .cx-plan { grid-template-columns: 1fr 1fr; }
    .cx-plan .f:first-child { grid-column: 1 / -1; }
  }
  /* ===== 설계 일정 ===== */
  .ds-time { padding: 14px 18px; margin-bottom: 14px; }
  .ds-time-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
  .ds-now { font-weight: 700; font-size: 17px; }
  .ds-counts { margin-left: auto; text-align: right; display: flex; align-items: center; gap: 10px; }
  .ds-late { border: 0; background: var(--red-soft); color: var(--red); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
  .ds-next { margin-top: 8px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .linkish { border: 0; background: none; color: var(--heritage); font-weight: 700; font-size: 14px; margin-left: auto; padding: 2px 0; }
  .ds-phase { padding: 10px 18px 6px; font-size: 12px; font-weight: 700; color: var(--muted); background: #F7F8F5; border-bottom: 1px solid var(--line); }
  .ds-row .cr-title.done { color: var(--muted); text-decoration: line-through; }
  .ds-prev-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-top: 6px; }
  /* ===== 현장보고 ===== */
  .rp-stat { display: flex; gap: 20px; padding: 14px 18px; margin-bottom: 12px; align-items: flex-end; flex-wrap: wrap; }
  .rp-stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .rp-spark { margin-left: auto; }
  .rp-bars { display: flex; gap: 3px; align-items: flex-end; height: 34px; margin-top: 4px; }
  .rp-bars i { width: 8px; background: var(--green-2); border-radius: 2px 2px 0 0; }
  .rp-cal { padding: 12px 14px; margin-bottom: 12px; }
  .rp-cal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .rp-cal-top b { font-size: 16px; }
  .rp-cal-top .linkish { margin: 0; }
  .rp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .rp-grid.head { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 4px; }
  .rp-cell { min-height: 58px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 4px 5px; text-align: left; display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
  .rp-cell.empty { border: 0; background: none; }
  .rp-cell.has { background: var(--green-soft); border-color: #C3D3B2; }
  .rp-cell.today { box-shadow: inset 0 0 0 2px var(--amber); }
  .rp-d { font-size: 13px; font-weight: 600; color: var(--ink); }
  .rp-mark { line-height: 1.2; overflow: hidden; }
  .rp-p { margin-top: auto; font-weight: 700; color: var(--green); }
  .cm-item { border-top: 1px solid var(--line); padding: 10px 0; }
  .cm-item:first-child { border-top: 0; padding-top: 0; }
  .cm-head { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 3px; }
  .cm-head .t { color: var(--muted); }
  .cm-del { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 4px; }
  .cm-write { display: flex; gap: 8px; margin-top: 12px; align-items: flex-end; }
  .cm-write textarea { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; resize: vertical; }
  .cm-write .btn { white-space: nowrap; }
  .site-mini { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px; }
  .site-mini b { font-size: 17px; }
  .site-mini .linkish { margin-left: auto; }
  .site-mini-prog { flex: 1 0 100%; }
  .site-mini-prog .progress { padding: 4px 0 0; }
  .rp-work { border-top: 1px solid var(--line); padding: 10px 0; }
  .rp-work:first-of-type { border-top: 0; padding-top: 0; }
  .rp-work-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
  .rp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rp-table th, .rp-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  .rp-table th { background: #F7F8F5; color: var(--muted); font-size: 13px; }
  .rp-wrow { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .rp-wgrid { display: grid; grid-template-columns: 1.3fr 1.2fr 1fr 70px 88px 34px; gap: 6px; margin-bottom: 6px; }
  .rp-wgrid select, .rp-wgrid input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px; background: #fff; }
  .rp-wrow textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px; }
  .rp-line { display: grid; gap: 6px; margin-bottom: 8px; }
  .rp-line input, .rp-line select { border: 1px solid var(--line); border-radius: 7px; padding: 8px; width: 100%; background: #fff; }
  .rp-mat { grid-template-columns: 1.4fr 1fr 80px 1fr 34px; }
  .rp-eq { grid-template-columns: 1.2fr 1.2fr 80px 1fr 34px; }
  details.card summary { cursor: pointer; font-size: 14px; }
  @media (max-width: 760px) {
    .rp-wgrid { grid-template-columns: 1fr 1fr 34px; }
    .rp-wgrid .wDetail { grid-column: 1 / 3; }
    .rp-mat, .rp-eq { grid-template-columns: 1fr 1fr 34px; }
    .rp-cell { min-height: 52px; }
    .rp-stat { gap: 14px; }
  }
  /* ===== 대시보드 ===== */
  .ov-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .ov-card { padding: 14px 16px; }
  .ov-card b { display: block; font-size: 24px; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .ov-card b.warn { color: var(--red); }
  .ov-block { padding: 14px 18px; margin-bottom: 12px; }
  .ov-block h4 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; }
  .ov-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .rp-bars.tall { height: 76px; gap: 2px; }
  .rp-bars.tall i { flex: 1; width: auto; min-width: 4px; }
  .ov-trade { display: grid; grid-template-columns: 110px 1fr 60px; gap: 10px; align-items: center; margin-bottom: 7px; font-size: 14px; }
  .ov-trade b { text-align: right; font-variant-numeric: tabular-nums; }
  .ov-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
  .ov-line:first-of-type { border-top: 0; }
  .ov-report { margin-bottom: 12px; }
  .ov-report .thumbs { margin-top: 6px; grid-template-columns: repeat(3, 1fr); max-width: 320px; }
  .ov-prog { grid-column: 1 / -1; }
  .ov-card.ov-click { text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .ov-card.ov-click:hover { background: #F7F8F5; }
  .cr-sites { display: flex; flex-wrap: wrap; gap: 6px; }
  .cr-sites .chip b { margin-left: 6px; color: var(--green); }
  .cr-sites .flag { margin-left: 6px; }
  .ov-prog .bar { height: 6px; margin-top: 4px; }
  @media (max-width: 760px) {
    .ov-cards { grid-template-columns: 1fr 1fr; }
    .ov-trade { grid-template-columns: 84px 1fr 50px; font-size: 13px; }
  }
  /* ===== 현장정보 · 회사디테일 ===== */
  .si-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; padding: 12px; }
  .si-card { display: flex; gap: 10px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: inherit; color: inherit; cursor: pointer; }
  .si-card:hover { border-color: #C3D3B2; }
  .si-img { flex: none; width: 76px; height: 76px; border-radius: 8px; background: var(--gray-soft) center/cover no-repeat; display: grid; place-items: center; }
  .si-img i { font-style: normal; font-size: 11px; color: var(--muted); }
  .si-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .si-txt b { font-size: 15px; }
  .si-st { align-self: flex-start; margin-top: 3px; font-size: 12px; padding: 1px 8px; }
  .si-st.확정, .si-st.발주 { background: var(--green-soft); color: var(--green); }
  .si-st.시공완료 { background: var(--heritage-soft); color: var(--heritage); }
  .dt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .dt-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0; overflow: hidden; text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; }
  .dt-card:hover { border-color: #C3D3B2; }
  .dt-img { aspect-ratio: 4 / 3; background: #F4F2E6 center/contain no-repeat; border-bottom: 1px solid var(--line); }
  .dt-txt { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .dt-full { padding: 8px; }
  .dt-full img { width: 100%; display: block; border-radius: 6px; background: #fff; cursor: zoom-in; }
  /* ===== 공정표 ===== */
  .sc-gantt { padding: 12px 14px; margin-bottom: 12px; overflow: hidden; }
  .sc-months { position: relative; height: 18px; margin-left: 120px; font-size: 11px; color: var(--muted); }
  .sc-months span { position: absolute; text-align: center; border-left: 1px solid var(--line); padding-left: 4px; }
  .sc-rows { position: relative; }
  .sc-row { display: flex; align-items: center; gap: 8px; height: 22px; cursor: pointer; }
  .sc-row:hover { background: #F7F8F5; }
  .sc-name { flex: none; width: 112px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc-track { position: relative; flex: 1; height: 100%; }
  .sc-bar { position: absolute; top: 5px; height: 12px; border-radius: 3px; background: var(--green-2); opacity: .85; }
  .sc-bar.done { background: var(--gray); }
  .sc-bar.doing { background: var(--amber); }
  .sc-bar.late { background: var(--red); }
  .sc-bar b { display: block; height: 100%; background: rgba(255,255,255,.45); border-radius: 3px; }
  .sc-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--heritage); z-index: 1; margin-left: 120px; }
  .sc-item .cr-title.done { color: var(--muted); text-decoration: line-through; }
  .sc-opt { display: grid; grid-template-columns: 1fr 90px 28px; gap: 8px; align-items: center; margin-bottom: 6px; }
  .sc-opt input[type=number] { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; width: 100%; }
  .sc-opt input:disabled { background: var(--gray-soft); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--red); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; display: none; max-width: 90vw; z-index: 50; }

  @media (max-width: 760px) {
    .top-row { flex-wrap: wrap; padding: 10px 14px; }
    .site-pick { order: 3; margin-left: 0; width: 100%; }
    .site-pick select { max-width: none; width: 100%; }
    .me { margin-left: auto; }
    main { padding: 14px 12px 60px; }
    .facts { grid-template-columns: 1fr 1fr; }
    .fact:nth-child(4n) { border-right: 1px solid var(--line); }
    .fact:nth-child(2n) { border-right: 0; }
    .site-head, .progress { padding-left: 16px; padding-right: 16px; }
    .fact { padding: 12px 16px; }
    .fact.blank { display: none; }
  }

  /* ===== 모바일 최적화 ===== */
  @media (max-width: 760px) {
    body { font-size: 15px; }
    /* iOS 입력 시 화면 확대 방지 */
    input, select, textarea { font-size: 16px !important; }
    .tab { padding: 10px 12px 11px; }
    .me { gap: 6px; }
    .me #meName { max-width: 5em; overflow: hidden; text-overflow: ellipsis; }
    .tabs-row { flex-direction: column-reverse; align-items: stretch; gap: 0; }
    .dyk { flex: none; margin: 0 12px 8px; }

    /* 변경요청 목록 */
    .cr-bar { margin-bottom: 10px; }
    .cr-bar h2 .cr-sub { display: none; }
    .cr-bar #crNew { display: none; }
    .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -12px 10px; padding: 0 12px; }
    .filters::-webkit-scrollbar { display: none; }
    .filters .chip { flex: none; }
    .cr-row { grid-template-columns: 1fr auto; padding: 13px 14px; gap: 3px 10px; }
    .cr-right { grid-row: 1; grid-column: 2; align-self: start; }
    .cr-wait { display: none; }
    .cr-title, .cr-sub { grid-column: 1 / -1; }
    main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .fab { display: flex; align-items: center; gap: 6px; position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 20;
      background: var(--green); color: #fff; border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 700; font-size: 16px; box-shadow: 0 6px 18px rgba(45,80,22,.35); }

    /* 상세·접수 시트: 전체 화면 */
    .sheet { width: 100%; box-shadow: none; }
    .sheet-head { padding: calc(12px + env(safe-area-inset-top)) 14px 12px; position: sticky; top: 0; }
    .sheet-head .x { font-size: 28px; padding: 2px 8px; margin-right: -6px; }
    .sheet-body { padding: 12px 12px calc(40px + env(safe-area-inset-bottom)); }
    .card { padding: 14px; border-radius: 12px; }
    .kv { grid-template-columns: 80px 1fr; }

    /* 단계 표시: 7단계가 한 화면에 */
    .steps { overflow: visible; }
    .step { flex: 1 1 0; min-width: 0; font-size: 11px; line-height: 1.25; word-break: keep-all; padding: 22px 1px 0; }

    /* 버튼·입력 터치 크기 */
    .actions.sticky { position: sticky; bottom: calc(-40px - env(safe-area-inset-bottom)); background: var(--bg); margin: 0 -12px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); z-index: 2; }
    .actions .btn { flex: 1 1 0; min-height: 48px; font-size: 16px; }
    .seg button { padding: 9px 14px; }
    .chip { padding: 8px 14px; }
    .sig-wrap canvas { height: 200px; }
    .thumbs { grid-template-columns: repeat(3, 1fr); }
    .check input { width: 20px; height: 20px; flex: none; margin-top: 1px; }
  }
</style>

<script>
const GOOGLE_CLIENT_ID = '573053436430-btlompn2ojv7h4qviandnb4b9p41410j.apps.googleusercontent.com';
const TOKEN_KEY = 'bfp_app_token';
const SITE_KEY = 'bfp_app_site';
const TAB_LABEL = { all: '전체현황', cx: '고객관리', design: '설계', info: '현장정보', site: '현장관리', change: '변경요청', detail: '회사디테일' };
const TAB_ORDER = ['all', 'cx', 'design', 'info', 'site', 'change', 'payreq', 'detail', 'sikgu', 'master'];
const EXT_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

const S = { me: null, tabs: [], links: [], sites: [], tab: null, siteCode: null, siteSub: '' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000);
}

// ---------- 로그인 ----------
function parseJwt(t) {
  const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(atob(b).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}
function getToken() {
  const t = sessionStorage.getItem(TOKEN_KEY);
  if (!t) return '';
  try { if (Date.now() > parseJwt(t).exp * 1000 - 60000) { sessionStorage.removeItem(TOKEN_KEY); return ''; } } catch (e) { return ''; }
  return t;
}

async function api(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ idToken: getToken() }, body))
  });
  const data = await res.json();
  if (data.authError) { showLogin(data.error); throw new Error(data.error); }
  if (!data.ok) throw new Error(data.error || '요청 실패');
  return data;
}

function showLogin(msg) {
  sessionStorage.removeItem(TOKEN_KEY);
  $('appView').hidden = true;
  $('loginView').hidden = false;
  $('loginMsg').textContent = msg || '';
}

function initGoogle() {
  if (!window.google || !google.accounts) { setTimeout(initGoogle, 150); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle, auto_select: true, ux_mode: 'popup' });
  google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', width: 260 });
  if (!getToken()) google.accounts.id.prompt();
}

function onGoogle(res) {
  sessionStorage.setItem(TOKEN_KEY, res.credential);
  start();
}

async function start() {
  $('loginMsg').textContent = '확인 중...';
  $('loginMsg').style.color = 'var(--muted)';
  try {
    const d = await api({ action: 'me' });
    Object.assign(S, { me: d.user, tabs: d.tabs, links: d.links, sites: d.sites });
    $('loginView').hidden = true;
    $('appView').hidden = false;
    $('loginMsg').style.color = '';
    renderShell();
  } catch (e) {
    $('loginMsg').style.color = '';
    if (!$('loginView').hidden) $('loginMsg').textContent = e.message;
  }
}

$('logoutBtn').onclick = () => {
  sessionStorage.removeItem(TOKEN_KEY);
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  location.reload();
};

// ---------- 화면 틀 ----------
function renderShell() {
  $('meName').textContent = S.me.name;
  $('meRole').textContent = S.me.roleLabel;

  // 현장 선택 — 현장코드 순 (숫자로 시작하는 코드 먼저, HQ 등은 뒤로)
  const codeKey = c => (/^\d/.test(c) ? '0' : '1') + c;
  S.sites.sort((a, b) => codeKey(a.code).localeCompare(codeKey(b.code)));
  const saved = localStorage.getItem(SITE_KEY);
  S.siteCode = (S.sites.find(s => s.code === saved) || S.sites[0] || {}).code || null;
  $('sitePick').innerHTML = S.sites.length
    ? S.sites.map(s => `<option value="${esc(s.code)}">${esc(s.code)} ${esc(s.name)}${s.status === '시공중' ? '' : ' · ' + esc(s.status)}</option>`).join('')
    : '<option>볼 수 있는 현장이 없습니다</option>';
  $('sitePick').value = S.siteCode || '';
  $('sitePick').onchange = () => { S.siteCode = $('sitePick').value; localStorage.setItem(SITE_KEY, S.siteCode); DS.site = null; DS.plan = null; DS.items = []; RP.site = null; RP.items = []; RP.stat = null; OV.site = null; SI.site = null; SC.site = null; SC.cond = null; SC.tasks = []; renderTab(); };

  // 설계 → 현장관리 → 입금요청 → 변경요청 → 식구 순 (고객관리는 계약 전 단계라 맨 앞)
  $('tabs').innerHTML = TAB_ORDER.map(key => {
    if (S.tabs.includes(key)) return `<button class="tab" role="tab" data-tab="${key}">${TAB_LABEL[key]}</button>`;
    const l = S.links.find(x => x.key === key);
    return l ? `<a class="tab ext" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}${EXT_ICON}</a>` : '';
  }).join('');
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => selectTab(b.dataset.tab));

  selectTab(S.tabs.includes(S.tab) ? S.tab : S.tabs[0]);
  if (S.tabs.includes('cx') && !CX.loaded) cxLoad().then(() => { if (S.tab === 'cx') cxRenderList(); }).catch(() => {});
  dykLoad();
}

function selectTab(t) {
  S.tab = t;
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('sitePickWrap').hidden = t === 'cx' || t === 'all' || t === 'detail';
  renderTab();
}

function currentSite() { return S.sites.find(s => s.code === S.siteCode); }

function renderTab() {
  const fab = $('crFab'); if (fab) fab.hidden = S.tab !== 'change';
  if (S.tab === 'all') return renderAllTab();
  if (S.tab === 'info') return renderInfoTab();
  if (S.tab === 'detail') return renderDetailTab();
  if (S.tab === 'design') return renderDesignTab();
  if (S.tab === 'site') return renderSiteTab();
  if (S.tab === 'change') return renderChangeTab();
  if (S.tab === 'cx') return renderCxTab();
}

// ---------- Did you know ----------
const DYK = { items: [], i: 0, timer: null };
async function dykLoad() {
  if (S.me.role === 'client') return;
  try {
    const d = await api({ action: 'dyk' });
    DYK.items = d.items || [];
    if (!DYK.items.length) return;
    $('dyk').hidden = false;
    DYK.i = 0; dykShow();
    clearInterval(DYK.timer);
    DYK.timer = setInterval(() => { DYK.i = (DYK.i + 1) % DYK.items.length; dykShow(); }, 7000);
  } catch (e) {}
}
function dykShow() {
  const el = $('dykText'), it = DYK.items[DYK.i];
  el.classList.add('fade');
  setTimeout(() => { el.textContent = `${it.icon} ${it.text}`; el.classList.remove('fade'); }, 350);
}
$('dyk').onclick = () => {
  openSheet('Did you know', '사람사는집 소식', `<div class="card"><ul class="dyk-list">
    ${DYK.items.map(it => `<li><span class="ic">${esc(it.icon)}</span><div><b>${esc(it.text)}</b>${it.detail ? `<small>${esc(it.detail)}</small>` : ''}</div></li>`).join('')}
  </ul></div>`);
};

// ---------- 현장관리 ----------
function toPy(m2) { return Math.round(m2 / 3.3058 * 10) / 10; }
function fmtNum(n) { return (Math.round(n * 10) / 10).toLocaleString('ko-KR'); }
function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function progressHtml(s) {
  if (!s.startDate || !s.endDate) {
    return s.status === '시공중' ? '<div class="progress"><div class="progress-top"><span>공정률</span><span>착공일·준공예정일이 입력되면 자동 계산됩니다</span></div></div>' : '';
  }
  const total = dayDiff(s.startDate, s.endDate);
  const done = dayDiff(s.startDate, today());
  const pct = total > 0 ? Math.max(0, Math.min(100, Math.round(done / total * 100))) : 0;
  const left = dayDiff(today(), s.endDate);
  const label = done < 0 ? `착공 D-${-done}` : left >= 0 ? `착공 D+${done} · 준공까지 ${left}일` : `준공예정 ${-left}일 경과`;
  return `<div class="progress"><div class="progress-top"><span>${esc(label)}</span><b>${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function contractPy(a) {
  if (!a) return 0;
  const v = x => Number(x) || 0;
  return v(a.house) + (v(a.attic) + v(a.parking) + v(a.basement)) * 0.5;
}

function siteSummaryHtml(s) {
  const floorTotal = (s.floorAreas || []).reduce((t, f) => t + (Number(f.area) || 0), 0);
  const floors = [s.floorsAbove ? `지상 ${s.floorsAbove}층` : '', s.floorsBelow ? `지하 ${s.floorsBelow}층` : '', s.attic ? '다락' : ''].filter(Boolean).join(' · ');
  const cp = contractPy(s.area);
  const facts = [
    ['유형 · 구조', [s.houseType, s.struct].filter(Boolean).join(' · ') || '—', floors],
    ['연면적', floorTotal ? `${fmtNum(floorTotal)}㎡` : '—', floorTotal ? `${fmtNum(toPy(floorTotal))}평` + ((s.floorAreas || []).length ? ' · ' + s.floorAreas.map(f => f.name).join('/') : '') : ''],
    ['대지면적', s.landArea ? `${fmtNum(s.landArea)}㎡` : '—', s.landArea ? `${fmtNum(toPy(s.landArea))}평` : ''],
    ['담당 소장', s.manager || '—', ''],
    ['공사 기간', s.startDate ? `${s.startDate} ~` : (s.plannedStart ? `착공 예정 ${s.plannedStart}` : '—'), s.endDate ? `준공 예정 ${s.endDate}` : ''],
    ['입주 희망', s.moveIn || '—', ''],
    ['부대시설', (s.facilities || []).join(', ') || '—', '']
  ];
  if (S.me.role !== 'client') {
    facts.push(['건축주', s.owner || '—', s.ownerPhone || '']);
    facts.push(['설계', s.designBy === '건축사사무소' ? (s.architect || '건축사사무소') : (s.designBy ? '사람사는집 자체 설계' : '—'), cp ? `계약 ${fmtNum(cp)}평` : '']);
    facts.push(['NAS 폴더', s.nasFolder || '—', '']);
  }
  // 4칸 단위로 채우기
  while (facts.length % 4) facts.push(['', '', '']);

  return `<section class="panel">
      <div class="site-head">
        <div class="site-title">
          <span class="code">${esc(s.code)}</span>
          <h2>${esc(s.name)}</h2>
          <span class="pill ${esc(s.status)}">${esc(s.status)}</span>
          ${s.problem ? '<span class="pill problem">문제 현장</span>' : ''}
        </div>
        ${s.address ? `<div class="addr">${esc(s.address)}</div>` : ''}
        ${s.problem ? `<div class="problem-note">${esc(s.problemReason)}</div>` : ''}
      </div>
      ${progressHtml(s)}
      <dl class="facts">
        ${facts.map(f => `<div class="fact${f[0] ? '' : ' blank'}"><dt>${esc(f[0])}</dt><dd>${f[0] ? esc(f[1]) : ''}${f[2] ? `<small>${esc(f[2])}</small>` : ''}</dd></div>`).join('')}
      </dl>
    </section>`;
}

        <span class="cr-sub">설계 ${rows.filter(r => r.status === '설계중').length} · 견적 ${rows.filter(r => r.status === '견적조정중').length} · 허가 ${rows.filter(r => r.status === '허가중').length}</span></section>
      <section class="panel ov-card"><span class="cr-id">이번 주 투입 인원</span><b>${weekTotal}명</b><span class="cr-sub">전 현장 합계</span></section>
      <section class="panel ov-card"><span class="cr-id">보고 끊긴 현장</span><b class="${noReport.length ? 'warn' : ''}">${noReport.length}곳</b>
        <span class="cr-sub">시공중인데 3일 이상 보고 없음</span></section>
      <button type="button" class="panel ov-card ov-click" id="ovCrCard"><span class="cr-id">진행 중 변경요청</span><b class="${crTotal ? 'warn' : ''}">${crTotal}건</b>
        <span class="cr-sub">누르면 변경요청 현황으로</span></button>
    </div>

    ${problem.length ? `<section class="panel ov-block"><h4>문제 현장</h4>
      ${problem.map(r => `<div class="ov-line"><span class="st 반려">${esc(r.code)}</span><b>${esc(r.name)}</b><span class="cr-sub">${esc(r.problemReason)}</span></div>`).join('')}
    </section>` : ''}

    ${ovGroupHtml('시공 중', rows.filter(r => r.status === '시공중'), prog)}
    ${ovGroupHtml('설계·견적·허가 중', rows.filter(r => ['설계중', '견적조정중', '허가중'].includes(r.status)), prog)}
    ${ovGroupHtml('보류', rows.filter(r => r.status === '보류'), prog)}

  $('ovRefresh').onclick = () => { OV.allAt = 0; renderAllTab(); };

const SI_URL = {};
async function siPhotoUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (SI_URL[k]) return SI_URL[k];
  const d = await api({ action: 'si_photo', id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return SI_URL[k] = URL.createObjectURL(new Blob([arr], { type: d.type }));
}

function siOpen(id) {

const DT_URL = {};
async function dtFileUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (DT_URL[k]) return DT_URL[k];
  const d = await api({ action: 'dt_file', id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return DT_URL[k] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
}

  const o = DT.items.find(x => x.id === id); if (!o) return;

// ---------- 공정표 ----------
const SC = { site: null, cond: null, tasks: [], meta: null, canEdit: false, loading: false };

async function scLoad(code) {
  if (SC.site === code || SC.loading) return;
  SC.loading = true;
  try {
    const d = await api({ action: 'sc_get', siteCode: code });
    Object.assign(SC, { site: code, cond: d.cond, tasks: d.tasks, canEdit: d.canEdit,
      meta: { template: d.template, options: d.options, statuses: d.statuses, structs: d.structs } });
  } finally { SC.loading = false; }
}

function scDday(t) {
  if (t.status === '완료') return { cls: '', text: '완료' };
  const d = dayDiff(today(), t.end);
  if (t.start > today()) return { cls: '', text: `D-${dayDiff(today(), t.start)}` };
  if (d < 0) return { cls: 'over', text: `${-d}일 지연` };
  return { cls: d <= 2 ? 'today' : '', text: `D-${d}` };
}

function scRender(el) {
  if (!SC.cond || !SC.tasks.length) return scCreateForm(el);
  const ts = SC.tasks;
  const total = ts.reduce((s, t) => s + t.days, 0);
  const doneDays = ts.reduce((s, t) => s + t.days * (t.progress / 100), 0);
  const pct = total ? Math.round(doneDays / total * 100) : 0;
  const late = ts.filter(t => t.status !== '완료' && t.end < today());
  const now = ts.filter(t => t.status === '진행중' || (t.status === '예정' && t.start <= today() && t.end >= today()));
  const next = ts.filter(t => t.status === '예정' && t.start > today()).slice(0, 3);
  const first = ts[0].start, last = ts.reduce((m, t) => t.end > m ? t.end : m, ts[0].end);
  const span = Math.max(1, dayDiff(first, last));
  const months = [];
  for (let d = new Date(first + 'T00:00:00'); ymd(d) <= last; d.setMonth(d.getMonth() + 1)) {
    const m0 = new Date(d.getFullYear(), d.getMonth(), 1), m1 = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    const s = ymd(m0) < first ? first : ymd(m0), e = ymd(m1) > last ? last : ymd(m1);
    months.push({ label: (d.getMonth() + 1) + '월', left: dayDiff(first, s) / span * 100, width: Math.max(0.5, (dayDiff(s, e) + 1) / span * 100) });
  }
  const todayLeft = today() >= first && today() <= last ? dayDiff(first, today()) / span * 100 : null;

  el.innerHTML = `
    <div class="cr-bar"><h2 style="font-size:17px">공정표 <span class="cr-sub" style="font-weight:500">${esc(first)} ~ ${esc(last)}</span></h2>
      <button class="btn ghost" type="button" id="scPrint">🖨 인쇄</button>
      ${SC.canEdit ? '<button class="btn ghost" type="button" id="scShift">이후 공정 순연</button>' : ''}
      ${S.me.role === 'admin' ? '<button class="btn ghost" type="button" id="scReset">다시 만들기</button>' : ''}</div>

    <section class="panel ds-time">
      <div class="ds-time-top">
        <div><span class="cr-id">공정 진행률 (소요일 기준)</span><div class="ds-now">${pct}%</div></div>
        <div class="ds-counts">${late.length ? `<span class="ds-late"><b>${late.length}</b> 지연</span>` : ''}
          <span class="cr-sub">완료 ${ts.filter(t => t.status === '완료').length}/${ts.length}</span></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="ds-next">${now.length ? `진행 중 · <b>${esc(now.map(t => t.name).join(', '))}</b>` : next.length ? `다음 · <b>${esc(next[0].name)}</b> ${esc(next[0].start.slice(5).replace('-', '/'))} 시작` : '모든 공정 완료'}</div>
    </section>

    <section class="panel sc-gantt">
      <div class="sc-months">${months.map(m => `<span style="left:${m.left}%;width:${m.width}%">${m.label}</span>`).join('')}</div>
      <div class="sc-rows">
        ${todayLeft !== null ? `<i class="sc-today" style="left:${todayLeft}%"></i>` : ''}
        ${ts.map(t => {
          const l = dayDiff(first, t.start) / span * 100, w = Math.max(1.2, (dayDiff(t.start, t.end) + 1) / span * 100);
          const late2 = t.status !== '완료' && t.end < today();
          return `<div class="sc-row" data-id="${esc(t.id)}"><span class="sc-name">${esc(t.name)}</span>
            <span class="sc-track"><i class="sc-bar ${t.status === '완료' ? 'done' : late2 ? 'late' : t.status === '진행중' ? 'doing' : ''}" style="left:${l}%;width:${w}%">
              ${t.progress > 0 && t.progress < 100 ? `<b style="width:${t.progress}%"></b>` : ''}</i></span></div>`;
        }).join('')}
      </div>
    </section>

    <section class="panel">
      ${(() => { let ph = ''; return ts.map(t => {
        const dd = scDday(t);
        const head = t.phase !== ph ? (ph = t.phase, `<div class="ds-phase">${esc(t.phase)}</div>`) : '';
        return head + `<button class="cr-row sc-item ${t.status !== '완료' && t.end < today() ? 'urgent' : ''}" data-id="${esc(t.id)}">
          <span class="cr-id">${esc(t.start.slice(5).replace('-', '/'))} ~ ${esc(t.end.slice(5).replace('-', '/'))} · ${t.days}일${t.owner ? ' · ' + esc(t.owner) : ''}</span>
          <span class="cr-title ${t.status === '완료' ? 'done' : ''}">${esc(t.name)}</span>
          ${t.note ? `<span class="cr-sub">${esc(t.note)}</span>` : ''}
          <span class="cr-right"><span class="st ${t.status === '완료' ? '완료' : dd.cls === 'over' ? '반려' : ''}">${t.status === '완료' ? '완료' : t.progress ? t.progress + '%' : dd.text}</span></span>
        </button>`; }).join(''); })()}
    </section>`;

  el.querySelectorAll('.sc-item, .sc-row').forEach(b => b.onclick = () => scTaskForm(b.dataset.id));
  if ($('scShift')) $('scShift').onclick = scShiftForm;
  if ($('scReset')) $('scReset').onclick = () => { if (confirm('공정표를 지우고 다시 만들까요? 입력한 진행 상황도 함께 지워집니다.')) { SC.cond = null; SC.tasks = []; scRender(el); } };
  $('scPrint').onclick = scPrint;
}

function scCreateForm(el) {
  const s = currentSite();
  if (!SC.canEdit) { el.innerHTML = '<div class="panel empty"><h3>공정표가 아직 없습니다</h3>소장님·본사가 만들면 여기에 표시됩니다.</div>'; return; }
  const cp = contractPy(s.area);
  const floorTotal = (s.floorAreas || []).reduce((t, f) => t + (Number(f.area) || 0), 0);
  const area0 = cp || (floorTotal ? Math.round(toPy(floorTotal)) : '');
  el.innerHTML = `<section class="panel" style="padding:18px">
    <h4 style="margin:0 0 4px">공정표 만들기</h4>
    <div class="hint">평수·구조·층수와 특이사항 물량으로 공종별 기간을 계산해 날짜를 배치합니다. 만든 뒤 개별 공종은 바꿀 수 있습니다.</div>
    <div class="cx-when" style="margin-top:14px">
      <div class="f"><label for="scStart">착공일</label><input type="date" id="scStart" value="${esc(s.startDate || s.plannedStart || today())}"></div>
      <div class="f"><label for="scArea">연면적 (평)</label><input type="number" id="scArea" value="${esc(area0)}" step="0.1" inputmode="decimal"></div>
    </div>
    <div class="f"><span class="lb">구조</span>${segHtml('scSt', SC.meta.structs, s.struct && SC.meta.structs.includes(s.struct) ? s.struct : '경목')}</div>
    <div class="f"><span class="lb">지상 층수</span>${segHtml('scFl', [['1', '단층'], ['2', '2층'], ['3', '3층'], ['4', '4층']], String(s.floorsAbove || 2))}</div>
    <div class="card" style="margin:14px 0">
      <h4>특이사항 (해당 항목만 체크하고 물량 입력)</h4>
      ${SC.meta.options.map(o => `<div class="sc-opt">
        <label class="check"><input type="checkbox" class="scOpt" data-k="${esc(o.key)}"> ${esc(o.name)}</label>
        <input type="number" class="scQty" data-k="${esc(o.key)}" placeholder="0" inputmode="decimal" disabled><span class="cr-sub">${esc(o.unit)}</span>
      </div>`).join('')}
    </div>
    <div class="f"><label for="scNote">메모</label><input type="text" id="scNote" placeholder="예: 겨울 타설 양생 여유 포함"></div>
    <div id="scPrev"></div>
    <div class="actions"><button class="btn ghost" type="button" id="scPreview">미리보기</button><button class="btn" type="button" id="scMake">공정표 만들기</button></div>
  </section>`;
  bindSegs(el);
  el.querySelectorAll('.scOpt').forEach(c => c.onchange = () => {
    const q = el.querySelector(`.scQty[data-k="${c.dataset.k}"]`);
    q.disabled = !c.checked; if (c.checked) q.focus();
  });
  const params = () => ({
    startDate: $('scStart').value, area: $('scArea').value, struct: segVal(el, 'scSt'), floors: segVal(el, 'scFl'),
    note: $('scNote').value,
    options: Object.fromEntries([...el.querySelectorAll('.scOpt:checked')].map(c =>
      [c.dataset.k, { on: 1, qty: el.querySelector(`.scQty[data-k="${c.dataset.k}"]`).value }]))
  });
  $('scPreview').onclick = e => submitting(e.target, async () => {
    const d = await api({ action: 'sc_preview', params: params() });
    const last = d.tasks.reduce((m, t) => t.end > m ? t.end : m, d.tasks[0].end);
    const fin = d.tasks.filter(t => t.phase !== '준공').reduce((m, t) => t.end > m ? t.end : m, d.tasks[0].end);
    $('scPrev').innerHTML = `<div class="sum"><b>미리보기</b>
      <div class="ds-prev-row"><span>공사 완료 (마감까지)</span><b>${esc(fin)}</b></div>
      <div class="ds-prev-row"><span>준공·사용승인</span><b>${esc(last)}</b></div>
      ${d.tasks.filter(t => ['골조', '외피', '마감'].includes(t.phase)).slice(0, 3).map(t => `<div class="ds-prev-row"><span>${esc(t.name)}</span><span>${esc(t.start)} ~ ${esc(t.end)} (${t.days}일)</span></div>`).join('')}</div>`;
  });
  $('scMake').onclick = e => submitting(e.target, async () => {
    const d = await api({ action: 'sc_create', siteCode: s.code, replace: true, params: params() });
    SC.cond = d.cond; SC.tasks = d.tasks;
    renderSiteTab(); toast('공정표를 만들었습니다');
  });
}

function scTaskForm(id) {
  const t = SC.tasks.find(x => x.id === id); if (!t) return;
  const can = SC.canEdit;
  const body = openSheet(esc(t.name), `${esc(currentSite().code)} · ${esc(t.phase)} · ${t.days}일`, `
    <div class="card">
      <div class="cx-when"><div class="f"><label>시작일</label><input type="date" id="tStart" value="${esc(t.start)}" ${can ? '' : 'disabled'}></div>
        <div class="f"><label>종료일</label><input type="date" id="tEnd" value="${esc(t.end)}" ${can ? '' : 'disabled'}></div></div>
      <div class="f"><span class="lb">상태</span>${segHtml('tSt', SC.meta.statuses, t.status)}</div>
      <div class="f"><label>진행률 <b id="tPv">${t.progress}%</b></label><input type="range" id="tProg" min="0" max="100" step="10" value="${t.progress}" ${can ? '' : 'disabled'} style="width:100%"></div>
      <div class="f"><label>담당 (팀·업체)</label><input type="text" id="tOwner" value="${esc(t.owner)}" ${can ? '' : 'disabled'}></div>
      <div class="f"><label>메모</label><textarea id="tNote" rows="2" ${can ? '' : 'disabled'}>${esc(t.note)}</textarea></div>
      ${t.doneDate ? `<div class="hint">완료일 ${esc(t.doneDate)}${t.doneDate > t.end ? ` · 계획보다 ${dayDiff(t.end, t.doneDate)}일 늦음` : ''}</div>` : ''}
    </div>
    ${can ? `<label class="check" style="margin-bottom:10px"><input type="checkbox" id="tShift" checked> <span>완료일이 계획보다 늦으면 <b>이후 공정도 함께 미루기</b></span></label>
    <div class="actions sticky"><button class="btn ghost" type="button" id="tClose">닫기</button>
      <button class="btn" type="button" id="tDone">공정 완료</button>
      <button class="btn ghost" type="button" id="tSave">저장</button></div>` : ''}`);
  bindSegs(body);
  if (!can) return;
  $('tProg').oninput = () => $('tPv').textContent = $('tProg').value + '%';
  $('tClose').onclick = closeSheet;
  const send = (extra) => api(Object.assign({ action: 'sc_task', id: t.id, shiftAfter: $('tShift').checked, fields: Object.assign({
    start: $('tStart').value, end: $('tEnd').value, status: segVal(body, 'tSt'), progress: $('tProg').value,
    owner: $('tOwner').value, note: $('tNote').value }, extra) }, {}));
  $('tSave').onclick = e => submitting(e.target, async () => {
    const d = await send(); SC.tasks = d.tasks; closeSheet(); renderSiteTab();
    toast(d.moved ? `저장 · 이후 ${d.moved}개 공정을 옮겼습니다` : '저장했습니다');
  });
  $('tDone').onclick = e => submitting(e.target, async () => {
    const d = await send({ status: '완료', progress: 100, doneDate: today() });
    SC.tasks = d.tasks; closeSheet(); renderSiteTab();
    toast(d.moved ? `완료 · 이후 ${d.moved}개 공정을 옮겼습니다` : `${t.name} 완료`);
  });
}

function scShiftForm() {
  const s = currentSite();
  const body = openSheet('이후 공정 순연', esc(s.code + ' ' + s.name), `
    <div class="card">
      <div class="hint">완료되지 않은 공정을 한꺼번에 미루거나 당깁니다. 주말·공휴일은 자동으로 건너뜁니다.</div>
      <div class="f" style="margin-top:12px"><label>며칠 옮길까요? (당기려면 -3 처럼)</label><input type="number" id="scDays" value="3" step="1"></div>
      <div class="f"><label>이 날짜 이후 공정만</label><input type="date" id="scFrom" value="${today()}"></div>
    </div>
    <div class="actions sticky"><button class="btn ghost" type="button" id="scClose">닫기</button><button class="btn" type="button" id="scGo">순연</button></div>`);

  $('scGo').onclick = e => submitting(e.target, async () => {

function scPrint() {
  const s = currentSite(), ts = SC.tasks;
  const w = window.open('', '_blank'); if (!w) { toast('팝업을 허용해 주세요'); return; }
  const rows = ts.map(t => `<tr class="${t.status === '완료' ? 'done' : t.end < today() && t.status !== '완료' ? 'late' : ''}">
    <td>${esc(t.phase)}</td><td>${esc(t.name)}</td><td>${t.days}일</td><td>${esc(t.start)}</td><td>${esc(t.end)}</td>
    <td>${esc(t.status)}${t.progress && t.progress < 100 ? ` ${t.progress}%` : ''}</td><td>${esc(t.owner)}</td><td>${esc(t.note)}</td></tr>`).join('');
  w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>공정표 ${esc(s.code)}</title><style>
    body{font-family:"Malgun Gothic",sans-serif;font-size:12px;color:#1E261B;padding:24px}
    h1{font-size:18px;margin:0 0 4px;color:#00509D;border-top:3px solid #00509D;padding-top:10px}.sub{color:#697164;margin-bottom:12px}
    table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px 8px}th{background:#FEFAE0;color:#2D5016}
    tr.done td{color:#888;text-decoration:line-through}tr.late td{background:#F9ECEA}
    button{margin-bottom:12px;padding:9px 20px;background:#2D5016;color:#fff;border:0;border-radius:6px}@media print{button{display:none}}
  </style></head><body><button onclick="window.print()">인쇄</button>
    <h1>시공 공정표</h1><div class="sub">${esc(s.code)} ${esc(s.name)} · ${esc(ts[0].start)} ~ ${esc(ts.reduce((m, t) => t.end > m ? t.end : m, ts[0].end))} · (주)사람사는집종합건설</div>
    <table><tr><th>단계</th><th>공종</th><th>소요</th><th>시작</th><th>종료</th><th>상태</th><th>담당</th><th>메모</th></tr>${rows}</table>
  </body></html>`);
  w.document.close();
}

// ---------- 현장보고 ----------
const RP = { site: null, items: [], stat: null, meta: null, month: null, loading: false };

function rpWeatherIcon(w) { return { '맑음': '☀️', '구름': '⛅', '흐림': '☁️', '비': '🌧️', '눈': '❄️', '바람': '💨' }[w] || ''; }
function rpDow(d) { return ['일', '월', '화', '수', '목', '금', '토'][new Date(d + 'T00:00:00').getDay()]; }

async function rpLoad(code) {
  if (RP.site === code || RP.loading) return;
  RP.loading = true;
  try {
    const d = await api({ action: 'rp_list', siteCode: code });
    RP.items = d.items; RP.stat = d.stat; RP.site = code;
    if (d.meta) RP.meta = d.meta;
    if (!RP.month) RP.month = today().slice(0, 7);
  } finally { RP.loading = false; }
}

function rpRender(el) {
  const isClient = S.me.role === 'client';
  const canWrite = RP.meta.canWrite;
  const month = RP.month || today().slice(0, 7);
  const byDate = {}; RP.items.forEach(r => byDate[r.date] = r);

  // 달력
  const first = new Date(month + '-01T00:00:00');
  const startPad = first.getDay();
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < startPad; i++) cells += '<div class="rp-cell empty"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = month + '-' + String(d).padStart(2, '0');
    const r = byDate[ds];
    cells += `<button type="button" class="rp-cell ${r ? 'has' : ''} ${ds === today() ? 'today' : ''}" data-date="${ds}">
      <span class="rp-d">${d}</span>
      ${r ? `<span class="rp-mark">${r.trades.slice(0, 2).map(t => esc(t.split('/')[0])).join(', ')}${r.trades.length > 2 ? ' 외' : ''}</span>
        ${!isClient && r.people ? `<span class="rp-p">${r.people}명</span>` : ''}` : ''}
    </button>`;
  }

  const stat = RP.stat;
  const dailyKeys = stat ? Object.keys(stat.daily).sort().slice(-14) : [];
  const maxDaily = dailyKeys.length ? Math.max(...dailyKeys.map(k => stat.daily[k])) : 0;

  el.innerHTML = `
    <div class="cr-bar"><h2 style="font-size:17px">현장보고</h2>
      <button class="btn ghost" type="button" id="rpPrint">주간 인쇄</button>
      ${canWrite ? '<button class="btn" type="button" id="rpNew">+ 보고 작성</button>' : ''}</div>

    ${stat ? `<section class="panel rp-stat">
      <div><span class="cr-id">누적 투입 인원</span><b>${stat.total.toLocaleString('ko-KR')}명</b></div>
      <div><span class="cr-id">작성된 보고</span><b>${stat.reportCount}건</b></div>
      <div class="rp-spark">
        <span class="cr-id">최근 투입 인원</span>
        <div class="rp-bars">${dailyKeys.map(k => `<i style="height:${maxDaily ? Math.max(8, stat.daily[k] / maxDaily * 100) : 0}%" title="${k} ${stat.daily[k]}명"></i>`).join('')}</div>
      </div>
    </section>` : ''}

    <section class="panel rp-cal">
      <div class="rp-cal-top">
        <button type="button" class="linkish" id="rpPrev">‹ 이전달</button>
        <b>${month.replace('-', '년 ')}월</b>
        <button type="button" class="linkish" id="rpNext">다음달 ›</button>
      </div>
      <div class="rp-grid head">${['일', '월', '화', '수', '목', '금', '토'].map(d => `<div>${d}</div>`).join('')}</div>
      <div class="rp-grid">${cells}</div>
    </section>

    <section class="panel">
      ${RP.items.length ? RP.items.slice(0, 40).map(r => `
        <button class="cr-row rp-row" data-id="${esc(r.id)}">
          <span class="cr-id">${esc(r.date.slice(5).replace('-', '/'))} (${rpDow(r.date)}) ${rpWeatherIcon(r.weather)}${r.tempMin !== '' && r.tempMax !== '' ? ` ${esc(r.tempMin)}/${esc(r.tempMax)}℃` : ''}${!isClient && r.people ? ` · 인원 ${r.people}명` : ''}</span>
          <span class="cr-title">${esc(r.trades.join(' · ') || '작업 보고')}</span>
          <span class="cr-sub">${esc(r.work.map(w => (w.team ? w.team + ' ' : '') + (w.count ? w.count + '명 ' : '') + w.work.split('\\n')[0]).join(' / ').slice(0, 80))}</span>
          <span class="cr-right">${(r.photos || []).length ? `<span class="cr-sub">사진 ${r.photos.length}</span>` : ''}</span>
        </button>`).join('') : '<div class="empty"><h3>작성된 현장보고가 없습니다</h3>매일 작업 내용을 남기면 건축주와 본사가 같은 화면으로 확인합니다.</div>'}
    </section>`;

  $('rpPrev').onclick = () => { RP.month = rpShiftMonth(month, -1); rpRender(el); };
  $('rpNext').onclick = () => { RP.month = rpShiftMonth(month, 1); rpRender(el); };
  $('rpPrint').onclick = rpPrintForm;
  if ($('rpNew')) $('rpNew').onclick = () => rpForm(null, today());
  el.querySelectorAll('.rp-cell[data-date]').forEach(b => b.onclick = () => {
    const r = byDate[b.dataset.date];
    if (r) rpOpen(r.id); else if (canWrite && b.dataset.date <= today()) rpForm(null, b.dataset.date);
  });
  el.querySelectorAll('.rp-row').forEach(b => b.onclick = () => rpOpen(b.dataset.id));
}

function rpShiftMonth(m, n) {
  const d = new Date(m + '-01T00:00:00'); d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

// ---- 상세 ----
async function rpOpen(id) {
  let item;
  try { item = (await api({ action: 'rp_get', id })).item; } catch (e) { toast(e.message); return; }
  const isClient = S.me.role === 'client';
  const canEdit = RP.meta.canWrite && (S.me.role === 'admin' || item.mine);
  const cum = item.cumulative || {};
  const body = openSheet(`${esc(item.date)} (${rpDow(item.date)}) 현장보고`,
    `${esc(currentSite().code)} · ${esc(item.createdBy)} 작성${item.weather ? ' · ' + rpWeatherIcon(item.weather) + ' ' + esc(item.weather) : ''}${item.tempMin !== '' && item.tempMax !== '' ? ` ${esc(item.tempMin)}/${esc(item.tempMax)}℃` : ''}`, `
    <div class="card">
      <h4>금일 작업내용</h4>
      ${(item.labor || []).map(w => `<div class="rp-work">
        <div class="rp-work-head"><b>${esc(w.team || w.trade)}</b>${w.count ? ` · ${w.count}명${w.shift === '야간' ? ' (야간)' : ''}` : ''}${!isClient && w.team && cum[w.team] ? ` <span class="cr-sub">누계 ${cum[w.team]}품</span>` : ''}
          <span class="tag">${esc(w.trade)}${w.detail ? ' · ' + esc(w.detail) : ''}</span></div>
        <div class="content">${esc(w.work)}</div>
      </div>`).join('')}
      ${!isClient && item.labor && item.labor.length ? `<div class="sum" style="margin-top:10px">금일 투입 <b>${item.labor.reduce((s, w) => s + (Number(w.count) || 0), 0)}명</b></div>` : ''}

    if (!confirm(`${item.date} 보고를 삭제할까요? 사진도 함께 지워집니다.`)) return;

      RP.site = null; OV.site = null; closeSheet(); await rpLoad(S.siteCode); renderSiteTab(); toast('삭제했습니다');
    });

}

async function rpPhotoUrl(item, fileId) {
  if (CR.urls[fileId]) return CR.urls[fileId];
  const d = await api({ action: 'rp_photo', id: item.id, fileId });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  CR.urls[fileId] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type };
  return CR.urls[fileId];
}

// ---------- 사진 확대 보기 (좌우 이동·스와이프) ----------
async function lightbox(ids, startIndex, loader) {
  if (!ids.length) return;
  let i = Math.max(0, startIndex);
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<button class="lb-close" type="button" aria-label="닫기">×</button>
    <button class="lb-nav prev" type="button" aria-label="이전">‹</button>
    <div class="lb-stage"><img alt=""><div class="lb-load">불러오는 중...</div></div>
    <button class="lb-nav next" type="button" aria-label="다음">›</button>
    <div class="lb-count"></div>`;
  document.body.appendChild(box);
  const img = box.querySelector('img'), load = box.querySelector('.lb-load');
  const show = async () => {
    box.querySelector('.lb-count').textContent = `${i + 1} / ${ids.length}`;
    box.querySelectorAll('.lb-nav').forEach(b => b.hidden = ids.length < 2);
    img.style.visibility = 'hidden'; load.hidden = false;
    try { const f = await loader(ids[i]); img.src = f.url; img.style.visibility = 'visible'; }
    catch (e) { load.textContent = '사진을 불러오지 못했습니다'; return; }
    load.hidden = true;
    [i - 1, i + 1].filter(n => n >= 0 && n < ids.length).forEach(n => loader(ids[n]).catch(() => {}));
  };
  const move = n => { i = (i + n + ids.length) % ids.length; show(); };
  const close = () => { box.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') move(-1); if (e.key === 'ArrowRight') move(1); };
  document.addEventListener('keydown', key);
  box.querySelector('.lb-close').onclick = close;
  box.querySelector('.prev').onclick = e => { e.stopPropagation(); move(-1); };
  box.querySelector('.next').onclick = e => { e.stopPropagation(); move(1); };
  box.onclick = e => { if (e.target === box || e.target.classList.contains('lb-stage')) close(); };
  // 모바일 스와이프
  let x0 = null, y0 = null;
  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  box.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 1 : -1);
    x0 = null;
  }, { passive: true });
  show();
}

const DS_WEEKS = 28;
const DS_TPL = [

];

function dsMonday(str) { const d = new Date(str + 'T00:00:00'); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return d; }
function dsAdd(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function dsPreview(mode, baseDate) {
  const start = mode === '계약일' ? dsMonday(baseDate) : dsAdd(dsMonday(baseDate), -(DS_WEEKS - 1) * 7);
  return DS_TPL.map(t => {
    const ws = dsAdd(start, (t[1] - 1) * 7);
    const date = t[4] === 'meeting' ? dsAdd(ws, 2) : t[4] === 'deadline' ? dsAdd(dsAdd(start, (t[2] - 1) * 7), 4) : ws;
    return { phase: t[0], week: t[1], title: t[3], kind: t[4], date: ymd(date) };
  });
}
function dsDday(date) {
  if (!date) return { text: '', cls: '' };
  const d = dayDiff(today(), date);
  if (d < 0) return { text: `${-d}일 지남`, cls: 'over' };
  if (d === 0) return { text: '오늘', cls: 'today' };
  return { text: `D-${d}`, cls: '' };
}
function dsCurrent() {
  const open = DS.items.filter(i => i.status !== '완료');
  const late = open.filter(i => i.date && i.date < today());
  const next = open.filter(i => i.date && i.date >= today()).sort((a, b) => a.date.localeCompare(b.date));
  const doneCount = DS.items.filter(i => i.status === '완료').length;
  return { late, next, doneCount, total: DS.items.length };
}

async function dsLoad(code) {
  if (DS.site === code || DS.loading) return;

    DS.canEdit = meta.canEdit; DS.plan = d.plan; DS.items = d.items; DS.site = code;

const CR = { items: [], site: null, meta: null, filter: '진행중', busy: false, urls: {},
  mode: 'all', all: [], allAt: 0, allFilter: '내 차례' };
const CR_STEPS = [
  ['접수', '접수'], ['설계검토', '설계 검토'], ['견적', '견적'], ['건축주확인', '건축주 확인'],
  ['승인대기', '승인'], ['도면반영', '도면 반영'], ['현장반영', '현장 확인']
];
const CR_OPEN = ['설계검토', '견적', '건축주확인', '승인대기', '도면반영', '현장반영'];

function crWait(o) {
  return {
    설계검토: '설계팀 검토 대기', 견적: '공무 견적 대기', 건축주확인: '건축주 확인 대기',
    승인대기: o.fastTrack ? '소장 전결 승인 대기' : '대표 승인 대기', 도면반영: '설계팀 도면 반영 대기',
    현장반영: '현장 확인 대기', 완료: '완료', 반려: '반려', 취소: '취소'
  }[o.status] || o.status;
}

function crMyTurn(o) {
  const r = S.me.role, admin = r === 'admin', gm = S.me.team === '공무';
  switch (o.status) {
    case '설계검토': return admin || r === 'design';
    case '견적': return admin || gm;
    case '건축주확인': return admin || r === 'site' || gm;
    case '승인대기': return admin || (o.fastTrack && r === 'site');
    case '도면반영': return admin || r === 'design';
    case '현장반영': return admin || r === 'site';
  }
  return false;
}

function crSteps(o) {
  const skip = k => (k === '설계검토' && o.fastTrack) || (k === '견적' && (o.fastTrack || o.costType === '없음')) || (k === '도면반영' && o.drawingImpact === 'N');
  const cur = o.status === '완료' ? 99 : CR_STEPS.findIndex(s => s[0] === o.status);
  return CR_STEPS.map((s, i) => {
    let st = i === 0 || i < cur ? 'done' : i === cur ? 'cur' : '';
    if (i > 0 && skip(s[0])) st = 'skip';
    if ((o.status === '반려' || o.status === '취소') && i > 0) st = skip(s[0]) ? 'skip' : '';
    return `<div class="step ${st}">${s[1]}</div>`;
  }).join('');
}

// 금액 한글 표기: 180000 → 금 일십팔만원정
function wonKorean(n) {
  n = Math.floor(Number(n));
  if (!n || n < 0) return '';
  const digit = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const small = ['', '십', '백', '천'];
  const big = ['', '만', '억', '조'];
  let out = '', g = 0;
  while (n > 0 && g < big.length) {
    const part = n % 10000;
    if (part) {
      let t = '';
      String(part).padStart(4, '0').split('').forEach((d, i) => { if (d !== '0') t += digit[d] + small[3 - i]; });
      out = t + big[g] + out;
    }
    n = Math.floor(n / 10000); g++;
  }
  return '금 ' + out + '원정';
}
function bindWonReader(input, target) {
  const upd = () => {
    const v = Number(input.value);
    target.innerHTML = input.value && v > 0 ? `<b class="money">${v.toLocaleString('ko-KR')}원</b> · ${wonKorean(v)}` : '';
  };
  input.addEventListener('input', upd); upd();
}

function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
function crCost(o) {
  if (o.costType === '없음') return '추가비용 없음';
  if (o.amount === '' || o.amount == null) return o.costType ? (o.costType === '감액' ? '감액 (견적 전)' : '추가비용 (견적 전)') : '';
  return (o.costType === '감액' ? '감액 ' : '추가 ') + won(o.amount);
}

// 이미지는 1600px JPEG로 줄여서 업로드
async function readFiles(input) {
  const out = [];
  for (const f of Array.from(input.files || [])) {
    if (f.type.startsWith('image/') && f.type !== 'image/gif') {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out.push({ name: f.name.replace(/\.\w+$/, '') + '.jpg', type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] });
    } else {
      if (f.size > 10 * 1024 * 1024) throw new Error(f.name + ': 10MB 이하 파일만 첨부할 수 있습니다.');
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
      out.push({ name: f.name, type: f.type || 'application/octet-stream', data });
    }
  }
  return out;
}
