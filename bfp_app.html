<title>사람사는집</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #EEF0EA; --surface: #FFFFFF; --ink: #1E261B; --muted: #697164; --line: #D8DCD2;
    --green: #2D5016; --green-2: #3E6B22; --green-soft: #E3EBDA;
    --amber: #9A6A12; --amber-soft: #F6ECD4; --blue: #2F5D8A; --blue-soft: #DFE9F3;
    --gray: #8A8F86; --gray-soft: #ECEDEA; --red: #A33A2B; --red-soft: #F6DEDA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--ink); font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* 로그인 */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 36px 28px 28px; text-align: center; }
  .mark { width: 44px; height: 44px; border-radius: 10px; background: var(--green); display: grid; place-items: center; margin: 0 auto 14px; }
  .login-card h1 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
  .login-card p { margin: 6px 0 24px; color: var(--muted); font-size: 14px; }
  #gbtn { display: flex; justify-content: center; min-height: 44px; }
  .login-msg { margin-top: 16px; font-size: 13px; color: var(--red); min-height: 18px; }

  /* 상단 */
  .top { background: var(--green); color: #fff; position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top); }
  .top-row { max-width: 1080px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  .site-pick { margin-left: auto; position: relative; min-width: 0; }
  .site-pick select { appearance: none; -webkit-appearance: none; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); color: #fff; border-radius: 8px; padding: 7px 32px 7px 12px; max-width: 280px; font-weight: 600; }
  .site-pick select option { color: var(--ink); }
  .site-pick::after { content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .me { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .me .role { background: rgba(255,255,255,.16); padding: 2px 8px; border-radius: 999px; }
  .me button { background: none; border: 0; color: rgba(255,255,255,.8); font-size: 13px; padding: 4px; }
  .tabs { max-width: 1080px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; background: none; border: 0; color: rgba(255,255,255,.72); padding: 10px 14px 11px; font-weight: 600; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 5px; text-decoration: none; font-size: 15px; }
  .tab[aria-selected="true"] { background: var(--bg); color: var(--ink); }
  .tab.ext { font-weight: 500; }
  .tab.ext svg { opacity: .7; }
  .tab-sep { width: 1px; background: rgba(255,255,255,.2); margin: 10px 6px; flex: none; }

  main { max-width: 1080px; margin: 0 auto; padding: 20px 20px 60px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

  /* 현장 요약 */
  .site-head { padding: 20px 22px 18px; }
  .site-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .code { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--green); background: var(--green-soft); border-radius: 6px; padding: 2px 8px; font-size: 14px; letter-spacing: .03em; }
  .site-title h2 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .pill { font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--green-soft); color: var(--green); }
  .pill.보류 { background: var(--amber-soft); color: var(--amber); }
  .pill.완공 { background: var(--blue-soft); color: var(--blue); }
  .pill.설계중, .pill.견적조정중, .pill.허가중 { background: #fff; box-shadow: inset 0 0 0 1px #9DB38A; }
  .pill.problem { background: var(--red-soft); color: var(--red); }
  .addr { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .problem-note { margin-top: 12px; background: var(--red-soft); color: var(--red); border-radius: 8px; padding: 8px 12px; font-size: 14px; }

  .progress { padding: 0 22px 18px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .progress-top b { color: var(--ink); font-size: 20px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--gray-soft); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green-2); border-radius: 999px; }

  .facts { border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 0 -1px; }
  .fact { padding: 14px 22px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
  .fact:nth-child(4n) { border-right: 0; }
  .fact dt { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .fact dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .fact dd small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }

  .subnav { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 12px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
  .empty h3 { margin: 0 0 6px; color: var(--ink); font-size: 17px; }
  .loading { padding: 80px 20px; text-align: center; color: var(--muted); }

  /* ===== 변경요청 ===== */
  .cr-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cr-bar h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; margin-right: auto; }
  .btn { border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; background: var(--green); color: #fff; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid #E6B8B0; }
  .btn:disabled { opacity: .5; cursor: default; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters .chip b { margin-left: 4px; }
  .cr-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 18px; }
  .cr-row:last-child { border-bottom: 0; }
  .cr-row:hover { background: #F7F8F5; }
  .cr-id { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .cr-title { font-weight: 600; }
  .cr-sub { font-size: 13px; color: var(--muted); }
  .cr-right { grid-column: 2; grid-row: 1 / span 3; text-align: right; align-self: center; }
  .cr-wait { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .st { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); white-space: nowrap; }
  .st.완료 { background: var(--green-soft); color: var(--green); }
  .st.반려, .st.취소 { background: var(--gray-soft); color: var(--gray); }
  .st.mine { box-shadow: inset 0 0 0 2px var(--amber); }
  .tag { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); margin-left: 6px; vertical-align: 1px; }
  .money { font-variant-numeric: tabular-nums; font-weight: 600; }

  .scrim { position: fixed; inset: 0; background: rgba(20,26,18,.42); z-index: 30; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--bg); z-index: 31; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(20,26,18,.18); }
  .sheet-head { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; align-items: flex-start; gap: 12px; }
  .sheet-head h3 { margin: 2px 0 0; font-size: 18px; letter-spacing: -0.02em; }
  .sheet-head .x { margin-left: auto; background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); padding: 4px 6px; }
  .sheet-body { overflow-y: auto; padding: 16px 18px 40px; flex: 1; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .card h4 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; }

  .steps { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; }
  .step { flex: 1 0 auto; min-width: 64px; text-align: center; position: relative; font-size: 12px; color: var(--muted); padding-top: 22px; }
  .step::before { content: ""; position: absolute; top: 6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--line); z-index: 1; }
  .step::after { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line); }
  .step:first-child::after { display: none; }
  .step.done { color: var(--ink); }
  .step.done::before { background: var(--green-2); box-shadow: none; }
  .step.done::after, .step.cur::after { background: var(--green-2); }
  .step.cur { color: var(--amber); font-weight: 700; }
  .step.cur::before { background: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
  .step.skip { opacity: .4; text-decoration: line-through; }

  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .content { white-space: pre-wrap; font-size: 15px; }

  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .thumb { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 8px; background: var(--gray-soft) center/cover no-repeat; display: flex; align-items: flex-end; padding: 0; overflow: hidden; }
  .thumb span { width: 100%; font-size: 11px; background: rgba(255,255,255,.9); padding: 3px 5px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb.doc { align-items: center; justify-content: center; flex-direction: column; font-size: 12px; color: var(--muted); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compare h5 { margin: 0 0 6px; font-size: 13px; }

  .f { margin-bottom: 12px; }
  .f > label, .f > .lb { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .f input[type=text], .f input[type=number], .f select, .f textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: #fff; }
  .f textarea { resize: vertical; min-height: 72px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .won-read { margin-top: 6px; font-size: 15px; color: var(--green); min-height: 1.4em; }
  .notice { background: var(--amber-soft); color: #6B4A0C; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .sum { background: var(--green-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .sum b { font-size: 18px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 4px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  .sig-wrap { border: 1px dashed #9DB38A; border-radius: 8px; background: #fff; position: relative; }
  .sig-wrap canvas { display: block; width: 100%; height: 170px; touch-action: none; }
  .sig-wrap .clr { position: absolute; top: 6px; right: 6px; font-size: 12px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
  .sig-wrap .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #B5BCAE; pointer-events: none; font-size: 14px; }
  .timeline { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .timeline li { padding: 8px 0 8px 14px; border-left: 2px solid var(--line); position: relative; }
  .timeline li::before { content: ""; position: absolute; left: -5px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--green-2); }
  .timeline .t { font-size: 12px; color: var(--muted); }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 40; display: grid; place-items: center; padding: 20px; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--green); }

  @media (max-width: 760px) {
    .sheet { width: 100%; }
    .cr-row { padding: 12px 14px; }
    .compare { grid-template-columns: 1fr; }
  }
  input[type=file] { width: 100%; font-size: 14px; color: var(--muted); }
  input[type=file]::file-selector-button { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 8px 14px; font-weight: 600; margin-right: 10px; font-family: inherit; cursor: pointer; }
  .fab { display: none; }
  /* ===== 고객관리 ===== */
  .badge { background: #D9534F; color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 5px; text-align: center; margin-left: 2px; }
  .cx-alert { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .cx-alert button { flex: 1 1 180px; text-align: left; border: 1px solid #E6B8B0; background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
  .cx-alert b { font-size: 22px; margin-right: 6px; vertical-align: -2px; font-variant-numeric: tabular-nums; }
  .cx-ok { background: var(--green-soft); color: var(--green); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; font-size: 14px; }
  .chip.warn b { color: var(--red); }
  .cx-row.urgent { box-shadow: inset 4px 0 0 var(--red); }
  .flag { font-size: 12px; font-weight: 700; color: #fff; background: var(--red); border-radius: 5px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .cx-warn { background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600; font-size: 14px; }
  .cx-st.접수메일답장완료 { background: var(--amber-soft); color: var(--amber); }
  .cx-st.반려 { background: var(--gray-soft); color: var(--gray); }

  .cx-next { font-size: 13px; color: var(--muted); }
  .cx-next.today { color: var(--amber); font-weight: 600; }
  .cx-next.over { color: var(--red); font-weight: 600; }
  .cx-st { background: var(--blue-soft); color: var(--blue); }
  .cx-st.접수 { background: var(--amber-soft); color: var(--amber); }

  .cx-contact:empty { display: none; }

  .cx-ai { margin-top: 10px; background: var(--green-soft); border-radius: 8px; padding: 12px; font-size: 14px; }
  .timeline li.k-통화::before, .timeline li.k-방문상담::before, .timeline li.k-미팅::before { background: var(--amber); }
  @media (max-width: 760px) {
    .cx-plan { grid-template-columns: 1fr 1fr; }

  /* ===== 설계 일정 ===== */

  .ds-next { margin-top: 8px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .linkish { border: 0; background: none; color: var(--green); font-weight: 700; font-size: 14px; margin-left: auto; padding: 2px 0; }
  .ds-phase { padding: 10px 18px 6px; font-size: 12px; font-weight: 700; color: var(--muted); background: #F7F8F5; border-bottom: 1px solid var(--line); }
  .ds-row .cr-title.done { color: var(--muted); text-decoration: line-through; }
  .ds-prev-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; margin-top: 6px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--red); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; display: none; max-width: 90vw; z-index: 50; }

  @media (max-width: 760px) {
    .top-row { flex-wrap: wrap; padding: 10px 14px; }

    main { padding: 14px 12px 60px; }
    .facts { grid-template-columns: 1fr 1fr; }

    .site-head, .progress { padding-left: 16px; padding-right: 16px; }
    .fact { padding: 12px 16px; }
    .fact.blank { display: none; }
  }

  /* ===== 모바일 최적화 ===== */
  @media (max-width: 760px) {
    body { font-size: 15px; }
    /* iOS 입력 시 화면 확대 방지 */
    input, select, textarea { font-size: 16px !important; }
    .tab { padding: 10px 12px 11px; }
    .me { gap: 6px; }
    .me #meName { max-width: 5em; overflow: hidden; text-overflow: ellipsis; }

    /* 변경요청 목록 */
    .cr-bar { margin-bottom: 10px; }
    .cr-bar h2 .cr-sub { display: none; }
    .cr-bar #crNew { display: none; }

    .filters::-webkit-scrollbar { display: none; }

    .cr-right { grid-row: 1; grid-column: 2; align-self: start; }
    .cr-wait { display: none; }
    .cr-title, .cr-sub { grid-column: 1 / -1; }
    main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .fab { display: flex; align-items: center; gap: 6px; position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 20;
      background: var(--green); color: #fff; border: 0; border-radius: 999px; padding: 14px 20px; font-weight: 700; font-size: 16px; box-shadow: 0 6px 18px rgba(45,80,22,.35); }

    /* 상세·접수 시트: 전체 화면 */
    .sheet { width: 100%; box-shadow: none; }
    .sheet-head { padding: calc(12px + env(safe-area-inset-top)) 14px 12px; position: sticky; top: 0; }
    .sheet-head .x { font-size: 28px; padding: 2px 8px; margin-right: -6px; }
    .sheet-body { padding: 12px 12px calc(40px + env(safe-area-inset-bottom)); }
    .card { padding: 14px; border-radius: 12px; }
    .kv { grid-template-columns: 80px 1fr; }

    /* 단계 표시: 7단계가 한 화면에 */
    .steps { overflow: visible; }
    .step { flex: 1 1 0; min-width: 0; font-size: 11px; line-height: 1.25; word-break: keep-all; padding: 22px 1px 0; }

    /* 버튼·입력 터치 크기 */
    .actions.sticky { position: sticky; bottom: calc(-40px - env(safe-area-inset-bottom)); background: var(--bg); margin: 0 -12px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); z-index: 2; }

  }
</style>

<body>

<!-- ▼ 설치 후 이 한 줄만 수정: 마스터 Apps Script "새 배포"의 웹 앱 URL -->
<script>const API_URL = 'https://script.google.com/macros/s/AKfycbzc21WNSYNOg55Bc5W_lcUxMBmi4KN0JrkAMB84cvi6AbGf1Xsmy10MoTQz93BuxIdigA/exec';</script>

<section class="login" id="loginView">
  <div class="login-card">
    <div class="mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    </div>
    <h1>사람사는집</h1>
    <p>회사 구글 계정으로 로그인하세요</p>
    <div id="gbtn"></div>
    <div class="login-msg" id="loginMsg" role="status"></div>
  </div>
</section>

<div id="appView" hidden>
  <header class="top">
    <div class="top-row">
      <span class="brand">사람사는집</span>
      <label class="site-pick" id="sitePickWrap">
        <span class="sr" hidden>현장 선택</span>
        <select id="sitePick" aria-label="현장 선택"></select>
      </label>
      <div class="me"><span id="meName"></span><span class="role" id="meRole"></span><button type="button" id="logoutBtn">로그아웃</button></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main id="main"></main>
</div>

<div class="toast" id="toast" role="alert"></div>

<script>
const GOOGLE_CLIENT_ID = '573053436430-btlompn2ojv7h4qviandnb4b9p41410j.apps.googleusercontent.com';
const TOKEN_KEY = 'bfp_app_token';
const SITE_KEY = 'bfp_app_site';
const TAB_LABEL = { change: '변경요청', site: '현장관리', cx: '고객관리' };
const EXT_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

const S = { me: null, tabs: [], links: [], sites: [], tab: null, siteCode: null, siteSub: '' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000);
}

// ---------- 로그인 ----------
function parseJwt(t) {
  const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(atob(b).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}
function getToken() {
  const t = sessionStorage.getItem(TOKEN_KEY);
  if (!t) return '';
  try { if (Date.now() > parseJwt(t).exp * 1000 - 60000) { sessionStorage.removeItem(TOKEN_KEY); return ''; } } catch (e) { return ''; }
  return t;
}

async function api(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ idToken: getToken() }, body))
  });
  const data = await res.json();
  if (data.authError) { showLogin(data.error); throw new Error(data.error); }
  if (!data.ok) throw new Error(data.error || '요청 실패');
  return data;
}

function showLogin(msg) {
  sessionStorage.removeItem(TOKEN_KEY);
  $('appView').hidden = true;
  $('loginView').hidden = false;
  $('loginMsg').textContent = msg || '';
}

function initGoogle() {
  if (!window.google || !google.accounts) { setTimeout(initGoogle, 150); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle, auto_select: true, ux_mode: 'popup' });
  google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', width: 260 });
  if (!getToken()) google.accounts.id.prompt();
}

function onGoogle(res) {
  sessionStorage.setItem(TOKEN_KEY, res.credential);
  start();
}

async function start() {
  $('loginMsg').textContent = '확인 중...';
  $('loginMsg').style.color = 'var(--muted)';
  try {
    const d = await api({ action: 'me' });
    Object.assign(S, { me: d.user, tabs: d.tabs, links: d.links, sites: d.sites });
    $('loginView').hidden = true;
    $('appView').hidden = false;
    $('loginMsg').style.color = '';
    renderShell();
  } catch (e) {
    $('loginMsg').style.color = '';
    if (!$('loginView').hidden) $('loginMsg').textContent = e.message;
  }
}

$('logoutBtn').onclick = () => {
  sessionStorage.removeItem(TOKEN_KEY);
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  location.reload();
};

// ---------- 화면 틀 ----------
function renderShell() {
  $('meName').textContent = S.me.name;
  $('meRole').textContent = S.me.roleLabel;

  // 현장 선택 — 현장코드 순 (숫자로 시작하는 코드 먼저, HQ 등은 뒤로)
  const codeKey = c => (/^\d/.test(c) ? '0' : '1') + c;
  S.sites.sort((a, b) => codeKey(a.code).localeCompare(codeKey(b.code)));
  const saved = localStorage.getItem(SITE_KEY);
  S.siteCode = (S.sites.find(s => s.code === saved) || S.sites[0] || {}).code || null;
  $('sitePick').innerHTML = S.sites.length
    ? S.sites.map(s => `<option value="${esc(s.code)}">${esc(s.code)} ${esc(s.name)}${s.status === '시공중' ? '' : ' · ' + esc(s.status)}</option>`).join('')
    : '<option>볼 수 있는 현장이 없습니다</option>';
  $('sitePick').value = S.siteCode || '';
  $('sitePick').onchange = () => { S.siteCode = $('sitePick').value; localStorage.setItem(SITE_KEY, S.siteCode); DS.site = null; DS.plan = null; DS.items = []; renderTab(); };

  const tabsHtml = S.tabs.map(t => `<button class="tab" role="tab" data-tab="${t}">${TAB_LABEL[t]}</button>`).join('');
  const linksHtml = S.links.map(l => `<a class="tab ext" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}${EXT_ICON}</a>`).join('');
  $('tabs').innerHTML = tabsHtml + (S.links.length ? '<span class="tab-sep" aria-hidden="true"></span>' + linksHtml : '');
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => selectTab(b.dataset.tab));

  selectTab(S.tabs.includes(S.tab) ? S.tab : S.tabs[0]);
  if (S.tabs.includes('cx') && !CX.loaded) cxLoad().then(() => { if (S.tab === 'cx') cxRenderList(); }).catch(() => {});
}

function selectTab(t) {
  S.tab = t;
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('sitePickWrap').hidden = t === 'cx';
  renderTab();
}

function currentSite() { return S.sites.find(s => s.code === S.siteCode); }

function renderTab() {
  const fab = $('crFab'); if (fab) fab.hidden = S.tab !== 'change';
  if (S.tab === 'site') return renderSiteTab();
  if (S.tab === 'change') return renderChangeTab();
  if (S.tab === 'cx') return renderCxTab();
}

// ---------- 현장관리 ----------
function toPy(m2) { return Math.round(m2 / 3.3058 * 10) / 10; }
function fmtNum(n) { return (Math.round(n * 10) / 10).toLocaleString('ko-KR'); }
function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function progressHtml(s) {
  if (!s.startDate || !s.endDate) {
    return s.status === '시공중' ? '<div class="progress"><div class="progress-top"><span>공정률</span><span>착공일·준공예정일이 입력되면 자동 계산됩니다</span></div></div>' : '';
  }
  const total = dayDiff(s.startDate, s.endDate);
  const done = dayDiff(s.startDate, today());
  const pct = total > 0 ? Math.max(0, Math.min(100, Math.round(done / total * 100))) : 0;
  const left = dayDiff(today(), s.endDate);
  const label = done < 0 ? `착공 D-${-done}` : left >= 0 ? `착공 D+${done} · 준공까지 ${left}일` : `준공예정 ${-left}일 경과`;
  return `<div class="progress"><div class="progress-top"><span>${esc(label)}</span><b>${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function contractPy(a) {
  if (!a) return 0;
  const v = x => Number(x) || 0;
  return v(a.house) + (v(a.attic) + v(a.parking) + v(a.basement)) * 0.5;
}

function renderSiteTab() {
  const s = currentSite();
  if (!s) { $('main').innerHTML = '<div class="panel empty"><h3>볼 수 있는 현장이 없습니다</h3>담당 현장이 필요하면 관리자에게 요청하세요.</div>'; return; }

  const floorTotal = (s.floorAreas || []).reduce((t, f) => t + (Number(f.area) || 0), 0);
  const floors = [s.floorsAbove ? `지상 ${s.floorsAbove}층` : '', s.floorsBelow ? `지하 ${s.floorsBelow}층` : '', s.attic ? '다락' : ''].filter(Boolean).join(' · ');
  const cp = contractPy(s.area);
  const facts = [
    ['유형 · 구조', [s.houseType, s.struct].filter(Boolean).join(' · ') || '—', floors],
    ['연면적', floorTotal ? `${fmtNum(floorTotal)}㎡` : '—', floorTotal ? `${fmtNum(toPy(floorTotal))}평` + ((s.floorAreas || []).length ? ' · ' + s.floorAreas.map(f => f.name).join('/') : '') : ''],
    ['대지면적', s.landArea ? `${fmtNum(s.landArea)}㎡` : '—', s.landArea ? `${fmtNum(toPy(s.landArea))}평` : ''],
    ['담당 소장', s.manager || '—', ''],
    ['공사 기간', s.startDate ? `${s.startDate} ~` : (s.plannedStart ? `착공 예정 ${s.plannedStart}` : '—'), s.endDate ? `준공 예정 ${s.endDate}` : ''],
    ['입주 희망', s.moveIn || '—', ''],
    ['부대시설', (s.facilities || []).join(', ') || '—', '']
  ];
  if (S.me.role !== 'client') {
    facts.push(['건축주', s.owner || '—', s.ownerPhone || '']);
    facts.push(['설계', s.designBy === '건축사사무소' ? (s.architect || '건축사사무소') : (s.designBy ? '사람사는집 자체 설계' : '—'), cp ? `계약 ${fmtNum(cp)}평` : '']);
    facts.push(['NAS 폴더', s.nasFolder || '—', '']);
  }
  // 4칸 단위로 채우기
  while (facts.length % 4) facts.push(['', '', '']);

  const subs = S.me.role === 'client' ? ['현장보고', '공지', '스펙북', '360 VIEW'] : ['설계 일정', '현장보고', '공정표', '공지', '스펙북', '서류함', '360 VIEW'];
  if (!subs.includes(S.siteSub)) S.siteSub = subs[0];

  $('main').innerHTML = `
    <section class="panel">
      <div class="site-head">
        <div class="site-title">
          <span class="code">${esc(s.code)}</span>
          <h2>${esc(s.name)}</h2>
          <span class="pill ${esc(s.status)}">${esc(s.status)}</span>
          ${s.problem ? '<span class="pill problem">문제 현장</span>' : ''}
        </div>
        ${s.address ? `<div class="addr">${esc(s.address)}</div>` : ''}
        ${s.problem ? `<div class="problem-note">${esc(s.problemReason)}</div>` : ''}
      </div>
      ${progressHtml(s)}
      <dl class="facts">
        ${facts.map(f => `<div class="fact${f[0] ? '' : ' blank'}"><dt>${esc(f[0])}</dt><dd>${f[0] ? esc(f[1]) : ''}${f[2] ? `<small>${esc(f[2])}</small>` : ''}</dd></div>`).join('')}
      </dl>
    </section>
    ${S.me.role !== 'client' ? dsTimelineHtml() : ''}
    <div class="subnav" role="tablist">
      ${subs.map(x => `<button class="chip" aria-pressed="${x === S.siteSub}" data-sub="${esc(x)}">${esc(x)}</button>`).join('')}
    </div>
    <div id="subBody">${S.siteSub === '설계 일정' ? '<div class="loading">불러오는 중...</div>' : `<section class="panel empty"><h3>${esc(S.siteSub)}</h3>다음 단계에서 이 화면을 채웁니다.</section>`}</div>`;
  $('main').querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { S.siteSub = b.dataset.sub; renderSiteTab(); });
  $('main').querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.siteSub = '설계 일정'; renderSiteTab(); });
  if (S.me.role !== 'client') {
    dsLoad(s.code).then(() => {
      if (S.tab !== 'site' || S.siteCode !== s.code) return;
      if (S.siteSub === '설계 일정' && $('subBody')) dsRender($('subBody'));
      else if (DS.plan && !document.querySelector('.ds-time')) renderSiteTab();
    }).catch(e => { if ($('subBody') && S.siteSub === '설계 일정') $('subBody').innerHTML = `<section class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</section>`; });
    if (DS.site === s.code && S.siteSub === '설계 일정') dsRender($('subBody'));
  }
}

// ---------- 설계 일정 ----------
const DS = { site: null, plan: null, items: [], canEdit: false, loading: false };
const DS_WEEKS = 28;
const DS_TPL = [
  ['설계', 1, 1, '킥오프 미팅', 'meeting'], ['설계', 1, 3, '현장답사 · 법규 확인 · 배치/평면 설계', 'work'],

function dsMonday(str) { const d = new Date(str + 'T00:00:00'); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return d; }
function dsAdd(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function dsPreview(mode, baseDate) {
  const start = mode === '계약일' ? dsMonday(baseDate) : dsAdd(dsMonday(baseDate), -(DS_WEEKS - 1) * 7);
  return DS_TPL.map(t => {
    const ws = dsAdd(start, (t[1] - 1) * 7);
    const date = t[4] === 'meeting' ? dsAdd(ws, 2) : t[4] === 'deadline' ? dsAdd(dsAdd(start, (t[2] - 1) * 7), 4) : ws;
    return { phase: t[0], week: t[1], title: t[3], kind: t[4], date: ymd(date) };
  });
}
function dsDday(date) {
  if (!date) return { text: '', cls: '' };
  const d = dayDiff(today(), date);
  if (d < 0) return { text: `${-d}일 지남`, cls: 'over' };
  if (d === 0) return { text: '오늘', cls: 'today' };
  return { text: `D-${d}`, cls: '' };
}
function dsCurrent() {
  const open = DS.items.filter(i => i.status !== '완료');
  const late = open.filter(i => i.date && i.date < today());
  const next = open.filter(i => i.date && i.date >= today()).sort((a, b) => a.date.localeCompare(b.date));
  const doneCount = DS.items.filter(i => i.status === '완료').length;
  return { late, next, doneCount, total: DS.items.length };
}

async function dsLoad(code) {
  if (DS.site === code || DS.loading) return;
  DS.loading = true;
  try {
    const [meta, d] = await Promise.all([api({ action: 'ds_meta' }), api({ action: 'ds_get', siteCode: code })]);
    DS.canEdit = meta.canEdit; DS.plan = d.plan; DS.items = d.items; DS.site = code;
  } finally { DS.loading = false; }
}

function dsTimelineHtml() {
  if (!DS.plan) return '';
  const c = dsCurrent();
  const week = Math.min(DS_WEEKS, Math.max(1, Math.floor(dayDiff(DS.plan.startDate, today()) / 7) + 1));
  const pct = Math.max(0, Math.min(100, Math.round((week - 1) / (DS_WEEKS - 1) * 100)));
  const nx = c.next[0];
  const nd = nx ? dsDday(nx.date) : null;
  return `<section class="panel ds-time">
    <div class="ds-time-top">
      <div><span class="cr-id">설계 진행</span><div class="ds-now">${week}주차 / ${DS_WEEKS}주 · ${esc(DS.plan.baseMode === '착공역산' ? '착공 역산' : '계약일 기준')}</div></div>

const CR = { items: [], site: null, meta: null, filter: '진행중', busy: false, urls: {} };
const CR_STEPS = [
  ['접수', '접수'], ['설계검토', '설계 검토'], ['견적', '견적'], ['건축주확인', '건축주 확인'],
  ['승인대기', '승인'], ['도면반영', '도면 반영'], ['현장반영', '현장 확인']
];
const CR_OPEN = ['설계검토', '견적', '건축주확인', '승인대기', '도면반영', '현장반영'];

function crWait(o) {
  return {
    설계검토: '설계팀 검토 대기', 견적: '공무 견적 대기', 건축주확인: '건축주 확인 대기',
    승인대기: o.fastTrack ? '소장 전결 승인 대기' : '대표 승인 대기', 도면반영: '설계팀 도면 반영 대기',
    현장반영: '현장 확인 대기', 완료: '완료', 반려: '반려', 취소: '취소'
  }[o.status] || o.status;
}

function crMyTurn(o) {
  const r = S.me.role, admin = r === 'admin', gm = S.me.team === '공무';
  switch (o.status) {
    case '설계검토': return admin || r === 'design';
    case '견적': return admin || gm;
    case '건축주확인': return admin || r === 'site' || gm;
    case '승인대기': return admin || (o.fastTrack && r === 'site');
    case '도면반영': return admin || r === 'design';
    case '현장반영': return admin || r === 'site';
  }
  return false;
}

function crSteps(o) {
  const skip = k => (k === '설계검토' && o.fastTrack) || (k === '견적' && (o.fastTrack || o.costType === '없음')) || (k === '도면반영' && o.drawingImpact === 'N');
  const cur = o.status === '완료' ? 99 : CR_STEPS.findIndex(s => s[0] === o.status);
  return CR_STEPS.map((s, i) => {
    let st = i === 0 || i < cur ? 'done' : i === cur ? 'cur' : '';
    if (i > 0 && skip(s[0])) st = 'skip';
    if ((o.status === '반려' || o.status === '취소') && i > 0) st = skip(s[0]) ? 'skip' : '';
    return `<div class="step ${st}">${s[1]}</div>`;
  }).join('');
}

// 금액 한글 표기: 180000 → 금 일십팔만원정
function wonKorean(n) {
  n = Math.floor(Number(n));
  if (!n || n < 0) return '';
  const digit = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const small = ['', '십', '백', '천'];
  const big = ['', '만', '억', '조'];
  let out = '', g = 0;
  while (n > 0 && g < big.length) {
    const part = n % 10000;
    if (part) {
      let t = '';
      String(part).padStart(4, '0').split('').forEach((d, i) => { if (d !== '0') t += digit[d] + small[3 - i]; });
      out = t + big[g] + out;
    }
    n = Math.floor(n / 10000); g++;
  }
  return '금 ' + out + '원정';
}
function bindWonReader(input, target) {
  const upd = () => {
    const v = Number(input.value);
    target.innerHTML = input.value && v > 0 ? `<b class="money">${v.toLocaleString('ko-KR')}원</b> · ${wonKorean(v)}` : '';
  };
  input.addEventListener('input', upd); upd();
}

function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
function crCost(o) {
  if (o.costType === '없음') return '추가비용 없음';
  if (o.amount === '' || o.amount == null) return o.costType ? (o.costType === '감액' ? '감액 (견적 전)' : '추가비용 (견적 전)') : '';
  return (o.costType === '감액' ? '감액 ' : '추가 ') + won(o.amount);
}

async function renderChangeTab() {
  const s = currentSite();
  if (!s) { $('main').innerHTML = '<div class="panel empty"><h3>볼 수 있는 현장이 없습니다</h3></div>'; return; }
  if (CR.site !== s.code) {
    $('main').innerHTML = '<div class="loading">변경요청을 불러오는 중...</div>';
    try {
      if (!CR.meta) CR.meta = await api({ action: 'cr_meta' });
      const d = await api({ action: 'cr_list', siteCode: s.code });
      CR.items = d.items; CR.site = s.code;
    } catch (e) { $('main').innerHTML = `<div class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</div>`; return; }
    if (S.tab !== 'change' || S.siteCode !== s.code) return;
  }
  crRenderList();
}

  const list = CR.items.filter(groups[CR.filter]);
  $('main').innerHTML = `
    <div class="cr-bar">

      <button class="btn" id="crNew" type="button">+ 변경요청 접수</button>
    </div>
    <div class="filters">
      ${Object.keys(groups).map(k => `<button class="chip" data-f="${k}" aria-pressed="${CR.filter === k}">${k}<b>${CR.items.filter(groups[k]).length}</b></button>`).join('')}
    </div>
    <section class="panel">
      ${list.length ? list.map(o => `
        <button class="cr-row" data-id="${esc(o.id)}">
          <span class="cr-id">${esc(o.id)}${o.fastTrack ? '<span class="tag">전결</span>' : ''}</span>
          <span class="cr-title">${esc(o.title)}</span>
          <span class="cr-sub">${esc(o.trade)} · ${esc(o.createdBy)} · ${esc(String(o.createdAt).slice(0, 10))}${crCost(o) ? ' · <span class="money">' + esc(crCost(o)) + '</span>' : ''}</span>
          <span class="cr-right"><span class="st ${esc(o.status)} ${CR_OPEN.includes(o.status) && crMyTurn(o) ? 'mine' : ''}">${esc(o.status === '승인대기' ? '승인' : o.status)}</span><span class="cr-wait">${esc(crWait(o))}</span></span>

// ---- 공통: 시트·폼 도구 ----
function openSheet(title, sub, body) {
  closeSheet();
  const wrap = document.createElement('div');
  wrap.id = 'sheetWrap';
  wrap.innerHTML = `<div class="scrim"></div><aside class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><div><div class="cr-id">${sub}</div><h3>${title}</h3></div><button class="x" type="button" aria-label="닫기">×</button></div>
    <div class="sheet-body">${body}</div></aside>`;
  document.body.appendChild(wrap);
  wrap.querySelector('.scrim').onclick = closeSheet;
  wrap.querySelector('.x').onclick = closeSheet;
  document.body.style.overflow = 'hidden';
  return wrap.querySelector('.sheet-body');
}
function closeSheet() { const w = $('sheetWrap'); if (w) w.remove(); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const lb = document.querySelector('.lightbox'); if (lb) lb.remove(); else closeSheet(); } });

function segHtml(name, opts, val) {
  return `<div class="seg" data-seg="${name}">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<button type="button" data-v="${esc(v)}" aria-pressed="${v === val}">${esc(l)}</button>`; }).join('')}</div>`;
}
function bindSegs(root, onChange) {
  root.querySelectorAll('[data-seg] button').forEach(b => b.onclick = () => {
    b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    if (onChange) onChange(b.parentNode.dataset.seg, b.dataset.v);
  });
}
function segVal(root, name) { const b = root.querySelector(`[data-seg="${name}"] [aria-pressed="true"]`); return b ? b.dataset.v : ''; }

// 이미지는 1600px JPEG로 줄여서 업로드
async function readFiles(input) {
  const out = [];
  for (const f of Array.from(input.files || [])) {
    if (f.type.startsWith('image/') && f.type !== 'image/gif') {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out.push({ name: f.name.replace(/\.\w+$/, '') + '.jpg', type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1] });
    } else {
      if (f.size > 10 * 1024 * 1024) throw new Error(f.name + ': 10MB 이하 파일만 첨부할 수 있습니다.');
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
      out.push({ name: f.name, type: f.type || 'application/octet-stream', data });
    }
  }
  return out;
}

async function submitting(btn, fn) {
  if (CR.busy) return;
  CR.busy = true; const t = btn.textContent; btn.disabled = true; btn.textContent = '저장 중...';
  try { await fn(); } catch (e) { toast(e.message); } finally { CR.busy = false; btn.disabled = false; btn.textContent = t; }
}

function crOpen(id) {

    o.reviewNote ? ['검토 의견', o.reviewNote] : null,

    o.approvedBy ? ['승인', `${o.approvedBy} · ${o.approvedAt}`] : null,

    ${after.length ? `<div class="card"><h4>도면 변경 전 · 후</h4><div class="compare"><div><h5>변경 전</h5>${files(before) || '<div class="hint">첨부 없음</div>'}</div><div><h5>변경 후 · ${esc(o.drawingRev)}</h5>${files(after)}</div></div></div>`
      : before.length ? `<div class="card"><h4>변경 전 사진·도면</h4>${files(before)}</div>` : ''}
    ${others.length ? `<div class="card"><h4>기타 첨부 (견적·서명·현장 사진)</h4>${files(others)}</div>` : ''}
    <div class="card">
      <h4>메모</h4>
      <div class="f"><textarea id="cNote" rows="2" placeholder="진행 관련 메모 (처리 이력에 남습니다)"></textarea></div>
      <div class="actions">${crCanCancel(o) ? '<button class="btn danger" type="button" id="cCancel">요청 취소</button>' : ''}<button class="btn ghost" type="button" id="cSave">메모 저장</button></div>

      <h4>사진·자료 업로드</h4>

  }).catch(() => {});
}

function crCanCancel(o) {
  if (!(S.me.role === 'admin' || o.mine)) return false;
  return o.status === '설계검토' || (o.status === '건축주확인' && (o.fastTrack || S.me.role === 'admin'));
}

async function crDo(o, payload) {
  const d = await api(Object.assign({ action: 'cr_act', id: o.id }, payload));
  const i = CR.items.findIndex(x => x.id === o.id);
  CR.items[i] = d.item;
  crRenderList();
  crOpen(o.id);
}

async function crFileUrl(o, fileId) {
  if (CR.urls[fileId]) return CR.urls[fileId];
  const d = await api({ action: 'cr_file', id: o.id, fileId });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  CR.urls[fileId] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
  return CR.urls[fileId];
}
function crThumb(o, btn) {
  if (btn.classList.contains('doc')) return;
  crFileUrl(o, btn.dataset.file).then(f => { btn.style.backgroundImage = `url("${f.url}")`; }).catch(() => {});
}
async function crViewFile(o, fileId) {
  try {
    const f = await crFileUrl(o, fileId);
    if (f.type.startsWith('image/')) {
      const lb = document.createElement('div'); lb.className = 'lightbox';
      lb.innerHTML = `<img src="${f.url}" alt="${esc(f.name)}">`;
      lb.onclick = () => lb.remove();
      document.body.appendChild(lb);
    } else {
      const a = document.createElement('a'); a.href = f.url; a.download = f.name; a.target = '_blank';
      document.body.appendChild(a); a.click(); a.remove();
    }
  } catch (e) { toast(e.message); }
}

// ---- 단계별 처리 폼 ----
function crActionForm(o, s, box) {
  const summary = `<div class="sum">${o.costType === '없음' ? '<b>추가비용 없음</b>' : `${o.costType === '감액' ? '감액' : '추가비용'} <b>${won(o.amount)}</b><div class="hint" style="color:var(--green)">${wonKorean(o.amount)}</div>`}</div>`;
  const noteF = (ph) => `<div class="f"><textarea class="aNote" rows="2" placeholder="${ph || '메모 (선택)'}"></textarea></div>`;
  const rejectBtn = S.me.role === 'admin' || S.me.role === 'design' ? '<button class="btn danger" type="button" data-a="reject">반려</button>' : '';
  let html = '';

  if (o.status === '설계검토') {
    html = `<h4>설계 검토</h4>
      <div class="f"><span class="lb">도면 변경</span>${segHtml('dw', [['Y', '있음'], ['N', '없음']], '')}</div>

      <div class="actions">${rejectBtn}<button class="btn" type="button" data-a="review">검토 완료</button></div>`;
  } else if (o.status === '견적') {
    html = `<h4>견적</h4>
      <div class="f"><label>${o.costType === '감액' ? '감액 금액' : '추가 금액'} (원, VAT 포함)</label><input type="number" class="aAmount" min="0" step="1000" inputmode="numeric">
        <div class="won-read" aria-live="polite"></div></div>
      <div class="f"><label>견적서 첨부 (선택)</label><input type="file" class="aFiles" multiple accept="image/*,.pdf,.xlsx,.xls"></div>
      ${noteF('산출 근거 등')}
      <div class="actions">${S.me.role === 'admin' ? rejectBtn : ''}<button class="btn" type="button" data-a="estimate">견적 등록</button></div>`;
  } else if (o.status === '건축주확인') {
    html = `<h4>건축주 확인</h4>${summary}
      <div class="notice">위 금액과 변경 내용을 건축주께 설명하고 서명을 받아주세요.</div>
      <div class="f"><label>건축주 이름</label><input type="text" class="aOwner" value="${esc(s.owner || '')}"></div>
      <div class="f"><span class="lb">서명</span><div class="sig-wrap"><canvas class="aSig"></canvas><span class="ph">여기에 서명</span><button type="button" class="clr">지우기</button></div></div>
      ${noteF()}
      <div class="actions"><button class="btn danger" type="button" data-a="owner_decline">건축주 미동의</button><button class="btn" type="button" data-a="owner_confirm">확인 완료</button></div>`;
  } else if (o.status === '승인대기') {
    html = `<h4>${o.fastTrack ? '소장 전결 승인' : '승인'}</h4>${summary}${noteF()}
      <div class="actions">${S.me.role === 'admin' ? rejectBtn : ''}<button class="btn" type="button" data-a="approve">${o.fastTrack && S.me.role === 'site' ? '전결 승인' : '승인'}</button></div>`;
  } else if (o.status === '도면반영') {
    html = `<h4>도면 반영</h4>
      <div class="f"><label>도면 Rev 번호</label><input type="text" class="aRev" placeholder="예: Rev.3 (전기평면도)"></div>
      <div class="f"><label>변경된 도면 (변경 위치 구름 표시)</label><input type="file" class="aFiles" multiple accept="image/*,.pdf,.dwg,.dxf"></div>
      ${noteF()}
      <div class="actions"><button class="btn" type="button" data-a="drawing">도면 반영 완료</button></div>`;
  } else if (o.status === '현장반영') {
    html = `<h4>현장 확인</h4>
      ${o.drawingImpact === 'Y' ? `<label class="check f"><input type="checkbox" class="aChk"> <span>최신 도면 <b>${esc(o.drawingRev)}</b>을 확인하고 시공했습니다</span></label>` : ''}

      ${noteF()}
      <div class="actions"><button class="btn" type="button" data-a="site_done">현장 확인 완료</button></div>`;
  }
  box.innerHTML = html;
  bindSegs(box);
  if (box.querySelector('.aAmount')) bindWonReader(box.querySelector('.aAmount'), box.querySelector('.won-read'));

  // 서명 패드
  const cv = box.querySelector('.aSig');
  let signed = false;
  if (cv) {
    const ratio = window.devicePixelRatio || 1;
    const fit = () => { const r = cv.getBoundingClientRect(); cv.width = r.width * ratio; cv.height = r.height * ratio; const g = cv.getContext('2d'); g.scale(ratio, ratio); g.lineWidth = 2.4; g.lineCap = 'round'; g.strokeStyle = '#1E261B'; signed = false; box.querySelector('.ph').hidden = false; };
    requestAnimationFrame(fit);
    const g = () => cv.getContext('2d');
    let drawing = false;
    const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); g().beginPath(); g().moveTo(x, y); };
    cv.onpointermove = e => { if (!drawing) return; const [x, y] = pos(e); g().lineTo(x, y); g().stroke(); if (!signed) { signed = true; box.querySelector('.ph').hidden = true; } };
    cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
    box.querySelector('.clr').onclick = fit;
  }

  box.querySelectorAll('[data-a]').forEach(btn => btn.onclick = () => submitting(btn, async () => {
    const act = btn.dataset.a;
    const note = (box.querySelector('.aNote') || {}).value || '';
    const p = { act, note };
    if (act === 'review') { p.drawingImpact = segVal(box, 'dw'); p.costType = segVal(box, 'cost'); }
    if (act === 'reject' && !note.trim()) throw new Error('반려 사유를 메모란에 입력하세요.');
    if (act === 'reject' && !confirm('반려할까요?')) return;
    if (act === 'estimate') p.amount = box.querySelector('.aAmount').value;
    if (act === 'owner_confirm') {
      if (!signed) throw new Error('건축주 서명을 받아주세요.');
      p.ownerName = box.querySelector('.aOwner').value;
      const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height;
      const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(cv, 0, 0);
      p.signature = c2.toDataURL('image/png').split(',')[1];
    }
    if (act === 'owner_decline' && !confirm('건축주 미동의로 종료할까요?')) return;
    if (act === 'drawing') p.rev = box.querySelector('.aRev').value;
    if (act === 'site_done') p.drawingChecked = !!(box.querySelector('.aChk') || {}).checked;
    const fi = box.querySelector('.aFiles');
    if (fi) p.files = await readFiles(fi);
    await crDo(o, p);
  }));
}

const CX = { items: [], meta: null, filter: '진행중', q: '', loaded: false };
const CX_FIELDS = [
  ['landStatus', '고객 상황', 'land'], ['situation', '현재 상황 (문의 원문)', 'text'], ['location', '현장 소재지', 'text'],
  ['landArea', '대지 면적', 'text', '㎡'], ['wantArea', '희망 건축면적', 'text', '평'], ['floors', '희망 층수', 'text'],
  ['budget', '예산', 'text'], ['houseType', '유형', 'houseType'], ['struct', '구조', 'struct'], ['exterior', '외장 스타일', 'text'],
  ['wantStart', '희망 착공 시기', 'text'], ['wantDesign', '희망 설계', 'area'], ['inquiry', '문의·특이사항', 'area']
];

function cxClosed(o) { return (CX.meta ? CX.meta.closed : ['계약완료', '반려']).includes(o.stage); }
function cxDays(o) { return Math.max(0, dayDiff(String(o.createdAt).slice(0, 10), today())); }
function cxNoContact(o) { return !cxClosed(o) && o.stage === '접수' && !o.firstContactAt; }
function cxStale(o) {
  if (cxClosed(o) || !o.lastActivityAt) return false;
  const idle = dayDiff(String(o.lastActivityAt).slice(0, 10), today());
  return idle >= (CX.meta ? CX.meta.staleDays : 14) && (!o.dueDate || o.dueDate <= today());
}
function cxOver(o) { return !cxClosed(o) && o.dueDate && o.dueDate < today(); }
function cxDue(o) {
  if (cxClosed(o) || !o.dueDate) return { cls: '', text: '' };
  const d = dayDiff(today(), o.dueDate);
  if (d < 0) return { cls: 'over', text: `${-d}일 지남` };
  if (d === 0) return { cls: 'today', text: '오늘' };
  return { cls: '', text: `D-${d}` };
}
function cxUrgentCount() { return CX.items.filter(o => cxNoContact(o) || cxOver(o) || cxStale(o)).length; }
function cxUnit(v, unit) { return v && unit && !String(v).includes(unit) && /^[\d.~\s-]+$/.test(v) ? v + unit : v; }
function cxBadge() {
  const tab = document.querySelector('[data-tab="cx"]');
  if (!tab || !CX.loaded) return;
  const n = cxUrgentCount();
  let b = tab.querySelector('.badge');
  if (!n) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('span'); b.className = 'badge'; tab.appendChild(b); }
  b.textContent = n;
}
async function cxLoad() {
  const [meta, list] = await Promise.all([api({ action: 'cx_meta' }), api({ action: 'cx_list' })]);
  CX.meta = meta; CX.items = list.items || []; CX.loaded = true;
  cxBadge();
}
function cxReplace(item) { const i = CX.items.findIndex(x => x.id === item.id); if (i >= 0) CX.items[i] = item; else CX.items.unshift(item); cxBadge(); }

async function renderCxTab() {

}

function cxRowsHtml(list) {

    return `<button class="cr-row cx-row ${flag ? 'urgent' : ''}" data-id="${esc(o.id)}">

      <span class="cr-sub">${esc([o.location, o.landStatus, o.wantArea ? cxUnit(o.wantArea, '평') : '', o.budget].filter(Boolean).join(' · '))}</span>

  }).join('');
}
function cxBindRows() {
  document.querySelectorAll('#cxRows .cx-row').forEach(b => b.onclick = () => cxOpen(b.dataset.id));
}
function cxFilteredList() {
  const q = CX.q.trim().toLowerCase();
  const rank = o => cxNoContact(o) ? 0 : cxOver(o) ? 1 : cxStale(o) ? 2 : cxClosed(o) ? 9 : 5;
  return CX.items.filter(cxGroups()[CX.filter]).filter(o => !q || [o.name, o.phone, o.location, o.id].join(' ').toLowerCase().includes(q))
    .sort((a, b) => rank(a) - rank(b) || String(a.dueDate || '9999').localeCompare(String(b.dueDate || '9999')) || String(b.createdAt).localeCompare(String(a.createdAt)));
}
function cxGroups() {
  return {
    진행중: o => !cxClosed(o),
    미연락: cxNoContact,
    '기한 지남': cxOver,
    방치: cxStale,
    ...Object.fromEntries(CX.meta.stages.map(st => [st, o => o.stage === st])),

  };
}

function cxFieldInput(f, v) {

async function cxFileUrl(o, fileId) {
  if (CR.urls[fileId]) return CR.urls[fileId];
  const d = await api({ action: 'cx_file', id: o.id, fileId });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  CR.urls[fileId] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
  return CR.urls[fileId];
}
function cxThumb(o, btn) {
  if (btn.classList.contains('doc')) return;
  cxFileUrl(o, btn.dataset.file).then(f => { btn.style.backgroundImage = `url("${f.url}")`; }).catch(() => {});
}
async function cxViewFile(o, fileId) {
  try {
    const f = await cxFileUrl(o, fileId);
    if (f.type.startsWith('image/')) {
      const lb = document.createElement('div'); lb.className = 'lightbox';
      lb.innerHTML = `<img src="${f.url}" alt="${esc(f.name)}">`;
      lb.onclick = () => lb.remove();
      document.body.appendChild(lb);
    } else {
      const a = document.createElement('a'); a.href = f.url; a.download = f.name; a.target = '_blank';
      document.body.appendChild(a); a.click(); a.remove();
    }
  } catch (e) { toast(e.message); }
}

    <div class="actions sticky"><button class="btn ghost" type="button" id="cClose">닫기</button><button class="btn danger" type="button" id="cDel" disabled>삭제</button></div>`);
  let targets = [];
  const refresh = () => {
    const months = Number(segVal(body, 'months'));
    const cut = new Date(); cut.setMonth(cut.getMonth() - months);
    const cutStr = ymd(cut);
    const kinds = [...body.querySelectorAll('.cTarget:checked')].map(c => c.value);
    targets = CX.items.filter(o => {
      const last = String(o.lastActivityAt || o.createdAt).slice(0, 10);

      return kinds.includes('진행');
    });
    $('cCount').textContent = `삭제 대상 ${targets.length}명`;
    $('cList').innerHTML = targets.length ? targets.map(o => `<div><b>${esc(o.name)}</b> <span class="cr-sub">${esc(o.stage)} · 마지막 기록 ${esc(String(o.lastActivityAt || o.createdAt).slice(0, 10))} · ${esc(o.location || '')}</span></div>`).join('') : '<div class="hint">조건에 맞는 고객이 없습니다.</div>';
    const b = $('cDel'); b.disabled = !targets.length; b.textContent = targets.length ? `${targets.length}명 삭제` : '삭제';
  };
  bindSegs(body, refresh);
  body.querySelectorAll('.cTarget').forEach(c => c.onchange = refresh);
  body.querySelector('#cClose').onclick = closeSheet;
  body.querySelector('#cDel').onclick = e => {
    if (!targets.length || !confirm(`${targets.length}명의 고객과 상담 기록을 삭제할까요?`)) return;
    submitting(e.target, async () => {
      const ids = targets.map(o => o.id);
      const d = await api({ action: 'cx_delete', ids });
      CX.items = CX.items.filter(x => !ids.includes(x.id)); cxBadge();
      closeSheet(); cxRenderList(); toast(`${d.deleted}명 삭제`);
    });

function cxSiteNameGuess(loc) {
  const t = String(loc || '').split(/\s+/);
  const city = (t.find(x => /(시|군)$/.test(x) && !/(광역시|특별시|특별자치시)$/.test(x)) || t[0] || '').replace(/(광역시|특별시|특별자치시|특별자치도|도|시|군)$/, '');
  const dong = [...t].reverse().find(x => /(동|리|읍|면)$/.test(x)) || '';
  return [city, dong].filter(Boolean).join(' ');
}
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  const actOpts = [...new Set([...(o.nextAction && !CX.meta.actions.includes(o.nextAction) ? [o.nextAction] : []), ...CX.meta.actions])]
    .map(a => `<option ${a === o.nextAction ? 'selected' : ''}>${esc(a)}</option>`).join('');

      <div class="cx-contact">
        ${o.phone ? `<a class="btn" href="tel:${esc(o.phone.replace(/[^\d+]/g, ''))}">전화 걸기</a>` : ''}
        ${o.phone ? `<a class="btn ghost" href="sms:${esc(o.phone.replace(/[^\d+]/g, ''))}">문자</a>` : ''}
        ${o.email ? `<a class="btn ghost" href="mailto:${esc(o.email)}">메일</a>` : ''}
      </div>
      ${o.phone ? `<div class="hint pc-note">전화·문자 버튼은 휴대폰에서만 연결됩니다. PC에서는 번호를 복사해 쓰세요 — <button type="button" class="linkish" id="cxCopy" style="margin:0">${esc(o.phone)} 복사</button></div>` : ''}
    </div>

    <div class="card">
      <h4>연락·상담 기록</h4>
      ${segHtml('kind', CX.meta.logKinds, '통화')}
      <div class="cx-when">
        <div class="f"><label for="xLogDate">날짜</label><input type="date" id="xLogDate" value="${today()}" max="${today()}"></div>
        <div class="f"><label for="xLogTime">시간</label><input type="time" id="xLogTime" value="${String(new Date().getHours()).padStart(2, '0')}:${String(new Date().getMinutes()).padStart(2, '0')}"></div>
      </div>
      <div class="f"><textarea id="xLog" rows="3" placeholder="통화·상담 내용, 희망 사항, 다음에 연락하기로 한 시점 등"></textarea></div>
      <div class="hint" id="xLogHint"></div>
      <div class="actions"><button class="btn" type="button" id="xLogSave">기록 저장</button></div>
    </div>

    <div class="card" id="meetCard">
      <h4>상담 미팅 일정</h4>
      ${o.meetingAt ? `<div class="cx-meet"><b>${esc(o.meetingAt.replace('-', '.').replace('-', '.'))}</b>${o.meetingPlace ? ' · ' + esc(o.meetingPlace) : ''}<div class="hint">구글 캘린더에 등록되어 있습니다.</div></div>
        <div class="actions"><button class="btn danger" type="button" id="mCancel">미팅 취소</button><button class="btn ghost" type="button" id="mEdit">일정 변경</button></div>` : `
        <div class="cx-when">
          <div class="f"><label for="mDate">날짜</label><input type="date" id="mDate" min="${today()}"></div>
          <div class="f"><label for="mTime">시간</label><input type="time" id="mTime" value="14:00" step="600"></div>
        </div>
        <div class="f"><span class="lb">소요 시간</span>${segHtml('mLen', [['60', '1시간'], ['90', '1시간 30분'], ['120', '2시간']], '90')}</div>
        <div class="f"><span class="lb">장소</span>${segHtml('mPlace', CX.meta.meetingPlaces, '본사 사무실')}</div>
        <div class="f" id="mDetailBox" hidden><input type="text" id="mDetail" placeholder="장소 상세 (주소, 층, 링크 등)"></div>
        <div class="f"><input type="text" id="mNote" placeholder="미팅 메모 (선택)"></div>
        <div class="actions"><button class="btn" type="button" id="mSave">미팅 확정 · 캘린더 등록</button></div>`}
    </div>

    <div class="card">
      <h4>진행 단계 · 다음 연락</h4>
      ${segHtml('stage', CX.meta.stages, o.stage)}
      <div id="rejBox" class="f" style="margin-top:10px" ${o.stage === '반려' ? '' : 'hidden'}>
        <span class="lb">반려 사유 (여러 개 선택)</span>
        <div class="seg" id="rejSeg">${CX.meta.rejectReasons.map(r => `<button type="button" data-r="${esc(r)}" aria-pressed="${reasons.includes(r)}">${esc(r)}</button>`).join('')}</div>
      </div>
      <div class="cx-plan" id="planBox" ${cxClosed(o) ? 'hidden' : ''}>
        <div class="f"><label>다음 할 일</label><select id="xNext"><option value="">선택</option>${actOpts}</select></div>
        <div class="f"><label>기한 <span class="cx-next ${due.cls}">${esc(due.text)}</span></label><input type="date" id="xDue" value="${esc(o.dueDate)}"></div>
        <div class="f"><label>담당자</label><select id="xOwner">${staffOpts}</select></div>
      </div>
      <div class="actions"><button class="btn" type="button" id="xPlanSave">저장</button></div>
    </div>

    <div class="card" id="sumCard">
      <div style="display:flex;align-items:center;margin-bottom:10px"><h4 style="margin:0">고객 정보</h4><button class="btn ghost" type="button" id="xEdit" style="margin-left:auto;padding:5px 12px">수정</button></div>
      <dl class="kv">
        <dt>연락처</dt><dd>${esc(o.phone || '—')}</dd><dt>이메일</dt><dd>${esc(o.email || '—')}</dd>
        ${CX_FIELDS.map(f => `<dt>${f[1]}</dt><dd>${esc(cxUnit(o[f[0]], f[3]) || '—')}</dd>`).join('')}
      </dl>
    </div>

    <div class="card">
      <h4>사진·자료</h4>
      <div id="cxFiles">${cxFilesHtml(o)}</div>
      <div class="f" style="margin-top:10px"><input type="file" id="cxUp" multiple accept="image/*,.pdf,.dwg,.dxf,.hwp,.docx,.xlsx"></div>
      <div class="f"><input type="text" id="cxUpNote" placeholder="자료 설명 (선택)"></div>
      <div class="actions"><button class="btn ghost" type="button" id="cxUpSave">올리기</button></div>
    </div>

    ${CX.meta.aiEnabled ? `<div class="card"><div style="display:flex;align-items:center"><h4 style="margin:0">AI 상담 분석</h4><button class="btn ghost" type="button" id="xAi" style="margin-left:auto;padding:5px 12px">분석하기</button></div>
      <div class="hint">고객 정보와 기록으로 다음 미팅 준비 포인트를 정리합니다.</div><div class="content cx-ai" id="aiOut" hidden></div></div>` : ''}

    ${o.siteCode ? `<div class="card"><h4>연결된 현장</h4><b>${esc(o.siteCode)}</b> — 포털 현장관리에서 확인할 수 있습니다.</div>`
      : o.stage === '계약완료' && isAdmin ? `<div class="card"><h4>마스터에 현장 등록</h4>
        <div class="f"><label>현장명</label><input type="text" id="rName" value="${esc(cxSiteNameGuess(o.location))}"></div>
        <div class="f"><span class="lb">설계 계약연도</span>${segHtml('rYear', CX.meta.codeYears.map(y => [y, '20' + y + '년']), CX.meta.codeYears[1])}</div>
        <div class="f"><span class="lb">설계 주체</span>${segHtml('rDesign', [['사람사는집', '자체 설계'], ['건축사사무소', '건축사사무소']], '')}</div>
        <div class="f" id="rArchBox" hidden><label>건축사사무소 이름</label><input type="text" id="rArch"></div>
        <div class="hint">건축주·연락처·주소·유형·대지면적이 채워진 "설계중" 현장이 만들어집니다.</div>
        <div class="actions"><button class="btn" type="button" id="rSave">현장 등록</button></div></div>` : ''}

    <div class="card"><h4>상담 기록</h4><ul class="timeline" id="xLogs"><li class="t">불러오는 중...</li></ul></div>
    ${isAdmin ? `<div class="actions" style="margin-top:4px"><button class="btn danger" type="button" id="xDel">고객 삭제</button></div>` : ''}`);

  const del = $('xDel');
  if (del) del.onclick = e => {
    const msg = `${o.name} 고객과 상담 기록을 삭제할까요?` + (o.siteCode ? `\n\n※ 현장 ${o.siteCode}와 연결된 고객입니다. 현장 정보는 그대로 남습니다.` : '') + '\n\n삭제한 자료는 고객관리_DB 시트의 "삭제보관" 탭에 보관됩니다.';
    if (!confirm(msg)) return;
    submitting(e.target, async () => {
      await api({ action: 'cx_delete', ids: [o.id] });
      CX.items = CX.items.filter(x => x.id !== o.id); cxBadge();
      closeSheet(); cxRenderList(); toast(`${o.name} 고객 삭제`);
    });
  };

  // 기록 종류별로 단계가 어떻게 바뀌는지 미리 안내
  const hintFor = k => {
    if (k === '통화' && ['접수', '접수(메일답장완료)'].includes(o.stage)) return '저장하면 단계가 "통화완료"로 넘어갑니다.';
    if (k === '메일·문자' && o.stage === '접수') return '저장하면 단계가 "접수(메일답장완료)"로 넘어갑니다.';
    if (['미팅', '방문상담'].includes(k) && ['접수', '접수(메일답장완료)', '통화완료', '통화완료 미팅고려', '미팅약속/진행중'].includes(o.stage)) return '저장하면 단계가 "미팅완료/계약고려중"으로 넘어갑니다.';
    return '';
  };
  $('xLogHint').textContent = hintFor('통화');

  bindSegs(body, (name, v) => {
    if (name === 'kind') $('xLogHint').textContent = hintFor(v);
    if (name === 'stage') {
      $('planBox').hidden = CX.meta.closed.includes(v);
      $('rejBox').hidden = v !== '반려';
      if (v !== o.stage && !CX.meta.closed.includes(v)) {
        const days = CX.meta.dueDays[v];
        if (days != null) { const d = new Date(); d.setDate(d.getDate() + days); $('xDue').value = ymd(d); }
        const nx = CX.meta.nextDefault[v]; if (nx) $('xNext').value = nx;
      }
    }
    if (name === 'rDesign') $('rArchBox').hidden = v !== '건축사사무소';
    if (name === 'mPlace') $('mDetailBox').hidden = ['본사 사무실'].includes(v);
  });
  body.querySelectorAll('#rejSeg button').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));

  const saveMeeting = async payload => {
    const d = await api(Object.assign({ action: 'cx_meeting', id: o.id }, payload));
    cxReplace(d.item); cxRenderList(); cxOpen(o.id);
  };
  if ($('mSave')) $('mSave').onclick = e => submitting(e.target, () => {
    if (!$('mDate').value || !$('mTime').value) throw new Error('미팅 날짜와 시간을 선택하세요.');
    return saveMeeting({ date: $('mDate').value, time: $('mTime').value, minutes: segVal(body, 'mLen'), place: segVal(body, 'mPlace'), placeDetail: $('mDetail').value, note: $('mNote').value })
      .then(() => toast('미팅 확정 · 캘린더에 등록했습니다'));
  });
  if ($('mEdit')) $('mEdit').onclick = () => {
    const card = $('meetCard');
    const [dt, tm] = o.meetingAt.split(' ');
    card.innerHTML = `<h4>상담 미팅 일정 변경</h4>
      <div class="cx-when"><div class="f"><label>날짜</label><input type="date" id="mDate" value="${esc(dt)}"></div>
      <div class="f"><label>시간</label><input type="time" id="mTime" value="${esc(tm)}" step="600"></div></div>
      <div class="f"><span class="lb">소요 시간</span>${segHtml('mLen2', [['60', '1시간'], ['90', '1시간 30분'], ['120', '2시간']], '90')}</div>
      <div class="f"><input type="text" id="mDetail" value="${esc(o.meetingPlace)}" placeholder="장소"></div>
      <div class="actions"><button class="btn ghost" type="button" id="mBack">취소</button><button class="btn" type="button" id="mUpdate">변경 저장</button></div>`;
    bindSegs(card);
    card.querySelector('#mBack').onclick = () => cxOpen(o.id);
    card.querySelector('#mUpdate').onclick = e => submitting(e.target, () =>
      saveMeeting({ date: $('mDate').value, time: $('mTime').value, minutes: segVal(card, 'mLen2'), place: '기타', placeDetail: $('mDetail').value })
        .then(() => toast('미팅 일정을 변경했습니다')));
  };
  if ($('mCancel')) $('mCancel').onclick = e => {
    if (!confirm('상담 미팅을 취소하고 캘린더에서 지울까요?')) return;
    submitting(e.target, () => saveMeeting({ cancel: true }).then(() => toast('미팅을 취소했습니다')));
  };

  const copyBtn = $('cxCopy');
  if (copyBtn) copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(o.phone); toast('연락처를 복사했습니다'); }
    catch (e) { toast('복사가 안 되면 번호를 길게 눌러 선택하세요'); }
  };

  const bindFiles = () => {
    body.querySelectorAll('#cxFiles [data-file]').forEach(b => { cxThumb(o, b); b.onclick = () => cxViewFile(o, b.dataset.file); });
    body.querySelectorAll('#cxFiles [data-del]').forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      if (!confirm('이 자료를 지울까요?')) return;
      submitting(b, async () => {
        const d = await api({ action: 'cx_file_delete', id: o.id, fileId: b.dataset.del });
        cxReplace(d.item); cxOpen(o.id);
      });
    });
  };
  bindFiles();
  body.querySelector('#cxUpSave').onclick = e => submitting(e.target, async () => {
    const input = $('cxUp');
    if (!input.files.length) throw new Error('올릴 파일을 선택하세요.');
    const d = await api({ action: 'cx_upload', id: o.id, files: await readFiles(input), note: $('cxUpNote').value });
    cxReplace(d.item); cxOpen(o.id); toast('자료를 올렸습니다');
  });

  const update = async fields => {
    const d = await api({ action: 'cx_update', id: o.id, fields });
    cxReplace(d.item); cxRenderList(); cxOpen(o.id);
  };
  body.querySelector('#xPlanSave').onclick = e => submitting(e.target, () => {
    const stage = segVal(body, 'stage');
    const f = { stage, ownerEmail: $('xOwner').value };
    if (stage === '반려') {
      f.rejectReasons = [...body.querySelectorAll('#rejSeg [aria-pressed="true"]')].map(b => b.dataset.r);
      if (!f.rejectReasons.length) throw new Error('반려 사유를 선택하세요.');
    }
    if (!CX.meta.closed.includes(stage)) {
      f.nextAction = $('xNext').value; f.dueDate = $('xDue').value;
      if (!f.dueDate) throw new Error('다음 연락 기한을 정해주세요. 먼 훗날이라도 날짜를 넣어야 잊지 않습니다.');
    }
    return update(f);
  });
  body.querySelector('#xLogSave').onclick = e => submitting(e.target, async () => {
    const date = $('xLogDate').value;
    if (!date) throw new Error('날짜를 선택하세요.');
    const d = await api({ action: 'cx_log', id: o.id, kind: segVal(body, 'kind'), text: $('xLog').value, at: date + ' ' + ($('xLogTime').value || '09:00') });
    cxReplace(d.item); cxRenderList(); cxOpen(o.id);
    toast(d.autoStage ? `기록 저장 · 단계가 "${d.autoStage}"(으)로 바뀌었습니다` : '기록 저장');
  });
  body.querySelector('#xEdit').onclick = () => {
    const card = $('sumCard');
    card.innerHTML = `<h4>고객 정보 수정</h4>
      <div class="f"><span class="lb">유입 경로</span><select data-k="source">${CX.meta.sources.map(x => `<option ${x === o.source ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="f"><label>성함</label><input type="text" data-k="name" value="${esc(o.name)}"></div>
      <div class="f"><label>연락처</label><input type="text" data-k="phone" value="${esc(o.phone)}" inputmode="tel"></div>
      <div class="f"><label>이메일</label><input type="text" data-k="email" value="${esc(o.email)}"></div>
      ${CX_FIELDS.map(f => cxFieldInput(f, o[f[0]])).join('')}
      <div class="actions"><button class="btn ghost" type="button" id="eCancel">취소</button><button class="btn" type="button" id="eSave">저장</button></div>`;
    bindToggleSegs(card);
    card.querySelector('#eCancel').onclick = () => cxOpen(o.id);
    card.querySelector('#eSave').onclick = e => submitting(e.target, () => update(cxReadFields(card)));
  };
  const ai = $('xAi');
  if (ai) ai.onclick = e => submitting(e.target, async () => {
    const d = await api({ action: 'cx_analyze', id: o.id });
    const out = $('aiOut'); out.hidden = false; out.textContent = d.text;
    loadLogs();
  });
  const reg = $('rSave');
  if (reg) reg.onclick = e => submitting(e.target, async () => {
    const d = await api({ action: 'cx_register_site', id: o.id, siteName: $('rName').value, codeYear: segVal(body, 'rYear'), designBy: segVal(body, 'rDesign'), architect: ($('rArch') || {}).value || '' });
    cxReplace(d.item);
    toast(`현장 ${d.code} 등록 완료 — 새로고침하면 현장 목록에 나타납니다`);
    cxRenderList(); cxOpen(o.id);
  });

  function loadLogs() {
    api({ action: 'cx_logs', id: o.id }).then(d => {
      const el = $('xLogs'); if (!el) return;
      el.innerHTML = d.items.length ? d.items.map(l => {
        const head = `<div class="log-head"><b class="log-date">${esc(l.at.slice(0, 16).replace(/-/g, '.'))}</b><span class="log-kind k-${esc(l.kind.replace(/[^\w가-힣]/g, ''))}">${esc(l.kind)}</span><span class="t">${esc(l.by)}</span></div>`;
        return l.kind === 'AI 분석'
          ? `<li>${head}<details><summary>AI 분석 결과 보기</summary><div class="content" style="margin-top:6px">${esc(l.text)}</div></details></li>`
          : `<li class="k-${esc(l.kind.replace(/[^\w가-힣]/g, ''))}">${head}<div class="content">${esc(l.text)}</div></li>`;
      }).join('') : '<li class="t">기록 없음</li>';
    }).catch(() => {});
  }
  loadLogs();
}

// ---------- 시작 ----------
if (API_URL.includes('여기에_새_배포_URL')) {
  $('loginMsg').textContent = '설치 필요: 파일 상단의 API_URL을 입력하세요.';
}
initGoogle();
if (getToken()) start();
</script>
</body>
</html>
