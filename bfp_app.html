    .actions.sticky { position: sticky; bottom: calc(-40px - env(safe-area-inset-bottom)); background: var(--bg); margin: 0 -12px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); z-index: 2; }
    .actions .btn { flex: 1 1 0; min-height: 48px; font-size: 16px; }
    .seg button { padding: 9px 14px; }
    .chip { padding: 8px 14px; }
    .sig-wrap canvas { height: 200px; }

  }

  /* ===================== PC: 왼쪽 메뉴 =====================
     마우스를 쓰는 넓은 화면(PC)에서만. 태블릿·휴대폰은 위쪽 탭 그대로. */
  @media (min-width: 1100px) and (hover: hover) and (pointer: fine) {
    :root { --side: 228px; }

      overflow-y: auto; overflow-x: hidden; z-index: 20; padding-top: 0; scrollbar-width: thin; }
    .top-row { display: contents; }                                  /* 안쪽 항목을 세로 막대에 바로 배치 */
    .brand { order: 0; padding: 22px 20px 14px; }
    .logo-mark { height: 14px; }
    .site-pick { order: 1; margin: 0 14px 10px; }
    .site-pick select { width: 100%; max-width: none; }
    .tabs-row { order: 2; max-width: none; margin: 0; flex-direction: column; flex: 1; }
    .tabs { flex-direction: column; padding: 4px 10px; gap: 2px; overflow: visible; width: auto; }
    .tab { width: 100%; justify-content: flex-start; border-radius: 8px; padding: 10px 14px; font-size: 15px; color: rgba(255,255,255,.78); }
    .tab:hover { background: rgba(255,255,255,.08); color: #fff; }

    .tab-sep { width: auto; height: 1px; margin: 10px 8px; }

      border-radius: 12px; padding: 10px 12px; }
    .dyk-text { white-space: normal; line-height: 1.45; font-size: 13px; }
    .me { order: 9; margin-top: auto; padding: 14px 20px 18px; border-top: 1px solid rgba(255,255,255,.12); flex-wrap: wrap; }
    main { margin-left: var(--side); max-width: 1640px; padding: 26px 34px 60px; }
    /* 넓어진 화면에 맞춰 표도 넓게 */
    .ca-grid { min-width: 1150px; }

  /* ===== 테마: 작업도구 (차분한 회색 메뉴 · 숲 녹색 강조) ===== */
  :root { --bg:#FFFFFF; --surface:#FFFFFF; --raise:#F7F7F5; --ink:#1F1F1E; --text:#37352F; --muted:#787774;
    --line:#383836; --line-strong:#DCDCD9; --accent:#2F5D46; --accent-soft:#2C3A32; --red:#D44C47; --red-soft:#FBECEB;
    --green:#2F5D46; --green-2:#264D3A; --green-soft:#2C3A32; --amber:#9A6A1B; --amber-soft:#3A3123; --blue:#4F4E4A; --blue-soft:#353533; --gray-soft:#353533; }
  
  body { color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); }

  body { font-size: 14.5px; }

  .site-pick::after { border-color: var(--muted); }

  .tab.ext svg { stroke: currentColor; }
  .tab-sep { background: var(--line); }
  .dyk { background: var(--raise); border-color: var(--line); color: var(--text); border-radius: 6px; }

  .f input[type=text], .f input[type=number], .f input[type=date], .f select, .f textarea, .ca-month, .ca-bulk select { border-radius: 6px; border-color: var(--line-strong); }

  .ov-card b { font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }

  @media (min-width: 1100px) and (hover: hover) and (pointer: fine) {

    .me { border-top-color: var(--line); }
  }

  /* ===== 메뉴만 어둡게 (단색, 무늬 없음) — 본문은 그대로 ===== */
  :root { --nav: #191A19; --nav-line: rgba(255,255,255,.09); --nav-text: rgba(255,255,255,.66); }

  .tab:hover { color: #fff; }
  .tab[aria-selected="true"] { color: #fff; }
  .tab[aria-selected="true"]::after { background: var(--surface); }
  .tab.ext { color: rgba(255,255,255,.42); }

  .dyk { background: rgba(255,255,255,.06); border-color: var(--nav-line); color: rgba(255,255,255,.88); }

  .dyk-tag { color: #9CC7AE; }
  @media (min-width: 1100px) and (hover: hover) and (pointer: fine) {

<script>
const GOOGLE_CLIENT_ID = '573053436430-btlompn2ojv7h4qviandnb4b9p41410j.apps.googleusercontent.com';
const TOKEN_KEY = 'bfp_app_token';
const SITE_KEY = 'bfp_app_site';
const TAB_LABEL = { all: '전체현황', cx: '고객관리', design: '설계', info: '현장정보', site: '현장관리', change: '변경요청', card: '법인카드', board: '현장재정', est: '견적기', detail: '회사디테일' };
const TAB_ORDER = ['all', 'cx', 'design', 'info', 'site', 'change', 'payreq', 'card', 'board', 'est', 'fin', 'detail', 'sikgu', 'master'];
const EXT_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

const S = { me: null, tabs: [], links: [], sites: [], tab: null, siteCode: null, siteSub: '', badges: {} };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000);
}

// ---------- 로그인 ----------
function parseJwt(t) {
  const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(atob(b).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}
function getToken() {
  const t = sessionStorage.getItem(TOKEN_KEY);
  if (!t) return '';
  try { if (Date.now() > parseJwt(t).exp * 1000 - 60000) { sessionStorage.removeItem(TOKEN_KEY); return ''; } } catch (e) { return ''; }
  return t;
}

async function api(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ idToken: getToken() }, body))
  });
  const data = await res.json();
  if (data.authError) { showLogin(data.error); throw new Error(data.error); }
  if (!data.ok) throw new Error(data.error || '요청 실패');
  return data;
}

function showLogin(msg) {
  sessionStorage.removeItem(TOKEN_KEY);
  $('appView').hidden = true;
  $('loginView').hidden = false;
  $('loginMsg').textContent = msg || '';
}

function initGoogle() {
  if (!window.google || !google.accounts) { setTimeout(initGoogle, 150); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle, auto_select: true, ux_mode: 'popup' });
  google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', width: 260 });
  if (!getToken()) google.accounts.id.prompt();
}

function onGoogle(res) {
  sessionStorage.setItem(TOKEN_KEY, res.credential);
  start();
}

async function start() {
  $('loginMsg').textContent = '확인 중...';
  $('loginMsg').style.color = 'var(--muted)';
  try {
    const d = await api({ action: 'me' });
    Object.assign(S, { me: d.user, tabs: d.tabs, links: d.links, sites: d.sites, badges: d.badges || {} });
    $('loginView').hidden = true;
    $('appView').hidden = false;
    $('loginMsg').style.color = '';
    renderShell();
  } catch (e) {
    $('loginMsg').style.color = '';
    if (!$('loginView').hidden) $('loginMsg').textContent = e.message;
  }
}

$('logoutBtn').onclick = () => {
  sessionStorage.removeItem(TOKEN_KEY);
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  location.reload();
};

// ---------- 화면 틀 ----------
function renderShell() {
  $('meName').textContent = S.me.name;
  $('meRole').textContent = S.me.roleLabel;

  // 현장 선택 — 현장코드 순 (숫자로 시작하는 코드 먼저, HQ 등은 뒤로)
  const codeKey = c => (/^\d/.test(c) ? '0' : '1') + c;
  S.sites.sort((a, b) => codeKey(a.code).localeCompare(codeKey(b.code)));
  const saved = localStorage.getItem(SITE_KEY);
  S.siteCode = (S.sites.find(s => s.code === saved) || S.sites[0] || {}).code || null;
  $('sitePick').innerHTML = S.sites.length
    ? S.sites.map(s => `<option value="${esc(s.code)}">${esc(s.code)} ${esc(s.name)}${s.status === '시공중' ? '' : ' · ' + esc(s.status)}</option>`).join('')
    : '<option>볼 수 있는 현장이 없습니다</option>';
  $('sitePick').value = S.siteCode || '';
  $('sitePick').onchange = () => { S.siteCode = $('sitePick').value; localStorage.setItem(SITE_KEY, S.siteCode); DS.site = null; DS.plan = null; DS.items = []; RP.site = null; RP.items = []; RP.stat = null; OV.site = null; SI.site = null; SC.site = null; SC.cond = null; SC.tasks = []; PF.site = null; PF.d = null; ST.site = null; ST.d = null; renderTab(); };

  // 설계 → 현장관리 → 입금요청 → 변경요청 → 식구 순 (고객관리는 계약 전 단계라 맨 앞)
  $('tabs').innerHTML = TAB_ORDER.map(key => {
    if (S.tabs.includes(key)) return `<button class="tab" role="tab" data-tab="${key}">${TAB_LABEL[key]}<i class="tab-badge" data-badge="${key}" ${S.badges[key] ? '' : 'hidden'}>${S.badges[key] || ''}</i></button>`;
    const l = S.links.find(x => x.key === key);
    return l ? `<a class="tab ext" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}${EXT_ICON}</a>` : '';
  }).join('');
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => selectTab(b.dataset.tab));

  selectTab(S.tabs.includes(S.tab) ? S.tab : S.tabs[0]);
  if (S.tabs.includes('cx') && !CX.loaded) cxLoad().then(() => { if (S.tab === 'cx') cxRenderList(); }).catch(() => {});
  dykLoad();
}

function selectTab(t) {
  S.tab = t;
  $('tabs').querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('sitePickWrap').hidden = ['cx', 'all', 'detail', 'card', 'board', 'est'].includes(t);
  renderTab();
}

function currentSite() { return S.sites.find(s => s.code === S.siteCode); }

function renderTab() {
  const fab = $('crFab'); if (fab) fab.hidden = S.tab !== 'change';
  if (S.tab === 'all') return renderAllTab();
  if (S.tab === 'info') return renderInfoTab();
  if (S.tab === 'detail') return renderDetailTab();
  if (S.tab === 'card') return renderCardTab();
  if (S.tab === 'board') return renderBoardTab();
  if (S.tab === 'est') return renderEstTab();
  if (S.tab === 'design') return renderDesignTab();
  if (S.tab === 'site') return renderSiteTab();
  if (S.tab === 'change') return renderChangeTab();
  if (S.tab === 'cx') return renderCxTab();
}

// ---------- 재정 메뉴 (현장재정 보드 · 견적기) ----------
// 화면 파일은 서버가 권한 확인 후 내려주고, 여기서는 iframe 안에 그대로 띄운다 (다크 테마·데이터 주입)
const FB = { board: null, est: null, boardHtml: '', estHtml: '' };
function fbDoc(html, data) {
  let h = html.replace(/<html(\s[^>]*)?>/i, '<html data-theme="dark">');
  const inject = `<script>window.BFP_DATA=${data ? JSON.stringify(data).replace(/<\//g, '<\\/') : 'null'};<\/script>
<style>:root{color-scheme:dark}:root[data-theme="dark"]{--bg:#262624;--panel:#2D2D2B;--line:#3A3937;--track:#3A3937}body{background:var(--bg)}</style>`;
  return /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, m => m + inject) : inject + h;
}
function setBadge(key, n) {
  S.badges[key] = n;
  const b = document.querySelector(`[data-badge="${key}"]`); if (!b) return;
  b.hidden = !n; b.textContent = n || '';
}
function fbFrame(doc) {
  $('main').innerHTML = '<iframe class="fb-frame" id="fbFrame" title="재정 화면"></iframe>';
  const f = $('fbFrame');
  const fit = () => { if (!document.body.contains(f)) { window.removeEventListener('resize', fit); return; }
    f.style.height = Math.max(420, window.innerHeight - f.getBoundingClientRect().top - 12) + 'px'; };
  window.addEventListener('resize', fit); fit();
  f.srcdoc = doc;
}
async function renderBoardTab() {
  if (!FB.board) {
    $('main').innerHTML = '<div class="loading">현장재정 보드를 불러오는 중...</div>';
    try { const d = await api({ action: 'fb_board' }); FB.board = d.data; FB.boardHtml = d.html; setBadge('board', (d.data.alerts || []).length); }
    catch (e) { $('main').innerHTML = `<div class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</div>`; return; }
    if (S.tab !== 'board') return;
  }
  if (!FB.board.sites.length) { $('main').innerHTML = '<div class="panel empty"><h3>볼 수 있는 현장이 없습니다</h3>담당 현장이 마스터에 등록되어 있는지 확인해 주세요.</div>'; return; }
  fbFrame(fbDoc(FB.boardHtml, FB.board));
}
async function renderEstTab() {
  if (!FB.estHtml) {
    $('main').innerHTML = '<div class="loading">현장 견적기를 불러오는 중...</div>';
    try { const d = await api({ action: 'fb_est' }); FB.estHtml = d.html; }
    catch (e) { $('main').innerHTML = `<div class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</div>`; return; }
    if (S.tab !== 'est') return;
  }
  fbFrame(fbDoc(FB.estHtml, null));
}

// ---------- Did you know ----------
const DYK = { items: [], i: 0, timer: null };
async function dykLoad() {
  if (S.me.role === 'client') return;
  try {
    const d = await api({ action: 'dyk' });
    DYK.items = d.items || [];
    if (!DYK.items.length) return;
    $('dyk').hidden = false;
    DYK.i = 0; dykShow();
    clearInterval(DYK.timer);
    DYK.timer = setInterval(() => { DYK.i = (DYK.i + 1) % DYK.items.length; dykShow(); }, 7000);
  } catch (e) {}
}
function dykShow() {
  const el = $('dykText'), it = DYK.items[DYK.i];
  el.classList.add('fade');

// ---------- 현장관리 ----------
function toPy(m2) { return Math.round(m2 / 3.3058 * 10) / 10; }
function fmtNum(n) { return (Math.round(n * 10) / 10).toLocaleString('ko-KR'); }
function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function progressHtml(s) {
  if (!s.startDate || !s.endDate) {
    return s.status === '시공중' ? '<div class="progress"><div class="progress-top"><span>공정률</span><span>착공일·준공예정일이 입력되면 자동 계산됩니다</span></div></div>' : '';
  }
  const total = dayDiff(s.startDate, s.endDate);
  const done = dayDiff(s.startDate, today());
  const pct = total > 0 ? Math.max(0, Math.min(100, Math.round(done / total * 100))) : 0;
  const left = dayDiff(today(), s.endDate);
  const label = done < 0 ? `착공 D-${-done}` : left >= 0 ? `착공 D+${done} · 준공까지 ${left}일` : `준공예정 ${-left}일 경과`;
  return `<div class="progress"><div class="progress-top"><span>${esc(label)}</span><b>${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function contractPy(a) {
  if (!a) return 0;
  const v = x => Number(x) || 0;
  return v(a.house) + (v(a.attic) + v(a.parking) + v(a.basement)) * 0.5;
}

function siteSummaryHtml(s) {
  const floorTotal = (s.floorAreas || []).reduce((t, f) => t + (Number(f.area) || 0), 0);
  const floors = [s.floorsAbove ? `지상 ${s.floorsAbove}층` : '', s.floorsBelow ? `지하 ${s.floorsBelow}층` : '', s.attic ? '다락' : ''].filter(Boolean).join(' · ');
  const cp = contractPy(s.area);
  const facts = [
    ['유형 · 구조', [s.houseType, s.struct].filter(Boolean).join(' · ') || '—', floors],
    ['연면적', floorTotal ? `${fmtNum(floorTotal)}㎡` : '—', floorTotal ? `${fmtNum(toPy(floorTotal))}평` + ((s.floorAreas || []).length ? ' · ' + s.floorAreas.map(f => f.name).join('/') : '') : ''],
    ['대지면적', s.landArea ? `${fmtNum(s.landArea)}㎡` : '—', s.landArea ? `${fmtNum(toPy(s.landArea))}평` : ''],
    ['담당 소장', s.manager || '—', ''],
    ['공사 기간', s.startDate ? `${s.startDate} ~` : (s.plannedStart ? `착공 예정 ${s.plannedStart}` : '—'), s.endDate ? `준공 예정 ${s.endDate}` : ''],
    ['입주 희망', s.moveIn || '—', ''],
    ['부대시설', (s.facilities || []).join(', ') || '—', '']
  ];
  if (S.me.role !== 'client') {
    facts.push(['건축주', s.owner || '—', s.ownerPhone || '']);
    facts.push(['설계', s.designBy === '건축사사무소' ? (s.architect || '건축사사무소') : (s.designBy ? '사람사는집 자체 설계' : '—'), cp ? `계약 ${fmtNum(cp)}평` : '']);
    facts.push(['NAS 폴더', s.nasFolder || '—', '']);
  }
  // 4칸 단위로 채우기
  while (facts.length % 4) facts.push(['', '', '']);

  return `<section class="panel">
      <div class="site-head">
        <div class="site-title">
          <span class="code">${esc(s.code)}</span>
          <h2>${esc(s.name)}</h2>
          <span class="pill ${esc(s.status)}">${esc(s.status)}</span>
          ${s.problem ? '<span class="pill problem">문제 현장</span>' : ''}
        </div>
        ${s.address ? `<div class="addr">${esc(s.address)}</div>` : ''}
        ${s.problem ? `<div class="problem-note">${esc(s.problemReason)}</div>` : ''}
      </div>
      ${progressHtml(s)}
      <dl class="facts">
        ${facts.map(f => `<div class="fact${f[0] ? '' : ' blank'}"><dt>${esc(f[0])}</dt><dd>${f[0] ? esc(f[1]) : ''}${f[2] ? `<small>${esc(f[2])}</small>` : ''}</dd></div>`).join('')}
      </dl>
    </section>`;
}

      <button type="button" class="panel ov-card ov-click" id="ovCrCard"><span class="cr-id">진행 중 변경요청</span><b class="${crTotal ? 'warn' : ''}">${crTotal}건</b>

  $('main').querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { infoSec = b.dataset.sec; renderInfoTab(); });

  if (infoSec === '우리 집 이야기') {
    const el = $('infoBody');
    try { await stLoad(s.code); } catch (e) { el.innerHTML = `<section class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</section>`; return; }
    if (S.tab !== 'info' || S.siteCode !== s.code || infoSec !== '우리 집 이야기') return;
    stRender(el);
    return;
  }

  if (infoSec === '성능 · Passport') {
    const el = $('infoBody'); el.id = 'pfSection';
    try { await pfLoad(s.code); } catch (e) { el.innerHTML = `<section class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</section>`; return; }
    if (S.tab !== 'info' || S.siteCode !== s.code || infoSec !== '성능 · Passport') return;
    pfRender(el);
    return;
  }

  $('infoBody').innerHTML = '<div id="siBody"><div class="loading">선정 소재를 불러오는 중...</div></div>';
  if (SI.site !== s.code) {
    try {
      const d = await api({ action: 'si_list', siteCode: s.code });
      Object.assign(SI, { site: s.code, items: d.items, groups: d.groups, statuses: d.statuses, canEdit: d.canEdit });
    } catch (e) { if ($('siBody')) $('siBody').innerHTML = `<section class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</section>`; return; }
    if (S.tab !== 'info' || S.siteCode !== s.code) return;
  }
  siRender();
}

function siRender() {
  const el = $('siBody'); if (!el) return;
  const groups = Object.keys(SI.groups);
  const list = SI.items.filter(o => SI.group === '전체' || o.group === SI.group);
  const done = SI.items.filter(o => o.status === '확정' || o.status === '발주' || o.status === '시공완료').length;
  el.innerHTML = `
    <div class="cr-bar"><h2 style="font-size:17px">선정 소재 <span class="cr-sub" style="font-weight:500">${SI.items.length ? `확정 ${done}/${SI.items.length}` : ''}</span></h2>
      <button class="btn ghost" type="button" id="siPrint">🖨 인쇄</button>
      ${SI.canEdit ? '<button class="btn" type="button" id="siNew">+ 소재 추가</button>' : ''}</div>
    <div class="filters">${['전체', ...groups].map(g => `<button class="chip" data-g="${esc(g)}" aria-pressed="${SI.group === g}">${esc(g)}<b>${g === '전체' ? SI.items.length : SI.items.filter(o => o.group === g).length}</b></button>`).join('')}</div>
    ${list.length ? groups.filter(g => list.some(o => o.group === g)).map(g => `
      <section class="panel" style="margin-bottom:12px">
        <div class="ds-phase">${esc(g)}</div>
        <div class="si-grid">${list.filter(o => o.group === g).map(o => `
          <button type="button" class="si-card" data-id="${esc(o.id)}">
            <span class="si-img" data-sid="${esc(o.id)}" data-pid="${esc((o.photos[0] || {}).id || '')}">${o.photos.length ? '' : '<i>사진 없음</i>'}</span>
            <span class="si-txt"><span class="cr-id">${esc(o.part)}</span><b>${esc(o.product)}</b>
              <span class="cr-sub">${esc([o.brand, o.model, o.color].filter(Boolean).join(' · '))}</span>
              <span class="st si-st ${esc(o.status)}">${esc(o.status)}</span></span>
          </button>`).join('')}</div>
      </section>`).join('') : `<section class="panel empty"><h3>등록된 소재가 없습니다</h3>${SI.canEdit ? '[+ 소재 추가]로 외장재·창호·바닥재 등 선정한 제품을 기록하세요.' : '설계팀이 선정한 소재가 여기에 표시됩니다.'}</section>`}`;
  el.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { SI.group = b.dataset.g; siRender(); });
  el.querySelectorAll('.si-card').forEach(b => b.onclick = () => siOpen(b.dataset.id));
  el.querySelectorAll('.si-img[data-pid]').forEach(im => { if (im.dataset.pid) siPhotoUrl(im.dataset.sid, im.dataset.pid, true).then(u => im.style.backgroundImage = `url("${u}")`).catch(() => {}); });
  if ($('siNew')) $('siNew').onclick = () => siForm(null);
  $('siPrint').onclick = siPrint;
}

const SI_URL = {};
async function siPhotoUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (SI_URL[k]) return SI_URL[k];
  const d = await api({ action: 'si_photo', id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return SI_URL[k] = URL.createObjectURL(new Blob([arr], { type: d.type }));
}

function siOpen(id) {
  const o = SI.items.find(x => x.id === id); if (!o) return;
  const body = openSheet(esc(o.product), `${esc(o.group)} · ${esc(o.part)}`, `
    ${o.photos.length ? `<div class="card"><div class="thumbs">${o.photos.map(p => `<button type="button" class="thumb" data-p="${esc(p.id)}"></button>`).join('')}</div></div>` : ''}
    <div class="card"><dl class="kv">
      <dt>제품명</dt><dd>${esc(o.product)}</dd><dt>브랜드</dt><dd>${esc(o.brand || '—')}</dd>
      <dt>모델·품번</dt><dd>${esc(o.model || '—')}</dd><dt>색상</dt><dd>${esc(o.color || '—')}</dd>
      <dt>상태</dt><dd>${esc(o.status)}${o.confirmedAt ? ' · ' + esc(o.confirmedAt) + ' 확정' : ''}</dd>
      ${o.note ? `<dt>메모</dt><dd class="content">${esc(o.note)}</dd>` : ''}
      <dt>수정</dt><dd>${esc(o.by)} · ${esc(o.updatedAt)}</dd>
    </dl></div>
    ${SI.canEdit ? '<div class="actions"><button class="btn danger" type="button" id="siDel">삭제</button><button class="btn" type="button" id="siEdit">수정</button></div>' : ''}`);
  const ids = o.photos.map(p => p.id);
  body.querySelectorAll('[data-p]').forEach((b, i) => {
    siPhotoUrl(o.id, b.dataset.p, true).then(u => b.style.backgroundImage = `url("${u}")`).catch(() => {});
    b.onclick = () => lightbox(ids, i, fid => siPhotoUrl(o.id, fid, false).then(url => ({ url })));
  });
  if ($('siEdit')) $('siEdit').onclick = () => siForm(o);
  if ($('siDel')) $('siDel').onclick = e => { if (confirm(`${o.product}을(를) 삭제할까요?`)) submitting(e.target, async () => {
    await api({ action: 'si_delete', id: o.id }); SI.items = SI.items.filter(x => x.id !== o.id); closeSheet(); siRender(); toast('삭제했습니다');
  }); };
}

function siForm(o) {
  const g0 = o ? o.group : Object.keys(SI.groups)[0];
  const body = openSheet(o ? '소재 수정' : '소재 추가', esc(currentSite().code + ' ' + currentSite().name), `
    <div class="card">
      <div class="f"><span class="lb">공간</span>${segHtml('sg', Object.keys(SI.groups), g0)}</div>
      <div class="f"><label>부위</label><select id="sPart"></select></div>
      <div class="f"><label>제품명</label><input type="text" id="sProduct" value="${esc(o ? o.product : '')}" placeholder="예: 세라믹 사이딩"></div>
      <div class="cx-when"><div class="f"><label>브랜드</label><input type="text" id="sBrand" value="${esc(o ? o.brand : '')}"></div>
        <div class="f"><label>모델·품번</label><input type="text" id="sModel" value="${esc(o ? o.model : '')}"></div></div>
      <div class="f"><label>색상</label><input type="text" id="sColor" value="${esc(o ? o.color : '')}" placeholder="예: 세이지 그린 / 월넛"></div>
      <div class="f"><span class="lb">상태</span>${segHtml('ss', SI.statuses, o ? o.status : '검토중')}</div>
      <div class="f"><label>메모</label><textarea id="sNote" rows="2" placeholder="시공 시 주의, 대체품 등">${esc(o ? o.note : '')}</textarea></div>
    </div>
    <div class="card"><h4>사진 (샘플·카탈로그·시공 예)</h4>
      ${o && o.photos.length ? `<div class="thumbs" id="sOld">${o.photos.map(p => `<div class="thumb-wrap"><button type="button" class="thumb" data-p="${esc(p.id)}"></button><button type="button" class="thumb-x" data-rm="${esc(p.id)}">×</button></div>`).join('')}</div>` : ''}
      <div class="f" style="margin-top:10px"><input type="file" id="sPhotos" multiple accept="image/*"></div></div>
    <div class="actions sticky"><button class="btn ghost" type="button" id="sClose">닫기</button><button class="btn" type="button" id="sSave">저장</button></div>`);
  const fillParts = g => { $('sPart').innerHTML = (SI.groups[g] || []).map(p => `<option ${o && o.part === p ? 'selected' : ''}>${esc(p)}</option>`).join(''); };
  fillParts(g0);
  bindSegs(body, (n, v) => { if (n === 'sg') fillParts(v); });
  const removed = [];
  body.querySelectorAll('#sOld [data-p]').forEach(b => siPhotoUrl(o.id, b.dataset.p, true).then(u => b.style.backgroundImage = `url("${u}")`).catch(() => {}));
  body.querySelectorAll('#sOld [data-rm]').forEach(b => b.onclick = () => { removed.push(b.dataset.rm); b.closest('.thumb-wrap').remove(); });
  $('sClose').onclick = closeSheet;
  $('sSave').onclick = e => submitting(e.target, async () => {
    const d = await api({ action: 'si_save', siteCode: currentSite().code, id: o ? o.id : '', removePhotos: removed,
      photos: await readFiles($('sPhotos')),
      fields: { group: segVal(body, 'sg'), part: $('sPart').value, product: $('sProduct').value, brand: $('sBrand').value,
        model: $('sModel').value, color: $('sColor').value, status: segVal(body, 'ss'), note: $('sNote').value } });
    const i = SI.items.findIndex(x => x.id === d.item.id);
    if (i >= 0) SI.items[i] = d.item; else SI.items.push(d.item);
    closeSheet(); siRender(); toast('저장했습니다');
  });
}

async function siPrint() {
  const s = currentSite();
  const w = window.open('', '_blank'); if (!w) { toast('팝업을 허용해 주세요'); return; }
  const rows = [];

    rows.push(`<tr><td>${esc(g)}</td><td>${esc(o.part)}</td><td class="im">${img}</td><td><b>${esc(o.product)}</b><br>${esc([o.brand, o.model].filter(Boolean).join(' · '))}</td><td>${esc(o.color)}</td><td>${esc(o.status)}</td><td>${esc(o.note)}</td></tr>`);

  w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>선정 소재 ${esc(s.code)}</title><style>
    body{font-family:"Malgun Gothic",sans-serif;font-size:12px;color:#262626;padding:24px}h1{font-size:18px;margin:0 0 4px;color:#000000;border-top:3px solid #000000;padding-top:10px}
    .sub{color:#8C8C88;margin-bottom:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px 8px;vertical-align:middle}th{background:#F5F5F3;color:#000000}
    td.im{width:80px}td.im img{width:72px;height:72px;object-fit:cover;display:block}button{margin-bottom:12px;padding:9px 20px;background:#000000;color:#fff;border:0;border-radius:6px}@media print{button{display:none}}
  </style></head><body><button onclick="window.print()">인쇄</button><h1>선정 소재 목록</h1><div class="sub">${esc(s.code)} ${esc(s.name)} · (주)사람사는집종합건설</div>
    <table><tr><th>공간</th><th>부위</th><th>사진</th><th>제품</th><th>색상</th><th>상태</th><th>메모</th></tr>${rows.join('') || '<tr><td colspan="7">등록된 소재 없음</td></tr>'}</table></body></html>`);
  w.document.close();
}

// ---------- 회사 디테일 도면 ----------
const DT = { items: [], cats: [], canEdit: false, loaded: false, cat: '전체', q: '' };

async function renderDetailTab() {
  if (!DT.loaded) {
    $('main').innerHTML = '<div class="loading">디테일 도면을 불러오는 중...</div>';
    try { const d = await api({ action: 'dt_list' }); Object.assign(DT, { items: d.items, cats: d.cats, canEdit: d.canEdit, loaded: true }); }
    catch (e) { $('main').innerHTML = `<div class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</div>`; return; }
    if (S.tab !== 'detail') return;
  }
  $('main').innerHTML = `
    <div class="cr-bar"><h2>회사 디테일</h2>${DT.canEdit ? '<button class="btn" type="button" id="dtNew">+ 디테일 추가</button>' : ''}</div>
    <div class="f"><input type="text" id="dtQ" placeholder="디테일 검색 (예: 창호, 기밀, 처마)" value="${esc(DT.q)}"></div>
    <div class="filters">${['전체', ...DT.cats].map(c => { const n = c === '전체' ? DT.items.length : DT.items.filter(o => o.cat === c).length; return (n || c === '전체' || c === DT.cat) ? `<button class="chip" data-c="${esc(c)}" aria-pressed="${DT.cat === c}">${esc(c)}<b>${n}</b></button>` : ''; }).join('')}</div>
    <div id="dtList"></div>`;
  dtList();
  $('dtQ').oninput = () => { DT.q = $('dtQ').value; dtList(); };
  $('main').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { DT.cat = b.dataset.c; renderDetailTab(); });
  if ($('dtNew')) $('dtNew').onclick = () => dtForm(null);
}

function dtList() {
  const q = DT.q.trim().toLowerCase();
  const list = DT.items.filter(o => (DT.cat === '전체' || o.cat === DT.cat) && (!q || [o.title, o.desc, o.cat, o.id].join(' ').toLowerCase().includes(q)));
  $('dtList').innerHTML = list.length ? `<div class="dt-grid">${list.map(o => `
    <button type="button" class="dt-card" data-id="${esc(o.id)}">
      <span class="dt-img" data-did="${esc(o.id)}" data-fid="${esc((o.files.find(f => f.type.startsWith('image/')) || o.files[0] || {}).id || '')}"></span>
      <span class="dt-txt"><span class="cr-id">${esc(o.id)} · ${esc(o.cat)}${o.rev ? ' · ' + esc(o.rev) : ''}</span><b>${esc(o.title)}</b>
        <span class="cr-sub">도면 ${o.files.length}장</span></span>
    </button>`).join('')}</div>`
    : `<section class="panel empty"><h3>디테일 도면이 없습니다</h3>${DT.canEdit ? '[+ 디테일 추가]로 부위별 표준 디테일을 올려주세요.' : '설계팀이 올린 표준 디테일이 여기에 표시됩니다.'}</section>`;
  $('dtList').querySelectorAll('.dt-card').forEach(b => b.onclick = () => dtOpen(b.dataset.id));
  $('dtList').querySelectorAll('.dt-img').forEach(im => { if (im.dataset.fid) dtFileUrl(im.dataset.did, im.dataset.fid, true).then(u => im.style.backgroundImage = `url("${u.url}")`).catch(() => {}); });
}

const DT_URL = {};
async function dtFileUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (DT_URL[k]) return DT_URL[k];
  const d = await api({ action: 'dt_file', id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return DT_URL[k] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
}

function dtOpen(id) {
  const o = DT.items.find(x => x.id === id); if (!o) return;
  const imgs = o.files.filter(f => f.type.startsWith('image/'));
  const docs = o.files.filter(f => !f.type.startsWith('image/'));
  const body = openSheet(esc(o.title), `${esc(o.id)} · ${esc(o.cat)}${o.rev ? ' · ' + esc(o.rev) : ''}`, `
    ${imgs.map((f, i) => `<div class="card dt-full"><img alt="" data-i="${i}" data-f="${esc(f.id)}"><div class="hint">누르면 크게 · 두 손가락으로 확대</div></div>`).join('')}
    ${docs.length ? `<div class="card"><h4>PDF·도면 파일</h4>${docs.map(f => `<button type="button" class="btn ghost dt-doc" data-f="${esc(f.id)}" style="margin:0 6px 6px 0">📄 ${esc(f.name)}</button>`).join('')}</div>` : ''}
    ${o.desc ? `<div class="card"><h4>설명·주의사항</h4><div class="content">${esc(o.desc)}</div></div>` : ''}
    <div class="hint" style="margin-bottom:10px">최종 수정 ${esc(o.by)} · ${esc(o.updatedAt)}</div>
    <div class="actions">${DT.canEdit ? '<button class="btn danger" type="button" id="dtDel">삭제</button><button class="btn ghost" type="button" id="dtEdit">수정</button>' : ''}<button class="btn" type="button" id="dtPrint">🖨 인쇄</button></div>`);
  body.querySelectorAll('.dt-full img').forEach(im => {
    dtFileUrl(o.id, im.dataset.f, false).then(u => im.src = u.url).catch(() => {});
    im.onclick = () => lightbox(imgs.map(f => f.id), Number(im.dataset.i), fid => dtFileUrl(o.id, fid, false));
  });
  body.querySelectorAll('.dt-doc').forEach(b => b.onclick = async () => {
    try { const u = await dtFileUrl(o.id, b.dataset.f, false); const a = document.createElement('a'); a.href = u.url; a.target = '_blank'; a.download = u.name; document.body.appendChild(a); a.click(); a.remove(); }
    catch (e) { toast(e.message); }
  });
  $('dtPrint').onclick = () => dtPrint(o);
  if ($('dtEdit')) $('dtEdit').onclick = () => dtForm(o);
  if ($('dtDel')) $('dtDel').onclick = e => { if (confirm(`${o.title} 디테일을 삭제할까요?`)) submitting(e.target, async () => {
    await api({ action: 'dt_delete', id: o.id }); DT.items = DT.items.filter(x => x.id !== o.id); closeSheet(); renderDetailTab(); toast('삭제했습니다');
  }); };
}

async function dtPrint(o) {
  const w = window.open('', '_blank'); if (!w) { toast('팝업을 허용해 주세요'); return; }

    body{font-family:"Malgun Gothic",sans-serif;color:#262626;padding:20px;margin:0}.head{border-top:3px solid #000000;padding-top:8px;display:flex;justify-content:space-between;align-items:baseline}
    h1{font-size:17px;margin:0}.meta{font-size:11px;color:#8C8C88}.desc{font-size:12px;white-space:pre-wrap;margin:8px 0;padding:8px;background:#F5F5F3}

  w.document.close();
}

    <div class="card">
      <div class="f"><span class="lb">분류</span>${segHtml('dc', DT.cats, o ? o.cat : (DT.cat !== '전체' ? DT.cat : DT.cats[0]))}</div>

      <div class="f"><label>Rev</label><input type="text" id="dRev" value="${esc(o ? o.rev : '')}" placeholder="예: Rev.2 (2026.09)"></div>
      <div class="f"><label>설명·주의사항</label><textarea id="dDesc" rows="4" placeholder="현장에서 꼭 지켜야 할 순서·자재·치수">${esc(o ? o.desc : '')}</textarea></div>
    </div>
    <div class="card"><h4>도면 파일 (이미지·PDF)</h4>
      ${o && o.files.length ? `<div class="hint" id="dOld">${o.files.map(f => `<span class="tag" style="margin:0 6px 6px 0;display:inline-block">${esc(f.name)} <button type="button" data-rm="${esc(f.id)}" style="border:0;background:none;cursor:pointer">×</button></span>`).join('')}</div>` : ''}
      <div class="f" style="margin-top:10px"><input type="file" id="dFiles" multiple accept="image/*,.pdf"></div>
      <div class="hint">현장에서 휴대폰으로 보기 좋도록 이미지(JPG·PNG)를 권장합니다. PDF도 올릴 수 있습니다.</div></div>
    <div class="actions sticky"><button class="btn ghost" type="button" id="dClose">닫기</button><button class="btn" type="button" id="dSave">저장</button></div>`);
  bindSegs(body);
  const removed = [];
  body.querySelectorAll('#dOld [data-rm]').forEach(b => b.onclick = () => { removed.push(b.dataset.rm); b.parentNode.remove(); });
  $('dClose').onclick = closeSheet;
  $('dSave').onclick = e => submitting(e.target, async () => {
    const input = $('dFiles');
    const files = [];
    for (const f of Array.from(input.files)) {   // 도면은 원본 해상도 유지 (축소하지 않음)
      if (f.size > 15 * 1024 * 1024) throw new Error(f.name + ': 15MB 이하만 올릴 수 있습니다.');
      files.push(await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ name: f.name, type: f.type || 'application/octet-stream', data: String(r.result).split(',')[1] }); r.onerror = rej; r.readAsDataURL(f); }));
    }
    const d = await api({ action: 'dt_save', id: o ? o.id : '', files, removeFiles: removed,
      fields: { cat: segVal(body, 'dc'), title: $('dTitle').value, rev: $('dRev').value, desc: $('dDesc').value } });
    const i = DT.items.findIndex(x => x.id === d.item.id);
    if (i >= 0) DT.items[i] = d.item; else DT.items.push(d.item);
    closeSheet(); renderDetailTab(); toast('저장했습니다');
  });
}

// ---------- 공정표 ----------
const SC = { site: null, cond: null, tasks: [], meta: null, canEdit: false, loading: false, view: 'all', month: '' };
try { SC.view = localStorage.getItem('bfp_sc_view') === 'month' ? 'month' : 'all'; } catch (e) {}
const SC_DOW = ['일', '월', '화', '수', '목', '금', '토'];
function scCls(t) { return t.status === '완료' ? 'done' : (t.end < today() ? 'late' : t.status === '진행중' ? 'doing' : ''); }
function scAddDays(d, n) { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return ymd(x); }

// 1안 전체공정: 첨부 공사일정표처럼 하루 한 칸, 월·일·요일·일수 머리글 + 공종별 막대
function scGridHtml(ts, print) {
  const first = ts[0].start, last = ts.reduce((m, t) => t.end > m ? t.end : m, ts[0].end);
  const n = dayDiff(first, last) + 1, days = [];
  for (let i = 0; i < n; i++) { const d = new Date(scAddDays(first, i) + 'T00:00:00'); days.push({ s: ymd(d), d: d.getDate(), w: d.getDay(), m: d.getMonth() + 1, y: d.getFullYear() }); }
  const months = []; days.forEach(x => { const k = `${x.y}-${x.m}`; const m = months[months.length - 1]; if (m && m.k === k) m.n++; else months.push({ k, label: `${x.m}월`, n: 1 }); });
  const dc = x => (x.w === 0 ? 'sc-we sc-sun' : x.w === 6 ? 'sc-we sc-sat' : '') + (x.s === today() && !print ? ' sc-tdy' : '');
  const head = `<thead>
    <tr><th class="sc-h" rowspan="4">공종</th>${months.map(m => `<th colspan="${m.n}">${m.label}</th>`).join('')}</tr>
    <tr>${days.map(x => `<th class="sc-d ${dc(x)}">${x.d}</th>`).join('')}</tr>
    <tr>${days.map(x => `<th class="sc-d ${dc(x)}">${SC_DOW[x.w]}</th>`).join('')}</tr>
    <tr>${days.map((x, i) => `<th class="sc-d ${dc(x)}">${i + 1}</th>`).join('')}</tr></thead>`;
  let ph = '';
  const body = ts.map(t => {
    const a = dayDiff(first, t.start), len = dayDiff(t.start, t.end) + 1, cls = scCls(t);
    const cells = [];
    for (let i = 0; i < a; i++) cells.push(`<td class="sc-d ${dc(days[i])}"></td>`);
    cells.push(`<td class="sc-span" colspan="${len}" data-tid="${esc(t.id)}" title="${esc(t.name)} ${esc(t.start)}~${esc(t.end)}"><i class="${cls}">${t.progress > 0 && t.progress < 100 ? `<b style="width:${t.progress}%"></b>` : ''}</i><em>${esc(t.name)}${t.owner ? ' · ' + esc(t.owner) : ''} (${t.days}일)</em></td>`);
    for (let i = a + len; i < n; i++) cells.push(`<td class="sc-d ${dc(days[i])}"></td>`);
    const phRow = t.phase !== ph ? (ph = t.phase, `<tr class="sc-ph"><td class="sc-h">${esc(t.phase)}</td><td colspan="${n}"></td></tr>`) : '';
    return phRow + `<tr><td class="sc-h" data-tid="${esc(t.id)}">${esc(t.name)}</td>${cells.join('')}</tr>`;
  }).join('');
  return `<section class="panel sc-wrap"><table class="sc-grid">${head}<tbody>${body}</tbody></table>
    <div class="sc-legend"><span><i></i>예정</span><span><i style="background:var(--amber)"></i>진행중</span><span><i style="background:var(--gray)"></i>완료</span><span><i style="background:var(--red)"></i>지연</span><span>회색 칸 = 주말</span></div></section>`;
}

// 2안 월별: 구글 캘린더처럼 달력 칸에 공종을 띠로 올린다
function scMonthHtml(ts, print) {
  const first = ts[0].start, last = ts.reduce((m, t) => t.end > m ? t.end : m, ts[0].end);
  const ym = s => s.slice(0, 7);
  if (!SC.month || SC.month < ym(first) || SC.month > ym(last)) SC.month = (today() >= first && today() <= last) ? ym(today()) : ym(first);
  const [Y, M] = SC.month.split('-').map(Number);
  const m0 = new Date(Y, M - 1, 1), m1 = new Date(Y, M, 0);
  const gridStart = scAddDays(ymd(m0), -m0.getDay());
  const weeks = []; for (let w = 0; ; w++) { const ws = scAddDays(gridStart, w * 7); if (ws > ymd(m1)) break; weeks.push(ws); }
  const prev = ymd(new Date(Y, M - 2, 1)), next = ymd(new Date(Y, M, 1));
  const weekHtml = weeks.map(ws => {
    const we = scAddDays(ws, 6);
    const segs = ts.filter(t => t.start <= we && t.end >= ws).map(t => {
      const s = t.start < ws ? ws : t.start, e = t.end > we ? we : t.end;
      return { t, c0: dayDiff(ws, s), c1: dayDiff(ws, e), cont: t.start < ws, more: t.end > we };
    }).sort((a, b) => a.c0 - b.c0 || (b.c1 - b.c0) - (a.c1 - a.c0));
    const lanes = []; segs.forEach(g => { let i = 0; while (lanes[i] && lanes[i] > g.c0) i++; lanes[i] = g.c1 + 1; g.lane = i; });
    const dayCells = Array.from({ length: 7 }, (_, i) => { const d = scAddDays(ws, i); const dd = new Date(d + 'T00:00:00');
      const out = dd.getMonth() + 1 !== M, cls = [out ? 'out' : '', i === 0 ? 'we sun' : i === 6 ? 'we sat' : '', d === today() && !print ? 'tdy' : ''].join(' ');
      return `<div class="sc-day ${cls}"><b>${dd.getDate()}${!out && dd.getDate() === 1 ? '일' : ''}</b></div>`; }).join('');
    const chips = segs.map(g => `<span class="sc-chip ${scCls(g.t)} ${g.cont ? 'cont' : ''} ${g.more ? 'more' : ''}" data-tid="${esc(g.t.id)}"
      style="left:calc(${g.c0 / 7 * 100}% + 2px);width:calc(${(g.c1 - g.c0 + 1) / 7 * 100}% - 4px);top:${24 + g.lane * 21}px" title="${esc(g.t.name)} ${esc(g.t.start)}~${esc(g.t.end)}">${g.cont ? '' : ''}${esc(g.t.name)}</span>`).join('');
    return `<div class="sc-week" style="min-height:${Math.max(84, 28 + lanes.length * 21)}px">${dayCells}${chips}</div>`;
  }).join('');
  return `<section class="panel">
    <div class="sc-cal-top"><h3>${Y}년 ${M}월</h3>${print ? '' : `<span class="nav">
      <button type="button" data-mv="${prev.slice(0, 7)}" ${prev.slice(0, 7) < ym(first) ? 'disabled' : ''}>‹ 이전 달</button>
      <button type="button" data-mv="${(today() >= first && today() <= last ? today() : first).slice(0, 7)}">이번 달</button>
      <button type="button" data-mv="${next.slice(0, 7)}" ${next.slice(0, 7) > ym(last) ? 'disabled' : ''}>다음 달 ›</button></span>`}</div>
    <div class="sc-cal">${SC_DOW.map((d, i) => `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`).join('')}${weekHtml}</div></section>`;
}

async function scLoad(code) {
  if (SC.site === code || SC.loading) return;
  SC.loading = true;
  try {
    const d = await api({ action: 'sc_get', siteCode: code });
    Object.assign(SC, { site: code, cond: d.cond, tasks: d.tasks, canEdit: d.canEdit,
      meta: { template: d.template, options: d.options, statuses: d.statuses, structs: d.structs } });
  } finally { SC.loading = false; }
}

function scDday(t) {
  if (t.status === '완료') return { cls: '', text: '완료' };
  const d = dayDiff(today(), t.end);
  if (t.start > today()) return { cls: '', text: `D-${dayDiff(today(), t.start)}` };
  if (d < 0) return { cls: 'over', text: `${-d}일 지연` };
  return { cls: d <= 2 ? 'today' : '', text: `D-${d}` };
}

function scRender(el) {
  if (!SC.cond || !SC.tasks.length) return scCreateForm(el);
  const ts = SC.tasks;
  const total = ts.reduce((s, t) => s + t.days, 0);
  const doneDays = ts.reduce((s, t) => s + t.days * (t.progress / 100), 0);
  const pct = total ? Math.round(doneDays / total * 100) : 0;
  const late = ts.filter(t => t.status !== '완료' && t.end < today());
  const now = ts.filter(t => t.status === '진행중' || (t.status === '예정' && t.start <= today() && t.end >= today()));
  const next = ts.filter(t => t.status === '예정' && t.start > today()).slice(0, 3);
  const first = ts[0].start, last = ts.reduce((m, t) => t.end > m ? t.end : m, ts[0].end);
  const span = Math.max(1, dayDiff(first, last));
  const months = [];
  for (let d = new Date(first + 'T00:00:00'); ymd(d) <= last; d.setMonth(d.getMonth() + 1)) {
    const m0 = new Date(d.getFullYear(), d.getMonth(), 1), m1 = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    const s = ymd(m0) < first ? first : ymd(m0), e = ymd(m1) > last ? last : ymd(m1);
    months.push({ label: (d.getMonth() + 1) + '월', left: dayDiff(first, s) / span * 100, width: Math.max(0.5, (dayDiff(s, e) + 1) / span * 100) });
  }
  const todayLeft = today() >= first && today() <= last ? dayDiff(first, today()) / span * 100 : null;

  el.innerHTML = `
    <div class="cr-bar"><h2 style="font-size:17px">공정표 <span class="cr-sub" style="font-weight:500">${esc(first)} ~ ${esc(last)}</span></h2>
      <span class="sc-view" role="group" aria-label="보기 방식">
        <button type="button" data-v="all" aria-pressed="${SC.view === 'all'}">전체공정</button>
        <button type="button" data-v="month" aria-pressed="${SC.view === 'month'}">월별</button></span>
      <button class="btn ghost" type="button" id="scPrint">🖨 인쇄</button>
      ${SC.canEdit ? '<button class="btn ghost" type="button" id="scShift">이후 공정 순연</button>' : ''}
      ${S.me.role === 'admin' ? '<button class="btn ghost" type="button" id="scReset">다시 만들기</button>' : ''}</div>

    <section class="panel ds-time">
      <div class="ds-time-top">
        <div><span class="cr-id">공정 진행률 (소요일 기준)</span><div class="ds-now">${pct}%</div></div>
        <div class="ds-counts">${late.length ? `<span class="ds-late"><b>${late.length}</b> 지연</span>` : ''}
          <span class="cr-sub">완료 ${ts.filter(t => t.status === '완료').length}/${ts.length}</span></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="ds-next">${now.length ? `진행 중 · <b>${esc(now.map(t => t.name).join(', '))}</b>` : next.length ? `다음 · <b>${esc(next[0].name)}</b> ${esc(next[0].start.slice(5).replace('-', '/'))} 시작` : '모든 공정 완료'}</div>
    </section>

    ${SC.view === 'month' ? scMonthHtml(ts) : scGridHtml(ts)}

    <section class="panel">
      ${(() => { let ph = ''; return ts.map(t => {
        const dd = scDday(t);
        const head = t.phase !== ph ? (ph = t.phase, `<div class="ds-phase">${esc(t.phase)}</div>`) : '';
        return head + `<button class="cr-row sc-item ${t.status !== '완료' && t.end < today() ? 'urgent' : ''}" data-id="${esc(t.id)}">
          <span class="cr-id">${esc(t.start.slice(5).replace('-', '/'))} ~ ${esc(t.end.slice(5).replace('-', '/'))} · ${t.days}일${t.owner ? ' · ' + esc(t.owner) : ''}</span>
          <span class="cr-title ${t.status === '완료' ? 'done' : ''}">${esc(t.name)}</span>
          ${t.note ? `<span class="cr-sub">${esc(t.note)}</span>` : ''}
          <span class="cr-right"><span class="st ${t.status === '완료' ? '완료' : dd.cls === 'over' ? '반려' : ''}">${t.status === '완료' ? '완료' : t.progress ? t.progress + '%' : dd.text}</span></span>
        </button>`; }).join(''); })()}
    </section>`;

  el.querySelectorAll('.sc-item, .sc-row, [data-tid]').forEach(b => b.onclick = () => scTaskForm(b.dataset.id || b.dataset.tid));
  el.querySelectorAll('.sc-view button').forEach(b => b.onclick = () => { SC.view = b.dataset.v; try { localStorage.setItem('bfp_sc_view', SC.view); } catch (e) {} scRender(el); });
  el.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { SC.month = b.dataset.mv; scRender(el); });
  if ($('scShift')) $('scShift').onclick = scShiftForm;
  if ($('scReset')) $('scReset').onclick = () => { if (confirm('공정표를 지우고 다시 만들까요? 입력한 진행 상황도 함께 지워집니다.')) { SC.cond = null; SC.tasks = []; scRender(el); } };
  $('scPrint').onclick = scPrint;
}

    owner: $('tOwner').value, note: $('tNote').value }, extra) }, {}));

    const d = await send(); SC.tasks = d.tasks; closeSheet(); renderSiteTab();

// ---------- 주택 성능 · Passport ----------
const PF = { site: null, d: null, loading: false, tab: '성능 요약' };
const PF_U_LIMIT = { '지붕': 0.150, '외벽': 0.170, '최하층바닥': 0.220, '창호': 1.000, '현관문': 1.400 };

function pfAirGrade(v) {
  v = Number(v);
  if (!(v > 0)) return null;
  return v <= 0.6 ? { t: '패시브하우스 기준 충족', c: 'best' } : v <= 1.0 ? { t: '매우 우수', c: 'good' }
    : v <= 1.5 ? { t: '우수', c: 'good' } : v <= 3.0 ? { t: '양호', c: 'ok' }
    : v <= 5.0 ? { t: '보통', c: 'ok' } : { t: '개선 필요', c: 'bad' };
}
function pfEnGrade(v) {
  if (!(v > 0)) return null;
  return v <= 90 ? { t: '패시브 수준', c: 'best' } : v <= 120 ? { t: '우수 (협회 인증 수준)', c: 'good' }
    : v <= 180 ? { t: '양호', c: 'ok' } : v <= 260 ? { t: '보통 (일반 신축 수준)', c: 'ok' } : { t: '개선 여지', c: 'bad' };
}
const PF_GAS_KWH = 10.55, PF_LPG_KWH = 13.9, PF_PE = { elec: 2.75, gas: 1.10 };

function pfEnergyStat(d) {
  const rows = d.energy || [], area = Number(d.site.area) || 0;
  if (!rows.length) return null;
  let kwh = 0, cost = 0, elec = 0, gas = 0, solar = 0;
  rows.forEach(r => {
    const g = (Number(r.gasUse) || 0) * (r.gasUnit === 'kg' ? PF_LPG_KWH : r.gasUnit === 'kWh' ? 1 : PF_GAS_KWH);
    elec += Number(r.elecKwh) || 0; gas += g; solar += Number(r.solarKwh) || 0;
    kwh += (Number(r.elecKwh) || 0) * PF_PE.elec + g * PF_PE.gas;
    cost += (Number(r.elecCost) || 0) + (Number(r.gasCost) || 0) + (Number(r.etcCost) || 0);
  });
  const m = rows.length, f = 12 / m;
  return { months: m, full: m >= 12, elecYear: Math.round(elec * f), gasYear: Math.round(gas * f), solarYear: Math.round(solar * f),
    costYear: Math.round(cost * f), costMonth: Math.round(cost / m),
    primary: area > 0 ? Math.round(kwh * f / area) : 0, area };
}

async function pfLoad(code) {
  if (PF.site === code || PF.loading) return;
  PF.loading = true;
  try { PF.d = await api({ action: 'pf_get', siteCode: code }); PF.site = code; }
  finally { PF.loading = false; }
}

function pfRender(el) {
  const d = PF.d; if (!d) return;
  const tabs = d.isClient ? ['성능 요약', '에너지 사용'] : ['성능 요약', '외피 구성', '기밀 테스트', '에너지 사용'];
  if (!tabs.includes(PF.tab)) PF.tab = '성능 요약';
  el.innerHTML = `<div class="subnav">${tabs.map(t => `<button class="chip" data-pf="${esc(t)}" aria-pressed="${PF.tab === t}">${esc(t)}</button>`).join('')}</div>
    <div id="pfBody"></div>`;
  el.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { PF.tab = b.dataset.pf; pfRender(el); });
  const body = $('pfBody');
  if (PF.tab === '성능 요약') pfSummary(body);
  else if (PF.tab === '외피 구성') pfEnvList(body);
  else if (PF.tab === '기밀 테스트') pfAirList(body);
  else pfEnergyList(body);
}

        <div class="pf-metric ${ag ? ag.c : ''}">
          <span class="cr-id">기밀 성능 (ACH50)</span>
          <b>${air ? Number(air.ach50).toFixed(2) : '—'}<small>회/h</small></b>
          <span class="cr-sub">${ag ? esc(ag.t) : '미측정'}${air ? ' · ' + esc(air.date) + ' ' + esc(air.stage) : ''}</span>

        </div>
        <div class="pf-metric ${eg ? eg.c : ''}">
          <span class="cr-id">연간 1차에너지 소요량</span>
          <b>${st && st.primary ? st.primary : '—'}<small>kWh/㎡·yr</small></b>
          <span class="cr-sub">${eg ? esc(eg.t) : '데이터 부족'}${st ? ` · ${st.months}개월 기록${st.full ? '' : ' (연환산)'}` : ''}</span>
          ${st && st.primary ? pfBar(Math.min(100, st.primary / 260 * 100), eg.c, ['90', '120', '260']) : ''}
        </div>
        <div class="pf-metric">
          <span class="cr-id">월 평균 에너지 비용</span>
          <b>${st ? Math.round(st.costMonth / 1000).toLocaleString('ko-KR') : '—'}<small>천원</small></b>
          <span class="cr-sub">${st ? '연 ' + Math.round(st.costYear / 10000).toLocaleString('ko-KR') + '만원' : '기록 없음'}${st && st.solarYear ? ' · 태양광 ' + st.solarYear.toLocaleString('ko-KR') + 'kWh' : ''}</span>
        </div>
      </div>

      <h4 style="margin-top:18px">외피 열관류율 (U값, W/㎡·K)</h4>
      <div class="pf-u">${parts.map(p => {
        const e = envBy[p], u = e ? Number(e.uValue) : null, lim = PF_U_LIMIT[p];
        const pass = u !== null && u <= lim;
        return `<div class="pf-u-row ${u === null ? 'none' : pass ? 'pass' : 'over'}" ${e ? `data-env="${esc(e.id)}"` : ''}>
          <span class="pf-u-part">${esc(p)}</span>
          <span class="pf-u-val">${u !== null ? u.toFixed(3) : '—'}</span>
          <span class="pf-u-bar">${u !== null ? `<i style="width:${Math.min(100, u / (lim * 1.6) * 100)}%"></i><em style="left:${100 / 1.6}%"></em>` : ''}</span>
          <span class="pf-u-note">${u === null ? '미입력' : pass ? `기준 ${lim} 충족` : `기준 ${lim} 초과`}</span>
        </div>`;
      }).join('')}</div>
      <div class="hint">기준은 건축물 에너지절약설계기준(중부2 주거) 값입니다. 숫자가 낮을수록 단열 성능이 좋습니다.</div>

    div.className = 'pf-row';
    div.innerHTML = `<select class="pMat">${matOpts(l ? l.name : '')}</select>
      <input type="number" class="pTh" placeholder="mm" inputmode="numeric" value="${l && l.thick ? esc(l.thick) : ''}">
      <label class="check pf-wood"><input type="checkbox" class="pIn" ${l && l.inWood ? 'checked' : ''}> 구조재 사이</label>
      <button type="button" class="pf-x">×</button>`;
    $('pRows').appendChild(div);
    div.querySelector('.pf-x').onclick = () => { div.remove(); calc(); };
    div.querySelectorAll('select,input').forEach(x => { x.onchange = calc; x.oninput = calc; });
  };
  const collect = () => [...$('pRows').querySelectorAll('.pf-row')].map(r => {
    const name = r.querySelector('.pMat').value;
    const m = mats.find(x => x.name === name) || {};
    return name ? { name, thick: Number(r.querySelector('.pTh').value) || 0, k: m.k || 0, r: m.r || 0, inWood: r.querySelector('.pIn').checked ? 1 : 0 } : null;
  }).filter(Boolean);
  const RS = { '지붕': [0.10, 0.043], '외벽': [0.11, 0.043], '최하층바닥': [0.086, 0.043] };
  const calc = () => {
    const part = segVal(body, 'pPart');
    $('pWrV').textContent = $('pWr').value;
    const rs = RS[part]; if (!rs) return;
    const wr = Number($('pWr').value) / 100;
    let rI = rs[0] + rs[1], rW = rs[0] + rs[1];
    collect().forEach(l => {
      const t = l.thick / 1000, k = l.k;
      const r = k > 0 ? t / k : (l.r || 0);
      rI += r; rW += (l.inWood && k > 0) ? t / 0.13 : r;
    });
    const u = rI > 0 ? (wr > 0 ? (1 - wr) / rI + wr / rW : 1 / rI) : 0;
    const lim = PF_U_LIMIT[part];
    $('pUOut').textContent = u ? u.toFixed(3) : '—';
    $('pUNote').textContent = u ? (u <= lim ? `기준 ${lim} 충족` : `기준 ${lim} 초과`) : '';
    $('pUOut').className = u && u <= lim ? 'ok' : 'warn';
  };
  const onPart = () => {
    const part = segVal(body, 'pPart');
    const direct = ['창호', '현관문'].includes(part);
    $('pDirect').hidden = !direct; $('pLayers').hidden = direct;
    if (!direct) calc();
  };
  bindSegs(body, onPart);
  (o && o.layers && o.layers.length ? o.layers : [null, null]).forEach(addRow);
  $('pAdd').onclick = () => addRow(null);
  $('pWr').oninput = calc;
  onPart();
  $('pClose').onclick = closeSheet;
  if ($('pDel')) $('pDel').onclick = e => { if (confirm(`${o.part} 구성을 삭제할까요?`)) submitting(e.target, async () => {
    const r = await api({ action: 'pf_delete', kind: 'env', id: o.id, siteCode: d.site.code });
    PF.d.env = r.env; closeSheet(); renderInfoTab(); toast('삭제했습니다');
  }); };
  $('pSave').onclick = e => submitting(e.target, async () => {
    const part = segVal(body, 'pPart');
    const r = await api({ action: 'pf_env_save', siteCode: d.site.code, id: o ? o.id : '', fields: {
      part, note: $('pNote').value, woodRatio: Number($('pWr').value) / 100,
      uValue: $('pU').value, layers: ['창호', '현관문'].includes(part) ? [] : collect() } });
    PF.d.env = r.env; closeSheet(); renderInfoTab(); toast('저장했습니다');
  });
}

const PF_URL = {};
async function pfFileUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (PF_URL[k]) return PF_URL[k];
  const d = await api({ action: 'pf_file', siteCode: PF.site, id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return PF_URL[k] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
}

// ---------- 우리 집 이야기 ----------
const ST = { site: null, d: null, loading: false };

async function stLoad(code) {
  if (ST.site === code || ST.loading) return;
  ST.loading = true;
  try { ST.d = await api({ action: 'st_get', siteCode: code }); ST.site = code; }
  finally { ST.loading = false; }
}

const stN = (v, d) => {
  const n = Number(v) || 0;
  return d ? n.toLocaleString('ko-KR', { maximumFractionDigits: d }) : Math.round(n).toLocaleString('ko-KR');
};

function stQtyForm() {
  const d = ST.d, q = d.qty || {}, m = d.story.mat;
  const row = (k, label, unit, est, ph) => `<div class="st-q">
    <label>${label}</label>
    <input type="number" id="q_${k}" step="0.1" inputmode="decimal" value="${q[k] === '' || q[k] === undefined ? '' : esc(q[k])}" placeholder="${ph || ('추정 ' + (Math.round(est * 10) / 10))}">
    <span>${unit}</span></div>`;
  const body = openSheet('자재 물량 입력', esc(d.story.site.code + ' ' + d.story.site.name), `
    <div class="card">
      <div class="hint">비워 두면 연면적·구조로 계산한 <b>추정값</b>이 쓰입니다. 실제 발주량을 넣으면 그 값으로 바뀌고 "추정" 표시가 사라집니다.</div>
      <div style="margin-top:12px">
        ${row('wood', '목재', '㎥', m.wood.v)}
        ${row('concrete', '콘크리트', '㎥', m.concrete.v)}
        ${row('rebar', '철근', '톤', m.rebar.v)}
        ${row('insul', '단열재', '㎥', m.insul.v)}
        ${row('windowN', '창·문 개수', '개', m.windowN.v)}
        ${row('windowA', '창호 면적', '㎡', m.windowA.v)}
        ${row('roofA', '지붕 면적', '㎡', m.roofA.v)}
        ${row('wallA', '외벽 면적', '㎡', m.wallA.v)}
        ${row('tile', '타일', '㎡', 0, '선택')}
      </div>
      <div class="f" style="margin-top:12px"><label>그 밖에 기록하고 싶은 것</label><input type="text" id="q_etc" value="${esc(q.etc || '')}" placeholder="예: 못 42,000개 · 실란트 86통"></div>
      <div class="f"><label>메모</label><input type="text" id="q_note" value="${esc(q.note || '')}" placeholder="산출 근거, 발주서 기준 등"></div>
    </div>
    <div class="actions sticky"><button class="btn ghost" type="button" id="qClose">닫기</button><button class="btn" type="button" id="qSave">저장</button></div>`);
  $('qClose').onclick = closeSheet;
  $('qSave').onclick = e => submitting(e.target, async () => {
    const f = {};
    ['wood', 'concrete', 'rebar', 'insul', 'windowN', 'windowA', 'roofA', 'wallA', 'tile'].forEach(k => f[k] = $('q_' + k).value);
    f.etc = $('q_etc').value; f.note = $('q_note').value;
    const r = await api({ action: 'st_save', siteCode: d.story.site.code, fields: f });
    ST.d.story = r.story; ST.d.qty = r.qty; closeSheet(); renderInfoTab(); toast('저장했습니다');
  });
}

const CA = { items: [], kinds: [], trades: [], cards: [], months: [], month: '', filter: '전체', canAll: false, loaded: false, sel: {}, view: 'sheet', siteTab: '*', colf: {}, sum: null, docLimit: 100000 };

async function renderCardTab() {
  if (!CA.loaded || CA.reload) {
    $('main').innerHTML = '<div class="loading">카드 내역을 불러오는 중...</div>';
    try {
      const d = await api({ action: 'ca_list', month: '', status: '' });
      Object.assign(CA, { items: d.items, kinds: d.kinds, trades: d.trades || [], cards: d.cards, months: d.months, canAll: d.canAll, docLimit: d.docLimit || 100000, loaded: true, reload: false });
      if (!CA.month) CA.month = '*';   // 기본은 전체 기간
    } catch (e) { $('main').innerHTML = `<div class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</div>`; return; }
    if (S.tab !== 'card') return;
  }
  if (CA.view !== 'list') return caRenderSheet();
  const rows = CA.items.filter(caInPeriod);
  const noSite = rows.filter(o => !o.siteCode);
  const lacks = rows.filter(caLacks);
  const FILTERS = { '전체': rows, '현장 미지정': noSite, '증빙 미비': lacks };
  if (!FILTERS[CA.filter]) CA.filter = '전체';
  const list = FILTERS[CA.filter];
  const sum = a => a.reduce((t, o) => t + (Number(o.amount) || 0), 0);
  const selIds = Object.keys(CA.sel).filter(k => CA.sel[k]);

  $('main').innerHTML = `
    <div class="cr-bar"><h2>법인카드</h2>
      ${caPeriodSelect()}
      <button class="btn ghost" type="button" id="caSum">시트로 보기</button>
      ${CA.canAll ? `<button class="btn ghost" type="button" id="caPaste">이용내역 불러오기</button>` : ''}
      <button class="btn ghost" type="button" id="caAdd">+ 직접 입력</button></div>

    <div class="ov-cards">
      <button type="button" class="panel ov-card ov-click" data-f="전체"><span class="cr-id">${esc(caPeriodLabel())} 합계</span>
        <b>${won(sum(rows))}</b><span class="cr-sub">${rows.length}건</span></button>
      <button type="button" class="panel ov-card ov-click" data-f="현장 미지정"><span class="cr-id">현장 미지정</span>
        <b class="${noSite.length ? 'warn' : ''}">${noSite.length}건</b><span class="cr-sub">${won(sum(noSite))}</span></button>
      <button type="button" class="panel ov-card ov-click" data-f="증빙 미비"><span class="cr-id">10만원 이상 증빙·공종 미비</span>
        <b class="${lacks.length ? 'warn' : ''}">${lacks.length}건</b><span class="cr-sub">${won(sum(lacks))}</span></button>
    </div>

    <div class="filters">${Object.keys(FILTERS).map(f => {
      const n = FILTERS[f].length;
      return `<button class="chip ${f !== '전체' && n ? 'warn' : ''}" data-f="${esc(f)}" aria-pressed="${CA.filter === f}">${esc(f)}<b>${n}</b></button>`;
    }).join('')}</div>

    ${list.length ? `<div class="ca-all"><label><input type="checkbox" id="caAll" ${selIds.length && selIds.length === list.length ? 'checked' : ''}>
      화면에 보이는 ${list.length}건 모두 선택</label></div>` : ''}

    ${selIds.length ? `<div class="ca-bulk"><b>${selIds.length}건 선택</b>
      <select id="caBulkSite"><option value="">현장 유지</option>${S.sites.map(s => `<option value="${esc(s.code)}">${esc(s.code)} ${esc(s.name)}</option>`).join('')}</select>
      <select id="caBulkKind"><option value="">분류 유지</option>${CA.kinds.map(k => `<option>${esc(k)}</option>`).join('')}</select>
      <select id="caBulkTrade"><option value="">공종 유지</option>${CA.trades.map(t => `<option>${esc(t)}</option>`).join('')}</select>
      <button class="btn" type="button" id="caBulkGo">지정</button>
      <button class="btn ghost" type="button" id="caBulkClear">해제</button>
      ${CA.canAll ? `<button class="btn ghost danger" type="button" id="caBulkDel">삭제</button>` : ''}</div>` : ''}

    <section class="panel">
      ${list.length ? list.map(o => `<div class="cr-row ca-row" data-id="${esc(o.id)}">
          <input type="checkbox" class="ca-chk" data-id="${esc(o.id)}" ${CA.sel[o.id] ? 'checked' : ''}>
          <span class="cr-title">${esc(o.store || '가맹점 미상')}<span class="ca-amt ${o.amount < 0 ? 'minus' : ''}">${won(o.amount)}</span></span>
          <span class="cr-sub"><span class="ca-when">${esc(String(o.paidAt).slice(5, 10).replace('-', '/'))}</span>
            <span class="ca-who">${esc(o.owner || '미매칭')}</span>
            ${o.kind ? `<span class="tag">${esc(o.kind)}</span>` : '<span class="tag warn-tag">분류 없음</span>'}
            ${o.trade ? `<span class="tag">${esc(o.trade)}</span>` : (caBig(o) ? '<span class="tag warn-tag">공종 필요</span>' : '')}
            ${caBig(o) && !(o.files || []).length ? '<span class="tag warn-tag">증빙 필요</span>' : ''}
            ${o.siteCode ? `<span class="code">${esc(o.siteCode)}</span>` : '<span class="tag warn-tag">현장 없음</span>'}
            ${o.memo ? '<span class="ca-memo">' + esc(o.memo) + '</span>' : ''}${(o.files || []).length ? ' 📎' : ''}</span>
        </div>`).join('')
        : `<div class="empty"><h3>${CA.filter === '전체' ? '내역이 없습니다' : '정리할 내역이 없습니다'}</h3>
           ${CA.filter === '전체' ? '카드 결제 문자가 오면 자동으로 여기에 쌓입니다.' : ''}</div>`}
    </section>`;

  $('caMonth').onchange = e => { CA.month = e.target.value; CA.sel = {}; renderCardTab(); };
  $('caAdd').onclick = caAddForm;
  if ($('caPaste')) $('caPaste').onclick = caPasteForm;
  $('caSum').onclick = () => { CA.view = 'sheet'; CA.sel = {}; renderCardTab(); };
  $('main').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { CA.filter = b.dataset.f; CA.sel = {}; renderCardTab(); });
  $('main').querySelectorAll('.ca-row').forEach(b => b.onclick = e => { if (e.target.classList.contains('ca-chk')) return; caOpen(b.dataset.id); });
  $('main').querySelectorAll('.ca-chk').forEach(c => c.onchange = () => { CA.sel[c.dataset.id] = c.checked; renderCardTab(); });
  if ($('caBulkClear')) $('caBulkClear').onclick = () => { CA.sel = {}; renderCardTab(); };
  if ($('caAll')) $('caAll').onchange = e => {
    CA.sel = {};
    if (e.target.checked) list.forEach(o => { CA.sel[o.id] = true; });
    renderCardTab();
  };
  if ($('caBulkDel')) $('caBulkDel').onclick = e => {
    if (!confirm(`선택한 ${selIds.length}건을 지웁니다. 되돌릴 수 없습니다.`)) return;
    submitting(e.target, async () => {
      const d = await api({ action: 'ca_bulk_delete', ids: selIds, month: '' });
      CA.items = d.items; if (d.months) CA.months = d.months; CA.sel = {};
      renderCardTab(); toast(`${d.removed}건 지웠습니다`);
    });
  };
  if ($('caBulkGo')) $('caBulkGo').onclick = e => {
    const site = $('caBulkSite').value, kind = $('caBulkKind').value, trade = $('caBulkTrade').value;
    if (!site && !kind && !trade) { toast('바꿀 현장·분류·공종 중 하나를 고르세요'); return; }
    submitting(e.target, async () => {
      const d = await api({ action: 'ca_bulk', ids: selIds, siteCode: site, kind, trade, month: '' });
      CA.items = d.items; CA.sel = {}; renderCardTab(); toast(`${d.saved}건 지정했습니다`);
    });
  };
}

function caBig(o) { return Math.abs(Number(o.amount) || 0) >= (CA.docLimit || 100000); }
// 기간: '*' = 전체 기간, 'yyyy' = 그 해 전체, 'yyyy-MM' = 그 달
function caInPeriod(o) {
  const p = CA.month || '*';
  if (p === '*') return true;
  return String(o.paidAt).slice(0, p.length) === p;
}
function caPeriodLabel() {
  const p = CA.month || '*';
  if (p === '*') return '전체 기간';
  if (/^\d{4}$/.test(p)) return p + '년';
  return p.slice(0, 4) + '년 ' + Number(p.slice(5, 7)) + '월';
}
function caPeriodSelect() {
  const months = CA.months || [];
  const years = [...new Set(months.map(m => m.slice(0, 4)))];
  const opt = (v, t) => `<option value="${esc(v)}" ${v === (CA.month || '*') ? 'selected' : ''}>${esc(t)}</option>`;
  return `<select id="caMonth" class="ca-month" aria-label="기간">
    ${opt('*', '전체 기간')}
    ${years.length > 1 || years.length === 1 ? `<optgroup label="연도">${years.map(y => opt(y, y + '년 전체')).join('')}</optgroup>` : ''}
    <optgroup label="월">${months.map(m => opt(m, m.slice(0, 4) + '년 ' + Number(m.slice(5, 7)) + '월')).join('')}</optgroup>
  </select>`;
}
function caLacks(o) { return caBig(o) && (!o.trade || !(o.files || []).length); }

// ---------- 시트 화면 (엑셀처럼 칸을 바로 고치면 저장) ----------
// ---------- 엑셀식 열 필터 ----------
const CA_COLS = {
  kind:     { label: '분류',     val: o => o.kind || '' },
  memo:     { label: '지출내용', val: o => o.memo || '' },
  siteCode: { label: '현장',     val: o => o.siteCode || '', show: v => { const x = S.sites.find(y => y.code === v); return x ? v + ' ' + x.name : v; } },
  trade:    { label: '공종',     val: o => o.trade || '' },
  store:    { label: '가맹점',   val: o => o.store || '' },
  owner:    { label: '사용자',   val: o => o.owner || '미매칭' },
  docs:     { label: '증빙',     val: o => (o.files || []).length ? '있음' : (caBig(o) ? '필요' : '없음') },
};
function caColPass(o, except) {
  for (const k in CA.colf) {
    if (k === except || !CA.colf[k]) continue;
    if (!CA.colf[k].has(CA_COLS[k].val(o))) return false;
  }
  return true;
}
function caColActive() { return Object.keys(CA.colf).filter(k => CA.colf[k]); }
function caTh(col, cls, text) {
  const on = !!CA.colf[col];
  return `<th class="${cls}"><button type="button" class="ca-fbtn ${on ? 'on' : ''}" data-col="${col}" title="${text} 필터">${text}<i>${on ? '▼' : '▾'}</i></button></th>`;
}
function caFilterPop(btn) {
  const col = btn.dataset.col, C = CA_COLS[col];
  document.querySelectorAll('.ca-fpop').forEach(x => x.remove());
  // 다른 필터·기간·현장 탭을 통과한 줄에서 값 목록을 만듭니다 (엑셀과 같음)
  const base = caSheetRows().filter(o => caColPass(o, col))
    .filter(o => col === 'siteCode' || CA.siteTab === '*' || (o.siteCode || '') === CA.siteTab);
  const cnt = {};
  base.forEach(o => { const v = C.val(o); cnt[v] = (cnt[v] || 0) + 1; });
  const vals = Object.keys(cnt).sort((a, b) => (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b, 'ko')));
  const cur = CA.colf[col];
  const label = v => v === '' ? '(비어 있음)' : (C.show ? C.show(v) : v);
  const pop = document.createElement('div');
  pop.className = 'ca-fpop';
  pop.innerHTML = `<input type="search" class="ca-fsearch" placeholder="${esc(C.label)} 검색">
    <label class="ca-fall"><input type="checkbox" checked> <b>모두 선택</b></label>
    <div class="ca-flist">${vals.map(v => `<label data-v="${esc(v)}"><input type="checkbox" value="${esc(v)}" ${!cur || cur.has(v) ? 'checked' : ''}>
      <span>${esc(label(v))}</span><em>${cnt[v]}</em></label>`).join('')}</div>
    <div class="ca-fact"><button type="button" class="btn ghost" data-a="clear">필터 해제</button><button type="button" class="btn" data-a="ok">확인</button></div>`;
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect();
  pop.style.top = (window.scrollY + r.bottom + 4) + 'px';
  pop.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8)) + 'px';

  const boxes = () => Array.from(pop.querySelectorAll('.ca-flist label')).filter(l => !l.hidden).map(l => l.querySelector('input'));
  const all = pop.querySelector('.ca-fall input');
  const syncAll = () => { const b = boxes(); const n = b.filter(x => x.checked).length; all.checked = n === b.length; all.indeterminate = n > 0 && n < b.length; };
  syncAll();
  all.onchange = () => { boxes().forEach(x => { x.checked = all.checked; }); };
  pop.querySelectorAll('.ca-flist input').forEach(x => x.onchange = syncAll);
  const q = pop.querySelector('.ca-fsearch');
  q.oninput = () => {
    const t = q.value.trim().toLowerCase();
    pop.querySelectorAll('.ca-flist label').forEach(l => { l.hidden = t && !l.textContent.toLowerCase().includes(t); });
    // 검색하면 찾은 것만 체크된 상태로 (엑셀처럼)
    if (t) pop.querySelectorAll('.ca-flist label').forEach(l => { l.querySelector('input').checked = !l.hidden; });
    syncAll();
  };
  q.focus();
  const close = () => { pop.remove(); document.removeEventListener('mousedown', outside, true); document.removeEventListener('keydown', esc1, true); };
  const outside = e => { if (!pop.contains(e.target) && e.target !== btn) close(); };
  const esc1 = e => { if (e.key === 'Escape') close(); if (e.key === 'Enter' && document.activeElement === q) pop.querySelector('[data-a="ok"]').click(); };
  setTimeout(() => { document.addEventListener('mousedown', outside, true); document.addEventListener('keydown', esc1, true); }, 0);
  pop.querySelector('[data-a="clear"]').onclick = () => { delete CA.colf[col]; close(); CA.sel = {}; caRenderSheet(); };
  pop.querySelector('[data-a="ok"]').onclick = () => {
    const picked = Array.from(pop.querySelectorAll('.ca-flist input')).filter(x => x.checked).map(x => x.value);
    if (picked.length === vals.length) delete CA.colf[col];
    else CA.colf[col] = new Set(picked);
    close(); CA.sel = {}; caRenderSheet();
  };
}

function caDateCell(v) {
  const t = String(v || '');
  const d = (CA.month && CA.month.length === 7 ? t.slice(5, 10) : t.slice(2, 10)).replace(/-/g, '.');
  const hm = t.slice(11, 16);   // 결제 시간 (엑셀 업로드분은 00:00 → 표시 안 함)
  return hm && hm !== '00:00' ? `${d} <small>${hm}</small>` : d;
}
function caSheetRows() {
  const rows = CA.items.filter(caInPeriod);
  return rows.slice().sort((a, b) => String(a.paidAt).localeCompare(String(b.paidAt)) || String(a.id).localeCompare(String(b.id)));
}
function caSheetSites(rows) {
  const g = {};
  rows.forEach(o => { const k = o.siteCode || ''; g[k] = (g[k] || 0) + (Number(o.amount) || 0); });
  return g;
}

function caRowHtml(o) {
  const big = caBig(o);
  const nf = (o.files || []).length;
  const siteOpts = `<option value="">— 미지정</option>` + S.sites.map(x =>
    `<option value="${esc(x.code)}" ${x.code === o.siteCode ? 'selected' : ''}>${esc(x.code)} ${esc(x.name)}</option>`).join('');
  const kindOpts = (o.kind ? '' : '<option value="" selected>— 선택</option>') + CA.kinds.map(k => `<option ${k === o.kind ? 'selected' : ''}>${esc(k)}</option>`).join('');
  const tradeOpts = `<option value="">${big ? '필요' : '—'}</option>` + CA.trades.map(t => `<option ${t === o.trade ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const moved = CA.siteTab !== '*' && (o.siteCode || '') !== CA.siteTab;
  return `<tr data-id="${esc(o.id)}" class="${moved ? 'moved' : ''} ${CA.sel[o.id] ? 'sel' : ''}">
    <td class="ck"><input type="checkbox" class="ca-ck" ${CA.sel[o.id] ? 'checked' : ''} aria-label="선택"></td>
    <td class="d">${caDateCell(o.paidAt)}</td>
    <td><select data-f="kind" class="${o.kind ? '' : 'need'}">${kindOpts}</select></td>
    <td class="memo"><input data-f="memo" list="caMemoList" autocomplete="off" value="${esc(o.memo || '')}" placeholder="${esc(o.store || '')}"></td>
    <td class="r"><input data-f="amount" class="amt ${o.amount < 0 ? 'minus' : ''}" inputmode="numeric" value="${Number(o.amount || 0).toLocaleString()}"></td>
    <td><select data-f="siteCode" class="${o.siteCode ? '' : 'need'}">${siteOpts}</select>${moved ? '<small class="ca-moved">이동됨</small>' : ''}</td>
    <td><select data-f="trade" class="${big && !o.trade ? 'need' : ''}">${tradeOpts}</select></td>
    <td class="store" title="${esc(o.store || '')}">${esc(o.store || '')}</td>
    <td class="who"><select data-f="card" class="${o.owner ? '' : 'need'}" title="${esc(o.owner || '미매칭')}${o.last4 ? ' · ' + esc(o.last4) : ''}">${caCardOpts(o)}</select></td>
    <td class="c"><button type="button" class="ca-clip ${big && !nf ? 'need' : ''}" data-act="open">${nf ? '📎' + nf : (big ? '필요' : '+')}</button></td>
  </tr>`;
}

function caCardOpts(o) {
  const cur = String(o.last4 || '');
  const known = CA.cards.some(c => String(c.last4) === cur);
  return (o.owner && known ? '' : `<option value="" selected>${esc(o.owner || '미매칭')}</option>`)
    + CA.cards.map(c => `<option value="${esc(c.last4)}" ${known && String(c.last4) === cur ? 'selected' : ''}>${esc(c.owner || c.alias || '')} ${esc(c.last4)}</option>`).join('')
    + (o.owner ? '<option value="-">미매칭으로 돌리기</option>' : '');
}

function caSheetSummary() {
  const rows = caSheetRows().filter(o => caColPass(o));
  const g = caSheetSites(rows);
  const all = Object.values(g).reduce((a, b) => a + b, 0);
  const codes = Object.keys(g).filter(k => k).sort((a, b) => g[b] - g[a]);
  const tab = (key, label, amt) => `<button type="button" class="ca-tab" data-tab="${esc(key)}" aria-pressed="${CA.siteTab === key}">
      <span>${label}</span><b>${won(amt)}</b></button>`;
  $('caTabs').innerHTML = tab('*', '전체', all)
    + codes.map(c => { const x = S.sites.find(y => y.code === c); return tab(c, esc(c) + (x ? ' ' + esc(x.name) : ''), g[c]); }).join('')
    + (g[''] !== undefined ? tab('', '현장 미지정', g['']) : '');
  $('caTabs').querySelectorAll('.ca-tab').forEach(b => b.onclick = () => { CA.siteTab = b.dataset.tab; CA.sel = {}; caRenderSheet(); });
  setTimeout(() => { const c = $('caFClear'); if (c) c.onclick = () => { CA.colf = {}; CA.sel = {}; caRenderSheet(); }; }, 0);

  const vis = rows.filter(o => CA.siteTab === '*' || (o.siteCode || '') === CA.siteTab);
  const byKind = {};
  vis.forEach(o => { byKind[o.kind || '미지정'] = (byKind[o.kind || '미지정'] || 0) + (Number(o.amount) || 0); });
  const needDocs = vis.filter(caLacks).length;
  const tabSite = S.sites.find(x => x.code === CA.siteTab);
  $('caPrintTitle').textContent = `법인카드 사용내역 · ${CA.siteTab === '*' ? '전체 현장' : CA.siteTab === '' ? '현장 미지정' : CA.siteTab + (tabSite ? ' ' + tabSite.name : '')} · ${caPeriodLabel()}`
    + (caColActive().length ? ' · ' + caColActive().map(k => CA_COLS[k].label + ': ' + [...CA.colf[k]].map(v => v || '(비어 있음)').join(', ')).join(' / ') : '');
  const act = caColActive();
  const fNote = act.length ? `<span class="ca-fnote">필터: ${act.map(k => esc(CA_COLS[k].label) + ' ' + (CA.colf[k].size <= 2
      ? [...CA.colf[k]].map(v => v === '' ? '(비어 있음)' : (CA_COLS[k].show ? CA_COLS[k].show(v) : v)).map(esc).join(', ') : CA.colf[k].size + '개')).join(' · ')}
      <button type="button" class="ca-fclear" id="caFClear">필터 모두 해제 ✕</button></span>` : '';
  $('caSumLine').innerHTML = fNote + `<b>합계 ${won(vis.reduce((t, o) => t + (Number(o.amount) || 0), 0))}</b><span>${vis.length}건</span>
    ${Object.entries(byKind).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span><span class="tag">${esc(k)}</span>${won(v)}</span>`).join('')}
    ${needDocs ? `<span class="warn">10만원 이상 증빙·공종 미비 ${needDocs}건</span>` : ''}`;
}

function caRenderSheet() {
  const rows = caSheetRows().filter(o => caColPass(o));
  if (CA.siteTab !== '*' && !rows.some(o => (o.siteCode || '') === CA.siteTab)) CA.siteTab = '*';
  const vis = rows.filter(o => CA.siteTab === '*' || (o.siteCode || '') === CA.siteTab);

  $('main').innerHTML = `
    <div class="cr-bar"><h2>법인카드</h2>
      ${caPeriodSelect()}
      <button class="btn ghost" type="button" id="caList">목록 보기</button>
      ${CA.canAll ? `<button class="btn ghost" type="button" id="caPaste">이용내역 불러오기</button>` : ''}
      ${CA.canAll && CA.items.some(o => !o.siteCode) ? `<button class="btn ghost" type="button" id="caAuto">현장 자동 지정 (${CA.items.filter(o => !o.siteCode).length})</button>` : ''}
      <button class="btn ghost" type="button" id="caAdd">+ 직접 입력</button>
      <button class="btn ghost" type="button" id="caPrint">인쇄</button></div>
    <div class="ca-print-title" id="caPrintTitle"></div>
    <div class="ca-tabs" id="caTabs"></div>
    <div class="ca-sumline" id="caSumLine"></div>
    <div id="caBulkBar"></div>
    <section class="panel ca-gridwrap">
      ${vis.length ? `<table class="ca-grid">
        <thead><tr><th class="ck"><input type="checkbox" id="caCkAll" aria-label="모두 선택"></th><th class="d">일시</th>
          ${caTh('kind', 'k', '분류')}${caTh('memo', '', '지출내용')}<th class="r">금액</th>
          ${caTh('siteCode', 's', '현장')}${caTh('trade', 't', '공종')}${caTh('store', 'st0', '가맹점')}${caTh('owner', 'w', '사용자')}
          ${caTh('docs', 'c', '증빙')}</tr></thead>
        <tbody>${vis.map(caRowHtml).join('')}</tbody></table>`
        : `<div class="empty"><h3>내역이 없습니다</h3>${caColActive().length ? '필터 조건에 맞는 내역이 없습니다.' : '카드 문자가 오거나 이용내역을 불러오면 여기에 쌓입니다.'}</div>`}
    </section>
    <datalist id="caMemoList">${[...new Set(CA.items.map(o => o.memo).filter(Boolean))].slice(0, 400).map(m => `<option value="${esc(m)}">`).join('')}</datalist>

      10만원 이상은 공종과 영수증·명세서를 꼭 남겨주세요 (빠지면 빨갛게 표시됩니다).</p>`;

  caSheetSummary();
  $('caMonth').onchange = e => { CA.month = e.target.value; CA.sel = {}; renderCardTab(); };
  $('caList').onclick = () => { CA.view = 'list'; renderCardTab(); };
  if ($('caPaste')) $('caPaste').onclick = caPasteForm;
  $('caAdd').onclick = caAddForm;

    caRenderSheet();

    toast(`${d.saved}건 현장 지정${how ? ' (' + how + ')' : ''}${d.none ? ` · 담당 현장을 못 찾은 ${d.none}건은 그대로` : ''}`);
  });
