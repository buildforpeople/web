// ---------- 여러 줄 한꺼번에 (체크 → 현장·분류·공종 지정) ----------
let caLastCk = -1;
function caVisibleIds() { return Array.from(document.querySelectorAll('#main .ca-grid tbody tr')).map(tr => tr.dataset.id); }
function caBindChecks() {
  const all = $('caCkAll');
  if (all) all.onchange = () => {
    const ids = caVisibleIds();
    CA.sel = {};
    if (all.checked) ids.forEach(id => { CA.sel[id] = true; });
    caSyncChecks(); caBulkBar();
  };
  document.querySelectorAll('#main .ca-grid tbody tr').forEach(tr => caBindCheck(tr));
  caSyncChecks();
}
function caBindCheck(tr) {
  const ck = tr.querySelector('.ca-ck');
  if (!ck) return;
  ck.onclick = e => {
    const ids = caVisibleIds();
    const i = ids.indexOf(tr.dataset.id);
    if (e.shiftKey && caLastCk >= 0) {            // Shift 누르고 클릭하면 사이 줄 모두
      const [a, b] = [Math.min(caLastCk, i), Math.max(caLastCk, i)];
      for (let k = a; k <= b; k++) CA.sel[ids[k]] = ck.checked;
    } else CA.sel[tr.dataset.id] = ck.checked;
    caLastCk = i;
    caSyncChecks(); caBulkBar();
  };
}
function caSyncChecks() {
  const ids = caVisibleIds();
  document.querySelectorAll('#main .ca-grid tbody tr').forEach(tr => {
    const on = !!CA.sel[tr.dataset.id];
    tr.classList.toggle('sel', on);
    const ck = tr.querySelector('.ca-ck'); if (ck) ck.checked = on;
  });
  const n = ids.filter(id => CA.sel[id]).length;
  const all = $('caCkAll');
  if (all) { all.checked = n > 0 && n === ids.length; all.indeterminate = n > 0 && n < ids.length; }
}
function caBulkBar() {
  const box = $('caBulkBar'); if (!box) return;
  const ids = caVisibleIds().filter(id => CA.sel[id]);
  if (!ids.length) { box.innerHTML = ''; return; }
  const sum = ids.reduce((t, id) => t + (Number((CA.items.find(o => o.id === id) || {}).amount) || 0), 0);
  box.innerHTML = `<div class="ca-bulk"><b>${ids.length}건 선택 · ${won(sum)}</b>
    <select id="cbSite"><option value="">현장 유지</option>${S.sites.map(x => `<option value="${esc(x.code)}">${esc(x.code)} ${esc(x.name)}</option>`).join('')}</select>
    <select id="cbKind"><option value="">분류 유지</option>${CA.kinds.map(k => `<option>${esc(k)}</option>`).join('')}</select>
    <select id="cbTrade"><option value="">공종 유지</option>${CA.trades.map(t => `<option>${esc(t)}</option>`).join('')}</select>
    <select id="cbCard"><option value="">사용자 유지</option>${CA.cards.map(c => `<option value="${esc(c.last4)}">${esc(c.owner || c.alias || '')} ${esc(c.last4)}</option>`).join('')}<option value="-">미매칭으로 돌리기</option></select>
    <button class="btn" type="button" id="cbGo">한꺼번에 지정</button>
    <button class="btn ghost" type="button" id="cbClear">선택 해제</button>
    ${CA.canAll ? '<button class="btn ghost danger" type="button" id="cbDel">삭제</button>' : ''}</div>`;
  $('cbClear').onclick = () => { CA.sel = {}; caSyncChecks(); caBulkBar(); };
  $('cbGo').onclick = e => {
    const site = $('cbSite').value, kind = $('cbKind').value, trade = $('cbTrade').value, card = $('cbCard') ? $('cbCard').value : '';
    if (!site && !kind && !trade && !card) { toast('바꿀 현장·분류·공종·사용자 중 하나를 고르세요'); return; }
    submitting(e.target, async () => {
      const d = await api({ action: 'ca_bulk', ids, siteCode: site, kind, trade, card, month: '' });
      CA.items = d.items; CA.sel = {};
      caRenderSheet(); toast(`${d.saved}건 지정했습니다`);
    });
  };
  if ($('cbDel')) $('cbDel').onclick = e => {
    if (!confirm(`선택한 ${ids.length}건을 지웁니다. 되돌릴 수 없습니다.`)) return;
    submitting(e.target, async () => {
      const d = await api({ action: 'ca_bulk_delete', ids, month: '' });
      CA.items = d.items; if (d.months) CA.months = d.months; CA.sel = {};
      caRenderSheet(); toast(`${d.removed}건 지웠습니다`);
    });
  };
}

function caBindRows(root) { root.querySelectorAll('.ca-grid tbody tr').forEach(caBindRow); }

function caBindRow(tr) {
  const id = tr.dataset.id;
  tr.querySelectorAll('[data-f]').forEach(el => {
    el.onchange = () => caCell(id, el.dataset.f, el.value, el);
    if (el.tagName !== 'INPUT') return;
    el.onfocus = () => { if (el.dataset.f === 'amount') el.value = String(el.value).replace(/,/g, ''); el.select(); };
    el.onblur = () => { if (el.dataset.f === 'amount' && el.value) el.value = Number(String(el.value).replace(/[^\d-]/g, '') || 0).toLocaleString(); };
    el.onkeydown = e => {
      if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const rows = Array.from(document.querySelectorAll('.ca-grid tbody tr'));
        const next = rows[rows.indexOf(tr) + (e.key === 'ArrowUp' ? -1 : 1)];
        const f = el.dataset.f;
        el.blur();                                   // 바뀐 값이면 여기서 저장이 시작됩니다
        const cell = next && document.querySelector(`.ca-grid tbody tr[data-id="${CSS.escape(next.dataset.id)}"] [data-f="${f}"]`);
        if (cell) cell.focus();
      } else if (e.key === 'Escape') {
        const o = CA.items.find(x => x.id === id);
        el.value = el.dataset.f === 'amount' ? Number(o.amount || 0).toLocaleString() : (o[el.dataset.f] || '');
        el.blur();
      }
    };
  });
  tr.querySelectorAll('[data-act="open"]').forEach(b => b.onclick = () => caOpen(id));
}

async function caCell(id, field, value, el) {
  const o = CA.items.find(x => x.id === id); if (!o) return;
  const before = Object.assign({}, o);
  let v = value;
  if (field === 'amount') {
    v = Number(String(value).replace(/[^\d-]/g, ''));
    if (!v) { toast('금액을 숫자로 입력하세요'); el.value = Number(o.amount || 0).toLocaleString(); return; }
    if (v === Number(o.amount)) return;
  } else if (field === 'card') {
    if (v === '' || (String(o.last4 || '') === String(v) && o.owner)) return;
    const me = CA.cards.find(c => String(c.last4) === String(v));
    if (!CA.canAll && v !== '-' && me && S.me && me.owner !== S.me.name
        && !confirm(`${me.owner} 소장님께 넘기면 내 화면에서 사라집니다. 넘길까요?`)) { caSwapRow(id, field, 'err'); return; }
  } else if (String(o[field] == null ? '' : o[field]) === String(v)) return;

  if (field !== 'card') o[field] = v;
  el.classList.remove('saved', 'err'); el.classList.add('saving');
  try {
    const fields = {}; fields[field] = v;
    const d = await api({ action: 'ca_save', id, lite: true, remember: field === 'kind', fields });
    const kindBefore = before.kind;
    Object.assign(o, d.item);
    caSwapRow(id, field, 'saved');
    if (field === 'memo' && !kindBefore && o.kind) caFlash(id, 'kind');            // 지출내용으로 분류가 채워짐
    (d.also || []).forEach(x => {                                                  // 같은 가맹점 빈 분류도 채워짐
      const y = CA.items.find(z => z.id === x.id); if (y) Object.assign(y, x);
      caSwapRow(x.id, 'kind', 'saved');
    });
    if ((d.also || []).length) toast(`같은 가맹점 ${d.also.length}건도 ${o.kind}(으)로 채웠습니다`);
  } catch (e) {
    Object.assign(o, before);
    caSwapRow(id, field, 'err');
    toast(e.message);
  }
  caSheetSummary();
}

function caFlash(id, field) {
  const el = document.querySelector(`.ca-grid tbody tr[data-id="${CSS.escape(id)}"] [data-f="${field}"]`);
  if (!el) return; el.classList.add('saved'); setTimeout(() => el.classList.remove('saved'), 1200);
}

// 저장 결과로 그 줄만 다시 그리고, 보고 있던 칸으로 커서를 돌려놓습니다.
function caSwapRow(id, field, flash) {
  const old = document.querySelector(`.ca-grid tbody tr[data-id="${CSS.escape(id)}"]`);
  const o = CA.items.find(x => x.id === id);
  if (!old || !o) return;
  const act = document.activeElement;
  const focusF = act && old.contains(act) ? act.dataset.f : null;
  const tmp = document.createElement('tbody'); tmp.innerHTML = caRowHtml(o);
  const row = tmp.firstElementChild;
  old.replaceWith(row);
  caBindRow(row);
  caBindCheck(row);
  const cell = row.querySelector(`[data-f="${field}"]`) || row;
  cell.classList.add(flash);
  setTimeout(() => cell.classList.remove(flash), flash === 'err' ? 1600 : 900);
  if (focusF) { const f = row.querySelector(`[data-f="${focusF}"]`); if (f) f.focus(); }
}

const CA_URL = {};
async function caFileUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (CA_URL[k]) return CA_URL[k];
  const d = await api({ action: 'ca_file', id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return CA_URL[k] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
}

function caPasteForm() {
  const body = openSheet('이용내역 한꺼번에 등록', '엑셀 파일 · 표 붙여넣기 · 승인 문자 모두 됩니다', `
    <div class="card">
      <p class="hint">카드사에서 받은 <b>이용내역 엑셀 파일을 그대로 올리면</b> 됩니다. 여러 개를 한꺼번에 올려도 되고,
        날짜·가맹점·금액만 있으면 열 순서는 상관없습니다. 화면에서 복사한 표나 휴대폰 <b>승인 문자</b>를 붙여넣어도 됩니다.
        이미 들어간 건과 승인거절·머리글 줄은 알아서 걸러집니다.</p>
      <div class="f"><label>엑셀 파일 (여러 개 선택 가능)</label>
        <input type="file" id="pFiles" multiple accept=".xlsx,.xls,.csv">
        <small class="hint">카드사에서 받은 이용내역 파일을 그대로 올리세요. 소장님별 파일 5~6개를 한 번에 올려도 됩니다.</small></div>
      <div class="f"><label>또는 붙여넣기</label>
        <textarea id="pTxt" rows="12" placeholder="2026-10-26&#9;0064&#9;동천철물건재&#9;27,500&#10;2026-10-25&#9;8754&#9;한솔철물&#9;238,000&#10;&#10;— 또는 —&#10;&#10;[Web발신]&#10;NH기업0064승인&#10;공용카드&#10;27,500원 체크&#10;10/26 12:50&#10;동천철물건재"></textarea></div>
    </div>
    <div class="actions sticky"><button class="btn ghost" type="button" id="pClose">닫기</button><button class="btn" type="button" id="pGo">넣기</button></div>`);

  $('pGo').onclick = e => submitting(e.target, async () => {

    if (picked.length) {
      const files = [];
      for (const f of picked) {

      d = await api({ action: 'ca_paste', text: t, month: '' });

  });
}

// 불러오기 결과 — 무엇이 왜 빠졌는지 그대로 보여줍니다
function caImportResult(d) {
  const files = d.files && d.files.length ? d.files : [{ name: d.mode === '문자' ? '붙여넣은 문자' : '붙여넣은 표', added: d.added, dup: d.dup, skip: d.skip, details: d.details || [] }];
  const block = f => {
    const det = f.details || [];
    const dups = det.filter(x => x.type === '중복'), skips = det.filter(x => x.type === '제외'), ign = det.filter(x => x.type === '읽지 않음');
    const guess = det.filter(x => x.type === '현장 추정');
    const list = (arr, cls) => arr.length ? `<ul class="ca-res-list ${cls}">${arr.map(x =>
      `<li><span>${esc(x.text)}</span><small>${esc(x.why)}</small></li>`).join('')}</ul>` : '';
    return `<div class="card"><h4>${esc(f.name)}</h4>
      ${f.error ? `<p class="ca-res-err">읽지 못했습니다 — ${esc(f.error)}</p>` : `
      <div class="ca-res-n"><span><b>${f.added}</b>건 등록</span><span class="${f.dup ? 'w' : ''}"><b>${f.dup}</b>건 중복</span><span class="${f.skip ? 'w' : ''}"><b>${f.skip}</b>건 제외</span></div>
      ${dups.length ? '<h5>중복으로 넣지 않은 것</h5>' + list(dups, 'dup') : ''}
      ${skips.length ? '<h5>제외한 것</h5>' + list(skips, 'skip') : ''}
      ${guess.length ? '<h5>현장을 추정해서 넣은 것 — 맞는지 확인해 주세요</h5>' + list(guess, 'dup') : ''}
      ${ign.length ? '<details class="ca-res-ign"><summary>읽지 않은 줄 ' + ign.length + '개 (제목·합계 등) — 결제가 섞여 있지 않은지 확인</summary>' + list(ign, 'ign') + '</details>' : ''}`}</div>`;
  };
  const body = openSheet('불러오기 결과', `${d.added}건 등록 · 중복 ${d.dup}건 · 제외 ${d.skip}건`, `

const RP = { site: null, items: [], stat: null, meta: null, month: null, loading: false };

function rpWeatherIcon(w) { return { '맑음': '☀️', '구름': '⛅', '흐림': '☁️', '비': '🌧️', '눈': '❄️', '바람': '💨' }[w] || ''; }
function rpDow(d) { return ['일', '월', '화', '수', '목', '금', '토'][new Date(d + 'T00:00:00').getDay()]; }

async function rpLoad(code) {
  if (RP.site === code || RP.loading) return;
  RP.loading = true;
  try {
    const d = await api({ action: 'rp_list', siteCode: code });
    RP.items = d.items; RP.stat = d.stat; RP.site = code;
    if (d.meta) RP.meta = d.meta;
    if (!RP.month) RP.month = today().slice(0, 7);
  } finally { RP.loading = false; }
}

function rpRender(el) {
  const isClient = S.me.role === 'client';
  const canWrite = RP.meta.canWrite;
  const month = RP.month || today().slice(0, 7);
  const byDate = {}; RP.items.forEach(r => byDate[r.date] = r);

  // 달력
  const first = new Date(month + '-01T00:00:00');
  const startPad = first.getDay();
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < startPad; i++) cells += '<div class="rp-cell empty"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = month + '-' + String(d).padStart(2, '0');
    const r = byDate[ds];
    cells += `<button type="button" class="rp-cell ${r ? 'has' : ''} ${ds === today() ? 'today' : ''}" data-date="${ds}">
      <span class="rp-d">${d}</span>
      ${r ? `<span class="rp-mark">${r.trades.slice(0, 2).map(t => esc(t.split('/')[0])).join(', ')}${r.trades.length > 2 ? ' 외' : ''}</span>
        ${!isClient && r.people ? `<span class="rp-p">${r.people}명</span>` : ''}` : ''}
    </button>`;
  }

  const stat = RP.stat;
  const dailyKeys = stat ? Object.keys(stat.daily).sort().slice(-14) : [];
  const maxDaily = dailyKeys.length ? Math.max(...dailyKeys.map(k => stat.daily[k])) : 0;

  el.innerHTML = `
    <div class="cr-bar"><h2 style="font-size:17px">현장보고</h2>
      <button class="btn ghost" type="button" id="rpPrint">주간 인쇄</button>
      ${canWrite ? '<button class="btn" type="button" id="rpNew">+ 보고 작성</button>' : ''}</div>

    ${stat ? `<section class="panel rp-stat">
      <div><span class="cr-id">누적 투입 인원</span><b>${stat.total.toLocaleString('ko-KR')}명</b></div>
      <div><span class="cr-id">작성된 보고</span><b>${stat.reportCount}건</b></div>
      <div class="rp-spark">
        <span class="cr-id">최근 투입 인원</span>
        <div class="rp-bars">${dailyKeys.map(k => `<i style="height:${maxDaily ? Math.max(8, stat.daily[k] / maxDaily * 100) : 0}%" title="${k} ${stat.daily[k]}명"></i>`).join('')}</div>
      </div>
    </section>` : ''}

    <section class="panel rp-cal">
      <div class="rp-cal-top">
        <button type="button" class="linkish" id="rpPrev">‹ 이전달</button>
        <b>${month.replace('-', '년 ')}월</b>
        <button type="button" class="linkish" id="rpNext">다음달 ›</button>
      </div>
      <div class="rp-grid head">${['일', '월', '화', '수', '목', '금', '토'].map(d => `<div>${d}</div>`).join('')}</div>
      <div class="rp-grid">${cells}</div>
    </section>

    <section class="panel">
      ${RP.items.length ? RP.items.slice(0, 40).map(r => `
        <button class="cr-row rp-row" data-id="${esc(r.id)}">
          <span class="cr-id">${esc(r.date.slice(5).replace('-', '/'))} (${rpDow(r.date)}) ${rpWeatherIcon(r.weather)}${r.tempMin !== '' && r.tempMax !== '' ? ` ${esc(r.tempMin)}/${esc(r.tempMax)}℃` : ''}${!isClient && r.people ? ` · 인원 ${r.people}명` : ''}</span>
          <span class="cr-title">${esc(r.trades.join(' · ') || '작업 보고')}</span>
          <span class="cr-sub">${esc(r.work.map(w => (w.team ? w.team + ' ' : '') + (w.count ? w.count + '명 ' : '') + w.work.split('\\n')[0]).join(' / ').slice(0, 80))}</span>
          <span class="cr-right">${(r.photos || []).length ? `<span class="cr-sub">사진 ${r.photos.length}</span>` : ''}</span>
        </button>`).join('') : '<div class="empty"><h3>작성된 현장보고가 없습니다</h3>매일 작업 내용을 남기면 건축주와 본사가 같은 화면으로 확인합니다.</div>'}
    </section>`;

  $('rpPrev').onclick = () => { RP.month = rpShiftMonth(month, -1); rpRender(el); };
  $('rpNext').onclick = () => { RP.month = rpShiftMonth(month, 1); rpRender(el); };
  $('rpPrint').onclick = rpPrintForm;
  if ($('rpNew')) $('rpNew').onclick = () => rpForm(null, today());
  el.querySelectorAll('.rp-cell[data-date]').forEach(b => b.onclick = () => {
    const r = byDate[b.dataset.date];

  });
  el.querySelectorAll('.rp-row').forEach(b => b.onclick = () => rpOpen(b.dataset.id));
}

function rpShiftMonth(m, n) {
  const d = new Date(m + '-01T00:00:00'); d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

async function rpPhotoUrl(item, fileId) {
  if (CR.urls[fileId]) return CR.urls[fileId];
  const d = await api({ action: 'rp_photo', id: item.id, fileId });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  CR.urls[fileId] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type };
  return CR.urls[fileId];
}

// 사진은 줄인 뒤 3장씩 묶어 4개까지 동시에 올린다 (한 번에 다 보내면 1분 넘게 걸림)
async function rpUploadPhotos(input, siteCode, date, btn) {
  const picked = Array.from(input.files || []);
  if (!picked.length) return [];
  const total = picked.length; let done = 0;
  const say = t => { if (btn) btn.textContent = t; };
  say(`사진 준비 중 0/${total}`);
  const files = [];
  for (const f of picked) { files.push((await readFiles({ files: [f] }))[0]); done++; say(`사진 준비 중 ${done}/${total}`); }
  const batches = []; for (let i = 0; i < files.length; i += 3) batches.push(files.slice(i, i + 3));
  const refs = new Array(batches.length); let sent = 0, next = 0;
  say(`사진 올리는 중 0/${total}`);
  const worker = async () => {
    while (next < batches.length) {
      const i = next++;
      const d = await api({ action: 'rp_photo_up', siteCode, date, photos: batches[i] });
      refs[i] = d.photos; sent += batches[i].length; say(`사진 올리는 중 ${sent}/${total}`);
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, batches.length) }, worker));
  say('저장 중...');
  return refs.flat();
}

// ---------- 사진 확대 보기 (좌우 이동·스와이프) ----------
async function lightbox(ids, startIndex, loader) {
  if (!ids.length) return;
  let i = Math.max(0, startIndex);
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = `<button class="lb-close" type="button" aria-label="닫기">×</button>
    <button class="lb-nav prev" type="button" aria-label="이전">‹</button>
    <div class="lb-stage"><img alt=""><div class="lb-load">불러오는 중...</div></div>
    <button class="lb-nav next" type="button" aria-label="다음">›</button>
    <div class="lb-count"></div>`;
  document.body.appendChild(box);
  const img = box.querySelector('img'), load = box.querySelector('.lb-load');
  const show = async () => {
    box.querySelector('.lb-count').textContent = `${i + 1} / ${ids.length}`;
    box.querySelectorAll('.lb-nav').forEach(b => b.hidden = ids.length < 2);
    img.style.visibility = 'hidden'; load.hidden = false;
    try { const f = await loader(ids[i]); img.src = f.url; img.style.visibility = 'visible'; }
    catch (e) { load.textContent = '사진을 불러오지 못했습니다'; return; }
    load.hidden = true;
    [i - 1, i + 1].filter(n => n >= 0 && n < ids.length).forEach(n => loader(ids[n]).catch(() => {}));
  };
  const move = n => { i = (i + n + ids.length) % ids.length; show(); };
  const close = () => { box.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') move(-1); if (e.key === 'ArrowRight') move(1); };
  document.addEventListener('keydown', key);
  box.querySelector('.lb-close').onclick = close;
  box.querySelector('.prev').onclick = e => { e.stopPropagation(); move(-1); };
  box.querySelector('.next').onclick = e => { e.stopPropagation(); move(1); };
  box.onclick = e => { if (e.target === box || e.target.classList.contains('lb-stage')) close(); };
  // 모바일 스와이프
  let x0 = null, y0 = null;
  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  box.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 1 : -1);
    x0 = null;
  }, { passive: true });
  show();
}

  ['계약·착공준비', 23, 24, '조명·전열·인테리어 디자인 초안', 'work'], ['계약·착공준비', 25, 25, '인테리어 디자인 초안 송부', 'deadline'],
  ['계약·착공준비', 26, 26, '서면 피드백 1회 → 인테리어 확정', 'deadline'], ['계약·착공준비', 27, 28, '인테리어 변동 견적 조정', 'work'],
  ['계약·착공준비', 28, 28, '공사 착공', 'deadline']
];

function dsMonday(str) { const d = new Date(str + 'T00:00:00'); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return d; }
function dsAdd(d, n) { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function dsPreview(mode, baseDate) {
  const start = mode === '계약일' ? dsMonday(baseDate) : dsAdd(dsMonday(baseDate), -(DS_WEEKS - 1) * 7);
  return DS_TPL.map(t => {
    const ws = dsAdd(start, (t[1] - 1) * 7);
    const date = t[4] === 'meeting' ? dsAdd(ws, 2) : t[4] === 'deadline' ? dsAdd(dsAdd(start, (t[2] - 1) * 7), 4) : ws;
    return { phase: t[0], week: t[1], title: t[3], kind: t[4], date: ymd(date) };
  });
}
function dsDday(date) {
  if (!date) return { text: '', cls: '' };
  const d = dayDiff(today(), date);
  if (d < 0) return { text: `${-d}일 지남`, cls: 'over' };
  if (d === 0) return { text: '오늘', cls: 'today' };
  return { text: `D-${d}`, cls: '' };
}
function dsCurrent() {
  const open = DS.items.filter(i => i.status !== '완료');
  const late = open.filter(i => i.date && i.date < today());
  const next = open.filter(i => i.date && i.date >= today()).sort((a, b) => a.date.localeCompare(b.date));
  const doneCount = DS.items.filter(i => i.status === '완료').length;
  return { late, next, doneCount, total: DS.items.length };
}

async function dsLoad(code) {
  if (DS.site === code || DS.loading) return;
  DS.loading = true;
  try {
    const [meta, d] = await Promise.all([api({ action: 'ds_meta' }), api({ action: 'ds_get', siteCode: code })]);
    DS.canEdit = meta.canEdit; DS.plan = d.plan; DS.items = d.items; DS.site = code;
  } finally { DS.loading = false; }
}

const CR = { items: [], site: null, meta: null, filter: '진행중', busy: false, urls: {},
  mode: 'all', all: [], allAt: 0, allFilter: '내 차례' };
const CR_STEPS = [
  ['접수', '접수'], ['설계검토', '설계 검토'], ['견적', '견적'], ['건축주확인', '건축주 확인'],
  ['승인대기', '승인'], ['도면반영', '도면 반영'], ['현장반영', '현장 확인']
];
const CR_OPEN = ['설계검토', '견적', '건축주확인', '승인대기', '도면반영', '현장반영'];

function crWait(o) {
  return {
    설계검토: '설계팀 검토 대기', 견적: '공무 견적 대기', 건축주확인: '건축주 확인 대기',
    승인대기: o.fastTrack ? '소장 전결 승인 대기' : '대표 승인 대기', 도면반영: '설계팀 도면 반영 대기',
    현장반영: '현장 확인 대기', 완료: '완료', 반려: '반려', 취소: '취소'
  }[o.status] || o.status;
}

function crMyTurn(o) {
  const r = S.me.role, admin = r === 'admin', gm = S.me.team === '공무';
  switch (o.status) {
    case '설계검토': return admin || r === 'design';
    case '견적': return admin || gm;
    case '건축주확인': return admin || r === 'site' || gm;
    case '승인대기': return admin || (o.fastTrack && r === 'site');
    case '도면반영': return admin || r === 'design';
    case '현장반영': return admin || r === 'site';
  }
  return false;
}

function crSteps(o) {
  const skip = k => (k === '설계검토' && o.fastTrack) || (k === '견적' && (o.fastTrack || o.costType === '없음')) || (k === '도면반영' && o.drawingImpact === 'N');
  const cur = o.status === '완료' ? 99 : CR_STEPS.findIndex(s => s[0] === o.status);
  return CR_STEPS.map((s, i) => {
    let st = i === 0 || i < cur ? 'done' : i === cur ? 'cur' : '';
    if (i > 0 && skip(s[0])) st = 'skip';
    if ((o.status === '반려' || o.status === '취소') && i > 0) st = skip(s[0]) ? 'skip' : '';
    return `<div class="step ${st}">${s[1]}</div>`;
  }).join('');
}

// 금액 한글 표기: 180000 → 금 일십팔만원정
function wonKorean(n) {
  n = Math.floor(Number(n));
  if (!n || n < 0) return '';
  const digit = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const small = ['', '십', '백', '천'];
  const big = ['', '만', '억', '조'];
  let out = '', g = 0;
  while (n > 0 && g < big.length) {
    const part = n % 10000;
    if (part) {
      let t = '';
      String(part).padStart(4, '0').split('').forEach((d, i) => { if (d !== '0') t += digit[d] + small[3 - i]; });
      out = t + big[g] + out;
    }
    n = Math.floor(n / 10000); g++;
  }
  return '금 ' + out + '원정';
}
function bindWonReader(input, target) {
  const upd = () => {
    const v = Number(input.value);
    target.innerHTML = input.value && v > 0 ? `<b class="money">${v.toLocaleString('ko-KR')}원</b> · ${wonKorean(v)}` : '';
  };
  input.addEventListener('input', upd); upd();
}

function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
function crCost(o) {
  if (o.costType === '없음') return '추가비용 없음';
  if (o.amount === '' || o.amount == null) return o.costType ? (o.costType === '감액' ? '감액 (견적 전)' : '추가비용 (견적 전)') : '';
  return (o.costType === '감액' ? '감액 ' : '추가 ') + won(o.amount);
}

  if (!fab) { fab = document.createElement('button'); fab.id = 'crFab'; fab.className = 'fab'; fab.type = 'button'; fab.innerHTML = '<span aria-hidden="true" style="font-size:20px;line-height:1">+</span> 변경요청 접수'; document.body.appendChild(fab); }

// ---- 공통: 시트·폼 도구 ----
function openSheet(title, sub, body) {
  closeSheet();
  const wrap = document.createElement('div');
  wrap.id = 'sheetWrap';
  wrap.innerHTML = `<div class="scrim"></div><aside class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><div><div class="cr-id">${sub}</div><h3>${title}</h3></div><button class="x" type="button" aria-label="닫기">×</button></div>
    <div class="sheet-body">${body}</div></aside>`;
  document.body.appendChild(wrap);
  wrap.querySelector('.scrim').onclick = closeSheet;
  wrap.querySelector('.x').onclick = closeSheet;
  document.body.style.overflow = 'hidden';
  return wrap.querySelector('.sheet-body');
}
function closeSheet() { const w = $('sheetWrap'); if (w) w.remove(); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const lb = document.querySelector('.lightbox'); if (lb) lb.remove(); else closeSheet(); } });

function segHtml(name, opts, val) {
  return `<div class="seg" data-seg="${name}">${opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<button type="button" data-v="${esc(v)}" aria-pressed="${v === val}">${esc(l)}</button>`; }).join('')}</div>`;
}
function bindSegs(root, onChange) {
  root.querySelectorAll('[data-seg] button').forEach(b => b.onclick = () => {
    b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    if (onChange) onChange(b.parentNode.dataset.seg, b.dataset.v);
  });
}
function segVal(root, name) { const b = root.querySelector(`[data-seg="${name}"] [aria-pressed="true"]`); return b ? b.dataset.v : ''; }

// 이미지는 1600px JPEG로 줄여서 업로드
async function readFiles(input) {
  const out = [];
  for (const f of Array.from(input.files || [])) {
    if (f.type.startsWith('image/') && f.type !== 'image/gif') {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      out.push({ name: f.name.replace(/\.\w+$/, '') + '.jpg', type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.78).split(',')[1] });
    } else {
      if (f.size > 10 * 1024 * 1024) throw new Error(f.name + ': 10MB 이하 파일만 첨부할 수 있습니다.');
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
      out.push({ name: f.name, type: f.type || 'application/octet-stream', data });
    }
  }
  return out;
}

async function submitting(btn, fn) {
  if (CR.busy) return;
  CR.busy = true; const t = btn.textContent; btn.disabled = true; btn.textContent = '저장 중...';
  try { await fn(); } catch (e) { toast(e.message); } finally { CR.busy = false; btn.disabled = false; btn.textContent = t; }
}

    ${after.length ? `<div class="card"><h4>도면 변경 전 · 후</h4><div class="compare"><div><h5>변경 전</h5>${files(before) || '<div class="hint">첨부 없음</div>'}</div><div><h5>변경 후 · ${esc(o.drawingRev)}</h5>${files(after)}</div></div></div>`
      : before.length ? `<div class="card"><h4>변경 전 사진·도면</h4>${files(before)}</div>` : ''}
    ${others.length ? `<div class="card"><h4>기타 첨부 (견적·서명·현장 사진)</h4>${files(others)}</div>` : ''}

function crCanCancel(o) {
  if (!(S.me.role === 'admin' || o.mine)) return false;
  return o.status === '설계검토' || (o.status === '건축주확인' && (o.fastTrack || S.me.role === 'admin'));
}

async function crDo(o, payload) {
  const d = await api(Object.assign({ action: 'cr_act', id: o.id }, payload));
  const i = CR.items.findIndex(x => x.id === o.id);
  CR.items[i] = d.item;
  CR.allAt = 0;
  crRenderList();
  crOpen(o.id);
}

async function crFileUrl(o, fileId) {
  if (CR.urls[fileId]) return CR.urls[fileId];
  const d = await api({ action: 'cr_file', id: o.id, fileId });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  CR.urls[fileId] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
  return CR.urls[fileId];
}
function crThumb(o, btn) {
  if (btn.classList.contains('doc')) return;
  crFileUrl(o, btn.dataset.file).then(f => { btn.style.backgroundImage = `url("${f.url}")`; }).catch(() => {});
}
async function crViewFile(o, fileId) {
  try {
    const f = await crFileUrl(o, fileId);
    if (f.type.startsWith('image/')) {
      const imgs = (o.attachments || []).filter(x => x.type && x.type.startsWith('image/')).map(x => x.id);
      return lightbox(imgs, imgs.indexOf(fileId), id => crFileUrl(o, id));
    }
    {
      const a = document.createElement('a'); a.href = f.url; a.download = f.name; a.target = '_blank';
      document.body.appendChild(a); a.click(); a.remove();
    }
  } catch (e) { toast(e.message); }
}

// ---- 단계별 처리 폼 ----
function crActionForm(o, s, box) {
  const summary = `<div class="sum">${o.costType === '없음' ? '<b>추가비용 없음</b>' : `${o.costType === '감액' ? '감액' : '추가비용'} <b>${won(o.amount)}</b><div class="hint" style="color:var(--green)">${wonKorean(o.amount)}</div>`}</div>`;
  const noteF = (ph) => `<div class="f"><textarea class="aNote" rows="2" placeholder="${ph || '메모 (선택)'}"></textarea></div>`;
  const rejectBtn = S.me.role === 'admin' || S.me.role === 'design' ? '<button class="btn danger" type="button" data-a="reject">반려</button>' : '';
  let html = '';

  if (o.status === '설계검토') {
    html = `<h4>설계 검토</h4>

  } else if (o.status === '견적') {
    html = `<h4>견적</h4>
      <div class="f"><label>${o.costType === '감액' ? '감액 금액' : '추가 금액'} (원, VAT 포함)</label><input type="number" class="aAmount" min="0" step="1000" inputmode="numeric">
        <div class="won-read" aria-live="polite"></div></div>

      <div class="actions">${S.me.role === 'admin' ? rejectBtn : ''}<button class="btn" type="button" data-a="estimate">견적 등록</button></div>`;
  } else if (o.status === '건축주확인') {
    html = `<h4>건축주 확인</h4>${summary}
      <div class="notice">위 금액과 변경 내용을 건축주께 설명하고 서명을 받아주세요.</div>
      <div class="f"><label>건축주 이름</label><input type="text" class="aOwner" value="${esc(s.owner || '')}"></div>
      <div class="f"><span class="lb">서명</span><div class="sig-wrap"><canvas class="aSig"></canvas><span class="ph">여기에 서명</span><button type="button" class="clr">지우기</button></div></div>
      ${noteF()}
      <div class="actions"><button class="btn danger" type="button" data-a="owner_decline">건축주 미동의</button><button class="btn" type="button" data-a="owner_confirm">확인 완료</button></div>`;
  } else if (o.status === '승인대기') {
    html = `<h4>${o.fastTrack ? '소장 전결 승인' : '승인'}</h4>${summary}${noteF()}
      <div class="actions">${S.me.role === 'admin' ? rejectBtn : ''}<button class="btn" type="button" data-a="approve">${o.fastTrack && S.me.role === 'site' ? '전결 승인' : '승인'}</button></div>`;
  } else if (o.status === '도면반영') {
    html = `<h4>도면 반영</h4>
      <div class="f"><label>도면 Rev 번호</label><input type="text" class="aRev" placeholder="예: Rev.3 (전기평면도)"></div>

      ${noteF()}
      <div class="actions"><button class="btn" type="button" data-a="drawing">도면 반영 완료</button></div>`;
  } else if (o.status === '현장반영') {
    html = `<h4>현장 확인</h4>

      ${noteF()}
      <div class="actions"><button class="btn" type="button" data-a="site_done">현장 확인 완료</button></div>`;
  }
  box.innerHTML = html;
  bindSegs(box);
  if (box.querySelector('.aAmount')) bindWonReader(box.querySelector('.aAmount'), box.querySelector('.won-read'));

  // 서명 패드
  const cv = box.querySelector('.aSig');
  let signed = false;
  if (cv) {
    const ratio = window.devicePixelRatio || 1;
    const fit = () => { const r = cv.getBoundingClientRect(); cv.width = r.width * ratio; cv.height = r.height * ratio; const g = cv.getContext('2d'); g.scale(ratio, ratio); g.lineWidth = 2.4; g.lineCap = 'round'; g.strokeStyle = '#262626'; signed = false; box.querySelector('.ph').hidden = false; };
    requestAnimationFrame(fit);
    const g = () => cv.getContext('2d');
    let drawing = false;
    const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); g().beginPath(); g().moveTo(x, y); };
    cv.onpointermove = e => { if (!drawing) return; const [x, y] = pos(e); g().lineTo(x, y); g().stroke(); if (!signed) { signed = true; box.querySelector('.ph').hidden = true; } };
    cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
    box.querySelector('.clr').onclick = fit;
  }

  box.querySelectorAll('[data-a]').forEach(btn => btn.onclick = () => submitting(btn, async () => {
    const act = btn.dataset.a;

    if (act === 'review') { p.drawingImpact = segVal(box, 'dw'); p.costType = segVal(box, 'cost'); }

    if (act === 'reject' && !confirm('반려할까요?')) return;
    if (act === 'estimate') p.amount = box.querySelector('.aAmount').value;
    if (act === 'owner_confirm') {
      if (!signed) throw new Error('건축주 서명을 받아주세요.');
      p.ownerName = box.querySelector('.aOwner').value;
      const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height;
      const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(cv, 0, 0);
      p.signature = c2.toDataURL('image/png').split(',')[1];
    }
    if (act === 'owner_decline' && !confirm('건축주 미동의로 종료할까요?')) return;
    if (act === 'drawing') p.rev = box.querySelector('.aRev').value;
    if (act === 'site_done') p.drawingChecked = !!(box.querySelector('.aChk') || {}).checked;
    const fi = box.querySelector('.aFiles');
    if (fi) p.files = await readFiles(fi);
    await crDo(o, p);
  }));
}

// ---------- 고객관리 ----------
const CX = { items: [], meta: null, filter: '오늘 할 일', q: '', loaded: false };
const CX_FIELDS = [
  ['landStatus', '고객 상황', 'land'], ['situation', '현재 상황 (문의 원문)', 'text'], ['location', '현장 소재지', 'text'],
  ['landArea', '대지 면적', 'text', '㎡'], ['wantArea', '희망 건축면적', 'text', '평'], ['floors', '희망 층수', 'text'],
  ['budget', '예산', 'text'], ['houseType', '유형', 'houseType'], ['struct', '구조', 'struct'], ['exterior', '외장 스타일', 'text'],
  ['wantStart', '희망 착공 시기', 'text'], ['wantDesign', '희망 설계', 'area'], ['inquiry', '문의·특이사항', 'area']
];

function cxClosed(o) { return (CX.meta ? CX.meta.closed : ['계약완료', '반려']).includes(o.stage); }
function cxDays(o) { return Math.max(0, dayDiff(String(o.createdAt).slice(0, 10), today())); }
function cxNoContact(o) { return !cxClosed(o) && o.stage === '접수' && !o.firstContactAt; }
function cxStale(o) {
  if (cxClosed(o) || !o.lastActivityAt) return false;
  const idle = dayDiff(String(o.lastActivityAt).slice(0, 10), today());
  return idle >= (CX.meta ? CX.meta.staleDays : 14) && (!o.dueDate || o.dueDate <= today());
}
function cxOver(o) { return !cxClosed(o) && o.dueDate && o.dueDate < today(); }
function cxDue(o) {
  if (cxClosed(o) || !o.dueDate) return { cls: '', text: '' };
  const d = dayDiff(today(), o.dueDate);
  if (d < 0) return { cls: 'over', text: `${-d}일 지남` };
  if (d === 0) return { cls: 'today', text: '오늘' };
  return { cls: '', text: `D-${d}` };
}
// 1순위: 접수 후 아직 통화 못한 고객 / 2순위: 미팅 후 계약 결정 대기
function cxP1(o) { return !cxClosed(o) && ['접수', '접수(메일답장완료)'].includes(o.stage) && !o.firstContactAt; }
function cxP2(o) { return !cxClosed(o) && ['미팅완료/계약고려중', '견적중'].includes(o.stage); }
function cxTodo(o) { return cxP1(o) || cxP2(o); }
function cxUrgentCount() { return CX.items.filter(cxTodo).length; }
function cxUnit(v, unit) { return v && unit && !String(v).includes(unit) && /^[\d.~\s-]+$/.test(v) ? v + unit : v; }
function cxBadge() {
  const tab = document.querySelector('[data-tab="cx"]');
  if (!tab || !CX.loaded) return;
  const n = cxUrgentCount();
  let b = tab.querySelector('.badge');
  if (!n) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('span'); b.className = 'badge'; tab.appendChild(b); }
  b.textContent = n;
}
async function cxLoad() {
  const [meta, list] = await Promise.all([api({ action: 'cx_meta' }), api({ action: 'cx_list' })]);
  CX.meta = meta; CX.items = (list.items || []).map(cxNorm); CX.loaded = true;
  cxBadge();
}
// 서버가 첨부를 문자열로 보내도 안전하게 (옛 배포 대비)
function cxNorm(o) {
  if (!o) return o;
  if (typeof o.attachments === 'string') { try { o.attachments = JSON.parse(o.attachments || '[]'); } catch (e) { o.attachments = []; } }
  if (!Array.isArray(o.attachments)) o.attachments = [];
  return o;
}

function cxReplace(item) {
  item = cxNorm(item); const i = CX.items.findIndex(x => x.id === item.id); if (i >= 0) CX.items[i] = item; else CX.items.unshift(item); cxBadge(); }

function cxRowsHtml(list) {
  if (!list.length) return `<div class="empty"><h3>해당하는 고객이 없습니다</h3>${CX.filter === '오늘 할 일' ? '첫 통화와 계약 결정 대기 고객이 모두 처리되었습니다.' : CX.filter === '진행중' ? '홈페이지 상담 요청은 자동으로 등록됩니다.' : ''}</div>`;

function cxFilteredList() {
  const q = CX.q.trim().toLowerCase();

  return CX.items.filter(cxGroups()[CX.filter]).filter(o => !q || [o.name, o.phone, o.location, o.id].join(' ').toLowerCase().includes(q))
    .sort((a, b) => rank(a) - rank(b) || String(a.dueDate || '9999').localeCompare(String(b.dueDate || '9999')) || String(b.createdAt).localeCompare(String(a.createdAt)));

function cxGroups() {
  return {
    '오늘 할 일': cxTodo,

}

function cxFieldInput(f, v) {

async function cxFileUrl(o, fileId) {
  if (CR.urls[fileId]) return CR.urls[fileId];
  const d = await api({ action: 'cx_file', id: o.id, fileId });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  CR.urls[fileId] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
  return CR.urls[fileId];
}
function cxThumb(o, btn) {
  if (btn.classList.contains('doc')) return;

async function cxViewFile(o, fileId) {
  try {
    const f = await cxFileUrl(o, fileId);
    if (f.type.startsWith('image/')) {
      const imgs = (o.attachments || []).filter(x => x.type && x.type.startsWith('image/')).map(x => x.id);
      return lightbox(imgs, imgs.indexOf(fileId), id => cxFileUrl(o, id));
    }
    {
      const a = document.createElement('a'); a.href = f.url; a.download = f.name; a.target = '_blank';
      document.body.appendChild(a); a.click(); a.remove();
    }
  } catch (e) { toast(e.message); }
}

        <label class="check"><input type="checkbox" class="cTarget" value="진행"> 진행 중이지만 오래 기록이 없는 고객</label>
      </div>
    </div>
    <div class="card"><h4 id="cCount"></h4><div id="cList" class="cx-clean-list"></div></div>
    <div class="notice">삭제한 자료는 고객관리_DB 시트의 "삭제보관" 탭으로 옮겨져, 필요하면 되살릴 수 있습니다.</div>
    <div class="actions sticky"><button class="btn ghost" type="button" id="cClose">닫기</button><button class="btn danger" type="button" id="cDel" disabled>삭제</button></div>`);
  let targets = [];
  const refresh = () => {
    const months = Number(segVal(body, 'months'));
    const cut = new Date(); cut.setMonth(cut.getMonth() - months);
    const cutStr = ymd(cut);
    const kinds = [...body.querySelectorAll('.cTarget:checked')].map(c => c.value);
    targets = CX.items.filter(o => {
      const last = String(o.lastActivityAt || o.createdAt).slice(0, 10);
      if (!last || last >= cutStr) return false;
      if (o.stage === '반려' || o.stage === '이탈') return kinds.includes('반려');
      if (o.stage === '계약완료') return kinds.includes('계약완료') && !o.siteCode;
      return kinds.includes('진행');
    });
    $('cCount').textContent = `삭제 대상 ${targets.length}명`;
    $('cList').innerHTML = targets.length ? targets.map(o => `<div><b>${esc(o.name)}</b> <span class="cr-sub">${esc(o.stage)} · 마지막 기록 ${esc(String(o.lastActivityAt || o.createdAt).slice(0, 10))} · ${esc(o.location || '')}</span></div>`).join('') : '<div class="hint">조건에 맞는 고객이 없습니다.</div>';
    const b = $('cDel'); b.disabled = !targets.length; b.textContent = targets.length ? `${targets.length}명 삭제` : '삭제';
  };
  bindSegs(body, refresh);
  body.querySelectorAll('.cTarget').forEach(c => c.onchange = refresh);
  body.querySelector('#cClose').onclick = closeSheet;
  body.querySelector('#cDel').onclick = e => {
    if (!targets.length || !confirm(`${targets.length}명의 고객과 상담 기록을 삭제할까요?`)) return;
    submitting(e.target, async () => {
      const ids = targets.map(o => o.id);
      const d = await api({ action: 'cx_delete', ids });
      CX.items = CX.items.filter(x => !ids.includes(x.id)); cxBadge();
      closeSheet(); cxRenderList(); toast(`${d.deleted}명 삭제`);
    });
  };
  refresh();
}

function cxSiteNameGuess(loc) {
  const t = String(loc || '').split(/\s+/);
  const city = (t.find(x => /(시|군)$/.test(x) && !/(광역시|특별시|특별자치시)$/.test(x)) || t[0] || '').replace(/(광역시|특별시|특별자치시|특별자치도|도|시|군)$/, '');
  const dong = [...t].reverse().find(x => /(동|리|읍|면)$/.test(x)) || '';
  return [city, dong].filter(Boolean).join(' ');
}
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function cxOpen(id) {
  try { cxOpenInner(id); }
  catch (e) {
    const at = String(e.stack || '').split('\n')[1] || '';
    const line = (at.match(/:(\d+):\d+/) || [])[1] || '?';
    toast(`상세 오류 [${id} · ${line}행] ${e.message}`);
    console.error('cxOpen', id, e);
  }
}

function cxOpenInner(id) {
  const o = cxNorm(CX.items.find(x => x.id === id) || null);
  if (!o) return;
  const M = CX.meta || {};
  ['stages', 'actions', 'logKinds', 'sources', 'houseTypes', 'structs', 'staff', 'codeYears',
   'landStatuses', 'rejectReasons', 'dropReasons', 'starTags', 'meetingPlaces', 'closed'].forEach(k => { if (!Array.isArray(M[k])) M[k] = []; });
  if (!M.dueDays) M.dueDays = {};
  if (!M.nextDefault) M.nextDefault = {};
  if (!M.staleDays) M.staleDays = 14;
  const due = cxDue(o);
  const isAdmin = S.me.role === 'admin';
  const reasons = String(o.rejectReasons || '').split(',').map(x => x.trim()).filter(Boolean);
  const staffOpts = `<option value="">미지정</option>` + M.staff.map(s => `<option value="${esc(s.email)}" ${s.email === o.ownerEmail ? 'selected' : ''}>${esc(s.name)} (${esc(s.team)})</option>`).join('');
  const actOpts = [...new Set([...(o.nextAction && !M.actions.includes(o.nextAction) ? [o.nextAction] : []), ...M.actions])]
    .map(a => `<option ${a === o.nextAction ? 'selected' : ''}>${esc(a)}</option>`).join('');
  const warn = cxP1(o) ? `접수 후 ${cxDays(o)}일째 통화 기록이 없습니다. 통화 후 바로 아래에 기록을 남겨주세요.`
    : cxP2(o) ? `미팅·견적 후 계약 결정을 기다리는 고객입니다. 확답을 받거나 다음 연락 시점을 정해주세요.`
    : cxOver(o) ? `다음 연락 기한이 ${due.text}. 연락하고 기록을 남기거나 기한을 다시 정하세요.`
    : cxStale(o) ? `${M.staleDays}일 넘게 기록이 없습니다. 진행 상황을 확인해 주세요.` : '';

  const body = openSheet(esc(o.name), `${esc(o.id)} · ${esc(o.source)} · 접수 ${esc(String(o.createdAt).slice(0, 10))} (D+${cxDays(o)})`, `
    ${warn ? `<div class="cx-warn">${esc(warn)}</div>` : ''}
    <div class="card" id="sumCard">
      <div class="cx-card-head"><h4>고객 정보</h4>
        <button type="button" class="star-btn ${o.star ? 'on' : ''}" id="starBtn" title="중요 표시">★</button>
        <button class="btn ghost" type="button" id="xEdit" style="margin-left:auto;padding:5px 12px">수정</button></div>
      <dl class="kv">
        <dt>연락처</dt><dd>${o.phone ? `<button type="button" class="cx-link" id="cxTel">${esc(o.phone)}</button>` : '—'}</dd>
        <dt>이메일</dt><dd>${o.email ? `<button type="button" class="cx-link" id="cxMail">${esc(o.email)}</button>` : '—'}</dd>
        ${CX_FIELDS.map(f => `<dt>${f[1]}</dt><dd>${esc(cxUnit(o[f[0]], f[3]) || '—')}</dd>`).join('')}
      </dl>
      <div class="cx-files-wrap">
        <h4 style="margin-bottom:8px">사진·자료</h4>
        <div id="cxFiles">${cxFilesHtml(o)}</div>
        <details class="cx-up"><summary>자료 올리기</summary>
          <div class="f" style="margin-top:10px"><input type="file" id="cxUp" multiple accept="image/*,.pdf,.dwg,.dxf,.hwp,.docx,.xlsx"></div>
          <div class="f"><input type="text" id="cxUpNote" placeholder="자료 설명 (선택)"></div>
          <div class="actions"><button class="btn ghost" type="button" id="cxUpSave">올리기</button></div>
        </details>
      </div>
    </div>

    <div class="card"><h4>상담 기록</h4><ul class="timeline" id="xLogs"><li class="t">불러오는 중...</li></ul></div>

    <div class="card">
      <h4>진행 단계 · 다음 연락</h4>
      ${segHtml('stage', M.stages, o.stage)}
      <div id="rejBox" class="f" style="margin-top:10px" ${['반려', '이탈'].includes(o.stage) ? '' : 'hidden'}>
        <span class="lb" id="rejLabel">${o.stage === '이탈' ? '이탈 사유 (선택)' : '반려 사유 (여러 개 선택)'}</span>
        <div class="seg" id="rejSeg">${(o.stage === '이탈' ? (M.dropReasons || []) : M.rejectReasons).map(r => `<button type="button" data-r="${esc(r)}" aria-pressed="${reasons.includes(r)}">${esc(r)}</button>`).join('')}</div>
      </div>
      <div class="cx-plan" id="planBox" ${cxClosed(o) ? 'hidden' : ''}>
        <div class="f"><label>다음 할 일</label><select id="xNext"><option value="">선택</option>${actOpts}</select></div>
        <div class="f"><label>기한 <span class="cx-next ${due.cls}">${esc(due.text)}</span></label><input type="date" id="xDue" value="${esc(o.dueDate)}"></div>
        <div class="f"><label>담당자</label><select id="xOwner">${staffOpts}</select></div>
      </div>
      <div class="actions"><button class="btn" type="button" id="xPlanSave">저장</button></div>
    </div>


    <div class="card">
      <h4>연락·상담 기록</h4>
      ${segHtml('kind', M.logKinds, '통화')}
      <div class="cx-when">
        <div class="f"><label for="xLogDate">날짜</label><input type="date" id="xLogDate" value="${today()}" max="${today()}"></div>
        <div class="f"><label for="xLogTime">시간</label><input type="time" id="xLogTime" value="${String(new Date().getHours()).padStart(2, '0')}:${String(new Date().getMinutes()).padStart(2, '0')}"></div>
      </div>
      <div class="f"><textarea id="xLog" rows="3" placeholder="통화·상담 내용, 희망 사항, 다음에 연락하기로 한 시점 등"></textarea></div>
      <div class="hint" id="xLogHint"></div>
      <div class="actions"><button class="btn" type="button" id="xLogSave">기록 저장</button></div>
    </div>

    <div class="card" id="meetCard">
      <h4>상담 미팅 일정</h4>
      ${o.meetingAt ? `<div class="cx-meet"><b>${esc(o.meetingAt.replace('-', '.').replace('-', '.'))}</b>${o.meetingPlace ? ' · ' + esc(o.meetingPlace) : ''}<div class="hint">구글 캘린더에 등록되어 있습니다.</div></div>
        <div class="actions"><button class="btn danger" type="button" id="mCancel">미팅 취소</button><button class="btn ghost" type="button" id="mEdit">일정 변경</button></div>` : `
        <div class="cx-when">
          <div class="f"><label for="mDate">날짜</label><input type="date" id="mDate" min="${today()}"></div>
          <div class="f"><label for="mTime">시간</label><input type="time" id="mTime" value="14:00" step="600"></div>
        </div>
        <div class="f"><span class="lb">소요 시간</span>${segHtml('mLen', [['60', '1시간'], ['90', '1시간 30분'], ['120', '2시간']], '90')}</div>
        <div class="f"><span class="lb">장소</span>${segHtml('mPlace', M.meetingPlaces, '본사 사무실')}</div>
        <div class="f" id="mDetailBox" hidden><input type="text" id="mDetail" placeholder="장소 상세 (주소, 층, 링크 등)"></div>
        <div class="f"><input type="text" id="mNote" placeholder="미팅 메모 (선택)"></div>
        <div class="actions"><button class="btn" type="button" id="mSave">미팅 확정 · 캘린더 등록</button></div>`}
    </div>

    ${M.aiEnabled ? `<div class="card"><div style="display:flex;align-items:center"><h4 style="margin:0">AI 상담 분석</h4><button class="btn ghost" type="button" id="xAi" style="margin-left:auto;padding:5px 12px">분석하기</button></div>
      <div class="hint">고객 정보와 기록으로 다음 미팅 준비 포인트를 정리합니다.</div><div class="content cx-ai" id="aiOut" hidden></div></div>` : ''}

    ${o.siteCode ? `<div class="card"><h4>연결된 현장</h4><b>${esc(o.siteCode)}</b> — 포털 현장관리에서 확인할 수 있습니다.</div>`
      : o.stage === '계약완료' && isAdmin ? `<div class="card"><h4>마스터에 현장 등록</h4>
        <div class="f"><label>현장명</label><input type="text" id="rName" value="${esc(cxSiteNameGuess(o.location))}"></div>
        <div class="f"><span class="lb">설계 계약연도</span>${segHtml('rYear', M.codeYears.map(y => [y, '20' + y + '년']), M.codeYears[1])}</div>
        <div class="f"><span class="lb">설계 주체</span>${segHtml('rDesign', [['사람사는집', '자체 설계'], ['건축사사무소', '건축사사무소']], '')}</div>
        <div class="f" id="rArchBox" hidden><label>건축사사무소 이름</label><input type="text" id="rArch"></div>
        <div class="hint">건축주·연락처·주소·유형·대지면적이 채워진 "설계중" 현장이 만들어집니다.</div>
        <div class="actions"><button class="btn" type="button" id="rSave">현장 등록</button></div></div>` : ''}

    ${isAdmin ? `<div class="actions" style="margin-top:4px"><button class="btn danger" type="button" id="xDel">고객 삭제</button></div>` : ''}`);

  const del = $('xDel');
  if (del) del.onclick = e => {
    const msg = `${o.name} 고객과 상담 기록을 삭제할까요?` + (o.siteCode ? `\n\n※ 현장 ${o.siteCode}와 연결된 고객입니다. 현장 정보는 그대로 남습니다.` : '') + '\n\n삭제한 자료는 고객관리_DB 시트의 "삭제보관" 탭에 보관됩니다.';
    if (!confirm(msg)) return;
    submitting(e.target, async () => {
      await api({ action: 'cx_delete', ids: [o.id] });
      CX.items = CX.items.filter(x => x.id !== o.id); cxBadge();
      closeSheet(); cxRenderList(); toast(`${o.name} 고객 삭제`);
    });
  };

  // 기록 종류별로 단계가 어떻게 바뀌는지 미리 안내
  const hintFor = k => {
    if (k === '통화' && ['접수', '접수(메일답장완료)'].includes(o.stage)) return '저장하면 단계가 "통화완료"로 넘어갑니다.';
    if (k === '메일·문자' && o.stage === '접수') return '저장하면 단계가 "접수(메일답장완료)"로 넘어갑니다.';
    if (['미팅', '방문상담'].includes(k) && ['접수', '접수(메일답장완료)', '통화완료', '통화완료 미팅고려', '미팅약속/진행중'].includes(o.stage)) return '저장하면 단계가 "미팅완료/계약고려중"으로 넘어갑니다.';
    return '';
  };
  $('xLogHint').textContent = hintFor('통화');

  bindSegs(body, (name, v) => {
    if (name === 'kind') $('xLogHint').textContent = hintFor(v);
    if (name === 'stage') {
      $('planBox').hidden = M.closed.includes(v);
      $('rejBox').hidden = !['반려', '이탈'].includes(v);
      if (['반려', '이탈'].includes(v)) {
        const list = v === '이탈' ? (M.dropReasons || []) : M.rejectReasons;
        $('rejLabel').textContent = v === '이탈' ? '이탈 사유 (선택)' : '반려 사유 (여러 개 선택)';
        $('rejSeg').innerHTML = list.map(r => `<button type="button" data-r="${esc(r)}" aria-pressed="${reasons.includes(r)}">${esc(r)}</button>`).join('');
        $('rejSeg').querySelectorAll('button').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
      }
      if (v !== o.stage && !M.closed.includes(v)) {
        const days = M.dueDays[v];
        if (days != null) { const d = new Date(); d.setDate(d.getDate() + days); $('xDue').value = ymd(d); }
        const nx = M.nextDefault[v]; if (nx) $('xNext').value = nx;
      }
    }
    if (name === 'rDesign') $('rArchBox').hidden = v !== '건축사사무소';
    if (name === 'mPlace') $('mDetailBox').hidden = ['본사 사무실'].includes(v);
  });
  body.querySelectorAll('#rejSeg button').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));

  const saveMeeting = async payload => {
    const d = await api(Object.assign({ action: 'cx_meeting', id: o.id }, payload));
    cxReplace(d.item); cxRenderList(); cxOpen(o.id);
  };
  if ($('mSave')) $('mSave').onclick = e => submitting(e.target, () => {
    if (!$('mDate').value || !$('mTime').value) throw new Error('미팅 날짜와 시간을 선택하세요.');
    return saveMeeting({ date: $('mDate').value, time: $('mTime').value, minutes: segVal(body, 'mLen'), place: segVal(body, 'mPlace'), placeDetail: $('mDetail').value, note: $('mNote').value })
      .then(() => toast('미팅 확정 · 캘린더에 등록했습니다'));
  });
  if ($('mEdit')) $('mEdit').onclick = () => {
    const card = $('meetCard');
    const [dt, tm] = o.meetingAt.split(' ');
    card.innerHTML = `<h4>상담 미팅 일정 변경</h4>
      <div class="cx-when"><div class="f"><label>날짜</label><input type="date" id="mDate" value="${esc(dt)}"></div>
      <div class="f"><label>시간</label><input type="time" id="mTime" value="${esc(tm)}" step="600"></div></div>
      <div class="f"><span class="lb">소요 시간</span>${segHtml('mLen2', [['60', '1시간'], ['90', '1시간 30분'], ['120', '2시간']], '90')}</div>
      <div class="f"><input type="text" id="mDetail" value="${esc(o.meetingPlace)}" placeholder="장소"></div>
      <div class="actions"><button class="btn ghost" type="button" id="mBack">취소</button><button class="btn" type="button" id="mUpdate">변경 저장</button></div>`;
    bindSegs(card);
    card.querySelector('#mBack').onclick = () => cxOpen(o.id);
    card.querySelector('#mUpdate').onclick = e => submitting(e.target, () =>
      saveMeeting({ date: $('mDate').value, time: $('mTime').value, minutes: segVal(card, 'mLen2'), place: '기타', placeDetail: $('mDetail').value })
        .then(() => toast('미팅 일정을 변경했습니다')));
  };
  if ($('mCancel')) $('mCancel').onclick = e => {
    if (!confirm('상담 미팅을 취소하고 캘린더에서 지울까요?')) return;
    submitting(e.target, () => saveMeeting({ cancel: true }).then(() => toast('미팅을 취소했습니다')));
  };

  const starBtn = $('starBtn');
  if (starBtn) starBtn.onclick = () => submitting(starBtn, async () => {
    const d = await api({ action: 'cx_star', id: o.id, star: o.star ? '' : '중요' });
    cxReplace(d.item); cxRenderList(); cxOpen(o.id);
  });

  const copyText = async (txt, msg) => {
    try { await navigator.clipboard.writeText(txt); toast(msg); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); toast(msg); } catch (e2) { toast('복사가 안 됩니다. 길게 눌러 선택하세요'); }
      ta.remove();
    }
  };
  // 연락처: 휴대폰이면 전화 연결, PC면 복사 / 이메일: 항상 복사
  const telBtn = $('cxTel');
  if (telBtn) telBtn.onclick = () => {
    const isMobile = window.matchMedia('(pointer: coarse)').matches;
    if (isMobile) location.href = 'tel:' + o.phone.replace(/[^\d+]/g, '');
    else copyText(o.phone, '연락처를 복사했습니다');
  };
  const mailBtn = $('cxMail');
  if (mailBtn) mailBtn.onclick = () => copyText(o.email, '이메일 주소를 복사했습니다');

  const bindFiles = () => {
    body.querySelectorAll('#cxFiles [data-file]').forEach(b => { cxThumb(o, b); b.onclick = () => cxViewFile(o, b.dataset.file); });
    body.querySelectorAll('#cxFiles [data-del]').forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      if (!confirm('이 자료를 지울까요?')) return;
      submitting(b, async () => {
        const d = await api({ action: 'cx_file_delete', id: o.id, fileId: b.dataset.del });
        cxReplace(d.item); cxOpen(o.id);
      });
    });
  };
  bindFiles();
  body.querySelector('#cxUpSave').onclick = e => submitting(e.target, async () => {
    const input = $('cxUp');
    if (!input.files.length) throw new Error('올릴 파일을 선택하세요.');
    const d = await api({ action: 'cx_upload', id: o.id, files: await readFiles(input), note: $('cxUpNote').value });
    cxReplace(d.item); cxOpen(o.id); toast('자료를 올렸습니다');
  });

  const update = async fields => {
    const d = await api({ action: 'cx_update', id: o.id, fields });
    cxReplace(d.item); cxRenderList(); cxOpen(o.id);
  };
  body.querySelector('#xPlanSave').onclick = e => submitting(e.target, () => {
    const stage = segVal(body, 'stage');
    const f = { stage, ownerEmail: $('xOwner').value };
    if (['반려', '이탈'].includes(stage)) {
      f.rejectReasons = [...body.querySelectorAll('#rejSeg [aria-pressed="true"]')].map(b => b.dataset.r);
      if (stage === '반려' && !f.rejectReasons.length) throw new Error('반려 사유를 선택하세요.');
    }
    if (!M.closed.includes(stage)) {
      f.nextAction = $('xNext').value; f.dueDate = $('xDue').value;
      if (!f.dueDate) throw new Error('다음 연락 기한을 정해주세요. 먼 훗날이라도 날짜를 넣어야 잊지 않습니다.');
    }
    return update(f);
  });
  body.querySelector('#xLogSave').onclick = e => submitting(e.target, async () => {
    const date = $('xLogDate').value;
    if (!date) throw new Error('날짜를 선택하세요.');
    const d = await api({ action: 'cx_log', id: o.id, kind: segVal(body, 'kind'), text: $('xLog').value, at: date + ' ' + ($('xLogTime').value || '09:00') });
    cxReplace(d.item); cxRenderList(); cxOpen(o.id);
    toast(d.autoStage ? `기록 저장 · 단계가 "${d.autoStage}"(으)로 바뀌었습니다` : '기록 저장');
  });
  body.querySelector('#xEdit').onclick = () => {
    const card = $('sumCard');
    card.innerHTML = `<h4>고객 정보 수정</h4>
      <div class="f"><span class="lb">유입 경로</span><select data-k="source">${M.sources.map(x => `<option ${x === o.source ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="f"><label>성함</label><input type="text" data-k="name" value="${esc(o.name)}"></div>
      <div class="f"><label>연락처</label><input type="text" data-k="phone" value="${esc(o.phone)}" inputmode="tel"></div>
      <div class="f"><label>이메일</label><input type="text" data-k="email" value="${esc(o.email)}"></div>
      ${CX_FIELDS.map(f => cxFieldInput(f, o[f[0]])).join('')}
      <div class="actions"><button class="btn ghost" type="button" id="eCancel">취소</button><button class="btn" type="button" id="eSave">저장</button></div>`;
    bindToggleSegs(card);
    card.querySelector('#eCancel').onclick = () => cxOpen(o.id);
    card.querySelector('#eSave').onclick = e => submitting(e.target, () => update(cxReadFields(card)));
  };
  const ai = $('xAi');
  if (ai) ai.onclick = e => submitting(e.target, async () => {
    const d = await api({ action: 'cx_analyze', id: o.id });
    const out = $('aiOut'); out.hidden = false; out.textContent = d.text;
    loadLogs();
  });
  const reg = $('rSave');
  if (reg) reg.onclick = e => submitting(e.target, async () => {
    const d = await api({ action: 'cx_register_site', id: o.id, siteName: $('rName').value, codeYear: segVal(body, 'rYear'), designBy: segVal(body, 'rDesign'), architect: ($('rArch') || {}).value || '' });
    cxReplace(d.item);
    toast(`현장 ${d.code} 등록 완료 — 새로고침하면 현장 목록에 나타납니다`);
    cxRenderList(); cxOpen(o.id);
  });

  function loadLogs() {
    api({ action: 'cx_logs', id: o.id }).then(d => {
      const el = $('xLogs'); if (!el) return;
      const canDel = d.canDeleteLog && S.me.role === 'admin';
      el.innerHTML = d.items.length ? d.items.map(l => {
        const x = canDel ? `<button type="button" class="log-x" data-row="${l.row}" title="기록 삭제" aria-label="기록 삭제">×</button>` : '';
        const head = `<div class="log-head"><b class="log-date">${esc(l.at.slice(0, 16).replace(/-/g, '.'))}</b><span class="log-kind k-${esc(l.kind.replace(/[^\w가-힣]/g, ''))}">${esc(l.kind)}</span><span class="t">${esc(l.by)}</span>${x}</div>`;
        return l.kind === 'AI 분석'
          ? `<li>${head}<details><summary>AI 분석 결과 보기</summary><div class="content" style="margin-top:6px">${esc(l.text)}</div></details></li>`
          : `<li class="k-${esc(l.kind.replace(/[^\w가-힣]/g, ''))}">${head}<div class="content">${esc(l.text)}</div></li>`;
      }).join('') : '<li class="t">기록 없음</li>';
      el.querySelectorAll('.log-x').forEach(b => b.onclick = () => {
        if (!confirm('이 상담 기록을 삭제할까요? 되돌릴 수 없습니다.')) return;
        submitting(b, async () => { await api({ action: 'cx_log_delete', id: o.id, row: b.dataset.row }); loadLogs(); toast('기록을 삭제했습니다'); });
      });
    }).catch(() => {});
  }
  loadLogs();
}

// ---------- 시작 ----------
if (API_URL.includes('여기에_새_배포_URL')) {
  $('loginMsg').textContent = '설치 필요: 파일 상단의 API_URL을 입력하세요.';
}
initGoogle();
if (getToken()) start();
</script>
