<script>const GOOGLE_CLIENT_ID = '573053436430-btlompn2ojv7h4qviandnb4b9p41410j.apps.googleusercontent.com';
const TOKEN_KEY = 'bfp_app_token';
const SITE_KEY = 'bfp_app_site';
const TAB_LABEL = { all: '전체현황', cx: '고객상담', design: '설계', est: '견적', info: '현장정보', site: '시공관리', card: '법인카드', board: '현장재정', detail: '회사디테일', inv: '창고·장비', labor: '인원출역' };
const TAB_ORDER = ['all', 'cx', 'design', 'est', 'info', 'site', 'labor', 'payreq', 'card', 'board', 'fin', 'detail', 'inv', 'sikgu', 'master'];
const TAB_GROUPS = { cx: '상담·설계', info: '시공', payreq: '재정', detail: '회사' };
const EXT_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

const S = { me: null, tabs: [], links: [], sites: [], tab: null, siteCode: null, siteSub: '', badges: {} };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000);
}

function parseJwt(t) {
  const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(atob(b).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}
function getToken() {
  const t = sessionStorage.getItem(TOKEN_KEY);
  if (!t) return '';
  try { if (Date.now() > parseJwt(t).exp * 1000 - 60000) { sessionStorage.removeItem(TOKEN_KEY); return ''; } } catch (e) { return ''; }
  return t;
}

const API_READ = /^(me|dyk|ov_site|ov_all|rp_list|rp_get|sc_get|si_list|dt_list|pf_get|st_get|fb_board|lb_data|ci_list|cm_list|cr_list|cr_all|cr_meta|cr_history|cx_list|cx_meta|cx_logs|ds_get|ds_meta|ca_list|iv_list|vw_list|oa_list|rp_sign_get)$/;
const AC = { mem: {}, flight: {}, pending: false, timer: null };
function acKey(body) {
  const b = Object.assign({}, body); delete b.idToken;
  return 'bfpc:' + (b.action === 'me' ? '' : ((S.me && S.me.email) || '')) + ':' + JSON.stringify(b);
}
function acGet(k) {
  if (AC.mem[k]) return AC.mem[k];
  try { const v = localStorage.getItem(k); if (v) { const o = JSON.parse(v); AC.mem[k] = o; return o; } } catch (e) {}
  return null;
}
function acPut(k, d) {
  const o = { t: Date.now(), s: JSON.stringify(d) };
  AC.mem[k] = o;
  if (o.s.length > 400000) return;
  try { localStorage.setItem(k, JSON.stringify(o)); }
  catch (e) { acClear(() => true); try { localStorage.setItem(k, JSON.stringify(o)); } catch (e2) {} }
}
function acClear(test) {
  Object.keys(AC.mem).forEach(k => { if (test(k)) delete AC.mem[k]; });
  try { Object.keys(localStorage).filter(k => k.indexOf('bfpc:') === 0 && test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
}
function acAfterWrite(body) {
  const code = body.siteCode;
  acClear(k => { if (!code) return true; const m = k.match(/"siteCode":"([^"]*)"/); return !m || m[1] === code; });
}
async function apiNet(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ idToken: getToken() }, body))
  });
  const data = await res.json();
  if (data.authError) { showLogin(data.error); throw new Error(data.error); }
  if (!data.ok) throw new Error(data.error || '요청 실패');
  return data;
}
function acFetch(body, k) {
  if (AC.flight[k]) return AC.flight[k];
  const p = apiNet(body).then(d => { acPut(k, d); return d; }).finally(() => { delete AC.flight[k]; });
  AC.flight[k] = p;
  return p;
}
function acSafe() {
  const a = document.activeElement;
  return !$('sheetWrap') && !document.querySelector('.lightbox') && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) && !CR.busy && !['board', 'est'].includes(S.tab);
}
function acRefreshUi() {
  AC.pending = true;
  clearTimeout(AC.timer);
  const tryNow = () => {
    if (!AC.pending) return;
    if (!acSafe()) { AC.timer = setTimeout(tryNow, 2000); return; }
    AC.pending = false;
    const y = window.scrollY;
    acResetStates();
    renderTab();
    setTimeout(() => window.scrollTo(0, y), 60);
  };
  AC.timer = setTimeout(tryNow, 300);
}
function acResetStates() {
  OV.site = null; OV.allAt = 0; FB.board = null; IV.loaded = false; SI.site = null; DT.loaded = false; LB.data = null; LB.key = '';
  CI.data = null; VW.site = null; SC.site = null; PF.site = null; ST.site = null; CA.reload = true; RP.site = null; DS.site = null;
  CR.site = null; CR.allAt = 0; OA.loaded = false;
}
async function api(body) {
  const act = String(body.action || '');
  if (!API_READ.test(act)) { const d = await apiNet(body); acAfterWrite(body); return d; }
  const k = acKey(body), c = acGet(k);
  if (c) {
    if (Date.now() - c.t > 30000 && !AC.flight[k]) {
      acFetch(body, k).then(d => { if (JSON.stringify(d) !== c.s && act !== 'me' && act !== 'dyk') acRefreshUi(); }).catch(() => {});
    }
    return JSON.parse(c.s);
  }
  return JSON.parse(JSON.stringify(await acFetch(body, k)));
}
function acPrefetch() {
  const code = S.siteCode; if (!code || !S.tabs.includes('site')) return;
  const list = [{ action: 'ov_site', siteCode: code }, { action: 'rp_list', siteCode: code }, { action: 'sc_get', siteCode: code }, { action: 'si_list', siteCode: code }];
  list.reduce((p, b) => p.then(() => { const k = acKey(b); return acGet(k) ? null : acFetch(b, k).catch(() => {}); }), Promise.resolve());
}

function showLogin(msg) {
  sessionStorage.removeItem(TOKEN_KEY);
  acClear(() => true);
  $('appView').hidden = true;
  $('loginView').hidden = false;
  $('loginMsg').textContent = msg || '';
}

function initGoogle() {
  if (!window.google || !google.accounts) { setTimeout(initGoogle, 150); return; }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogle, auto_select: true, ux_mode: 'popup' });
  google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', width: 260 });
  if (!getToken()) google.accounts.id.prompt();
}

function onGoogle(res) {
  sessionStorage.setItem(TOKEN_KEY, res.credential);
  acClear(() => true);
  start();
}

async function start() {
  $('loginMsg').textContent = '확인 중...';
  $('loginMsg').style.color = 'var(--muted)';
  try {
    const d = await api({ action: 'me' });
    try { const who = localStorage.getItem('bfpc_who'); if (who && who !== d.user.email) { acClear(k => k.indexOf('bfpc::') !== 0); } localStorage.setItem('bfpc_who', d.user.email); } catch (e) {}
    Object.assign(S, { me: d.user, tabs: d.tabs, links: d.links, sites: d.sites, badges: d.badges || {} });
    kbApply(d.kb || {});
    $('loginView').hidden = true;
    $('appView').hidden = false;
    $('loginMsg').style.color = '';
    renderShell();
  } catch (e) {
    $('loginMsg').style.color = '';
    if (!$('loginView').hidden) $('loginMsg').textContent = e.message;
  }
}

$('logoutBtn').onclick = () => {
  sessionStorage.removeItem(TOKEN_KEY);
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  location.reload();
};

function siteYear(c) { return /^\d{2}/.test(c || '') ? c.slice(0, 2) : '기타'; }
function sitePickFill() {
  const y = $('yearPick').value, list = S.sites.filter(x => siteYear(x.code) === y);
  $('sitePick').innerHTML = list.length
    ? list.map(x => `<option value="${esc(x.code)}">${esc(x.code)} ${esc(x.name)}${x.status === '시공중' ? '' : ' · ' + esc(x.status)}</option>`).join('')
    : '<option value="">볼 수 있는 현장이 없습니다</option>';
}
function sitePickSet(code) {
  if (!S.sites.some(x => x.code === code)) return;
  if ($('yearPick').value !== siteYear(code)) { $('yearPick').value = siteYear(code); sitePickFill(); }
  else if (![...$('sitePick').options].some(o => o.value === code)) sitePickFill();
  $('sitePick').value = code;
}
function renderShell() {
  $('meName').textContent = S.me.name;
  $('meRole').textContent = S.me.roleLabel;

  const codeKey = c => (/^\d/.test(c) ? '0' : '1') + c;
  S.sites.sort((a, b) => codeKey(a.code).localeCompare(codeKey(b.code)));
  const saved = localStorage.getItem(SITE_KEY);
  S.siteCode = (S.sites.find(s => s.code === saved) || S.sites[0] || {}).code || null;
  const years = [...new Set(S.sites.map(x => siteYear(x.code)))].sort((a, b) => a === '기타' ? 1 : b === '기타' ? -1 : b.localeCompare(a));
  $('yearPick').innerHTML = years.map(y => `<option value="${y}">${y === '기타' ? '기타' : '20' + y + '년'}</option>`).join('');
  $('yearPickWrap').hidden = years.length < 2;
  if (S.siteCode) sitePickSet(S.siteCode); else sitePickFill();
  $('yearPick').onchange = () => { sitePickFill(); if ($('sitePick').value) $('sitePick').onchange(); };
  $('sitePick').onchange = () => { S.siteCode = $('sitePick').value; localStorage.setItem(SITE_KEY, S.siteCode); setTimeout(acPrefetch, 1500); DS.site = null; DS.plan = null; DS.items = []; RP.site = null; RP.items = []; RP.stat = null; OV.site = null; SI.site = null; SC.site = null; SC.cond = null; SC.tasks = []; PF.site = null; PF.d = null; ST.site = null; ST.d = null; renderTab(); };

  const avail = new Set(TAB_ORDER.filter(k => S.tabs.includes(k) || S.links.some(x => x.key === k)));
  const grpFirst = {}; let g = '';
  TAB_ORDER.forEach(k => { if (TAB_GROUPS[k]) g = TAB_GROUPS[k]; if (avail.has(k) && g && !grpFirst[g]) grpFirst[g] = k; });

function toPy(m2) { return Math.round(m2 / 3.3058 * 10) / 10; }

function fmtNum(n) { return (Math.round(n * 10) / 10).toLocaleString('ko-KR'); }
function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function progressHtml(s) {
  if (!s.startDate || !s.endDate) {
    return s.status === '시공중' ? '<div class="progress"><div class="progress-top"><span>공정률</span><span>착공일·준공예정일이 입력되면 자동 계산됩니다</span></div></div>' : '';
  }
  const total = dayDiff(s.startDate, s.endDate);
  const done = dayDiff(s.startDate, today());
  const pct = total > 0 ? Math.max(0, Math.min(100, Math.round(done / total * 100))) : 0;
  const left = dayDiff(today(), s.endDate);
  const label = done < 0 ? `착공 D-${-done}` : left >= 0 ? `착공 D+${done} · 준공까지 ${left}일` : `준공예정 ${-left}일 경과`;
  return `<div class="progress"><div class="progress-top"><span>${esc(label)}</span><b>${pct}%</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

function contractPy(a) {

function ovGroupHtml(title, rows, prog) {

    <div class="ds-phase">${esc(title)} ${rows.length}곳 · 누르면 그 현장으로 이동</div>
    ${rows.map(r => {
      const p = prog(r);
      const gap = r.daysSinceReport;
      const late = r.status === '시공중' && (gap === '' || gap >= 3);
      return `<button class="cr-row ov-row ${late ? 'urgent' : ''}" data-code="${esc(r.code)}">
        <span class="cr-id">${esc(r.code)} · ${esc(r.status)}${r.manager ? ' · ' + esc(r.manager) : ''}</span>
        <span class="cr-title">${esc(r.name)}${r.problem ? '<span class="flag">문제</span>' : ''}</span>
        <span class="cr-sub">
          ${p !== null ? `공정 ${p}% · ` : r.designWeek ? `설계 ${r.designWeek}주차 · ` : ''}

          ${r.weekPeople ? ` · 주간 ${r.weekPeople}명` : ''}${r.totalPeople ? ` (누적 ${r.totalPeople})` : ''}

}

async function renderAllTab() {
  const fresh = OV.all && Date.now() - OV.allAt < 60000;
  if (!fresh) {
    $('main').innerHTML = '<div class="loading">전체 현장을 불러오는 중...</div>';
    try { OV.all = await api({ action: 'ov_all' }); OV.allAt = Date.now(); }
    catch (e) { $('main').innerHTML = `<div class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</div>`; return; }
    if (S.tab !== 'all') return;
  }
  const rows = OV.all.rows;
  const noReport = rows.filter(r => r.status === '시공중' && (r.daysSinceReport === '' || r.daysSinceReport >= 3));
  const crTotal = rows.reduce((s, r) => s + r.crOpen, 0);
  const weekTotal = rows.reduce((s, r) => s + r.weekPeople, 0);
  const problem = rows.filter(r => r.problem);

  const prog = r => {
    if (!r.startDate || !r.endDate) return null;
    const total = dayDiff(r.startDate, r.endDate), done = dayDiff(r.startDate, today());
    return total > 0 ? Math.max(0, Math.min(100, Math.round(done / total * 100))) : null;
  };

  $('main').innerHTML = `
    <div class="cr-bar"><h2>전체 현황 <span class="cr-sub" style="font-size:14px;font-weight:500">${esc(OV.all.today)}</span></h2>
      <button class="btn ghost" type="button" id="ovRefresh">새로고침</button></div>

    <div class="ov-cards">
      <section class="panel ov-card"><span class="cr-id">시공 중</span><b>${rows.filter(r => r.status === '시공중').length}곳</b>
        <span class="cr-sub">${rows.filter(r => r.status === '보류').length ? `보류 ${rows.filter(r => r.status === '보류').length}곳` : '진행 중인 공사'}</span></section>
      <section class="panel ov-card"><span class="cr-id">설계·허가 중</span><b>${rows.filter(r => ['설계중', '견적조정중', '허가중'].includes(r.status)).length}곳</b>
        <span class="cr-sub">설계 ${rows.filter(r => r.status === '설계중').length} · 견적 ${rows.filter(r => r.status === '견적조정중').length} · 허가 ${rows.filter(r => r.status === '허가중').length}</span></section>
      <section class="panel ov-card"><span class="cr-id">이번 주 투입 인원</span><b>${weekTotal}명</b><span class="cr-sub">전 현장 합계</span></section>
      <section class="panel ov-card"><span class="cr-id">보고 끊긴 현장</span><b class="${noReport.length ? 'warn' : ''}">${noReport.length}곳</b>
        <span class="cr-sub">시공중인데 3일 이상 보고 없음</span></section>
      <button type="button" class="panel ov-card ov-click" id="ovCrCard"><span class="cr-id">진행 중 변경요청</span><b class="${crTotal ? 'warn' : ''}">${crTotal}건</b>
        <span class="cr-sub">누르면 변경요청 현황으로</span></button>
    </div>

    ${problem.length ? `<section class="panel ov-block"><h4>문제 현장</h4>
      ${problem.map(r => `<div class="ov-line"><span class="st 반려">${esc(r.code)}</span><b>${esc(r.name)}</b><span class="cr-sub">${esc(r.problemReason)}</span></div>`).join('')}
    </section>` : ''}

    ${ovGroupHtml('시공 중', rows.filter(r => r.status === '시공중'), prog)}
    ${ovGroupHtml('설계·견적·허가 중', rows.filter(r => ['설계중', '견적조정중', '허가중'].includes(r.status)), prog)}
    ${ovGroupHtml('보류', rows.filter(r => r.status === '보류'), prog)}
    ${ovGroupHtml('그 외', rows.filter(r => !['시공중', '설계중', '견적조정중', '허가중', '보류'].includes(r.status)), prog)}`;

  $('ovRefresh').onclick = () => { OV.allAt = 0; renderAllTab(); };
  $('ovCrCard').onclick = () => { CR.wantAll = true; CR.allAt = 0; S.siteSub = '변경공사'; selectTab('site'); };
  $('main').querySelectorAll('.ov-row').forEach(b => b.onclick = () => {
    S.siteCode = b.dataset.code; localStorage.setItem(SITE_KEY, S.siteCode);
    sitePickSet(S.siteCode);
    DS.site = null; DS.plan = null; DS.items = []; RP.site = null; OV.site = null;
    S.siteSub = '대시보드'; selectTab('site');
  });
}

const SI_URL = {};
async function siPhotoUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (SI_URL[k]) return SI_URL[k];
  const d = await api({ action: 'si_photo', id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return SI_URL[k] = URL.createObjectURL(new Blob([arr], { type: d.type }));
}

  const body = openSheet(esc(o.product), `${esc(o.group)} · ${esc(o.part)}`, `

const DT_URL = {};
async function dtFileUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (DT_URL[k]) return DT_URL[k];
  const d = await api({ action: 'dt_file', id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return DT_URL[k] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
}

function dtOpen(id) {

      fields: { cat: segVal(body, 'dc'), title: $('dTitle').value, rev: $('dRev').value, desc: $('dDesc').value } });
    const i = DT.items.findIndex(x => x.id === d.item.id);

const VW = { site: null, items: [], canEdit: false, open: null };
const LB = { from: '', to: '', site: '', view: 'worker', data: null, key: '' };
const LB_VIEWS = { worker: '작업자별', sheet: '출역표', site: '현장별', trade: '공종별' };
function lbYmd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function lbMonth(off) { const n = new Date(); const a = new Date(n.getFullYear(), n.getMonth() + off, 1), b = new Date(n.getFullYear(), n.getMonth() + off + 1, 0); return [lbYmd(a), lbYmd(b)]; }
function lbG(n) { return (Math.round(n * 100) / 100).toLocaleString('ko-KR'); }
function lbDays(from, to) { const out = []; const d = new Date(from + 'T00:00:00'), e = new Date(to + 'T00:00:00'); while (d <= e) { out.push(lbYmd(d)); d.setDate(d.getDate() + 1); } return out; }
function lbAgg(recs, keyFn) {
  const m = new Map();
  recs.forEach(r => { const k = keyFn(r); if (!m.has(k)) m.set(k, { key: k, recs: [], days: new Set(), heads: 0, g: 0, gx: 0, amount: 0, noOut: 0, noRate: 0, sites: new Set() });
    const a = m.get(k); a.recs.push(r); a.days.add(r.date); a.heads += r.n; a.g += r.g; a.gx += r.g * r.extra; a.amount += r.amount; a.sites.add(r.siteCode);
    if (r.noOut) a.noOut++; if (!r.rate || (r.extra && !r.extraRate)) a.noRate++; });
  return [...m.values()];
}

function lbSheetHtml(R, live) {

const SC = { site: null, cond: null, tasks: [], meta: null, canEdit: false, loading: false, view: 'all', month: '' };
try { SC.view = localStorage.getItem('bfp_sc_view') === 'month' ? 'month' : 'all'; } catch (e) {}
const SC_DOW = ['일', '월', '화', '수', '목', '금', '토'];
function scCls(t) { return t.status === '완료' ? 'done' : (t.end < today() ? 'late' : t.status === '진행중' ? 'doing' : ''); }
function scAddDays(d, n) { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return ymd(x); }

function scGridHtml(ts, print) {
  const first = ts[0].start, last = ts.reduce((m, t) => t.end > m ? t.end : m, ts[0].end);
  const n = dayDiff(first, last) + 1, days = [];
  for (let i = 0; i < n; i++) { const d = new Date(scAddDays(first, i) + 'T00:00:00'); days.push({ s: ymd(d), d: d.getDate(), w: d.getDay(), m: d.getMonth() + 1, y: d.getFullYear() }); }
  const months = []; days.forEach(x => { const k = `${x.y}-${x.m}`; const m = months[months.length - 1]; if (m && m.k === k) m.n++; else months.push({ k, label: `${x.m}월`, n: 1 }); });
  const dc = x => (x.w === 0 ? 'sc-we sc-sun' : x.w === 6 ? 'sc-we sc-sat' : '') + (x.s === today() && !print ? ' sc-tdy' : '');
  const head = `<thead>
    <tr><th class="sc-h" rowspan="4">공종</th>${months.map(m => `<th colspan="${m.n}">${m.label}</th>`).join('')}</tr>
    <tr>${days.map(x => `<th class="sc-d ${dc(x)}">${x.d}</th>`).join('')}</tr>
    <tr>${days.map(x => `<th class="sc-d ${dc(x)}">${SC_DOW[x.w]}</th>`).join('')}</tr>
    <tr>${days.map((x, i) => `<th class="sc-d ${dc(x)}">${i + 1}</th>`).join('')}</tr></thead>`;
  let ph = '';
  const body = ts.map(t => {
    const a = dayDiff(first, t.start), len = dayDiff(t.start, t.end) + 1, cls = scCls(t);
    const cells = [];
    for (let i = 0; i < a; i++) cells.push(`<td class="sc-d ${dc(days[i])}"></td>`);
    cells.push(`<td class="sc-span" colspan="${len}" data-tid="${esc(t.id)}" title="${esc(t.name)} ${esc(t.start)}~${esc(t.end)}"><i class="${cls}">${t.progress > 0 && t.progress < 100 ? `<b style="width:${t.progress}%"></b>` : ''}</i><em>${esc(t.name)}${t.owner ? ' · ' + esc(t.owner) : ''} (${t.days}일)</em></td>`);
    for (let i = a + len; i < n; i++) cells.push(`<td class="sc-d ${dc(days[i])}"></td>`);
    const phRow = t.phase !== ph ? (ph = t.phase, `<tr class="sc-ph"><td class="sc-h">${esc(t.phase)}</td><td colspan="${n}"></td></tr>`) : '';
    return phRow + `<tr><td class="sc-h" data-tid="${esc(t.id)}">${esc(t.name)}</td>${cells.join('')}</tr>`;
  }).join('');
  return `<section class="panel sc-wrap"><table class="sc-grid">${head}<tbody>${body}</tbody></table>
    <div class="sc-legend"><span><i></i>예정</span><span><i style="background:var(--amber)"></i>진행중</span><span><i style="background:var(--gray)"></i>완료</span><span><i style="background:var(--red)"></i>지연</span><span>회색 칸 = 주말</span></div></section>`;
}

function scMonthHtml(ts, print) {
  const first = ts[0].start, last = ts.reduce((m, t) => t.end > m ? t.end : m, ts[0].end);
  const ym = s => s.slice(0, 7);
  if (!SC.month || SC.month < ym(first) || SC.month > ym(last)) SC.month = (today() >= first && today() <= last) ? ym(today()) : ym(first);
  const [Y, M] = SC.month.split('-').map(Number);
  const m0 = new Date(Y, M - 1, 1), m1 = new Date(Y, M, 0);
  const gridStart = scAddDays(ymd(m0), -m0.getDay());
  const weeks = []; for (let w = 0; ; w++) { const ws = scAddDays(gridStart, w * 7); if (ws > ymd(m1)) break; weeks.push(ws); }
  const prev = ymd(new Date(Y, M - 2, 1)), next = ymd(new Date(Y, M, 1));
  const weekHtml = weeks.map(ws => {
    const we = scAddDays(ws, 6);
    const segs = ts.filter(t => t.start <= we && t.end >= ws).map(t => {
      const s = t.start < ws ? ws : t.start, e = t.end > we ? we : t.end;
      return { t, c0: dayDiff(ws, s), c1: dayDiff(ws, e), cont: t.start < ws, more: t.end > we };
    }).sort((a, b) => a.c0 - b.c0 || (b.c1 - b.c0) - (a.c1 - a.c0));
    const lanes = []; segs.forEach(g => { let i = 0; while (lanes[i] && lanes[i] > g.c0) i++; lanes[i] = g.c1 + 1; g.lane = i; });
    const dayCells = Array.from({ length: 7 }, (_, i) => { const d = scAddDays(ws, i); const dd = new Date(d + 'T00:00:00');
      const out = dd.getMonth() + 1 !== M, cls = [out ? 'out' : '', i === 0 ? 'we sun' : i === 6 ? 'we sat' : '', d === today() && !print ? 'tdy' : ''].join(' ');
      return `<div class="sc-day ${cls}"><b>${dd.getDate()}${!out && dd.getDate() === 1 ? '일' : ''}</b></div>`; }).join('');
    const chips = segs.map(g => `<span class="sc-chip ${scCls(g.t)} ${g.cont ? 'cont' : ''} ${g.more ? 'more' : ''}" data-tid="${esc(g.t.id)}"
      style="left:calc(${g.c0 / 7 * 100}% + 2px);width:calc(${(g.c1 - g.c0 + 1) / 7 * 100}% - 4px);top:${24 + g.lane * 21}px" title="${esc(g.t.name)} ${esc(g.t.start)}~${esc(g.t.end)}">${g.cont ? '' : ''}${esc(g.t.name)}</span>`).join('');
    return `<div class="sc-week" style="min-height:${Math.max(84, 28 + lanes.length * 21)}px">${dayCells}${chips}</div>`;
  }).join('');
  return `<section class="panel">
    <div class="sc-cal-top"><h3>${Y}년 ${M}월</h3>${print ? '' : `<span class="nav">
      <button type="button" data-mv="${prev.slice(0, 7)}" ${prev.slice(0, 7) < ym(first) ? 'disabled' : ''}>‹ 이전 달</button>
      <button type="button" data-mv="${(today() >= first && today() <= last ? today() : first).slice(0, 7)}">이번 달</button>
      <button type="button" data-mv="${next.slice(0, 7)}" ${next.slice(0, 7) > ym(last) ? 'disabled' : ''}>다음 달 ›</button></span>`}</div>
    <div class="sc-cal">${SC_DOW.map((d, i) => `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`).join('')}${weekHtml}</div></section>`;
}

async function scLoad(code) {
  if (SC.site === code || SC.loading) return;
  SC.loading = true;
  try {
    const d = await api({ action: 'sc_get', siteCode: code });
    Object.assign(SC, { site: code, cond: d.cond, tasks: d.tasks, canEdit: d.canEdit,
      meta: { template: d.template, options: d.options, statuses: d.statuses, structs: d.structs } });
  } finally { SC.loading = false; }
}

function scDday(t) {
  if (t.status === '완료') return { cls: '', text: '완료' };
  const d = dayDiff(today(), t.end);
  if (t.start > today()) return { cls: '', text: `D-${dayDiff(today(), t.start)}` };
  if (d < 0) return { cls: 'over', text: `${-d}일 지연` };
  return { cls: d <= 2 ? 'today' : '', text: `D-${d}` };
}

function scRender(el) {
  if (!SC.tasks.length) return scCreateForm(el);
  const ts = SC.tasks;
  const total = ts.reduce((s, t) => s + t.days, 0);
  const doneDays = ts.reduce((s, t) => s + t.days * (t.progress / 100), 0);
  const pct = total ? Math.round(doneDays / total * 100) : 0;
  const late = ts.filter(t => t.status !== '완료' && t.end < today());
  const now = ts.filter(t => t.status === '진행중' || (t.status === '예정' && t.start <= today() && t.end >= today()));
  const next = ts.filter(t => t.status === '예정' && t.start > today()).slice(0, 3);
  const first = ts[0].start, last = ts.reduce((m, t) => t.end > m ? t.end : m, ts[0].end);
  const span = Math.max(1, dayDiff(first, last));
  const months = [];
  for (let d = new Date(first + 'T00:00:00'); ymd(d) <= last; d.setMonth(d.getMonth() + 1)) {
    const m0 = new Date(d.getFullYear(), d.getMonth(), 1), m1 = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    const s = ymd(m0) < first ? first : ymd(m0), e = ymd(m1) > last ? last : ymd(m1);

  }
  const todayLeft = today() >= first && today() <= last ? dayDiff(first, today()) / span * 100 : null;

  el.innerHTML = `
    <div class="cr-bar"><h2 style="font-size:17px">공정표 <span class="cr-sub" style="font-weight:500">${esc(first)} ~ ${esc(last)}</span></h2>

    <section class="panel ds-time">
      <div class="ds-time-top">
        <div><span class="cr-id">${OV.prog && OV.prog.code === SC.site && OV.prog.prog != null ? `공정률 (${esc(OV.prog.by)} 가중)` : '공정 진행률 (소요일 기준)'}</span><div class="ds-now">${OV.prog && OV.prog.code === SC.site && OV.prog.prog != null ? OV.prog.prog : pct}%</div></div>
        <div class="ds-counts">${late.length ? `<span class="ds-late"><b>${late.length}</b> 지연</span>` : ''}
          <span class="cr-sub">완료 ${ts.filter(t => t.status === '완료').length}/${ts.length}</span></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="ds-next">${now.length ? `진행 중 · <b>${esc(now.map(t => t.name).join(', '))}</b>` : next.length ? `다음 · <b>${esc(next[0].name)}</b> ${esc(next[0].start.slice(5).replace('-', '/'))} 시작` : '모든 공정 완료'}</div>
    </section>

    ${SC.view === 'month' ? scMonthHtml(ts) : scGridHtml(ts)}

    <section class="panel">
      ${(() => { let ph = ''; return ts.map(t => {
        const dd = scDday(t);
        const head = t.phase !== ph ? (ph = t.phase, `<div class="ds-phase">${esc(t.phase)}</div>`) : '';
        return head + `<button class="cr-row sc-item ${t.status !== '완료' && t.end < today() ? 'urgent' : ''}" data-id="${esc(t.id)}">
          <span class="cr-id">${esc(t.start.slice(5).replace('-', '/'))} ~ ${esc(t.end.slice(5).replace('-', '/'))} · ${t.days}일${t.owner ? ' · ' + esc(t.owner) : ''}</span>
          <span class="cr-title ${t.status === '완료' ? 'done' : ''}">${esc(t.name)}</span>
          ${t.note ? `<span class="cr-sub">${esc(t.note)}</span>` : ''}
          <span class="cr-right"><span class="st ${t.status === '완료' ? '완료' : dd.cls === 'over' ? '반려' : ''}">${t.status === '완료' ? '완료' : t.progress ? t.progress + '%' : dd.text}</span></span>
        </button>`; }).join(''); })()}
    </section>`;

  el.querySelectorAll('.sc-item, .sc-row, [data-tid]').forEach(b => b.onclick = () => scTaskForm(b.dataset.id || b.dataset.tid));

  $('scPrint').onclick = scPrint;

const PF = { site: null, d: null, loading: false, tab: '성능 요약' };
function pfZone(site) {
  const t = String((site && site.address) || '') + ' ' + String((site && site.name) || ''), z = KB.pfZone || {};
  if (/군위/.test(t)) return '중부2';
  if (/광주/.test(t)) return /경기/.test(t) ? '중부2' : '남부';
  if (/고성/.test(t)) return /강원/.test(t) ? '중부2' : '남부';
  const toks = t.replace(/[(),·]/g, ' ').split(/\s+/).map(w => w.replace(/(특별자치시|특별자치도|광역시|특별시|시|군|구|읍|면|동|리)$/, '')).filter(Boolean);
  for (const tk of toks) for (const [zone, list] of Object.entries(z)) if (list.split(' ').includes(tk)) return zone;
  return '중부2';
}
function pfJudge(part, u, site) {
  const zone = pfZone(site || (PF.d && PF.d.site) || currentSite());
  const lg = ((KB.pfLegal || {})[part] || {})[zone], pp = (KB.pfPassive || {})[part], ps = pp && typeof pp === 'object' ? pp[zone] : pp;
  const one = (lim, label) => lim == null || u == null || !(u > 0) ? null : { lim, label, ok: u <= lim };
  const top = pp && typeof pp === 'object' ? pp['중부1'] : null;
  const best = zone !== '중부1' && top != null && u > 0 && u <= top ? { lim: top, label: '가장 엄격한 중부1 기준', ok: true, best: true } : null;
  return { zone, legal: one(lg, `법적 기준(${zone})`), passive: one(ps, `한국패시브건축협회 기준(${zone})`), best };
}
function pfGap(x, u) { return Math.round(Math.abs(x.lim - u) / x.lim * 100); }
function pfBadges(part, u, site) {
  const j = pfJudge(part, u, site);
  return [j.legal, j.passive, j.best].filter(Boolean).map(x => x.best
    ? `<span class="pf-std best">★ ${x.label}(${x.lim.toFixed(2)})까지 통과</span>`
    : `<span class="pf-std ${x.ok ? 'ok' : 'no'}">${x.label} ${x.lim.toFixed(x.lim >= 1 ? 2 : 3)} · ${x.ok ? '통과' : '부족'}${pfGap(x, u) > 0 ? (x.ok ? ` · ${pfGap(x, u)}% 더 우수` : ` · ${pfGap(x, u)}% 초과`) : ''}</span>`).join('');
}
function pfStdText(part, u, site) {
  const j = pfJudge(part, u, site);
  return [j.legal, j.passive, j.best].filter(Boolean).map(x => x.best ? `${x.label}(${x.lim})까지 통과` : `${x.label} ${x.lim} ${x.ok ? '통과' : '부족'}${x.ok && pfGap(x, u) > 0 ? `(${pfGap(x, u)}% 더 우수)` : ''}`).join(' · ');
}
function pfLegalSummary(parts, envBy) {
  const got = parts.map(p => { const e = envBy[p], u = e ? Number(e.uValue) : null, j = pfJudge(p, u); return u > 0 && j.legal ? { p, g: (j.legal.lim - u) / j.legal.lim * 100 } : null; }).filter(Boolean);
  if (!got.length) return '';
  const avg = Math.round(got.reduce((a, x) => a + x.g, 0) / got.length);
  const list = got.map(x => `${x.p} ${Math.round(x.g) >= 0 ? Math.round(x.g) + '%' : '−' + Math.abs(Math.round(x.g)) + '%'}`).join(' · ');
  return avg > 0 ? `<div class="pf-legal-sum"><b>법적 기준보다 열이 새는 양이 평균 ${avg}% 적은 집</b><span>${esc(list)} · 숫자가 클수록 같은 난방으로 더 따뜻합니다</span></div>` : '';
}

function pfAirGrade(v) {
  v = Number(v);
  if (!(v > 0)) return null;
  const g = (KB.pfAir || []).find(x => v <= x[0]) || (KB.pfAir || []).slice(-1)[0];
  return g ? { t: g[1], c: g[2] } : null;
}
function pfEnGrade(v) {
  if (!(v > 0)) return null;
  const g = (KB.pfEn || []).find(x => v <= x[0]) || (KB.pfEn || []).slice(-1)[0];
  return g ? { t: g[1], c: g[2] } : null;
}
let PF_GAS_KWH = 0, PF_LPG_KWH = 0, PF_PE = { elec: 0, gas: 0 };

function pfEnergyStat(d) {
  const rows = d.energy || [], area = Number(d.site.area) || 0;
  if (!rows.length) return null;
  let kwh = 0, cost = 0, elec = 0, gas = 0, solar = 0;
  rows.forEach(r => {
    const g = (Number(r.gasUse) || 0) * (r.gasUnit === 'kg' ? PF_LPG_KWH : r.gasUnit === 'kWh' ? 1 : PF_GAS_KWH);
    elec += Number(r.elecKwh) || 0; gas += g; solar += Number(r.solarKwh) || 0;
    kwh += (Number(r.elecKwh) || 0) * PF_PE.elec + g * PF_PE.gas;
    cost += (Number(r.elecCost) || 0) + (Number(r.gasCost) || 0) + (Number(r.etcCost) || 0);
  });
  const m = rows.length, f = 12 / m;
  return { months: m, full: m >= 12, elecYear: Math.round(elec * f), gasYear: Math.round(gas * f), solarYear: Math.round(solar * f),
    costYear: Math.round(cost * f), costMonth: Math.round(cost / m),
    primary: area > 0 ? Math.round(kwh * f / area) : 0, area };
}

async function pfLoad(code) {
  if (PF.site === code || PF.loading) return;
  PF.loading = true;
  try { PF.d = await api({ action: 'pf_get', siteCode: code }); PF.site = code; }
  finally { PF.loading = false; }
}

function pfRender(el) {
  const d = PF.d; if (!d) return;
  const tabs = d.isClient ? ['성능 요약', '에너지 사용'] : ['성능 요약', '외피 구성', '기밀 테스트', '에너지 사용'];
  if (!tabs.includes(PF.tab)) PF.tab = '성능 요약';
  el.innerHTML = `<div class="subnav">${tabs.map(t => `<button class="chip" data-pf="${esc(t)}" aria-pressed="${PF.tab === t}">${esc(t)}</button>`).join('')}</div>
    <div id="pfBody"></div>`;
  el.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { PF.tab = b.dataset.pf; pfRender(el); });
  const body = $('pfBody');
  if (PF.tab === '성능 요약') pfSummary(body);
  else if (PF.tab === '외피 구성') pfEnvList(body);
  else if (PF.tab === '기밀 테스트') pfAirList(body);
  else pfEnergyList(body);
}

      <div class="pf-grid">

          ${air ? pfBar(pfAirScore(air.ach50), ag.c, [['아파트', 75], ['패시브 94', 94]]) : ''}

          <span class="cr-sub">${eg ? esc(eg.t) : '데이터 부족'}${st ? ` · ${st.months}개월 기록${st.full ? '' : ' (연환산)'}` : ''}</span>
          ${st && st.primary ? pfBar(Math.min(100, st.primary / 260 * 100), eg.c, ['90', '120', '260']) : ''}
        </div>
        <div class="pf-metric">
          <span class="cr-id">월 평균 에너지 비용</span>
          <b>${st ? Math.round(st.costMonth / 1000).toLocaleString('ko-KR') : '—'}<small>천원</small></b>
          <span class="cr-sub">${st ? '연 ' + Math.round(st.costYear / 10000).toLocaleString('ko-KR') + '만원' : '기록 없음'}${st && st.solarYear ? ' · 태양광 ' + st.solarYear.toLocaleString('ko-KR') + 'kWh' : ''}</span>
        </div>
      </div>

      <h4 style="margin-top:18px">외피 열관류율 (U값, W/㎡·K)</h4>
      ${pfLegalSummary(parts, envBy)}
      <div class="pf-u">${parts.map(p => {
        const e = envBy[p], u = e ? Number(e.uValue) : null, jj = pfJudge(p, u), lim = (jj.passive || jj.legal || { lim: 1 }).lim;
        const pass = u !== null && jj.legal && jj.legal.ok;
        return `<div class="pf-u-row ${u === null ? 'none' : pass ? 'pass' : 'over'}" ${e ? `data-env="${esc(e.id)}"` : ''}>

      <ul class="pf-explain">
        <li><b>ACH50</b> — 집 전체가 1시간에 몇 번 공기를 바꿔 새는지 보여주는 값입니다. 숫자가 작을수록 틈이 적어 겨울에 따뜻하고 여름에 시원합니다. 일반 신축은 3~5, 패시브하우스(PHIKO 신축 인증)는 0.6 이하입니다.</li>

  $('pfPrint').onclick = pfPrint;

function pfBar(pct, cls, marks) {
  return `<div class="pf-bar ${cls || ''}"><i style="width:${pct}%"></i>${(marks || []).map((m, i) => Array.isArray(m) ? `<em style="left:${m[1]}%" data-m="${esc(m[0])}"></em>` : `<em style="left:${[23, 50, 100][i]}%" data-m="${esc(m)}"></em>`).join('')}</div>`;
}
function pfAirScore(v) { v = Number(v); return v > 0 ? Math.max(0, Math.round((100 - v * 10) * 10) / 10) : null; }
function pfAirLeak(v) { return Math.round(Number(v) * 100); }
function pfAirText(v) {
  const L = pfAirLeak(v);
  return L <= 100 ? `집 안팎에 우산이 뒤집힐 만한 바람이 1시간 불어도, 집 안 공기 100L 중 ${L}L만 틈새로 빠져나갈 만큼 꼼꼼한 집`
    : `집 안팎에 우산이 뒤집힐 만한 바람이 1시간 불면, 집 안 공기 100L 기준 ${L.toLocaleString('ko-KR')}L(${(L / 100).toFixed(1)}번 통째로)가 틈새로 빠져나가는 집`;
}
const PF_AIR_RULE = '고기밀 주택: 약 1회(100L) 이하 교환 (90점/100) · 신축 아파트: 약 2~3회(200~300L) 교환 (70~80점/100) · 우풍 있는 집: 10회(1,000L) 이상 교환 (0점/100, 낙제)';

function pfEnvForm(o) {
  const d = PF.d;
  const parts = d.parts.map(p => p.key);
  const part0 = o ? o.part : '외벽';
  const mats = d.materials;
  const body = openSheet(o ? '외피 구성 수정' : '외피 구성 추가', esc(d.site.code + ' ' + d.site.name), `
    <div class="card">
      <div class="f"><span class="lb">부위</span>${segHtml('pPart', parts, part0)}</div>
      <div id="pDirect" hidden>
        <div class="f"><label>열관류율 U (W/㎡·K)</label><input type="number" id="pU" step="0.001" inputmode="decimal" value="${esc(o ? o.uValue : '')}" placeholder="예: 0.85"><div class="hint">창호·현관문은 제조사 성적서의 U값을 그대로 입력합니다.</div></div>
      </div>
      <div id="pLayers">
        <div class="f"><label>구성 층 <span class="hint">실내 → 실외 순서</span></label><div id="pRows"></div>
          <button class="btn ghost" type="button" id="pAdd" style="margin-top:8px">+ 층 추가</button></div>
        <div class="f"><label>구조재 간격</label>
          <div class="pf-oc">${segHtml('pOc', [['406.4', '16″ o.c. (406mm)'], ['609.6', '24″ o.c. (610mm)'], ['', '직접 입력']], '')}</div>
          <div class="pf-oc2"><label>부재 두께 <input type="number" id="pMw" value="38" inputmode="numeric"> mm</label>
            <label>간격 <input type="number" id="pSp" inputmode="decimal" placeholder="mm"> mm</label>
            <label>헤더·플레이트 등 추가 <input type="number" id="pEx" inputmode="decimal"> %p</label></div></div>
        <div class="f"><label>구조재(목재) 비율 <b id="pWrV">${o ? Math.round((o.woodRatio || 0) * 100) : 15}</b>%</label>
          <input type="range" id="pWr" min="0" max="35" step="1" value="${o ? Math.round((o.woodRatio || 0) * 100) : 15}" style="width:100%">
          <div class="hint" id="pWrHint">간격을 고르면 자동 계산됩니다. 부재 두께 ÷ 간격 + 추가 부재(외벽 6%p, 지붕 2%p 기본).</div></div>
        <div class="sum"><span>계산된 U값</span> <b id="pUOut">—</b> <span class="hint" id="pUNote"></span></div>
      </div>
      <div class="f"><label>메모</label><input type="text" id="pNote" value="${esc(o ? o.note : '')}" placeholder="예: 가등급 글라스울, 외단열 연속"></div>
    </div>
    <div class="actions sticky">${o && d.canEdit ? '<button class="btn danger" type="button" id="pDel">삭제</button>' : ''}
      <button class="btn ghost" type="button" id="pClose">닫기</button><button class="btn" type="button" id="pSave">저장</button></div>`);

  const matOpts = v => `<option value="">자재 선택</option>` + mats.map(m => `<option value="${esc(m.name)}" ${m.name === v ? 'selected' : ''}>${esc(m.name)}${m.k ? ` (λ ${m.k})` : ''}</option>`).join('');
  const addRow = (l) => {
    const div = document.createElement('div');
    div.className = 'pf-row';
    div.innerHTML = `<select class="pMat">${matOpts(l ? l.name : '')}</select>
      <input type="number" class="pTh" placeholder="mm" inputmode="numeric" value="${l && l.thick ? esc(l.thick) : ''}">
      <label class="check pf-wood"><input type="checkbox" class="pIn" ${l && l.inWood ? 'checked' : ''}> 구조재 사이</label>
      <button type="button" class="pf-x">×</button>`;
    $('pRows').appendChild(div);
    div.querySelector('.pf-x').onclick = () => { div.remove(); calc(); };
    div.querySelectorAll('select,input').forEach(x => { x.onchange = calc; x.oninput = calc; });
  };
  const collect = () => [...$('pRows').querySelectorAll('.pf-row')].map(r => {
    const name = r.querySelector('.pMat').value;
    const m = mats.find(x => x.name === name) || {};
    return name ? { name, thick: Number(r.querySelector('.pTh').value) || 0, k: m.k || 0, r: m.r || 0, inWood: r.querySelector('.pIn').checked ? 1 : 0 } : null;
  }).filter(Boolean);
  const RS = { '지붕': [0.10, 0.043], '외벽': [0.11, 0.043], '최하층바닥': [0.086, 0.043] };
  const calc = () => {
    const part = segVal(body, 'pPart');
    $('pWrV').textContent = $('pWr').value;
    const rs = RS[part]; if (!rs) return;
    const wr = Number($('pWr').value) / 100;
    let rI = rs[0] + rs[1], rW = rs[0] + rs[1];
    collect().forEach(l => {
      const t = l.thick / 1000, k = l.k;
      const r = k > 0 ? t / k : (l.r || 0);
      rI += r; rW += (l.inWood && k > 0) ? t / 0.13 : r;
    });
    const u = rI > 0 ? (wr > 0 ? (1 - wr) / rI + wr / rW : 1 / rI) : 0;
    const jj = pfJudge(part, u);
    $('pUOut').textContent = u ? u.toFixed(3) : '—';
    $('pUNote').innerHTML = u ? pfBadges(part, u) : '';
    $('pUOut').className = u && jj.legal && jj.legal.ok ? 'ok' : 'warn';
  };
  const ocCalc = () => {
    const part = segVal(body, 'pPart'), sp = Number($('pSp').value), mw = Number($('pMw').value) || 38;
    if ($('pEx').value === '') $('pEx').value = part === '외벽' ? 6 : part === '지붕' ? 2 : 0;
    const ex = Number($('pEx').value) || 0;
    if (!(sp > 0)) return;
    const base = mw / sp * 100, tot = Math.round(base + ex);
    $('pWr').value = Math.min(35, tot);
    $('pWrHint').textContent = `${mw}mm ÷ ${sp}mm = ${base.toFixed(1)}% + 추가 ${ex}%p → ${tot}%`;
    calc();
  };
  body.querySelectorAll('[data-seg="pOc"] button').forEach(b => b.addEventListener('click', () => { body.querySelectorAll('[data-seg="pOc"] button').forEach(x => x.setAttribute('aria-pressed', x === b)); if (b.dataset.v) $('pSp').value = b.dataset.v; else $('pSp').focus(); ocCalc(); }));
  ['pSp', 'pMw', 'pEx'].forEach(id => $(id).addEventListener('input', ocCalc));
  const onPart = () => {
    const part = segVal(body, 'pPart');
    if ($('pEx')) $('pEx').value = '';
    const direct = ['창호', '현관문'].includes(part);
    $('pDirect').hidden = !direct; $('pLayers').hidden = direct;
    if (!direct) calc();
  };
  bindSegs(body, onPart);
  (o && o.layers && o.layers.length ? o.layers : [null, null]).forEach(addRow);
  $('pAdd').onclick = () => addRow(null);
  $('pWr').oninput = calc;
  onPart();
  $('pClose').onclick = closeSheet;
  if ($('pDel')) $('pDel').onclick = e => { if (confirm(`${o.part} 구성을 삭제할까요?`)) submitting(e.target, async () => {
    const r = await api({ action: 'pf_delete', kind: 'env', id: o.id, siteCode: d.site.code });
    PF.d.env = r.env; closeSheet(); renderInfoTab(); toast('삭제했습니다');
  }); };
  $('pSave').onclick = e => submitting(e.target, async () => {
    const part = segVal(body, 'pPart');
    const r = await api({ action: 'pf_env_save', siteCode: d.site.code, id: o ? o.id : '', fields: {
      part, note: $('pNote').value, woodRatio: Number($('pWr').value) / 100,
      uValue: $('pU').value, layers: ['창호', '현관문'].includes(part) ? [] : collect() } });
    PF.d.env = r.env; closeSheet(); renderInfoTab(); toast('저장했습니다');
  });
}

const PF_URL = {};
async function pfFileUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (PF_URL[k]) return PF_URL[k];
  const d = await api({ action: 'pf_file', siteCode: PF.site, id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return PF_URL[k] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
}

  const mx = Math.max(maxE, maxG);
  const last = rows.slice(-24);
  el.innerHTML = `<div class="cr-bar"><h2 style="font-size:17px">에너지 사용</h2>
      ${d.canEdit ? '<button class="btn ghost" type="button" id="pfBulk">여러 달 입력</button><button class="btn" type="button" id="pfEnNew">+ 월 기록</button>' : ''}</div>
    ${st ? `<div class="ov-cards">
      <section class="panel ov-card"><span class="cr-id">월 평균 비용</span><b>${Math.round(st.costMonth).toLocaleString('ko-KR')}<small style="font-size:14px">원</small></b><span class="cr-sub">${st.months}개월 평균</span></section>
      <section class="panel ov-card"><span class="cr-id">연간 전기</span><b>${st.elecYear.toLocaleString('ko-KR')}<small style="font-size:14px">kWh</small></b><span class="cr-sub">${st.full ? '실적' : '연환산'}${st.solarYear ? ' · 발전 ' + st.solarYear.toLocaleString('ko-KR') : ''}</span></section>
      <section class="panel ov-card"><span class="cr-id">연간 가스</span><b>${Math.round(st.gasYear).toLocaleString('ko-KR')}<small style="font-size:14px">kWh</small></b><span class="cr-sub">난방·온수</span></section>
      <section class="panel ov-card"><span class="cr-id">1차에너지</span><b>${st.primary || '—'}<small style="font-size:14px">kWh/㎡</small></b><span class="cr-sub">${st.primary ? esc(pfEnGrade(st.primary).t) : '연면적 필요'}</span></section>
    </div>` : ''}
    ${last.length ? `<section class="panel ov-block"><h4>월별 사용량 <span class="hint">전기 ■ 가스 ■</span></h4>
      <div class="pf-months">${last.map(r => {
        const g = (Number(r.gasUse) || 0) * (r.gasUnit === 'kg' ? PF_LPG_KWH : r.gasUnit === 'kWh' ? 1 : PF_GAS_KWH);
        const e2 = Number(r.elecKwh) || 0;
        return `<div class="pf-m" title="${esc(r.ym)} 전기 ${e2}kWh · 가스 ${Math.round(g)}kWh">
          <span class="pf-m-bars"><i class="e" style="height:${e2 / mx * 100}%"></i><i class="g" style="height:${g / mx * 100}%"></i></span>
          <span class="pf-m-l">${esc(r.ym.slice(5))}</span></div>`;
      }).join('')}</div>
      <div class="hint">${esc(last[0].ym)} ~ ${esc(last[last.length - 1].ym)}</div></section>` : ''}
    <section class="panel">
      ${rows.length ? `<div class="table-scroll"><table class="pf-table"><tr><th>연월</th><th>전기</th><th>전기요금</th><th>가스</th><th>가스요금</th><th>발전</th><th>합계</th>${d.canEdit ? '<th></th>' : ''}</tr>
        ${rows.slice().reverse().map(r => `<tr>
          <td>${esc(r.ym)}</td><td>${(Number(r.elecKwh) || 0).toLocaleString('ko-KR')} kWh</td><td>${(Number(r.elecCost) || 0).toLocaleString('ko-KR')}</td>
          <td>${(Number(r.gasUse) || 0).toLocaleString('ko-KR')} ${esc(r.gasUnit || '㎥')}</td><td>${(Number(r.gasCost) || 0).toLocaleString('ko-KR')}</td>
          <td>${r.solarKwh ? (Number(r.solarKwh)).toLocaleString('ko-KR') + ' kWh' : '—'}</td>
          <td><b>${((Number(r.elecCost) || 0) + (Number(r.gasCost) || 0) + (Number(r.etcCost) || 0)).toLocaleString('ko-KR')}원</b></td>
          ${d.canEdit ? `<td><button type="button" class="linkish" data-en="${esc(r.id)}" style="margin:0">수정</button></td>` : ''}
        </tr>`).join('')}</table></div>` : `<div class="empty"><h3>에너지 기록이 없습니다</h3>${d.canEdit ? '매월 전기·가스 요금을 입력하면 연간 성능이 자동 계산됩니다.' : '건축주님의 월 사용량을 입력하면 이곳에 표시됩니다.'}</div>`}

function pfEnergyForm(r) {

    <div class="card">
      <div class="f"><label>연월</label><input type="month" id="eYm" value="${esc(ym)}" ${r ? 'disabled' : ''}></div>
      <div class="cx-when"><div class="f"><label>전기 사용량 (kWh)</label><input type="number" id="eKwh" inputmode="decimal" value="${esc(r ? r.elecKwh : '')}"></div>
        <div class="f"><label>전기 요금 (원)</label><input type="number" id="eCost" inputmode="numeric" value="${esc(r ? r.elecCost : '')}"></div></div>
      <div class="cx-when"><div class="f"><label>가스 사용량</label><input type="number" id="gUse" inputmode="decimal" value="${esc(r ? r.gasUse : '')}"></div>
        <div class="f"><span class="lb">단위</span>${segHtml('gUnit', ['㎥', 'kg', 'kWh'], r ? (r.gasUnit || '㎥') : '㎥')}</div></div>
      <div class="cx-when"><div class="f"><label>가스 요금 (원)</label><input type="number" id="gCost" inputmode="numeric" value="${esc(r ? r.gasCost : '')}"></div>
        <div class="f"><label>기타 요금 (원)</label><input type="number" id="eEtc" inputmode="numeric" value="${esc(r ? r.etcCost : '')}" placeholder="지역난방 등"></div></div>
      <div class="cx-when"><div class="f"><label>태양광 발전 (kWh)</label><input type="number" id="sKwh" inputmode="decimal" value="${esc(r ? r.solarKwh : '')}"></div>
        <div class="f"><label>자가 소비 (kWh)</label><input type="number" id="sSelf" inputmode="decimal" value="${esc(r ? r.selfKwh : '')}"></div></div>
      <div class="f"><label>메모</label><input type="text" id="eNote" value="${esc(r ? r.note : '')}" placeholder="예: 혹한기, 장기 외출"></div>
    </div>
    <div class="actions sticky">${r ? '<button class="btn danger" type="button" id="eDel">삭제</button>' : ''}
      <button class="btn ghost" type="button" id="eClose">닫기</button><button class="btn" type="button" id="eSave">저장</button></div>`);
  bindSegs(body);
  $('eClose').onclick = closeSheet;
  if ($('eDel')) $('eDel').onclick = e => { if (confirm(`${r.ym} 기록을 삭제할까요?`)) submitting(e.target, async () => {
    const x = await api({ action: 'pf_delete', kind: 'energy', id: r.id, siteCode: d.site.code });
    PF.d.energy = x.energy; closeSheet(); renderInfoTab(); toast('삭제했습니다');
  }); };
  $('eSave').onclick = e => submitting(e.target, async () => {
    const x = await api({ action: 'pf_energy_save', siteCode: d.site.code, fields: {
      ym: $('eYm').value, elecKwh: $('eKwh').value, elecCost: $('eCost').value,
      gasUse: $('gUse').value, gasUnit: segVal(body, 'gUnit'), gasCost: $('gCost').value,

  });
}

2026-02  388  63200  86  101000
2026-03  350  58000  54  67000"></textarea></div>

const ST = { site: null, d: null, loading: false };

async function stLoad(code) {
  if (ST.site === code || ST.loading) return;
  ST.loading = true;
  try { ST.d = await api({ action: 'st_get', siteCode: code }); ST.site = code; }
  finally { ST.loading = false; }
}

const stN = (v, d) => {
  const n = Number(v) || 0;
  return d ? n.toLocaleString('ko-KR', { maximumFractionDigits: d }) : Math.round(n).toLocaleString('ko-KR');
};

        ${t.seasons.length > 1 ? `${t.seasons.join(', ')}을 지나는 동안` : '그 뒤로'} ${stN(t.days)}일,
        ${t.rainy ? `비와 눈이 ${stN(t.rainy)}일 내렸지만 ` : ''}집은 하루씩 모양을 갖춰 갔습니다.</p>
    </section>` : ''}

    ${c.stored ? `<section class="st-block">
      <h3>이 집이 품은 탄소</h3>
      <div class="st-row">
        ${big(stN(c.stored, 1), '톤', '나무가 가둬 둔 CO₂', `소나무 ${stN(c.pines)}그루가 30년간 흡수한 양`)}

        이 집의 목재가 품고 있는 <b>${stN(c.stored, 1)}톤</b>은 소나무 ${stN(c.pines)}그루가 30년 동안 모은 양입니다.</p>

    ${pf ? `<section class="st-block alt">
      <h3>이 집의 성능</h3>
      <div class="st-row">
        ${pf.ach50 ? big(String(pfAirScore(pf.ach50)), '점', '기밀 성능 (100점 만점)', `ACH50 ${pf.ach50.toFixed(2)}회 · ` + (pf.ach50 <= 0.6 ? '패시브하우스 기준 충족' : pf.ach50 <= 1.5 ? '매우 우수' : '양호')) : ''}
        ${pf.primary ? big(stN(pf.primary), 'kWh/㎡', '연간 1차에너지', `일반 신축의 약 ${Math.round(pf.primary / 210 * 100)}%`) : ''}
        ${pf.saveKwhYear ? big(stN(pf.saveKwhYear), 'kWh', '해마다 덜 쓰는 에너지', `소나무 ${stN(pf.savePines)}그루 몫`) : ''}

        이산화탄소로 바꾸면 연 ${stN(pf.saveCo2Year, 1)}톤, 소나무 ${stN(pf.savePines)}그루를 매년 심는 것과 같습니다.</p>` : ''}

        ${row('rebar', '철근', '톤', m.rebar.v)}
        ${row('insul', '단열재', '㎥', m.insul.v)}
        ${row('windowN', '창·문 개수', '개', m.windowN.v)}
        ${row('windowA', '창호 면적', '㎡', m.windowA.v)}
        ${row('roofA', '지붕 면적', '㎡', m.roofA.v)}
        ${row('wallA', '외벽 면적', '㎡', m.wallA.v)}
        ${row('tile', '타일', '㎡', 0, '선택')}

      <div class="f" style="margin-top:12px"><label>그 밖에 기록하고 싶은 것</label><input type="text" id="q_etc" value="${esc(q.etc || '')}" placeholder="예: 못 42,000개 · 실란트 86통"></div>
      <div class="f"><label>메모</label><input type="text" id="q_note" value="${esc(q.note || '')}" placeholder="산출 근거, 발주서 기준 등"></div>

  $('qClose').onclick = closeSheet;
  $('qSave').onclick = e => submitting(e.target, async () => {
    const f = {};

    ST.d.story = r.story; ST.d.qty = r.qty; closeSheet(); renderInfoTab(); toast('저장했습니다');

}

const CA = { items: [], kinds: [], trades: [], cards: [], months: [], month: '', filter: '전체', canAll: false, loaded: false, sel: {}, view: 'sheet', siteTab: '*', colf: {}, sum: null, docLimit: 100000, desc: true, sortBy: 'date' };

async function renderCardTab() {
  if (!CA.loaded || CA.reload) {
    $('main').innerHTML = '<div class="loading">카드 내역을 불러오는 중...</div>';
    try {
      const d = await api({ action: 'ca_list', month: '', status: '' });
      Object.assign(CA, { items: d.items, kinds: d.kinds, trades: d.trades || [], tradeGroups: d.tradeGroups || [], cards: d.cards, months: d.months, canAll: d.canAll, docLimit: d.docLimit || 100000, loaded: true, reload: false });
      if (!CA.month) CA.month = '*';
    } catch (e) { $('main').innerHTML = `<div class="panel empty"><h3>불러오지 못했습니다</h3>${esc(e.message)}</div>`; return; }
    if (S.tab !== 'card') return;
  }
  if (CA.view !== 'list') return caRenderSheet();
  const rows = CA.items.filter(caInPeriod);
  const noSite = rows.filter(o => !o.siteCode);
  const lacks = rows.filter(caLacks);
  const FILTERS = { '전체': rows, '현장 미지정': noSite, '증빙 미비': lacks };
  if (!FILTERS[CA.filter]) CA.filter = '전체';
  const list = FILTERS[CA.filter];
  const sum = a => a.reduce((t, o) => t + (Number(o.amount) || 0), 0);
  const selIds = Object.keys(CA.sel).filter(k => CA.sel[k]);

  $('main').innerHTML = `
    <div class="cr-bar"><h2>법인카드</h2>
      ${caPeriodSelect()}
      <button class="btn ghost" type="button" id="caSum">시트로 보기</button>
      ${CA.canAll ? `<button class="btn ghost" type="button" id="caPaste">이용내역 불러오기</button>` : ''}
      <button class="btn ghost" type="button" id="caAdd">+ 직접 입력</button></div>

    <div class="ov-cards">
      <button type="button" class="panel ov-card ov-click" data-f="전체"><span class="cr-id">${esc(caPeriodLabel())} 합계</span>
        <b>${won(sum(rows))}</b><span class="cr-sub">${rows.length}건</span></button>
      <button type="button" class="panel ov-card ov-click" data-f="현장 미지정"><span class="cr-id">현장 미지정</span>
        <b class="${noSite.length ? 'warn' : ''}">${noSite.length}건</b><span class="cr-sub">${won(sum(noSite))}</span></button>
      <button type="button" class="panel ov-card ov-click" data-f="증빙 미비"><span class="cr-id">10만원 이상 증빙·공종 미비</span>
        <b class="${lacks.length ? 'warn' : ''}">${lacks.length}건</b><span class="cr-sub">${won(sum(lacks))}</span></button>
    </div>

    <div class="filters">${Object.keys(FILTERS).map(f => {
      const n = FILTERS[f].length;
      return `<button class="chip ${f !== '전체' && n ? 'warn' : ''}" data-f="${esc(f)}" aria-pressed="${CA.filter === f}">${esc(f)}<b>${n}</b></button>`;
    }).join('')}</div>

    ${list.length ? `<div class="ca-all"><label><input type="checkbox" id="caAll" ${selIds.length && selIds.length === list.length ? 'checked' : ''}>
      화면에 보이는 ${list.length}건 모두 선택</label></div>` : ''}

    ${selIds.length ? `<div class="ca-bulk"><b>${selIds.length}건 선택</b>
      <select id="caBulkSite"><option value="">현장 유지</option>${S.sites.map(s => `<option value="${esc(s.code)}">${esc(s.code)} ${esc(s.name)}</option>`).join('')}</select>
      <select id="caBulkKind"><option value="">분류 유지</option>${CA.kinds.map(k => `<option>${esc(k)}</option>`).join('')}</select>
      <select id="caBulkTrade">${tradeOpts(CA.tradeGroups, CA.trades, '', '공종 유지')}</select>
      <button class="btn" type="button" id="caBulkGo">지정</button>
      <button class="btn ghost" type="button" id="caBulkClear">해제</button>
      ${CA.canAll ? `<button class="btn ghost danger" type="button" id="caBulkDel">삭제</button>` : ''}</div>` : ''}

    <section class="panel">
      ${list.length ? list.map(o => `<div class="cr-row ca-row" data-id="${esc(o.id)}">
          <input type="checkbox" class="ca-chk" data-id="${esc(o.id)}" ${CA.sel[o.id] ? 'checked' : ''}>
          <span class="cr-title">${esc(o.store || '가맹점 미상')}<span class="ca-amt ${o.amount < 0 ? 'minus' : ''}">${won(o.amount)}</span></span>
          <span class="cr-sub"><span class="ca-when">${esc(String(o.paidAt).slice(5, 10).replace('-', '/'))}</span>
            <span class="ca-who">${esc(o.owner || '미매칭')}</span>
            ${o.kind ? `<span class="tag">${esc(o.kind)}</span>` : '<span class="tag warn-tag">분류 없음</span>'}
            ${o.trade ? `<span class="tag">${esc(o.trade)}</span>` : (caBig(o) ? '<span class="tag warn-tag">공종 필요</span>' : '')}
            ${caBig(o) && !(o.files || []).length ? '<span class="tag warn-tag">증빙 필요</span>' : ''}
            ${o.siteCode ? `<span class="code">${esc(o.siteCode)}</span>` : '<span class="tag warn-tag">현장 없음</span>'}
            ${o.memo ? '<span class="ca-memo">' + esc(o.memo) + '</span>' : ''}${(o.files || []).length ? ' 📎' : ''}</span>
        </div>`).join('')
        : `<div class="empty"><h3>${CA.filter === '전체' ? '내역이 없습니다' : '정리할 내역이 없습니다'}</h3>
           ${CA.filter === '전체' ? '카드 결제 문자가 오면 자동으로 여기에 쌓입니다.' : ''}</div>`}
    </section>`;

  $('caMonth').onchange = e => { CA.month = e.target.value; CA.sel = {}; renderCardTab(); };
  $('caAdd').onclick = caAddForm;
  if ($('caPaste')) $('caPaste').onclick = caPasteForm;
  $('caSum').onclick = () => { CA.view = 'sheet'; CA.sel = {}; renderCardTab(); };
  $('main').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { CA.filter = b.dataset.f; CA.sel = {}; renderCardTab(); });
  $('main').querySelectorAll('.ca-row').forEach(b => b.onclick = e => { if (e.target.classList.contains('ca-chk')) return; caOpen(b.dataset.id); });
  $('main').querySelectorAll('.ca-chk').forEach(c => c.onchange = () => { CA.sel[c.dataset.id] = c.checked; renderCardTab(); });
  if ($('caBulkClear')) $('caBulkClear').onclick = () => { CA.sel = {}; renderCardTab(); };
  if ($('caAll')) $('caAll').onchange = e => {
    CA.sel = {};
    if (e.target.checked) list.forEach(o => { CA.sel[o.id] = true; });
    renderCardTab();
  };
  if ($('caBulkDel')) $('caBulkDel').onclick = e => {
    if (!confirm(`선택한 ${selIds.length}건을 지웁니다. 되돌릴 수 없습니다.`)) return;
    submitting(e.target, async () => {
      const d = await api({ action: 'ca_bulk_delete', ids: selIds, month: '' });
      CA.items = d.items; if (d.months) CA.months = d.months; CA.sel = {};
      renderCardTab(); toast(`${d.removed}건 지웠습니다`);
    });
  };
  if ($('caBulkGo')) $('caBulkGo').onclick = e => {
    const site = $('caBulkSite').value, kind = $('caBulkKind').value, trade = $('caBulkTrade').value;
    if (!site && !kind && !trade) { toast('바꿀 현장·분류·공종 중 하나를 고르세요'); return; }
    submitting(e.target, async () => {
      const d = await api({ action: 'ca_bulk', ids: selIds, siteCode: site, kind, trade, month: '' });
      CA.items = d.items; CA.sel = {}; renderCardTab(); toast(`${d.saved}건 지정했습니다`);
    });
  };
}

function caBig(o) { return Math.abs(Number(o.amount) || 0) >= (CA.docLimit || 100000); }

function caInPeriod(o) {
  const p = CA.month || '*';
  if (p === '*') return true;
  return String(o.paidAt).slice(0, p.length) === p;
}
function caPeriodLabel() {
  const p = CA.month || '*';
  if (p === '*') return '전체 기간';
  if (/^\d{4}$/.test(p)) return p + '년';
  return p.slice(0, 4) + '년 ' + Number(p.slice(5, 7)) + '월';
}
function caPeriodSelect() {
  const months = CA.months || [];
  const years = [...new Set(months.map(m => m.slice(0, 4)))];
  const opt = (v, t) => `<option value="${esc(v)}" ${v === (CA.month || '*') ? 'selected' : ''}>${esc(t)}</option>`;
  return `<select id="caMonth" class="ca-month" aria-label="기간">
    ${opt('*', '전체 기간')}
    ${years.length > 1 || years.length === 1 ? `<optgroup label="연도">${years.map(y => opt(y, y + '년 전체')).join('')}</optgroup>` : ''}
    <optgroup label="월">${months.map(m => opt(m, m.slice(0, 4) + '년 ' + Number(m.slice(5, 7)) + '월')).join('')}</optgroup>
  </select>`;
}
function caLacks(o) { return caBig(o) && (!o.trade || !(o.files || []).length); }

const CA_COLS = {
  kind:     { label: '분류',     val: o => o.kind || '' },
  memo:     { label: '지출내용', val: o => o.memo || '' },
  siteCode: { label: '현장',     val: o => o.siteCode || '', show: v => { const x = S.sites.find(y => y.code === v); return x ? v + ' ' + x.name : v; } },
  trade:    { label: '공종',     val: o => o.trade || '' },
  store:    { label: '가맹점',   val: o => o.store || '' },
  owner:    { label: '사용자',   val: o => o.owner || '미매칭' },
  docs:     { label: '증빙',     val: o => (o.files || []).length ? '있음' : (caBig(o) ? '필요' : '없음') },
};
function caColPass(o, except) {
  for (const k in CA.colf) {
    if (k === except || !CA.colf[k]) continue;
    if (!CA.colf[k].has(CA_COLS[k].val(o))) return false;
  }
  return true;
}
function caColActive() { return Object.keys(CA.colf).filter(k => CA.colf[k]); }
function caTh(col, cls, text) {
  const on = !!CA.colf[col];
  return `<th class="${cls}"><button type="button" class="ca-fbtn ${on ? 'on' : ''}" data-col="${col}" title="${text} 필터">${text}<i>${on ? '▼' : '▾'}</i></button></th>`;
}
function caFilterPop(btn) {
  const col = btn.dataset.col, C = CA_COLS[col];
  document.querySelectorAll('.ca-fpop').forEach(x => x.remove());

  const base = caSheetRows().filter(o => caColPass(o, col))
    .filter(o => col === 'siteCode' || CA.siteTab === '*' || (o.siteCode || '') === CA.siteTab);
  const cnt = {};
  base.forEach(o => { const v = C.val(o); cnt[v] = (cnt[v] || 0) + 1; });
  const vals = Object.keys(cnt).sort((a, b) => (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b, 'ko')));
  const cur = CA.colf[col];
  const label = v => v === '' ? '(비어 있음)' : (C.show ? C.show(v) : v);
  const pop = document.createElement('div');
  pop.className = 'ca-fpop';
  pop.innerHTML = `<input type="search" class="ca-fsearch" placeholder="${esc(C.label)} 검색">
    <label class="ca-fall"><input type="checkbox" checked> <b>모두 선택</b></label>
    <div class="ca-flist">${vals.map(v => `<label data-v="${esc(v)}"><input type="checkbox" value="${esc(v)}" ${!cur || cur.has(v) ? 'checked' : ''}>
      <span>${esc(label(v))}</span><em>${cnt[v]}</em></label>`).join('')}</div>
    <div class="ca-fact"><button type="button" class="btn ghost" data-a="clear">필터 해제</button><button type="button" class="btn" data-a="ok">확인</button></div>`;
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect();
  pop.style.top = (window.scrollY + r.bottom + 4) + 'px';
  pop.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8)) + 'px';

  const boxes = () => Array.from(pop.querySelectorAll('.ca-flist label')).filter(l => !l.hidden).map(l => l.querySelector('input'));
  const all = pop.querySelector('.ca-fall input');
  const syncAll = () => { const b = boxes(); const n = b.filter(x => x.checked).length; all.checked = n === b.length; all.indeterminate = n > 0 && n < b.length; };
  syncAll();
  all.onchange = () => { boxes().forEach(x => { x.checked = all.checked; }); };
  pop.querySelectorAll('.ca-flist input').forEach(x => x.onchange = syncAll);
  const q = pop.querySelector('.ca-fsearch');
  q.oninput = () => {
    const t = q.value.trim().toLowerCase();
    pop.querySelectorAll('.ca-flist label').forEach(l => { l.hidden = t && !l.textContent.toLowerCase().includes(t); });

    if (t) pop.querySelectorAll('.ca-flist label').forEach(l => { l.querySelector('input').checked = !l.hidden; });
    syncAll();
  };
  q.focus();
  const close = () => { pop.remove(); document.removeEventListener('mousedown', outside, true); document.removeEventListener('keydown', esc1, true); };
  const outside = e => { if (!pop.contains(e.target) && e.target !== btn) close(); };
  const esc1 = e => { if (e.key === 'Escape') close(); if (e.key === 'Enter' && document.activeElement === q) pop.querySelector('[data-a="ok"]').click(); };
  setTimeout(() => { document.addEventListener('mousedown', outside, true); document.addEventListener('keydown', esc1, true); }, 0);
  pop.querySelector('[data-a="clear"]').onclick = () => { delete CA.colf[col]; close(); CA.sel = {}; caRenderSheet(); };
  pop.querySelector('[data-a="ok"]').onclick = () => {
    const picked = Array.from(pop.querySelectorAll('.ca-flist input')).filter(x => x.checked).map(x => x.value);
    if (picked.length === vals.length) delete CA.colf[col];
    else CA.colf[col] = new Set(picked);
    close(); CA.sel = {}; caRenderSheet();
  };
}

function caDateCell(v) {
  const t = String(v || '');
  const d = (CA.month && CA.month.length === 7 ? t.slice(5, 10) : t.slice(2, 10)).replace(/-/g, '.');
  const m = t.match(/\s(\d{1,2}):(\d{2})/), hm = m ? ('0' + m[1]).slice(-2) + ':' + m[2] : '';
  return hm && hm !== '00:00' ? `${d} <small>${hm}</small>` : `${d} <small class="nt">시각 없음</small>`;
}
function caSheetRows() {
  const rows = CA.items.filter(caInPeriod);
  const d = CA.desc ? -1 : 1;
  const byDate = (a, b) => String(a.paidAt).localeCompare(String(b.paidAt)) || String(a.id).localeCompare(String(b.id));
  if (CA.sortBy === 'amount') return rows.slice().sort((a, b) => d * ((Number(a.amount) || 0) - (Number(b.amount) || 0)) || -byDate(a, b));
  return rows.slice().sort((a, b) => d * byDate(a, b));
}
function caSheetSites(rows) {
  const g = {};
  rows.forEach(o => { const k = o.siteCode || ''; g[k] = (g[k] || 0) + (Number(o.amount) || 0); });
  return g;
}

function caCardOpts(o) {

    col.dt{width:96px}col.sto{width:140px}col.kd{width:84px}col.am{width:84px}col.st{width:120px}col.tr{width:76px}col.ow{width:84px}col.dc{width:40px}
    button{margin-bottom:10px;padding:8px 18px;background:#000;color:#fff;border:0;border-radius:6px}
    @media print{button{display:none}@page{size:A4 landscape;margin:10mm}thead{display:table-header-group}tr{break-inside:avoid}}
</style></head><body><button onclick="window.print()">인쇄</button>
    <h1>${esc(title)}</h1>
    <div class="sub"><b>합계 ${won(total)}</b><span>${rows.length}건</span>${Object.keys(byKind).map(k => `<span>${esc(k)} ${won(byKind[k])}</span>`).join('')}</div>

    <div class="sub" style="margin-top:8px">(주)사람사는집종합건설 · 출력 ${esc(today())}</div></body></html>`);
  w.document.close();
}
function caVisibleIds() { return Array.from(document.querySelectorAll('#main .ca-grid tbody tr')).map(tr => tr.dataset.id); }
function caBindChecks() {
  const all = $('caCkAll');
  if (all) all.onchange = () => {
    const ids = caVisibleIds();
    CA.sel = {};
    if (all.checked) ids.forEach(id => { CA.sel[id] = true; });
    caSyncChecks(); caBulkBar();
  };
  document.querySelectorAll('#main .ca-grid tbody tr').forEach(tr => caBindCheck(tr));
  caSyncChecks();
}
function caBindCheck(tr) {
  const ck = tr.querySelector('.ca-ck');
  if (!ck) return;
  ck.onclick = e => {
    const ids = caVisibleIds();
    const i = ids.indexOf(tr.dataset.id);
    if (e.shiftKey && caLastCk >= 0) {
      const [a, b] = [Math.min(caLastCk, i), Math.max(caLastCk, i)];
      for (let k = a; k <= b; k++) CA.sel[ids[k]] = ck.checked;
    } else CA.sel[tr.dataset.id] = ck.checked;
    caLastCk = i;
    caSyncChecks(); caBulkBar();
  };
}
function caSyncChecks() {
  const ids = caVisibleIds();
  document.querySelectorAll('#main .ca-grid tbody tr').forEach(tr => {
    const on = !!CA.sel[tr.dataset.id];
    tr.classList.toggle('sel', on);
    const ck = tr.querySelector('.ca-ck'); if (ck) ck.checked = on;
  });
  const n = ids.filter(id => CA.sel[id]).length;
  const all = $('caCkAll');
  if (all) { all.checked = n > 0 && n === ids.length; all.indeterminate = n > 0 && n < ids.length; }
}
function caBulkBar() {
  const box = $('caBulkBar'); if (!box) return;
  const ids = caVisibleIds().filter(id => CA.sel[id]);
  if (!ids.length) { box.innerHTML = ''; return; }
  const sum = ids.reduce((t, id) => t + (Number((CA.items.find(o => o.id === id) || {}).amount) || 0), 0);
  box.innerHTML = `<div class="ca-bulk"><b>${ids.length}건 선택 · ${won(sum)}</b>
    <select id="cbSite"><option value="">현장 유지</option>${S.sites.map(x => `<option value="${esc(x.code)}">${esc(x.code)} ${esc(x.name)}</option>`).join('')}</select>
    <select id="cbKind"><option value="">분류 유지</option>${CA.kinds.map(k => `<option>${esc(k)}</option>`).join('')}</select>
    <select id="cbTrade">${tradeOpts(CA.tradeGroups, CA.trades, '', '공종 유지')}</select>
    <select id="cbCard"><option value="">사용자 유지</option>${CA.cards.map(c => `<option value="${esc(c.last4)}">${esc(c.owner || c.alias || '')} ${esc(c.last4)}</option>`).join('')}<option value="-">미매칭으로 돌리기</option></select>
    <button class="btn" type="button" id="cbGo">한꺼번에 지정</button>
    <button class="btn ghost" type="button" id="cbClear">선택 해제</button>
    ${CA.canAll ? '<button class="btn ghost danger" type="button" id="cbDel">삭제</button>' : ''}</div>`;
  $('cbClear').onclick = () => { CA.sel = {}; caSyncChecks(); caBulkBar(); };
  $('cbGo').onclick = e => {
    const site = $('cbSite').value, kind = $('cbKind').value, trade = $('cbTrade').value, card = $('cbCard') ? $('cbCard').value : '';
    if (!site && !kind && !trade && !card) { toast('바꿀 현장·분류·공종·사용자 중 하나를 고르세요'); return; }
    submitting(e.target, async () => {
      const d = await api({ action: 'ca_bulk', ids, siteCode: site, kind, trade, card, month: '' });
      CA.items = d.items; CA.sel = {};
      caRenderSheet(); toast(`${d.saved}건 지정했습니다`);
    });
  };
  if ($('cbDel')) $('cbDel').onclick = e => {
    if (!confirm(`선택한 ${ids.length}건을 지웁니다. 되돌릴 수 없습니다.`)) return;
    submitting(e.target, async () => {
      const d = await api({ action: 'ca_bulk_delete', ids, month: '' });
      CA.items = d.items; if (d.months) CA.months = d.months; CA.sel = {};
      caRenderSheet(); toast(`${d.removed}건 지웠습니다`);
    });
  };
}

function caBindRows(root) { root.querySelectorAll('.ca-grid tbody tr').forEach(caBindRow); }

function caBindRow(tr) {
  const id = tr.dataset.id;
  tr.querySelectorAll('[data-f]').forEach(el => {
    el.onchange = () => caCell(id, el.dataset.f, el.value, el);
    if (el.tagName !== 'INPUT') return;
    el.onfocus = () => { if (el.dataset.f === 'amount') el.value = String(el.value).replace(/,/g, ''); el.select(); };
    el.onblur = () => { if (el.dataset.f === 'amount' && el.value) el.value = Number(String(el.value).replace(/[^\d-]/g, '') || 0).toLocaleString(); };
    el.onkeydown = e => {
      if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const rows = Array.from(document.querySelectorAll('.ca-grid tbody tr'));
        const next = rows[rows.indexOf(tr) + (e.key === 'ArrowUp' ? -1 : 1)];
        const f = el.dataset.f;
        el.blur();
        const cell = next && document.querySelector(`.ca-grid tbody tr[data-id="${CSS.escape(next.dataset.id)}"] [data-f="${f}"]`);
        if (cell) cell.focus();
      } else if (e.key === 'Escape') {
        const o = CA.items.find(x => x.id === id);
        el.value = el.dataset.f === 'amount' ? Number(o.amount || 0).toLocaleString() : (o[el.dataset.f] || '');
        el.blur();
      }
    };
  });
  tr.querySelectorAll('[data-act="open"]').forEach(b => b.onclick = () => caOpen(id));
}

async function caCell(id, field, value, el) {
  const o = CA.items.find(x => x.id === id); if (!o) return;
  const before = Object.assign({}, o);
  let v = value;
  if (field === 'amount') {
    v = Number(String(value).replace(/[^\d-]/g, ''));
    if (!v) { toast('금액을 숫자로 입력하세요'); el.value = Number(o.amount || 0).toLocaleString(); return; }
    if (v === Number(o.amount)) return;
  } else if (field === 'card') {
    if (v === '' || (String(o.last4 || '') === String(v) && o.owner)) return;
    const me = CA.cards.find(c => String(c.last4) === String(v));
    if (!CA.canAll && v !== '-' && me && S.me && me.owner !== S.me.name
        && !confirm(`${me.owner} 소장님께 넘기면 내 화면에서 사라집니다. 넘길까요?`)) { caSwapRow(id, field, 'err'); return; }
  } else if (String(o[field] == null ? '' : o[field]) === String(v)) return;

  if (field !== 'card') o[field] = v;
  el.classList.remove('saved', 'err'); el.classList.add('saving');
  try {
    const fields = {}; fields[field] = v;
    const d = await api({ action: 'ca_save', id, lite: true, remember: field === 'kind', fields });
    const kindBefore = before.kind;
    Object.assign(o, d.item);
    caSwapRow(id, field, 'saved');
    if (field === 'memo' && !kindBefore && o.kind) caFlash(id, 'kind');
    (d.also || []).forEach(x => {
      const y = CA.items.find(z => z.id === x.id); if (y) Object.assign(y, x);
      caSwapRow(x.id, 'kind', 'saved');
    });
    if ((d.also || []).length) toast(`같은 가맹점 ${d.also.length}건도 ${o.kind}(으)로 채웠습니다`);
  } catch (e) {
    Object.assign(o, before);
    caSwapRow(id, field, 'err');
    toast(e.message);
  }
  caSheetSummary();
}

function caFlash(id, field) {
  const el = document.querySelector(`.ca-grid tbody tr[data-id="${CSS.escape(id)}"] [data-f="${field}"]`);
  if (!el) return; el.classList.add('saved'); setTimeout(() => el.classList.remove('saved'), 1200);
}

function caSwapRow(id, field, flash) {
  const old = document.querySelector(`.ca-grid tbody tr[data-id="${CSS.escape(id)}"]`);
  const o = CA.items.find(x => x.id === id);
  if (!old || !o) return;
  const act = document.activeElement;
  const focusF = act && old.contains(act) ? act.dataset.f : null;
  const tmp = document.createElement('tbody'); tmp.innerHTML = caRowHtml(o);
  const row = tmp.firstElementChild;
  old.replaceWith(row);
  caBindRow(row);
  caBindCheck(row);
  const cell = row.querySelector(`[data-f="${field}"]`) || row;
  cell.classList.add(flash);
  setTimeout(() => cell.classList.remove(flash), flash === 'err' ? 1600 : 900);
  if (focusF) { const f = row.querySelector(`[data-f="${focusF}"]`); if (f) f.focus(); }
}

const CA_URL = {};
async function caFileUrl(id, fid, thumb) {
  const k = (thumb ? 't' : 'f') + fid;
  if (CA_URL[k]) return CA_URL[k];
  const d = await api({ action: 'ca_file', id, fileId: fid, thumb: !!thumb });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return CA_URL[k] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type, name: d.name };
}

function caImportResult(d) {
  const files = d.files && d.files.length ? d.files : [{ name: d.mode === '문자' ? '붙여넣은 문자' : '붙여넣은 표', added: d.added, dup: d.dup, skip: d.skip, details: d.details || [] }];

    const list = (arr, cls) => arr.length ? `<ul class="ca-res-list ${cls}">${arr.map(x =>
      `<li><span>${esc(x.text)}</span><small>${esc(x.why)}</small></li>`).join('')}</ul>` : '';

      ${ign.length ? '<details class="ca-res-ign"><summary>읽지 않은 줄 ' + ign.length + '개 (제목·합계 등) — 결제가 섞여 있지 않은지 확인</summary>' + list(ign, 'ign') + '</details>' : ''}`}</div>`;
  };

      같은 파일 안에서 같은 날 같은 금액을 두 번 쓴 건은 중복으로 보지 않습니다. 잘못 빠진 게 있으면 <b>+ 직접 입력</b>으로 넣어주세요.</p>

  $('rsOk').onclick = closeSheet;
}

  if ($('rpNew')) $('rpNew').onclick = () => rpForm(null, today());
  el.querySelectorAll('.rp-cell[data-date]').forEach(b => b.onclick = () => {
    const r = byDate[b.dataset.date];
    if (r) rpOpen(r.id); else if (canWrite && b.dataset.date <= today()) rpForm(null, b.dataset.date);
  });
  el.querySelectorAll('.rp-row').forEach(b => b.onclick = () => rpOpen(b.dataset.id));
}

function rpShiftMonth(m, n) {
  const d = new Date(m + '-01T00:00:00'); d.setMonth(d.getMonth() + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

async function rpPhotoUrl(item, fileId) {
  if (CR.urls[fileId]) return CR.urls[fileId];
  const d = await api({ action: 'rp_photo', id: item.id, fileId });
  const bin = atob(d.data); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  CR.urls[fileId] = { url: URL.createObjectURL(new Blob([arr], { type: d.type })), type: d.type };
  return CR.urls[fileId];
}

const RP_MAX_PHOTOS = 20;
document.addEventListener('change', e => {
  if (e.target.id !== 'rPhotos') return;
  const n = e.target.files.length, hint = $('rPhotoCnt');
  if (n > RP_MAX_PHOTOS) { e.target.value = ''; toast(`사진은 한 번에 ${RP_MAX_PHOTOS}장까지 고를 수 있습니다. (${n}장 선택됨) 다시 골라주세요.`, true); if (hint) hint.textContent = `한 번에 최대 ${RP_MAX_PHOTOS}장까지 고를 수 있습니다.`; return; }
  if (hint) hint.textContent = n ? `${n}장 선택됨 · 최대 ${RP_MAX_PHOTOS}장` : `한 번에 최대 ${RP_MAX_PHOTOS}장까지 고를 수 있습니다.`;
});
async function rpUploadPhotos(input, siteCode, date, btn) {
  const picked = Array.from(input.files || []);
  if (picked.length > RP_MAX_PHOTOS) throw new Error(`사진은 ${RP_MAX_PHOTOS}장까지 올릴 수 있습니다.`);
  if (!picked.length) return [];
  const total = picked.length; let done = 0;
  const say = t => { if (btn) btn.textContent = t; };
  say(`사진 준비 중 0/${total}`);
  const files = [];
  for (const f of picked) { files.push((await readFiles({ files: [f] }))[0]); done++; say(`사진 준비 중 ${done}/${total}`); }
  const batches = []; for (let i = 0; i < files.length; i += 3) batches.push(files.slice(i, i + 3));
  const refs = new Array(batches.length); let sent = 0, next = 0;
  say(`사진 올리는 중 0/${total}`);
  const worker = async () => {
    while (next < batches.length) {
      const i = next++;
      const d = await api({ action: 'rp_photo_up', siteCode, date, photos: batches[i] });
      refs[i] = d.photos; sent += batches[i].length; say(`사진 올리는 중 ${sent}/${total}`);
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, batches.length) }, worker));
  say('저장 중...');
  return refs.flat();
}

function rpPrintWeek(startMon) {
  const s = currentSite();
  const isClient = S.me.role === 'client';
  const days = [...Array(7)].map((_, i) => ymd(new Date(new Date(startMon + 'T00:00:00').getTime() + i * 86400000)));
  const byDate = {}; RP.items.forEach(r => byDate[r.date] = r);
  const rows = days.map(d => {
    const r = byDate[d];
    const work = r ? r.work.map(w => `<div><b>${esc(w.team || w.trade)}</b>${!isClient && w.count ? ` ${w.count}명` : ''} — ${esc(w.work).replace(/\n/g, '<br>')}</div>`).join('') : '<span class="none">보고 없음</span>';
    return `<tr><td class="d">${d.slice(5).replace('-', '/')}<br><span>${rpDow(d)}</span></td>
      <td class="w">${r ? (rpWeatherIcon(r.weather) + ' ' + (r.tempMin !== '' ? `${r.tempMin}/${r.tempMax}℃` : '')) : ''}</td>
      <td>${work}</td>
      ${!isClient ? `<td class="p">${r && r.people ? r.people + '명' : ''}</td>` : ''}
      <td class="t">${r ? esc(r.tomorrow).replace(/\n/g, '<br>') : ''}</td></tr>`;
  }).join('');
  const total = isClient ? 0 : days.reduce((sum, d) => sum + ((byDate[d] || {}).people || 0), 0);

const DR = { sign: null, lib: null };
function drLib() {
  if (window.ExcelJS) return Promise.resolve();
  if (DR.lib) return DR.lib;
  const load = src => new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
  DR.lib = load('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js')
    .catch(() => load('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'))

  return DR.lib;
}

function drSignHtml(s) {

  return `<div class="dr-sign"><div class="dr-sign-box">${sg.data ? `<img src="data:${esc(sg.type || 'image/png')};base64,${sg.data}" alt="서명">` : '<span class="cr-sub">미등록</span>'}</div>
    <div><b>${esc(sg.name || s.manager)}</b> 현장소장<div class="cr-sub">등록하면 모든 작업일보의 소장 칸에 찍혀 나옵니다.</div>
    ${sg.can ? `<label class="btn ghost sm" style="margin-top:8px">${sg.data ? '서명 바꾸기' : '서명·도장 이미지 등록'}<input type="file" accept="image/*" id="dSignFile" hidden></label>
    ${sg.data ? '<button type="button" class="linkish" id="dSignDel" style="margin-left:8px">삭제</button>' : ''}` : ''}</div></div>`;

async function drSignPrep(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('이미지를 읽지 못했습니다.')); i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
  const px = g.getImageData(0, 0, c.width, c.height), a = px.data;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const i = (y * c.width + x) * 4, lum = (a[i] + a[i + 1] + a[i + 2]) / 3;
    if (a[i + 3] < 30 || lum > 215) { a[i + 3] = 0; continue; }
    if (lum > 170) a[i + 3] = Math.round(a[i + 3] * (215 - lum) / 45);
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) throw new Error('서명이 보이지 않습니다. 흰 종이에 진하게 쓴 사진을 올려 주세요.');
  g.putImageData(px, 0, 0);
  const o = document.createElement('canvas'), pad = 4;
  o.width = x1 - x0 + 1 + pad * 2; o.height = y1 - y0 + 1 + pad * 2;
  o.getContext('2d').drawImage(c, x0, y0, x1 - x0 + 1, y1 - y0 + 1, pad, pad, x1 - x0 + 1, y1 - y0 + 1);
  return o.toDataURL('image/png').split(',')[1];
}

    </div>
